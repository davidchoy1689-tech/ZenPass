<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>我的預約 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=9" />
  <style>
    .tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
    .tabs button { flex: 1; padding: 14px 0; background: none; border: 0; font: inherit; font-weight: 700; color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; }
    .tabs button.on { color: var(--brand-600); border-color: var(--brand-500); }
    .bk-title { font-weight: 700; margin: 0 0 2px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn { min-height: 40px; padding: 0 14px; font-size: 14px; flex: 1; }
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">我的預約</div></div>

  <div class="wrap">
    <div class="tabs" style="margin:0 -16px 12px">
      <button class="on" data-tab="upcoming">即將</button>
      <button data-tab="past">已完成</button>
      <button data-tab="cancelled">已取消</button>
    </div>
    <div class="stack" id="panels"><div class="card"><div class="body muted">載入中…</div></div></div>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script>
    let all = [];
    let cur = "upcoming";
    const badge = (s) => ({
      confirmed: '<span class="badge ok">已確認</span>',
      pending_payment: '<span class="badge warn">待付款</span>',
      attended: '<span class="badge off">已完成</span>',
      no_show: '<span class="badge off">缺席</span>',
      cancelled: '<span class="badge off">已取消</span>',
    }[s] || `<span class="badge off">${esc(s)}</span>`);

    function row(b) {
      let actions = "";
      if (b.status === "confirmed") actions = `<button class="btn btn-secondary" onclick="cancelBk('${esc(b.id)}')">取消預約</button>`;
      if (b.status === "pending_payment") actions = `<a class="btn btn-primary" href="booking.html?id=${encodeURIComponent(b.class_id)}&sid=${encodeURIComponent(b.schedule_id)}">繼續付款</a>`;
      if (b.status === "attended") actions = `<button class="btn btn-primary" onclick="openNps('${esc(b.id)}')">⭐ 評價</button><a class="btn btn-secondary" href="class-detail.html?id=${encodeURIComponent(b.class_id)}">再預約</a>`;
      return `<div class="card"><div class="body">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <div><p class="bk-title">${esc(b.title || "課程")}</p>
            <p class="muted" style="margin:0;font-size:13px">${fmtTime(b.start_time)}${b.venue_name ? " · " + esc(b.venue_name) : ""}</p></div>
          ${badge(b.status)}
        </div>
        ${actions ? `<div class="actions">${actions}</div>` : ""}
      </div></div>`;
    }

    function render() {
      const groups = {
        upcoming: all.filter(b => b.status === "confirmed" || b.status === "pending_payment"),
        past: all.filter(b => b.status === "attended"),
        cancelled: all.filter(b => b.status === "cancelled" || b.status === "no_show"),
      };
      const arr = groups[cur] || [];
      document.getElementById("panels").innerHTML = arr.length ? arr.map(row).join("")
        : `<div class="card"><div class="body muted center">呢度暫時冇預約。</div></div>`;
    }

    window.cancelBk = async (id) => {
      if (!confirm("確定取消呢個預約？")) return;
      const r = await api.post("/bookings/" + encodeURIComponent(id) + "/cancel", {});
      if (r.ok) { await load(); } else { alert((r.data && r.data.error) || "取消失敗"); }
    };

    window.closeModal = (el) => { const o = el.closest(".modal-overlay"); if (o) o.remove(); };
    window.openNps = (id) => {
      const b = all.find(x => String(x.id) === String(id)) || {};
      const o = document.createElement("div");
      o.className = "modal-overlay";
      o.innerHTML = `<div class="modal">
        <h3>⭐ 課程評價</h3>
        <p class="muted" style="font-size:13px;margin-top:0">${esc(b.title || "")}</p>
        <div class="muted" style="font-size:13px">你幾大機會推薦呢個課程？（1 = 唔會，10 = 一定會）</div>
        <div class="rate-grid">${[...Array(10)].map((_, i) => `<button type="button" data-v="${i + 1}">${i + 1}</button>`).join("")}</div>
        <textarea rows="3" placeholder="有咩意見？（可選）" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;padding:11px;font:inherit;background:var(--surface);color:var(--text);margin-top:8px"></textarea>
        <label class="muted" style="font-size:13px;display:block;margin-top:8px"><input type="checkbox" checked> 我會推薦俾朋友</label>
        <div class="actions"><button class="btn btn-secondary" onclick="closeModal(this)">取消</button><button class="btn btn-primary" id="npsSend">提交</button></div>
      </div>`;
      document.body.appendChild(o);
      o.onclick = (e) => { if (e.target === o) o.remove(); };
      let val = 0;
      o.querySelectorAll(".rate-grid button").forEach(btn => btn.onclick = () => {
        val = Number(btn.dataset.v);
        o.querySelectorAll(".rate-grid button").forEach(x => x.classList.toggle("on", x === btn));
      });
      o.querySelector("#npsSend").onclick = async () => {
        if (!val) { alert("請揀 1-10 分"); return; }
        const r = await api.post("/nps/submit", {
          booking_id: id, rating: val,
          comment: o.querySelector("textarea").value,
          would_recommend: o.querySelector("input[type=checkbox]").checked ? 1 : 0,
        });
        if (r.ok) { alert((r.data && r.data.message) || "多謝你嘅評價！"); o.remove(); }
        else alert((r.data && r.data.error) || "提交失敗");
      };
    };

    async function load() {
      const r = await api.get("/bookings/my?limit=50");
      all = (r.data && r.data.bookings) || [];
      render();
    }

    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      cur = b.dataset.tab; render();
    });

    if (api.requireLogin("my-bookings.html")) load();
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
