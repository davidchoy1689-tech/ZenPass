<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>我的預約 · ZenPass v2</title>
  <link rel="stylesheet" href="assets/v2.css" />
  <style>
    .tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
    .tabs button { flex: 1; padding: 14px 0; background: none; border: 0; font: inherit; font-weight: 700;
                  color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; }
    .tabs button.on { color: var(--brand-600); border-color: var(--brand-500); }
    .bk-title { font-weight: 700; margin: 0 0 2px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn { min-height: 40px; padding: 0 14px; font-size: 14px; flex: 1; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <div class="title">我的預約</div>
  </div>

  <div class="wrap">
    <div class="tabs" style="margin:0 -16px 12px">
      <button class="on" data-tab="upcoming">即將</button>
      <button data-tab="past">已完成</button>
      <button data-tab="cancelled">已取消</button>
    </div>

    <!-- 即將 -->
    <div id="upcoming" class="stack tab-panel">
      <div class="card">
        <div class="body">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div>
              <p class="bk-title">芬蘭木柱體驗班</p>
              <p class="sub muted" style="margin:0">週六 12/13 · 10:00 · 旺角體育館</p>
            </div>
            <span class="badge warn">待付款</span>
          </div>
          <div class="banner" style="margin-top:12px">⏳ 名額已保留 · 剩 <b>13:24</b> 完成付款</div>
          <div class="actions">
            <a class="btn btn-primary" href="booking.html">繼續付款</a>
            <button class="btn btn-secondary">取消</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="body">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div>
              <p class="bk-title">地板冰壺入門</p>
              <p class="sub muted" style="margin:0">週日 12/14 · 14:00 · 銅鑼灣</p>
            </div>
            <span class="badge ok">已確認</span>
          </div>
          <div class="actions">
            <button class="btn btn-secondary">加入日曆</button>
            <button class="btn btn-secondary">取消預約</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 已完成 -->
    <div id="past" class="stack tab-panel hide">
      <div class="card">
        <div class="body">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div>
              <p class="bk-title">布袋球家庭班</p>
              <p class="sub muted" style="margin:0">週六 12/06 · 15:00 · 沙田</p>
            </div>
            <span class="badge off">已完成</span>
          </div>
          <div class="actions">
            <button class="btn btn-primary">評價課程</button>
            <button class="btn btn-secondary">再預約</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 已取消 -->
    <div id="cancelled" class="stack tab-panel hide">
      <div class="card"><div class="body muted center">冇已取消嘅預約。</div></div>
    </div>

    <div class="spacer"></div>
    <p class="muted center" style="font-size:12px">v2 預覽樣板 · 靜態示範數據</p>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="index.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my-bookings.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script>
    document.querySelectorAll(".tabs button").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hide"));
        document.getElementById(b.dataset.tab).classList.remove("hide");
      };
    });
  </script>
</body>
</html>
