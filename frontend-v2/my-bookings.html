<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>我的預約 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=35" />
  <link rel="stylesheet" href="assets/polish.css?v=1" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <link rel="stylesheet" href="assets/view-transitions.css?v=1" />
  <style>
    .tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
    .tabs button { flex: 1; padding: 14px 0; background: none; border: 0; font: inherit; font-weight: 700; color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; }
    .tabs button.on { color: var(--brand-600); border-color: var(--brand-500); }
    .bk-title { font-weight: 700; margin: 0 0 2px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn { min-height: 40px; padding: 0 14px; font-size: 14px; flex: 1; }
    /* 🎫 入場憑證（機票風格） */
    .tk-overlay{position:fixed;inset:0;background:rgba(15,23,42,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .22s ease}
    .tk-overlay.active{opacity:1;pointer-events:auto}
    .tk-card{width:100%;max-width:360px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.3);transform:translateY(18px) scale(.96);transition:transform .26s cubic-bezier(.34,1.56,.64,1);color:#0f172a}
    .tk-overlay.active .tk-card{transform:translateY(0) scale(1)}
    .tk-head{background:linear-gradient(135deg,var(--brand-500),var(--brand-700));color:#fff;padding:18px 20px;position:relative}
    .tk-head .brand{font-size:11px;letter-spacing:1.5px;opacity:.9;font-weight:700}
    .tk-head h3{margin:6px 0 0;font-size:19px;line-height:1.3}
    .tk-head .st{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
    .tk-body{padding:16px 20px 10px}
    .tk-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:9px}
    .tk-row .k{color:#64748b;flex:none}
    .tk-row .v{font-weight:600;text-align:right}
    .tk-div{position:relative;height:20px;background:#fff;display:flex;align-items:center}
    .tk-div:before,.tk-div:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(15,23,42,.75);top:0}
    .tk-div:before{left:-10px}
    .tk-div:after{right:-10px}
    .tk-div i{width:calc(100% - 30px);margin:0 15px;border-top:2px dashed #e2e8f0}
    .tk-foot{padding:8px 20px 20px;text-align:center;background:#fff}
    .tk-foot img{width:170px;height:170px;display:block;margin:0 auto 10px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;padding:8px;box-sizing:border-box}
    .tk-code{font:800 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:5px;color:#0f172a;background:#f1f5f9;border-radius:8px;padding:7px 14px;display:inline-block;margin-bottom:8px}
    .tk-tip{font-size:11.5px;color:#94a3b8;line-height:1.6}
    .tk-people{font-size:12px;color:#0f172a;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;margin:0 20px 10px;line-height:1.7;text-align:left}
    .tk-actions{display:flex;gap:8px;padding:0 20px 20px}
    .tk-actions .btn{flex:1;min-height:42px;font-size:13.5px}

    /* 安心時間軸 */
    .tl{display:flex;gap:0;margin:12px 0 2px;padding:0}
    .tl .st{flex:1;position:relative;padding:0 4px;text-align:center;font-size:11px;color:#94a3b8;font-weight:700;line-height:1.35}
    .tl .st:before{content:"";display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 5px;background:#e2e8f0;border:2px solid #fff;box-shadow:0 0 0 1px #e2e8f0;line-height:20px;font-size:12px;text-align:center}
    .tl .st.on{color:#047857}
    .tl .st.on:before{background:#10b981;box-shadow:0 0 0 1px #10b981;content:"✓";color:#fff}
    .tl .st.now{color:#b45309}
    .tl .st.now:before{background:#f59e0b;box-shadow:0 0 0 1px #f59e0b;content:"●";color:#fff}
    .tl .st:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#e2e8f0;z-index:-1}
    .tl .st:first-child:after{display:none}
    .tl .st.on:after,.tl .st.now:after{background:#10b981}
    .tl .st .d{display:block;font-size:10.5px;font-weight:600;color:#64748b;margin-top:2px}
    /* 🔄 自主改期 */
    .rs-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;margin:10px 0}
    .rs-opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;cursor:pointer;background:var(--surface)}
    .rs-opt:has(input:checked){border-color:#16A34A;background:#F0FDF4;box-shadow:0 0 0 1px #16A34A inset}
    .rs-opt input{width:20px;height:20px;flex:0 0 auto}
    .rs-opt .rs-t{font-size:13.5px;font-weight:800}
    .rs-opt .rs-s{font-size:11.5px;color:#64748B}
    .rs-note{font-size:12px;color:#166534;background:#F0FDF4;border:1px dashed #86EFAC;border-radius:10px;padding:8px 10px;line-height:1.45;margin-bottom:4px}
    .rs-empty{font-size:13px;color:#64748B;padding:14px 4px;text-align:center}
    .btn-block{width:100%;margin-top:10px}
    /* 🧪 示範模式：深綠金通行卡 */
    .demo-bar{background:#FEF3C7;border:1.5px dashed #F59E0B;color:#92400E;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;margin:0 0 10px;line-height:1.45}
    .pass-wallet-card{background:linear-gradient(135deg,#1A5336 0%,#113824 100%);border-radius:18px;padding:16px;margin:0 0 14px;color:#fff;box-shadow:0 10px 24px rgba(17,56,36,.28);border:1px solid rgba(212,175,55,.45)}
    .pw2-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .pw2-title{font-size:15px;font-weight:900;color:#F5E6B8;letter-spacing:.3px}
    .pw2-owner{background:rgba(212,175,55,.18);border:1px solid rgba(212,175,55,.55);color:#F5E6B8;font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px}
    .pass-stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
    .pass-stamp{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 4px;text-align:center;font-size:10.5px;line-height:1.35;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px}
    .pass-stamp .s-ic{font-size:16px}
    .pass-stamp.done{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.6);color:#DCFCE7}
    .pass-stamp.booked{background:rgba(250,204,21,.16);border-color:rgba(250,204,21,.65);color:#FEF9C3;font-weight:800}
    .pass-stamp.left{color:#CBD5E1;opacity:.85}
    .pw2-actions{display:flex;gap:8px;flex-wrap:wrap}
    .pw2-actions a{flex:1;min-width:150px;text-align:center;text-decoration:none;font-size:13.5px;font-weight:900;border-radius:10px;padding:11px 12px}
    .pw2-book{background:#22C55E;color:#06281A}
    .pw2-renew{background:linear-gradient(135deg,#E8C766,#C9A227);color:#2B1D00}
    /* 🎫 4 堂通行證卡包（真實） */
    .pass-wallet{background:linear-gradient(135deg,#F0FDF4 0%,#DCFCE7 100%);border:2px solid #22C55E;border-radius:16px;padding:14px 16px;margin:0 0 12px;box-shadow:0 4px 12px rgba(34,197,94,.15)}
    .pw-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .pw-title{font-size:13px;font-weight:900;color:#166534}
    .pw-exp{font-size:11.5px;font-weight:700;color:#15803D}
    .pw-dots{display:flex;gap:10px;align-items:center;margin-bottom:8px}
    .pw-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;flex:0 0 auto}
    .pw-dot.used{background:#16A34A;color:#fff;box-shadow:0 2px 6px rgba(22,163,74,.35)}
    .pw-dot.free{background:#fff;border:2px dashed #86EFAC;color:#16A34A}
    .pw-meta{font-size:12px;color:#166534;line-height:1.6;margin-bottom:10px}
    .pw-actions{display:flex;gap:8px;flex-wrap:wrap}
    .pw-actions a{flex:1;min-width:140px;text-align:center;text-decoration:none;font-size:13px;font-weight:800;border-radius:10px;padding:10px 12px}
    .pw-actions .pw-book{background:#15803D;color:#fff}
    .pw-actions .pw-renew{background:#fff;color:#15803D;border:1.5px solid #22C55E}
    .mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .mini a,.mini button{font:inherit;font-size:12px;font-weight:800;color:var(--brand-600);text-decoration:none;background:#f1f5f9;border:0;border-radius:99px;padding:6px 11px;cursor:pointer}
  </style>
  <!-- ⚡ Speculation Rules：hover / touch 200ms 背景預渲染，點擊後幾乎 0ms 直開 -->
  <script type="speculationrules">
  {
    "prerender": [
      { "source": "document", "where": { "href_matches": "/print-card.html*" }, "eagerness": "moderate" },
      { "source": "document", "where": { "href_matches": "/senior-view.html*" }, "eagerness": "moderate" },
      { "source": "document", "where": { "href_matches": "/adult-pass.html*" }, "eagerness": "moderate" }
    ],
    "prefetch": [
      {
        "source": "document",
        "where": { "href_matches": "/*" },
        "eagerness": "conservative"
      }
    ]
  }
  </script>
<link rel="preload" href="assets/fonts/NotoSansTC-subset-v3.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">我的預約</div></div>

  <div class="wrap">
    <div id="demoBanner" class="demo-bar" hidden>🧪 示範模式：以下通行卡同預約只係本地模擬，唔會影響真實帳戶。</div>
    <div id="passWallet" hidden></div>
    <div class="tabs" style="margin:0 -16px 12px">
      <button class="on" data-tab="upcoming">即將</button>
      <button data-tab="past">已完成</button>
      <button data-tab="cancelled">已取消</button>
    </div>
    <div class="stack" id="panels"><div class="card"><div class="body muted">載入中…</div></div></div>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js?v=3"></script>
  <script>
    const DEMO_PASS = new URLSearchParams(location.search).get("demo_pass") === "1";
    let all = [];
    let cur = "upcoming";
    const badge = (s) => ({
      confirmed: '<span class="badge ok">已確認</span>',
      pending_payment: '<span class="badge warn">待付款</span>',
      attended: '<span class="badge off">已完成</span>',
      no_show: '<span class="badge off">缺席</span>',
      cancelled: '<span class="badge off">已取消</span>',
    }[s] || `<span class="badge off">${esc(s)}</span>`);

    function hktTime(t) {
      const d = new Date(String(t || "").replace(" ", "T") + (/Z|[+-]\d\d:?\d\d$/.test(String(t || "")) ? "" : "Z"));
      if (isNaN(d.getTime())) return "";
      return d.toLocaleTimeString("zh-HK", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Hong_Kong" });
    }
    function seniorLink(b) {
      return "senior-view.html?id=" + encodeURIComponent(b.id);
    }
    function timeline(b) {
      if (b.status === "cancelled" || b.status === "pending_payment") return "";
      const start = new Date(String(b.start_time || "").replace(" ", "T") + (/Z|[+-]\d\d:?\d\d$/.test(String(b.start_time || "")) ? "" : "Z"));
      const started = !isNaN(start.getTime()) && Date.now() >= start.getTime();
      const checked = !!b.checked_in_at;
      const step2 = checked
        ? { cls: "on", label: "已簽到", sub: hktTime(b.checked_in_at) + " 入場" }
        : started ? { cls: "now", label: "待確認簽到", sub: "如已到場請聯絡導師" }
        : { cls: "", label: "待長者到達", sub: "當日簽到後更新" };
      let tagged = [];
      try { tagged = b.coach_tags ? (typeof b.coach_tags === "string" ? JSON.parse(b.coach_tags) : b.coach_tags) : []; } catch (e) {}
      const step3 = (tagged && tagged.length)
        ? { cls: "on", label: "已收到評語", sub: "導師已完成觀察" }
        : b.status === "attended"
          ? { cls: "now", label: "課後反饋", sub: "待導師提交" }
          : { cls: "", label: "課後反饋", sub: "下課後顯示" };
      return `<div class="tl">
        <div class="st on">已鎖定席位<span class="d">${b.payment_status === "paid" ? "已付款" : "已確認"}</span></div>
        <div class="st ${step2.cls}">${step2.label}<span class="d">${step2.sub}</span></div>
        <div class="st ${step3.cls}">${step3.label}<span class="d">${step3.sub}</span></div>
      </div>`;
    }
    function row(b) {
      let actions = "";
      if (b.status === "confirmed") {
        const cancelBtn = b.payment_type === "pass"
          ? (hoursUntil(b.start_time) >= 24
              ? `<button class="btn btn-secondary" onclick="cancelBk('${esc(b.id)}',1)">🗓️ 取消預約（可退 1 堂）</button>`
              : `<button class="btn btn-secondary" disabled title="開課前 24 小時內不可取消">🔒 已過取消時限（24 小時內）</button>`)
          : `<button class="btn btn-secondary" onclick="cancelBk('${esc(b.id)}',0)">取消預約</button>`;
        actions = `<button class="btn btn-primary" onclick="openPass('${esc(b.id)}')">🎫 出示入場憑證</button><a class="btn btn-secondary" href="adult-pass.html?id=${encodeURIComponent(b.id)}">🎫 電子票券</a><a class="btn btn-secondary" href="print-card.html?id=${encodeURIComponent(b.id)}">🖨️ 隨身卡</a>${cancelBtn}` +
        `<a class="btn btn-secondary" href="child-waiver.html?ref=${encodeURIComponent(b.booking_reference || "")}">🧒 家長同意書</a>`;
      }
      if (b.status === "confirmed") {
        const h = hoursUntil(b.start_time);
        actions += h >= 24
          ? `<button class="btn btn-secondary btn-block" onclick="openReschedule('${esc(b.id)}')">🔄 更改上課時間（免手續費）</button>`
          : `<button class="btn btn-secondary btn-block" disabled title="開課前 24 小時內不可改期">🔒 已過改期時限（開課前 24 小時）</button>`;
      }
      if (b.status === "pending_payment") actions = `<a class="btn btn-primary" href="booking.html?id=${encodeURIComponent(b.class_id)}&sid=${encodeURIComponent(b.schedule_id)}">繼續付款</a>`;
      if (b.status === "attended") actions = `<button class="btn btn-primary" onclick="openRateCoach('${esc(b.id)}','${esc(b.coach_name || "")}')">⭐ 評教練</button><button class="btn btn-secondary" onclick="openNps('${esc(b.id)}')">📋 課後問卷</button>${b.partner_venue_id ? `<button class="btn btn-secondary" onclick="openRateVenue('${esc(b.id)}','${esc(b.partner_venue_id)}','${esc(b.venue_name || "")}')">🏟️ 評場地</button>` : ""}<a class="btn btn-secondary" href="detail.html?id=${encodeURIComponent(b.class_id)}">再預約</a>`;
      return `<div class="card"><div class="body">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <div><p class="bk-title">${esc(b.title || "課程")}</p>
            <p class="muted" style="margin:0;font-size:13px">${b.student_name && api.getUser() && b.user_id !== api.getUser().id ? "👨‍👩‍👧 " + esc(b.student_name) + " · " : ""}${fmtTime(b.start_time, b.end_time)}${b.venue_name ? " · " + esc(b.venue_name) : ""}</p></div>
          ${badge(b.status)}
        </div>
        ${timeline(b)}
        ${(() => { try { const t = b.coach_tags ? (typeof b.coach_tags === "string" ? JSON.parse(b.coach_tags) : b.coach_tags) : []; if (!t || !t.length) return ""; const map = { energetic: "😊 精神好", moves_well: "💪 動作跟到", tight: "⚠️ 筋膜偏緊" }; return `<div style="margin:8px 0 0;font-size:12.5px;font-weight:800;color:#334155">導師評語：${t.map(k => map[k] || k).join("　")}</div>`; } catch (e) { return ""; } })()}
        ${actions ? `<div class="actions">${actions}</div>` : ""}
        ${b.status !== "cancelled" ? `<div class="mini">
          <a href="${seniorLink(b)}">📲 長者大字版</a>
          ${b.share ? `<button data-copy="senior-view.html" data-id="${b.id}" data-share="${b.share}">📋 複製大字版連結</button>` : ""}
          ${b.share ? `<button data-copy="adult-pass.html" data-id="${b.id}" data-share="${b.share}">🎫 複製票券連結</button>` : ""}
          <button data-onetime="${b.id}">🆔 一次性入場碼（防截圖）</button>
          <a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("提提你：" + (b.title || "課堂") + " " + fmtTime(b.start_time, b.end_time) + (b.venue_name ? "，" + b.venue_name : "") + "。到場出示 QR 就得：https://zenpass.hk/" + seniorLink(b))}">💬 傳提醒給父母</a>
        </div>` : ""}
        ${refundBox(b)}
      </div></div>`;
    }

    /* 💸 課堂取消 → 退款登記（FPS） */
    function refundBox(b) {
      if (b.status !== "cancelled" || b.payment_status !== "paid") return "";
      const st = String(b.refund_status || "none");
      const amt = Number(b.amount || 0).toFixed(2);
      const reason = b.cancel_reason || b.refund_reason || "課堂取消";
      if (st === "refunded") {
        return `<div style="margin-top:10px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:10px 12px">
          <b style="font-size:13px;color:#047857">✅ 已完成退款 HK$${amt}</b>
          <div class="muted" style="font-size:12px;margin-top:4px">款項已經 FPS 退回你登記嘅戶口${b.refunded_at ? "（" + esc(String(b.refunded_at).slice(0,10)) + "）" : ""}。</div>
        </div>`;
      }
      if (st === "requested" || st === "processing") {
        return `<div style="margin-top:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 12px">
          <b style="font-size:13px;color:#b45309">⏳ 退款處理中 · HK$${amt}</b>
          <div class="muted" style="font-size:12px;margin-top:4px">已登記 FPS：${esc(b.refund_fps_name || "")} / ${esc(b.refund_fps_id || "")}<br>款項將於 1–2 個工作天內轉入，完成後會再通知你。</div>
        </div>`;
      }
      return `<div style="margin-top:10px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px">
        <b style="font-size:13px;color:#c2410c">⚠️ 本課堂已取消（${esc(reason)}）· 可退 HK$${amt}</b>
        <div class="muted" style="font-size:12px;margin:4px 0 8px">請填寫轉數快（FPS）收款資料，平台會人手轉賬，一般 1–2 個工作天完成。</div>
        <input id="rfFps_${esc(b.id)}" placeholder="FPS 收款識別（手機號碼／電郵／FPS ID）" maxlength="64"
          style="width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 10px;font:inherit;font-size:13px;margin-bottom:6px" />
        <input id="rfName_${esc(b.id)}" placeholder="收款人姓名（需與銀行紀錄一致）" maxlength="64"
          style="width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 10px;font:inherit;font-size:13px;margin-bottom:8px" />
        <button class="btn btn-primary" type="button" onclick="submitRefund('${esc(b.id)}')">💸 提交退款登記</button>
        <div class="muted" style="font-size:11px;margin-top:6px">已付款紀錄：HK$${amt} · 退款原因：${esc(reason)}<br>💡 FPS 可填 8 位手機號碼／電郵／FPS ID，系統會自動去除 +852 及空格。</div>
      </div>`;
    }

    // FPS 識別碼標準化（同後端一致）：去除 +852／空格／橫線；email 轉細楷
    function normalizeFps(v) {
      const s = String(v || "").trim();
      if (!s) return "";
      if (s.includes("@")) return s.toLowerCase().replace(/\s+/g, "");
      let d = s.replace(/[^\d]/g, "");
      if (d.length === 11 && d.startsWith("852")) d = d.slice(3);
      if (d.length === 8) return d;
      return s.replace(/[\s\-()]/g, "").replace(/^\+/, "");
    }

      const raw = String(t || "");

      const ms = new Date(iso).getTime();
      return isNaN(ms) ? 0 : (ms - Date.now()) / 3600000;
    }
    function fmtShort(t) {
      const d = new Date(String(t || "").replace(" ", "T") + (/Z|[+-]\d\d:?\d\d$/.test(String(t || "")) ? "" : "+08:00"));
      if (isNaN(d)) return String(t || "");
      return d.toLocaleString("zh-HK", { month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });

        const t = new Date(/Z|[+-]\d\d:?\d\d$/.test(raw) ? raw : raw.replace(" ", "T") + "+08:00").getTime();

    /* 📅 匯出 .ics（手機一撳加入行事曆） */
    function downloadIcs(b, d) {
      const dt = (s) => {
        const x = new Date(String(s).replace(" ", "T"));
        if (isNaN(x)) return null;
        return x.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      };
      const st = dt(b.start_time), en = dt(b.end_time);
      if (!st) { alert("此預約未有確實時間，暫時加入唔到行事曆"); return; }
      const title = (b.title || "ZenPass 課堂") + " · ZenPass 禪流";
      const loc = [b.venue_name, b.venue_address].filter(Boolean).join(" ");
      const desc = ["預約編號：" + (d.booking_reference || b.booking_reference || ""), "驗證碼：" + (d.checkin_code || ""), "出示入場憑證 QR Code 簽到。"].join("\n");
      const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ZenPass//HK//ZH", "BEGIN:VEVENT",
        "UID:" + (b.id || Date.now()) + "@zenpass.hk",
        "DTSTAMP:" + st,
        "DTSTART:" + st,
        "DTEND:" + (en || st),
        "SUMMARY:" + title.replace(/[,;]/g, " "),
        "LOCATION:" + (loc || "").replace(/[,;]/g, " "),
        "DESCRIPTION:" + desc.replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"),
        "BEGIN:VALARM", "TRIGGER:-PT2H", "ACTION:DISPLAY", "DESCRIPTION:課堂 2 小時後開始", "END:VALARM",
        "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "zenpass-" + (b.booking_reference || "booking") + ".ics";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }

          booking_id: id, rating: val,
          comment: o.querySelector("textarea").value,
          would_recommend: o.querySelector("input[type=checkbox]").checked ? 1 : 0,
        });
        if (r.ok) { alert((r.data && r.data.message) || "多謝你嘅評價！"); o.remove(); }
        else alert((r.data && r.data.error) || "提交失敗");
      };
    };

    async function load() {
      const r = await api.get("/bookings/my?limit=50");
      all = (r.data && r.data.bookings) || [];
      render();
      if (DEMO_PASS) loadDemoWallet(); else loadPassWallet();
    }

    // 🧪 示範模式：深綠金通行卡（4 格進度點）
    function loadDemoWallet() {
      const box = document.getElementById("passWallet");
      if (!box) return;
      const banner = document.getElementById("demoBanner");
      if (banner) banner.hidden = false;
      let left = parseInt(localStorage.getItem("zenpass_mock_credits") || "3", 10);
      if (!Number.isFinite(left) || left < 0) left = 3;
      let booked = [];
      try { booked = JSON.parse(localStorage.getItem("zenpass_mock_bookings") || "[]") || []; } catch (e) {}
      const bookedCount = booked.length ? 1 : 0;
      const completed = Math.max(0, 4 - left - bookedCount);
      const stamps = [];
      for (let i = 0; i < completed; i++) stamps.push(`<div class="pass-stamp done"><span class="s-ic">✅</span>12/${String(5 + i * 7).padStart(2, "0")}<br>楓樹窩</div>`);
      if (bookedCount) stamps.push(`<div class="pass-stamp booked"><span class="s-ic">🟢</span>12/12<br>楓樹窩</div>`);
      for (let i = 0; i < left; i++) stamps.push(`<div class="pass-stamp left"><span class="s-ic">⚪</span>尚餘 ${left} 堂<br>待預約</div>`);
      while (stamps.length < 4) stamps.push(`<div class="pass-stamp left"><span class="s-ic">⚪</span>—</div>`);
      const action = left > 0
        ? `<a class="pw2-book" href="booking.html?demo_pass=1">📅 一鍵預約下一期班次（免重複填表）</a>`
        : `<a class="pw2-renew" href="https://wa.me/85290335538?text=${encodeURIComponent("你好，我想續購 4 堂通行卡（早鳥減 $40）")}" target="_blank" rel="noopener">🔄 續購 4 堂通行卡（早鳥減 $40）</a>`;
      box.innerHTML = `<div class="pass-wallet-card">
        <div class="pw2-head">
          <span class="pw2-title">🌿 樂齡 4 堂通行卡</span>
          <span class="pw2-owner">陳伯伯專屬</span>
        </div>
        <div class="pass-stamp-grid">${stamps.slice(0, 4).join("")}</div>
        <div class="pw2-actions">${action}</div>
      </div>`;
      box.hidden = false;
    }

    // 🎫 4 堂通行證卡包
    async function loadPassWallet() {
      const box = document.getElementById("passWallet");
      if (!box) return;
      try {
        const r = await api.get("/passes/my");
        const list = (r.ok && r.data && r.data.passes) || [];
        if (!list.length) { box.hidden = true; return; }
        const p = list[0];
        const total = Number(p.total_credits) || 4;
        const left = Number(p.remaining_credits) || 0;
        const used = Math.max(0, total - left);
        const slots = p.used_slots || [];
        let dots = "";
        for (let i = 0; i < total; i++) {
          dots += i < used
            ? `<span class="pw-dot used" title="${slots[i] ? (slots[i].start_time || "").slice(0, 10) : "已使用"}">✓</span>`
            : `<span class="pw-dot free">${i + 1}</span>`;
        }
        const exp = String(p.expires_at || "").slice(0, 10).replace(/-/g, "/");
        const usedTxt = slots.length
          ? "已上：" + slots.map(s => `${(s.start_time || "").slice(5, 10).replace("-", "/")} ${s.venue_name || ""}`).join("、")
          : "仲未開始用";
        const classId = (slots[slots.length - 1] && slots[slots.length - 1].class_id) || "";
        const nextHref = classId ? `booking.html?id=${encodeURIComponent(classId)}` : "explore.html";
        const wa = "https://wa.me/85290335538?text=" + encodeURIComponent(
          `你好，我想續購 4 堂通行證（${p.student_name}，卡號 ${p.id}），請提供付款方法。`
        );
        box.innerHTML = `<div class="pass-wallet">
          <div class="pw-head">
            <span class="pw-title">🎫 樂齡 4 堂通行證 · ${esc(p.student_name || "")}</span>
            <span class="pw-exp">有效期至 ${exp || "—"}</span>
          </div>
          <div class="pw-dots">${dots}</div>
          <div class="pw-meta">尚餘 <b>${left}</b> 堂 · <span style="opacity:.85">${esc(usedTxt)}</span></div>
          <div class="pw-actions">
            <a class="pw-book" href="${nextHref}">📅 一鍵預約下一堂</a>
            <a class="pw-renew" href="${wa}" target="_blank" rel="noopener">🔄 4 堂用完？續購再減 $40</a>
          </div>
        </div>`;
        box.hidden = false;
      } catch (e) { box.hidden = true; }
    }

    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      cur = b.dataset.tab; render();
    });

    (async () => {
      // Stripe Checkout 返回：主動確認付款（webhook 可能未設定）
      const q = new URLSearchParams(location.search);
      if (q.get("stripe") === "success" && q.get("session_id")) {
        const r = await api.post("/payments/stripe/confirm-payment", {
          session_id: q.get("session_id"),
        });
        if (!r.ok) alert((r.data && r.data.error) || "付款確認失敗，請聯絡客服");
        history.replaceState(null, "", location.pathname);
      }
      if (DEMO_PASS) { load(); } else if (api.requireLogin("my-bookings.html")) load();
    })();
    function miniToast(m) {
      const t = document.createElement("div");
      t.textContent = m;
      t.style.cssText = "position:fixed;right:16px;top:16px;background:#0f172a;color:#fff;padding:11px 15px;border-radius:12px;font:800 13px -apple-system,'PingFang HK',sans-serif;z-index:9999;box-shadow:0 8px 24px rgba(15,23,42,.25)";
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }
    document.addEventListener("click", async (e) => {
      const ot = e.target.closest("[data-onetime]");
      if (ot) {
        try {
          ot.disabled = true;
          ot.textContent = "⏳ 產生中…";
          const r = await fetch("/api/bookings/" + encodeURIComponent(ot.dataset.onetime) + "/access-token", {
            method: "POST",
            headers: { "content-type": "application/json" },
            credentials: "include",
          }).then((x) => x.json());
          if (!r || !r.success) throw new Error((r && r.error) || "產生失敗");
          location.href = r.url;
        } catch (err) {
          miniToast("⚠️ " + err.message);
          ot.disabled = false;
          ot.textContent = "🆔 一次性入場碼（防截圖）";
        }
        return;
      }
      const btn = e.target.closest("[data-copy]");
      if (!btn) return;
      const url = location.origin + "/" + btn.dataset.copy + "?id=" + encodeURIComponent(btn.dataset.id) + "&sh" + "are=" + encodeURIComponent(btn.dataset.share);
      const isSenior = btn.dataset.copy === "senior-view.html";
      const text = isSenior
        ? "爸爸/媽媽，呢個係你嘅專屬大字入場卡，撳入去就見到大字時間同入場 QR Code：\n" + url
        : "這是您的專屬電子票券連結（含入場 QR Code 與日曆提醒）：\n" + url;
      try {
        await navigator.clipboard.writeText(text);
        miniToast(isSenior
          ? "✅ 已複製專屬長者大字版說明與連結，可直接貼到 WhatsApp 給家人！"
          : "✅ 已複製電子票券說明與連結，可直接貼到 WhatsApp 給家人！");
      } catch (err) {
        prompt("請手動複製以下訊息：", text);
      }
    });
  </script>
  <script src="assets/footer.js?v=6" defer></script>
</body>
</html>
