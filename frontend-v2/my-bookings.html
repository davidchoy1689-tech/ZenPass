<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>我的預約 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <style>
    .tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
    .tabs button { flex: 1; padding: 14px 0; background: none; border: 0; font: inherit; font-weight: 700; color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; }
    .tabs button.on { color: var(--brand-600); border-color: var(--brand-500); }
    .bk-title { font-weight: 700; margin: 0 0 2px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn { min-height: 40px; padding: 0 14px; font-size: 14px; flex: 1; }
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">我的預約</div></div>

  <div class="wrap">
    <div class="tabs" style="margin:0 -16px 12px">
      <button class="on" data-tab="upcoming">即將</button>
      <button data-tab="past">已完成</button>
      <button data-tab="cancelled">已取消</button>
    </div>
    <div class="stack" id="panels"><div class="card"><div class="body muted">載入中…</div></div></div>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script>
    let all = [];
    let cur = "upcoming";
    const badge = (s) => ({
      confirmed: '<span class="badge ok">已確認</span>',
      pending_payment: '<span class="badge warn">待付款</span>',
      attended: '<span class="badge off">已完成</span>',
      no_show: '<span class="badge off">缺席</span>',
      cancelled: '<span class="badge off">已取消</span>',
    }[s] || `<span class="badge off">${esc(s)}</span>`);

    function row(b) {
      let actions = "";
      if (b.status === "confirmed") actions = `<button class="btn btn-secondary" onclick="cancelBk('${esc(b.id)}')">取消預約</button>`;
      if (b.status === "pending_payment") actions = `<a class="btn btn-primary" href="booking.html?id=${encodeURIComponent(b.class_id)}&sid=${encodeURIComponent(b.schedule_id)}">繼續付款</a>`;
      if (b.status === "attended") actions = `<button class="btn btn-primary" onclick="openRateCoach('${esc(b.id)}','${esc(b.coach_name || "")}')">⭐ 評教練</button><button class="btn btn-secondary" onclick="openNps('${esc(b.id)}')">📋 課後問卷</button>${b.partner_venue_id ? `<button class="btn btn-secondary" onclick="openRateVenue('${esc(b.id)}','${esc(b.partner_venue_id)}','${esc(b.venue_name || "")}')">🏟️ 評場地</button>` : ""}<a class="btn btn-secondary" href="detail.html?id=${encodeURIComponent(b.class_id)}">再預約</a>`;
      return `<div class="card"><div class="body">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <div><p class="bk-title">${esc(b.title || "課程")}</p>
            <p class="muted" style="margin:0;font-size:13px">${fmtTime(b.start_time)}${b.venue_name ? " · " + esc(b.venue_name) : ""}</p></div>
          ${badge(b.status)}
        </div>
        ${actions ? `<div class="actions">${actions}</div>` : ""}
      </div></div>`;
    }

    function render() {
      const groups = {
        upcoming: all.filter(b => b.status === "confirmed" || b.status === "pending_payment"),
        past: all.filter(b => b.status === "attended"),
        cancelled: all.filter(b => b.status === "cancelled" || b.status === "no_show"),
      };
      const arr = groups[cur] || [];
      document.getElementById("panels").innerHTML = arr.length ? arr.map(row).join("")
        : `<div class="card"><div class="body muted center">呢度暫時冇預約。</div></div>`;
    }

    window.cancelBk = async (id) => {
      if (!confirm("確定取消呢個預約？")) return;
      const r = await api.post("/bookings/" + encodeURIComponent(id) + "/cancel", {});
      if (r.ok) { await load(); } else { alert((r.data && r.data.error) || "取消失敗"); }
    };

    window.closeModal = (el) => { const o = el.closest(".modal-overlay"); if (o) o.remove(); };
    /* 🏟️ 評場地及設施（匿名；≤3 星必須選原因） */
    window.openRateVenue = (bookingId, venueId, venueName) => {
      const TAGS = ["🧹 清潔", "🛠️ 器材", "📐 空間", "❄️ 冷氣", "🚻 洗手間", "📍 交通"];
      const REASONS = ["清潔問題", "器材不足/壞", "空間太細", "冷氣/通風差", "職員態度", "其他"];
      const o = document.createElement("div");
      o.className = "modal-overlay";
      o.innerHTML = `<div class="modal">
        <h3>🏟️ 評價場地及設施</h3>
        <p class="muted" style="font-size:13px;margin-top:0">${esc(venueName || "場地")}</p>
        <div class="muted" style="font-size:13px">整體如何？</div>
        <div class="rate-grid" id="vrStars">${[1,2,3,4,5].map(v => `<button type="button" data-v="${v}">${v}</button>`).join("")}</div>
        <div class="lbl" style="font-size:13px;color:var(--text-muted);margin-top:10px">邊方面好／唔好？（可多選）</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px" id="vrTags">
          ${TAGS.map((t, i) => `<label style="font-size:12.5px;border:1px solid var(--border);border-radius:999px;padding:5px 10px"><input type="checkbox" data-tag="${esc(t.replace(/^\S+\s/, ""))}" style="margin-right:4px">${esc(t)}</label>`).join("")}
        </div>
        <div id="vrReasonsWrap" style="display:none">
          <div class="lbl" style="font-size:13px;color:var(--text-muted);margin-top:10px">請揀原因（3 星或以下必須）</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px" id="vrReasons">
            ${REASONS.map(t => `<label style="font-size:12.5px;border:1px solid var(--border);border-radius:999px;padding:5px 10px"><input type="checkbox" data-reason="${esc(t)}" style="margin-right:4px">${esc(t)}</label>`).join("")}
          </div>
        </div>
        <textarea rows="3" placeholder="其他意見（可選，7 日後先公開，全部匿名）" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;padding:11px;font:inherit;background:var(--surface);color:var(--text);margin-top:10px"></textarea>
        <div class="muted" style="font-size:12px;margin-top:6px">🔒 全部匿名：場地只會見到「學員」，見唔到你嘅姓名。</div>
        <div class="actions"><button class="btn btn-secondary" onclick="closeModal(this)">取消</button><button class="btn btn-primary" id="vrSend">提交評分</button></div>
      </div>`;
      document.body.appendChild(o);
      o.onclick = (e) => { if (e.target === o) o.remove(); };
      let val = 0;
      o.querySelectorAll("#vrStars button").forEach(btn => btn.onclick = () => {
        val = Number(btn.dataset.v);
        o.querySelectorAll("#vrStars button").forEach(x => x.classList.toggle("on", Number(x.dataset.v) <= val));
        o.querySelector("#vrReasonsWrap").style.display = val && val <= 3 ? "block" : "none";
      });
      o.querySelector("#vrSend").onclick = async () => {
        if (!val) { alert("請揀 1-5 星"); return; }
        const tags = [...o.querySelectorAll("#vrTags input:checked")].map(x => x.dataset.tag);
        const reasons = [...o.querySelectorAll("#vrReasons input:checked")].map(x => x.dataset.reason);
        if (val <= 3 && !reasons.length) { alert("3 星或以下請揀原因"); return; }
        const btn = o.querySelector("#vrSend");
        btn.disabled = true; btn.textContent = "提交中…";
        const r = await api.post("/mutual-reviews/submit", {
          target_type: "venue", target_id: venueId, rater_role: "student",
          context_type: "booking", context_id: bookingId,
          rating: val, tags, reasons, comment: o.querySelector("textarea").value.trim(),
        });
        btn.disabled = false; btn.textContent = "提交評分";
        if (r.ok) { alert((r.data && r.data.message) || "多謝你嘅評分！"); o.remove(); }
        else alert((r.data && r.data.error) || "提交失敗");
      };
    };

    /* ⭐ 評教練（1-5 星；後端驗證：只限已出席、每預約一次、48 小時內可改） */
    window.openRateCoach = (id, coachName) => {
      const b = all.find(x => x.id === id) || {};
      if (!b.coach_id) { alert("此預約缺少教練資料"); return; }
      const o = document.createElement("div");
      o.className = "modal-overlay";
      o.innerHTML = `<div class="modal">
        <h3>⭐ 評價教練</h3>
        <p class="muted" style="font-size:13px;margin-top:0">${esc(b.title || "")}${coachName ? " · " + esc(coachName) : ""}</p>
        <div class="muted" style="font-size:13px">今次堂嘅教練表現如何？</div>
        <div class="rate-grid" id="crStars">${[1,2,3,4,5].map(v => `<button type="button" data-v="${v}">${v}</button>`).join("")}</div>
        <div id="crReasonsWrap" style="display:none">
          <div class="muted" style="font-size:12px;margin-top:10px">原因（3 星或以下必須）</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px" id="crReasons">
            ${["遲到/早走","講解唔清楚","態度問題","安全意識不足","課程內容與描述不符"].map(t => `<label style="font-size:12.5px;border:1px solid var(--border);border-radius:999px;padding:5px 10px"><input type="checkbox" data-reason="${t}" style="margin-right:4px">${t}</label>`).join("")}
          </div>
        </div>
        <textarea rows="3" placeholder="有咩想同教練講？（可選，7 日後先公開，全部匿名）" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;padding:11px;font:inherit;background:var(--surface);color:var(--text);margin-top:10px"></textarea>
        <div class="muted" style="font-size:12px;margin-top:6px">🔒 匿名：教練見到「學員」，見唔到你嘅姓名。每張預約一次。</div>
        <div class="actions"><button class="btn btn-secondary" onclick="closeModal(this)">取消</button><button class="btn btn-primary" id="crSend">提交評分</button></div>
      </div>`;
      document.body.appendChild(o);
      o.onclick = (e) => { if (e.target === o) o.remove(); };
      let val = 0;
      o.querySelectorAll("#crStars button").forEach(btn => btn.onclick = () => {
        val = Number(btn.dataset.v);
        o.querySelectorAll("#crStars button").forEach(x => x.classList.toggle("on", Number(x.dataset.v) <= val));
        o.querySelector("#crReasonsWrap").style.display = val && val <= 3 ? "block" : "none";
      });
      o.querySelector("#crSend").onclick = async () => {
        if (!val) { alert("請揀 1-5 星"); return; }
        const reasons = [...o.querySelectorAll("[data-reason]:checked")].map(x => x.dataset.reason);
        if (val <= 3 && !reasons.length) { alert("3 星或以下請揀原因"); return; }
        const btn = o.querySelector("#crSend");
        btn.disabled = true; btn.textContent = "提交中…";
        const r = await api.post("/mutual-reviews/submit", {
          target_type: "coach", target_id: b.coach_id, rater_role: "student",
          context_type: "booking", context_id: id,
          rating: val, tags: [], reasons,
          comment: o.querySelector("textarea").value.trim(),
        });
        btn.disabled = false; btn.textContent = "提交評分";
        if (r.ok) { alert((r.data && r.data.message) || "多謝你嘅評分！"); o.remove(); }
        else alert((r.data && r.data.error) || "提交失敗");
      };
    };

    window.openNps = (id) => {
      const b = all.find(x => String(x.id) === String(id)) || {};
      const o = document.createElement("div");
      o.className = "modal-overlay";
      o.innerHTML = `<div class="modal">
        <h3>⭐ 課程評價</h3>
        <p class="muted" style="font-size:13px;margin-top:0">${esc(b.title || "")}</p>
        <div class="muted" style="font-size:13px">你幾大機會推薦呢個課程？（1 = 唔會，10 = 一定會）</div>
        <div class="rate-grid">${[...Array(10)].map((_, i) => `<button type="button" data-v="${i + 1}">${i + 1}</button>`).join("")}</div>
        <textarea rows="3" placeholder="有咩意見？（可選）" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;padding:11px;font:inherit;background:var(--surface);color:var(--text);margin-top:8px"></textarea>
        <label class="muted" style="font-size:13px;display:block;margin-top:8px"><input type="checkbox" checked> 我會推薦俾朋友</label>
        <div class="actions"><button class="btn btn-secondary" onclick="closeModal(this)">取消</button><button class="btn btn-primary" id="npsSend">提交</button></div>
      </div>`;
      document.body.appendChild(o);
      o.onclick = (e) => { if (e.target === o) o.remove(); };
      let val = 0;
      o.querySelectorAll(".rate-grid button").forEach(btn => btn.onclick = () => {
        val = Number(btn.dataset.v);
        o.querySelectorAll(".rate-grid button").forEach(x => x.classList.toggle("on", x === btn));
      });
      o.querySelector("#npsSend").onclick = async () => {
        if (!val) { alert("請揀 1-10 分"); return; }
        const r = await api.post("/nps/submit", {
          booking_id: id, rating: val,
          comment: o.querySelector("textarea").value,
          would_recommend: o.querySelector("input[type=checkbox]").checked ? 1 : 0,
        });
        if (r.ok) { alert((r.data && r.data.message) || "多謝你嘅評價！"); o.remove(); }
        else alert((r.data && r.data.error) || "提交失敗");
      };
    };

    async function load() {
      const r = await api.get("/bookings/my?limit=50");
      all = (r.data && r.data.bookings) || [];
      render();
    }

    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      cur = b.dataset.tab; render();
    });

    if (api.requireLogin("my-bookings.html")) load();
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
