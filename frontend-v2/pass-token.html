<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#064E3B" media="(prefers-color-scheme: dark)" />
<title>ZenPass · 入場憑證</title>
<link rel="stylesheet" href="assets/accessibility.css?v=1">
<style>
  :root { --brand:#0f766e; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --amber:#b45309; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; background:#f8fafc; color:var(--ink); }
  .wrap { max-width:560px; margin:0 auto; padding:16px 14px 36px; }
  .topbar { display:flex; justify-content:flex-end; margin-bottom:10px; }
  .bigbtn { border:2px solid var(--brand); background:#fff; color:var(--brand); font-weight:900; font-size:15px;
    padding:10px 14px; border-radius:12px; min-height:44px; }
  .bigbtn.on { background:var(--brand); color:#fff; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 8px 28px rgba(15,23,42,.06); }
  .badge { display:inline-block; font-size:13px; padding:4px 12px; border-radius:999px; background:#ccfbf1; color:#0f766e; font-weight:800; }
  h1 { font-size:20px; margin:10px 0 2px; line-height:1.35; }
  .sub { color:var(--muted); font-size:15px; margin:0 0 14px; line-height:1.55; }

  /* 一次性核銷碼：預設 36px；大字模式 46px */
  .last4box { margin:6px 0 4px; padding:16px 10px; border:3px dashed #14b8a6; border-radius:16px; background:#f0fdfa; text-align:center; }
  .last4label { font-size:14px; color:#0f766e; font-weight:800; letter-spacing:.5px; }
  #last4 { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:36px; font-weight:900;
    letter-spacing:10px; line-height:1.25; margin-top:6px; color:#0f172a; }
  .last4hint { font-size:14px; color:var(--muted); margin-top:6px; line-height:1.5; }

  #qrBox { display:flex; justify-content:center; padding:12px; background:#fff; border-radius:14px; border:1px solid var(--line); min-height:220px; align-items:center; margin-top:14px; }
  #qrBox img, #qrBox canvas { width:240px !important; height:240px !important; }

  .meta { margin-top:16px; font-size:16px; line-height:1.7; }
  .meta .row { display:flex; gap:8px; padding:5px 0; border-bottom:1px dashed #eef2f7; }
  .meta .k { color:var(--muted); flex:0 0 74px; font-size:14px; padding-top:2px; }
  .meta .v { font-weight:800; flex:1; }

  .barwrap { margin-top:16px; }
  .barlabel { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:5px; }
  .bar { height:12px; border-radius:999px; background:#e2e8f0; overflow:hidden; }
  .bar > i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#0d9488,#22c55e); transition:width .6s linear; }
  .bar.low > i { background:linear-gradient(90deg,#f59e0b,#ef4444); }

  .warn { margin-top:16px; font-size:14px; color:var(--muted); line-height:1.65; background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .err { color:#b91c1c; font-weight:900; }
  button.main { margin-top:16px; width:100%; padding:16px; font-size:17px; font-weight:900; color:#fff; background:var(--brand); border:0; border-radius:14px; min-height:56px; }

  body.large { font-size:19px; }
  body.large h1 { font-size:24px; }
  body.large .sub { font-size:17px; }
  body.large #last4, body.large .zp-last4 { font-size:46px; letter-spacing:14px; }
  body.large .last4label, body.large .last4hint { font-size:17px; }
  body.large .meta { font-size:19px; }
  body.large .meta .k { font-size:16px; }
  body.large .warn { font-size:16px; }
  body.large .bigbtn { font-size:16px; }
</style>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="bigbtn" id="largeBtn" type="button" aria-pressed="true">A+ 長者大字模式</button>
  </div>

  <div class="card">
    <span class="badge">一次性入場憑證</span>
    <h1 id="title">載入中…</h1>
    <p class="sub" id="sub">請向教練出示此頁，或直接讀出下方 4 位數字</p>

    <div class="last4box">
      <div class="last4label">👵 長者免手機 / 報電話核銷專用</div>
      <div id="last4" class="zp-last4">— — — —</div>
      <div class="last4hint">向教練報出上述 4 位數字即可完成點名</div>
    </div>

    <div id="qrBox"></div>

    <div class="meta" id="meta"></div>

    <div class="barwrap">
      <div class="barlabel"><span>憑證有效期限</span><span id="barTime">—</span></div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
    </div>

    <p class="warn">⚠️ 此憑證<b>只可使用一次</b>，核銷後即時失效。請勿截圖轉發他人——截圖外流會令你自己無法入場。</p>
    <button class="main" id="copyBtn" type="button" hidden>複製核銷碼</button>
  </div>
</div>
<script src="vendor/qrcode.min.js"></script>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var token = qs.get('t') || '';
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var box = document.getElementById('qrBox');
  var last4El = document.getElementById('last4');
  var metaEl = document.getElementById('meta');
  var btn = document.getElementById('copyBtn');
  var largeBtn = document.getElementById('largeBtn');

  /* ── 長者大字模式（預設開，記住選擇） ── */
  function applyLarge(on) {
    document.body.classList.toggle('large', on);
    largeBtn.classList.toggle('on', on);
    largeBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    largeBtn.textContent = on ? 'A+ 長者大字模式（已開）' : 'A+ 長者大字模式';
    try { localStorage.setItem('zp_large', on ? '1' : '0'); } catch (e) {}
  }
  var stored = null;
  try { stored = localStorage.getItem('zp_large'); } catch (e) {}
  applyLarge(qs.get('big') === '1' ? true : qs.get('big') === '0' ? false : stored !== '0');
  largeBtn.addEventListener('click', function(){ applyLarge(!document.body.classList.contains('large')); });

  if (!token) {
    titleEl.textContent = '憑證無效';
    titleEl.className = 'err';
    subEl.textContent = '缺少憑證參數，請由「我的預約」重新開啟。';
    last4El.textContent = '— — — —';
    return;
  }

  /* ── QR（payload 只帶 token）── */
  try {
    if (window.QRCode) new QRCode(box, { text: JSON.stringify({ access_token: token, v: 1 }), width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  } catch (e) {
    box.innerHTML = '<div style="color:#475569;font-size:14px">（未能繪製 QR，請直接讀出上方 4 位數字）</div>';
  }

  btn.hidden = false;
  btn.addEventListener('click', function(){
    var last4 = (last4El.textContent || '').replace(/\D/g, '');
    navigator.clipboard && navigator.clipboard.writeText(last4).then(function(){
      btn.textContent = '✅ 已複製';
      setTimeout(function(){ btn.textContent = '複製核銷碼'; }, 1600);
    });
  });

  function hkt(t) {
    if (!t) return '—';
    var d = new Date(String(t).replace(' ', 'T') + (/Z|[+-]\d\d:?\d\d$/.test(String(t)) ? '' : 'Z'));
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('zh-HK', { timeZone:'Asia/Hong_Kong', month:'numeric', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false });
  }

  /* ── 有效期限倒數 ── */
  var expiresMs = 0;
  function tick() {
    if (!expiresMs) return;
    var left = expiresMs - Date.now();
    var bar = document.getElementById('bar');
    var fill = document.getElementById('barFill');
    var label = document.getElementById('barTime');
    if (left <= 0) {
      fill.style.width = '0%';
      label.textContent = '已過期';
      bar.classList.add('low');
      subEl.textContent = '此憑證已過期，請在「我的預約」重新開啟。';
      subEl.className = 'sub err';
      return;
    }
    var mins = Math.floor(left / 60000);
    label.textContent = mins >= 60 ? Math.floor(mins/60) + ' 小時 ' + (mins%60) + ' 分' : mins + ' 分鐘';
    // 進度以 2 小時為基準
    var pct = Math.max(0, Math.min(100, (left / (2*3600000)) * 100));
    fill.style.width = pct.toFixed(1) + '%';
    bar.classList.toggle('low', left < 30*60000);
  }
  setInterval(tick, 20000);

  /* ── 取回課堂資訊 ── */
  fetch('/api/checkin/token-info?t=' + encodeURIComponent(token), { headers: { accept: 'application/json' } })
    .then(function(r){ return r.json().then(function(j){ return { s: r.status, j: j }; }); })
    .then(function(o){
      if (!o.j || !o.j.success) {
        titleEl.textContent = o.j && o.j.code === 'TOKEN_ALREADY_USED' ? '此憑證已使用' : '憑證無效';
        titleEl.className = 'err';
        subEl.textContent = (o.j && o.j.error) || '請由「我的預約」重新開啟。';
        last4El.textContent = '— — — —';
        return;
      }
      var d = o.j;
      titleEl.textContent = d.student_name + ' · ' + d.title;
      last4El.textContent = (d.last4 || '').split('').join(' ') || '— — — —';
      var rows = [
        ['時間', hkt(d.start_time)],
        ['場地', d.venue_name || '—'],
      ];
      if (d.venue_address) rows.push(['地址', d.venue_address]);
      rows.push(['訂單', d.booking_reference || '—']);
      metaEl.innerHTML = rows.map(function(r){
        return '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + String(r[1]).replace(/[<>&]/g, '') + '</span></div>';
      }).join('');
      expiresMs = new Date(d.expires_at).getTime() || 0;
      tick();
    })
    .catch(function(){
      subEl.textContent = '未能載入課堂資料（網絡問題）。仍可向教練出示 QR 或讀出 4 位數字。';
    });
})();
</script>
</body>
</html>
