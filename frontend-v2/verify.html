<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#064E3B" />
  <title>證書驗證 · ZenPass 禪流</title>
  <meta name="description" content="ZenPass 完課證書真偽驗證 — 輸入或掃描證書編號即可核實。" />
  <link rel="stylesheet" href="assets/v2.css?v=27" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    .vf-wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
    .vf-card{background:linear-gradient(135deg,#0B132B,#064E3B);color:#fff;border-radius:18px;padding:22px;text-align:center}
    .vf-ic{font-size:46px;line-height:1}
    .vf-title{font-size:17px;font-weight:800;margin-top:8px}
    .vf-sub{font-size:12.5px;color:#CBD5E1;margin-top:6px;line-height:1.6}
    .vf-rows{margin-top:16px;text-align:left;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
    .vf-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0}
    .vf-row span{color:#CBD5E1}
    .vf-row b{text-align:right}
    .vf-badge{display:inline-block;margin-top:14px;background:#ecfdf5;color:#047857;font-weight:800;font-size:12px;border-radius:999px;padding:6px 14px}
    .vf-bad{background:linear-gradient(135deg,#450a0a,#7f1d1d)}
    .vf-bad .vf-badge{background:#fef2f2;color:#b91c1c}
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="/">‹</a><div class="title">證書驗證</div></div>
  <div class="vf-wrap">
    <div id="out"><div class="vf-card"><div class="vf-ic">🔎</div><div class="vf-title">驗證中…</div></div></div>
    <div class="card" style="margin-top:14px"><div class="body">
      <b style="font-size:13.5px">咩係 ZenPass 完課證書？</b>
      <p class="muted" style="font-size:12.5px;line-height:1.7;margin:8px 0 0">學員完成課堂並經教練／學員簽到後，系統自動簽發帶獨立編號的電子證書，記錄項目、認證時數、等級及執教教練。學校、機構或家長可在此頁核實真偽。</p>
    </div></div>
    <p class="muted center" style="font-size:11.5px;margin-top:14px">香港康樂及體育有限公司 · Hong Kong Leisure and Fitness Company Limited</p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const _qs = new URLSearchParams(location.search);
    const code = (_qs.get("cert") || "").trim();
    // QR 內嵌嘅存證雜湊前綴（防翻拍／改圖：與伺服器紀錄不符即警告）
    const qrHash = (_qs.get("h") || "").trim().toLowerCase();
    // 雜湊鹽版本：只有同版本才做前綴比對（未來換鹽，舊 QR 唔會誤報）
    const qrSv = (_qs.get("sv") || "").trim();
    const CUR_SV = "1";
    const canCompare = !qrSv || qrSv === CUR_SV;
    const day = (t) => {
      const d = new Date(String(t || "").replace(" ", "T") + (/Z$/.test(String(t || "")) ? "" : "Z"));
      return isNaN(d.getTime()) ? String(t || "") : d.toLocaleDateString("zh-HK", { year: "numeric", month: "2-digit", day: "2-digit" });
    };
    (async () => {
      if (!code) {
        $("out").innerHTML = `<div class="vf-card vf-bad"><div class="vf-ic">⚠️</div><div class="vf-title">未提供證書編號</div>
          <div class="vf-sub">請掃描證書上的 QR Code，或使用完整連結。</div></div>`;
        return;
      }
      try {
        const r = await fetch("/api/certificates/verify/" + encodeURIComponent(code));
        const d = await r.json();
        if (!d || !d.valid) {
          $("out").innerHTML = `<div class="vf-card vf-bad"><div class="vf-ic">❌</div><div class="vf-title">查無此證書</div>
            <div class="vf-sub">編號 <b>${esc(code)}</b> 未在系統中登記，可能輸入有誤或證書已作廢。</div>
            <div class="vf-badge">無法驗證</div></div>`;
          return;
        }
        const c = d.certificate || {};
        const isAttend = String(c.cert_type || "") === "attendance";
        const isSkill = String(c.cert_type || "") === "skill_assessment";
        const docName = isSkill ? "專項評定證書" : isAttend ? "出席證書" : "證書";
        $("out").innerHTML = `<div class="vf-card">
          <div class="vf-ic">✅</div>
          <div class="vf-title">${docName}有效</div>
          <div class="vf-sub">此${docName}由 ZenPass 禪流平台正式簽發</div>
          <div class="vf-rows">
            ${c.is_demo ? `<div class="vf-row"><span>樣本</span><b style="color:#FCD34D">示範證書（非真實學員紀錄）</b></div>` : ""}
            <div class="vf-row"><span>持證學員</span><b>${esc(c.student_name)}</b></div>
            <div class="vf-row"><span>${isAttend || isSkill ? "課程名稱" : "完成項目"}</span><b>${esc(c.class_title)}</b></div>
            <div class="vf-row"><span>${isAttend ? "出席紀錄" : isSkill ? "評定等級" : "認證等級"}</span><b>${esc(c.level_label)}</b></div>
            <div class="vf-row"><span>${isAttend ? "出席時數" : "認證時數"}</span><b>${(Number(c.hours) || 0).toFixed(1)} 小時</b></div>
            <div class="vf-row"><span>執教教練</span><b>${c.coach_starred ? "星級教練 · " : ""}${esc(c.coach_name || "—")}</b></div>
            ${c.student_ref ? `<div class="vf-row"><span>學員識別碼</span><b style="font-family:ui-monospace,monospace;font-size:11px">${esc(c.student_ref)}</b></div>` : ""}
            <div class="vf-row"><span>${isAttend ? "紀錄日期" : "完成日期"}</span><b>${esc(day(c.issued_at))}</b></div>
            <div class="vf-row"><span>證書編號</span><b>${esc(c.code)}</b></div>
            ${isSkill ? `<div style="border-top:1px dashed #cbd5e1;margin:10px 0 6px"></div>
            <div style="font-size:12px;font-weight:800;color:#0f766e;margin-bottom:6px">🎖️ 五維能力評定</div>
            ${[
              ["技術精準度", c.technical_score],
              ["戰術與專注力", c.tactical_score],
              ["團隊溝通", c.teamwork_score],
              ["運動員精神", c.sportsmanship_score],
            ].map(([label, v]) => {
              const n = Number(v) || 0;
              return `<div style="display:flex;align-items:center;gap:8px;margin:5px 0">
                <span style="flex:1;font-size:12px;color:#475569">${label}</span>
                <span style="font-size:14px;letter-spacing:2px;color:#C9A227">${"★".repeat(n)}<span style="color:#cbd5e1">${"★".repeat(5 - n)}</span></span>
                <b style="width:28px;text-align:right;font-size:12px">${n}/5</b>
              </div>`;
            }).join("")}
            ${Array.isArray(c.assessment_tags) && c.assessment_tags.length ? `<div style="font-size:11.5px;color:#475569;margin-top:8px">🏷️ ${c.assessment_tags.map((t) => esc(t)).join(" · ")}</div>` : ""}
            ${c.coach_comment ? `<div style="font-size:11.5px;color:#334155;margin-top:6px;line-height:1.6"><b>教練評語：</b>${esc(c.coach_comment)}</div>` : ""}` : ""}
            ${c.verify_hash ? `<div style="margin-top:8px;border-top:1px dashed #cbd5e1;padding-top:8px">
              <div style="font-size:11px;color:#64748b;margin-bottom:3px">🔐 存證雜湊 SHA-256（64 位完整值）</div>
              <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.5;word-break:break-all;color:#0f172a;background:#f1f5f9;border-radius:8px;padding:7px 8px;text-align:left">${esc(c.verify_hash)}</div>
            </div>` : ""}
          </div>
          ${qrHash && !canCompare ? `<div style="margin-top:10px;color:#b45309;font-size:11.5px;font-weight:800">ℹ️ 此 QR 屬較早版本的雜湊格式，已直接以伺服器紀錄核實</div>` : ""}
          ${canCompare && qrHash && c.verify_hash && !String(c.verify_hash).toLowerCase().startsWith(qrHash)
            ? `<div style="margin-top:10px;background:#fef2f2;color:#b91c1c;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800">⚠️ QR 與伺服器存證不符 — 此證書可能為翻拍／改圖，請向 ZenPass 查詢</div>`
            : canCompare && qrHash && c.verify_hash
            ? `<div style="margin-top:10px;color:#047857;font-size:11.5px;font-weight:800">🔐 QR 內嵌雜湊與伺服器存證一致</div>`
            : ""}
          <div class="vf-badge">✔ 已核實 · ${esc(d.issuer || "ZenPass")}${d.sealed ? " · 🔐 存證相符" : ""}</div>
        </div>`;
      } catch (e) {
        $("out").innerHTML = `<div class="vf-card vf-bad"><div class="vf-ic">⚠️</div><div class="vf-title">驗證暫時失敗</div>
          <div class="vf-sub">請稍後再試，或 WhatsApp 9033 5538 查詢。</div></div>`;
      }
    })();
  </script>
</body>
</html>
