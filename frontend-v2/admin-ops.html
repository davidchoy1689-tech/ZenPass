<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <meta name="robots" content="noindex" />
  <title>營運總控台 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px}
    .kpi .v{font-size:20px;font-weight:800;color:var(--brand-600);line-height:1.15}
    .kpi .l{font-size:11.5px;color:var(--text-muted);margin-top:3px}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
    .row:last-child{border-bottom:0}
    .row .s{font-size:11.5px;color:var(--text-muted);margin-top:2px}
    .pill{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px}
    .p-on{background:#ecfdf5;color:#047857}.p-wait{background:#fff7ed;color:#c2410c}
    .fld{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:11px;padding:11px;font:inherit;font-size:14px;background:var(--surface);color:var(--text);margin-bottom:8px}
    .lbl{font-size:12.5px;font-weight:700;color:var(--text-muted);display:block;margin:0 0 5px 2px}
    .toast6{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(15,23,42,.93);color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;z-index:9999}
    .tabsx{display:flex;gap:8px;overflow-x:auto;margin:4px 0 12px}
    .tabsx button{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--text-muted)}
    .tabsx button.on{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="admin.html">‹</a><div class="title">營運總控台</div></div>
  <div class="wrap">
    <div id="guard"></div>
    <div id="app" hidden>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <input class="fld" id="month" type="month" style="margin:0;flex:1" />
        <button class="btn btn-primary" id="reload" style="flex:none;min-height:42px">更新</button>
      </div>

      <div class="tabsx" id="tabs">
        <button class="on" data-t="fin">💰 資金總覽</button>
        <button data-t="leads">📥 線索／審批</button>
        <button data-t="ops">🚨 異常處理</button>
        <button data-t="settle">🏁 批量結算</button>
        <button data-t="cred">🪪 教練資質</button>
        <button data-t="agr">🤝 協議簽署</button>
      </div>

      <div id="paneFin">
        <div class="kpis" id="kpis"></div>
        <div class="card"><div class="body" id="finDetail"></div></div>
      </div>

      <div id="paneLeads" hidden>
        <div class="card" style="margin-bottom:10px"><div class="body"><b>👨‍🏫 教練申請</b><div id="leadCoach" style="margin-top:8px"></div></div></div>
        <div class="card" style="margin-bottom:10px"><div class="body"><b>🏫 學校查詢</b><div id="leadSchool" style="margin-top:8px"></div></div></div>
        <div class="card"><div class="body"><b>🏢 企業查詢</b><div id="leadCorp" style="margin-top:8px"></div></div></div>
      </div>

      <div id="paneOps" hidden>
        <div class="card"><div class="body">
          <b>🌧️ 惡劣天氣／緊急停課</b>
          <div class="muted" style="font-size:12px;margin:6px 0 10px">會取消該日所有時段；可選擇同時退回 Credits。</div>
          <label class="lbl">日期</label>
          <input class="fld" type="date" id="wxDate" />
          <label class="lbl">原因</label>
          <input class="fld" id="wxReason" value="惡劣天氣取消" />
          <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0 12px">
            <input type="checkbox" id="wxRefund" checked style="width:18px;height:18px" />
            同時退回學員 Credits（會寫入 wallet_transactions）
          </label>
          <button class="btn btn-primary btn-block" id="wxGo">取消當日所有課堂</button>
          <div class="muted" id="wxMsg" style="margin-top:10px;font-size:12.5px"></div>
        </div></div>
      </div>

      <div id="paneCred" hidden>
        <div class="card"><div class="body">
          <b>🪪 教練資質核實</b>
          <div class="muted" style="font-size:12px;margin:6px 0 10px">牌照／急救證書核實後，教練會顯示 ✅ 已核實；過期會標示。</div>
          <div id="credList"></div>
        </div></div>
      </div>

      <div id="paneAgr" hidden>
        <div class="kpis" id="agrKpis" style="margin-bottom:10px"></div>
        <div class="card" style="margin-bottom:10px"><div class="body">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <b style="font-size:13.5px">簽署紀錄</b>
            <select id="agrFilter" class="fld" style="margin:0;flex:1;padding:8px">
              <option value="all">全部</option><option value="coach">教練</option><option value="venue">場地</option>
            </select>
          </div>
          <div id="agrList"></div>
        </div></div>
        <div class="card"><div class="body">
          <b style="font-size:13.5px">⚠️ 待補簽名單</b>
          <div class="muted" style="font-size:12px;margin:6px 0 8px">以下教練／場主未簽署協議（會鎖後台，簽完即解鎖）。</div>
          <div id="agrPending"></div>
        </div></div>
      </div>

      <div id="paneSettle" hidden>
        <div class="card" style="margin-bottom:10px"><div class="body">
          <b>🏁 批量封存本月已完結課堂</b>
          <div class="muted" style="font-size:12px;margin:6px 0 10px">會為所選月份所有「已完結但未封存」嘅課堂寫入 settled_at。</div>
          <button class="btn btn-primary btn-block" id="bsGo">⚡ 批量封存</button>
          <div class="muted" id="bsMsg" style="margin-top:10px;font-size:12.5px"></div>
        </div></div>
        <div class="card"><div class="body">
          <b>📥 出糧／場租清單</b>
          <div class="muted" style="font-size:12px;margin:6px 0 10px">匯出 FPS／銀行批量轉賬用 CSV（教練 80% + 場租）。</div>
          <button class="btn btn-secondary btn-block" id="plGo">下載 CSV</button>
        </div></div>
      </div>
      <div class="spacer"></div>
    </div>
  </div>

  <script src="assets/api.js?v=3"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const hkd = (n) => "HK$" + Number(n || 0).toLocaleString("en-HK");
    function toast(m) { const t = document.createElement("div"); t.className = "toast6"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }

    let MONTH = new Date().toISOString().slice(0, 7);

    (async () => {
      if (!api.getUser()) {
        $("guard").innerHTML = `<div class="card"><div class="body center" style="padding:24px 16px">
          <div style="font-size:36px">🛡️</div><b style="display:block;margin-top:6px">營運總控台</b>
          <div class="muted" style="font-size:13px;margin-top:8px">需要管理員登入</div>
          <div style="margin-top:14px"><a class="btn btn-primary" href="login.html?next=admin-ops.html">🔑 登入</a></div></div></div>`;
        return;
      }
      const me = await api.get("/users/me").catch(() => null);
      const u = (me && me.data && (me.data.user || me.data)) || api.getUser() || {};
      if (!["admin", "super_admin", "platform_manager"].includes(u.role)) {
        $("guard").innerHTML = `<div class="card"><div class="body center">此頁只限管理員使用。<br><br><a class="btn btn-secondary" href="my.html">返回</a></div></div>`;
        return;
      }
      $("app").hidden = false;
      $("month").value = MONTH;
      $("reload").onclick = () => { MONTH = $("month").value || MONTH; loadAll(); };
      $("tabs").onclick = (e) => {
        const b = e.target.closest("button"); if (!b) return;
        [...$("tabs").children].forEach((x) => x.classList.toggle("on", x === b));
        ["fin", "leads", "ops", "settle", "cred", "agr"].forEach((k) => ($("pane" + k[0].toUpperCase() + k.slice(1))).hidden = b.dataset.t !== k);
      };
      $("wxGo").onclick = weatherCancel;
      $("bsGo").onclick = batchSettle;
      $("plGo").onclick = payoutCsv;
      window.__loadCred = loadCredentials;
      loadAll();
    })();

    async function loadAll() {
      await loadFinance();
      await loadLeads();
      await loadCredentials();
      await loadAgreements();
    }

    async function loadFinance() {
      const r = await api.get("/admin/ops/overview?month=" + encodeURIComponent(MONTH));
      if (!r.ok) { $("kpis").innerHTML = `<div class="kpi" style="grid-column:span 2"><div class="l">${esc((r.data && r.data.error) || "讀取失敗")}</div></div>`; return; }
      const f = r.data.finance || {};
      $("kpis").innerHTML = `
        <div class="kpi"><div class="v">${hkd(f.gmv)}</div><div class="l">本月 GMV（總學費）</div></div>
        <div class="kpi"><div class="v">${hkd(f.platform_fee)}</div><div class="l">平台 20% 收入</div></div>
        <div class="kpi"><div class="v">${hkd(f.pending_coach)}</div><div class="l">待付教練（${f.pending_sessions || 0} 堂）</div></div>
        <div class="kpi"><div class="v">${hkd(f.pending_venue)}</div><div class="l">待付場租</div></div>`;
      $("finDetail").innerHTML = `
        <div class="row"><span>課堂數（本月）</span><b>${f.sessions || 0}</b></div>
        <div class="row"><span>已封存結算</span><b>${f.settled_sessions || 0}</b></div>
        <div class="row"><span>教練應得合計（80%）</span><b>${hkd(f.coach_net)}</b></div>
        <div class="row"><span>場租合計</span><b>${hkd(f.venue_rent)}</b></div>
        <div class="row"><span>待處理線索</span><span class="pill p-wait">教練 ${(r.data.leads || {}).coach || 0} · 學校 ${(r.data.leads || {}).school || 0} · 企業 ${(r.data.leads || {}).corporate || 0}</span></div>`;
    }

    async function loadLeads() {
      const r = await api.get("/admin/ops/leads");
      if (!r.ok) return;
      const d = r.data || {};
      const render = (arr, fmt) => arr.length ? arr.slice(0, 20).map(fmt).join("") : '<div class="muted" style="font-size:12.5px">暫無</div>';
      $("leadCoach").innerHTML = render(d.coaches || [], (x) => `<div class="row"><span><b>${esc(x.name)}</b>
        <span class="s">${esc(x.phone || "")} · ${esc(x.email || "")} · ${esc(x.specialties || "")} · ${esc(String(x.created_at || "").slice(0, 10))}</span></span>
        <a class="pill p-on" href="https://wa.me/852${esc(String(x.phone || "").slice(-8))}" target="_blank" rel="noopener" style="text-decoration:none">💬 聯絡</a></div>`);
      $("leadSchool").innerHTML = render(d.schools || [], (x) => `<div class="row"><span><b>${esc(x.school_name)}</b>
        <span class="s">${esc(x.contact_name || "")} · ${esc(x.contact_email || "")} · ${esc(x.sports_of_interest || "")}</span></span>
        <a class="pill p-on" href="mailto:${esc(x.contact_email || "")}" style="text-decoration:none">✉️</a></div>`);
      $("leadCorp").innerHTML = render(d.corporates || [], (x) => `<div class="row"><span><b>${esc(x.company_name)}</b>
        <span class="s">${esc(x.contact_name || "")} · ${esc(x.contact_email || "")} · ${esc(x.activities || "")}</span></span>
        <a class="pill p-on" href="mailto:${esc(x.contact_email || "")}" style="text-decoration:none">✉️</a></div>`);
    }

    async function loadCredentials() {
      const box = $("credList"); if (!box) return;
      const r = await api.get("/admin/coach-credentials?status=all");
      if (!r.ok) { box.innerHTML = `<div class="muted">${esc((r.data && r.data.error) || "讀取失敗")}</div>`; return; }
      const rows = (r.data.credentials || []);
      if (!rows.length) { box.innerHTML = '<div class="muted" style="font-size:12.5px">暫無教練提交資質。</div>'; return; }
      const badge = (x) => x.status === "verified" ? '<span class="pill p-on">✅ 已核實</span>' : x.status === "rejected" ? '<span class="pill" style="background:#fef2f2;color:#b91c1c">❌ 已拒絕</span>' : '<span class="pill p-wait">⏳ 待核實</span>';
      box.innerHTML = rows.map((x) => `<div class="row"><span><b>${esc(x.name || x.email)}</b>
        <span class="s">${esc(x.license_type || "")}${x.license_no ? " · " + esc(x.license_no) : ""}${x.license_expiry ? " · 到期 " + esc(x.license_expiry) : ""}
        ${x.first_aid_type ? " · 🚑 " + esc(x.first_aid_type) + (x.first_aid_expiry ? "（" + esc(x.first_aid_expiry) + "）" : "") : " · 無急救證書"}
        ${x.expired ? " · ⚠️ 已過期" : ""}</span></span>
        <span style="display:flex;gap:6px;align-items:center;white-space:nowrap">${badge(x)}
        ${x.status !== "verified" ? `<button class="btn btn-primary" style="min-height:32px;padding:0 10px;font-size:12px" data-cv="${esc(x.id)}" data-d="approve">核實</button>` : ""}
        ${x.status !== "rejected" ? `<button class="btn btn-secondary" style="min-height:32px;padding:0 10px;font-size:12px" data-cv="${esc(x.id)}" data-d="reject">拒絕</button>` : ""}
        </span></div>`).join("");
      box.querySelectorAll("[data-cv]").forEach((b) => (b.onclick = async () => {
        const note = b.dataset.d === "reject" ? (prompt("拒絕原因（可留空）") || "") : "";
        const rr = await api.post("/admin/coach-credentials/" + encodeURIComponent(b.dataset.cv) + "/verify", { decision: b.dataset.d, note });
        if (rr.ok) { toast("✅ " + rr.data.message); loadCredentials(); }
        else alert((rr.data && rr.data.error) || "審核失敗");
      }));
    }

    async function loadAgreements() {
      const list = $("agrList"), pend = $("agrPending"), kp = $("agrKpis");
      if (!list) return;
      const [r1, r2] = await Promise.all([api.get("/admin/agreements"), api.get("/admin/agreements/pending")]);
      const rows = (r1.ok && r1.data.agreements) || [];
      const pending = (r2.ok && r2.data.pending) || [];
      const isCoachRow = (x) => Number(x.is_coach) === 1 || ["coach", "platform_manager", "platform_staff"].includes(x.user_role);
      const coachCount = rows.filter(isCoachRow).length;
      const venueCount = rows.length - coachCount;
      if (kp) kp.innerHTML = `
        <div class="kpi"><div class="v">${rows.length}</div><div class="l">總簽署份數</div></div>
        <div class="kpi"><div class="v">${coachCount} / ${venueCount}</div><div class="l">教練 / 場地</div></div>
        <div class="kpi" style="grid-column:span 2"><div class="v" style="color:${pending.length ? "#c2410c" : "#047857"}">${pending.length}</div><div class="l">待補簽（未簽署嘅教練／場主）</div></div>`;
      const f = ($("agrFilter") && $("agrFilter").value) || "all";
      const shown = rows.filter((x) => f === "all" ? true : f === "coach" ? isCoachRow(x) : !isCoachRow(x));
      list.innerHTML = shown.length ? shown.map((x) => `<div class="row"><span><b>${esc(x.name || x.email)}</b>
        <span class="s">${esc(badgeRole(isCoachRow(x) ? "coach" : x.user_role || x.role_type))} · ${esc(x.signed_name || "")}${x.signer_title ? "（" + esc(x.signer_title) + "）" : ""} · ${esc(x.version || "")} · ${esc(String(x.created_at || "").slice(0, 16))} · IP ${esc(x.ip || "—")}</span></span>
        <span class="pill p-on">已簽署</span></div>`).join("") : '<div class="muted" style="font-size:12.5px">暫無紀錄</div>';
      pend.innerHTML = pending.length ? pending.map((x) => `<div class="row"><span><b>${esc(x.name || x.email)}</b>
        <span class="s">${esc(badgeRole(x.role))} · ${esc(x.email || "")}${x.phone ? " · " + esc(x.phone) : ""}</span></span>
        <a class="pill p-wait" style="text-decoration:none" href="https://wa.me/852${esc(String(x.phone || "").replace(/\D/g, "").slice(-8))}?text=${encodeURIComponent("你好，請到 ZenPass 後台完成《合作夥伴合規及免責承諾書》簽署，以開通排班／收款功能：https://zenpass.hk/coach-dashboard.html")}" target="_blank" rel="noopener">💬 提醒補簽</a></div>`).join("") : '<div class="muted" style="font-size:12.5px">✅ 全部已簽署</div>';
      if ($("agrFilter")) $("agrFilter").onchange = loadAgreements;
    }

    function badgeRole(r) {
      if (r === "coach") return "教練";
      if (String(r || "").startsWith("partner")) return "場地";
      return r || "—";
    }

    async function weatherCancel() {
      const date = $("wxDate").value;
      if (!date) { alert("請揀日期"); return; }
      if (!confirm(`確定取消 ${date} 所有課堂？`)) return;
      $("wxMsg").textContent = "處理中…";
      const r = await api.post("/admin/ops/weather-cancel", { date, reason: $("wxReason").value, refund: $("wxRefund").checked });
      $("wxMsg").textContent = r.ok ? r.data.message : ((r.data && r.data.error) || "失敗");
      if (r.ok) { toast("✅ " + r.data.message); loadFinance(); }
    }

    async function batchSettle() {
      if (!confirm(`批量封存 ${MONTH} 已完結課堂？`)) return;
      $("bsMsg").textContent = "處理中…";
      const r = await api.post("/admin/ops/batch-settle", { month: MONTH });
      $("bsMsg").textContent = r.ok ? r.data.message + `（學費 ${hkd(r.data.gross)} / 教練 ${hkd(r.data.net)} / 場租 ${hkd(r.data.venue_rent)}）` : ((r.data && r.data.error) || "失敗");
      if (r.ok) { toast("✅ 已封存 " + r.data.count + " 堂"); loadFinance(); }
    }

    async function payoutCsv() {
      const r = await api.get("/admin/ops/payout-list?month=" + encodeURIComponent(MONTH));
      if (!r.ok) { alert((r.data && r.data.error) || "讀取失敗"); return; }
      const rows = r.data.rows || [];
      if (!rows.length) { alert("本月暫無已完結課堂"); return; }
      const head = ["日期", "課堂", "教練", "教練電話", "出席", "學費", "教練80%", "平台20%", "場地", "場地電話", "已封存"];
      const lines = [head.join(",")];
      rows.forEach((x) => {
        lines.push([x.date, `"${String(x.title || "").replace(/"/g, '""')}"`, `"${x.coach_name}"`, x.coach_phone,
          x.attended, x.gross, x.coach_net, x.platform_fee, `"${x.venue_name}"`, x.venue_phone, x.settled ? "是" : "否"].join(","));
      });
      const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `ZenPass_Payout_${MONTH}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      toast("📥 已匯出 " + rows.length + " 筆");
    }
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
