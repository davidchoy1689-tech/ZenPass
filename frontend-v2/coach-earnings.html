<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="robots" content="noindex" />
  <title>收入月結 · ZenPass</title>
  <link rel="stylesheet" href="assets/v2.css?v=32" />
  <link rel="stylesheet" href="assets/polish.css?v=1" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    body{background:#F8FAFC;color:#0F172A}
    .e-wrap{max-width:820px;margin:0 auto;padding:14px 14px 90px}
    .e-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .e-head h1{font-size:17px;font-weight:900;flex:1;margin:0}
    .e-head input{border:1.5px solid #CBD5E1;border-radius:9px;padding:6px 8px;font:inherit;font-size:13px}
    .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .kpi{background:#fff;border:1.5px solid #E2E8F0;border-radius:16px;padding:12px}
    .kpi .k{font-size:11px;color:#64748B;font-weight:800}
    .kpi .v{font-size:22px;font-weight:900;margin-top:3px;letter-spacing:-.02em}
    .kpi .s{font-size:10.5px;color:#94A3B8;margin-top:2px;line-height:1.45}
    .kpi.hero{grid-column:span 2;background:linear-gradient(135deg,#ECFDF5,#F0FDFA);border-color:#A7F3D0}
    .kpi.hero .v{color:#065F46;font-size:30px}
    .kpi.hero.gold{background:linear-gradient(135deg,#FFFDF5 0%,#FEF9C3 100%);border-color:#FDE047;box-shadow:0 4px 12px rgba(234,179,8,.08)}
    .kpi.hero.gold .v{color:#713F12}
    .kpi.hero.gold .k{color:#854D0E}
    .badge-gold{display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:#854D0E;background:#FEF08A;padding:3px 9px;border-radius:999px;margin-left:6px}
    .sub-tag{float:right;font-size:10.5px;font-weight:800;color:#A16207;background:#FFFBEB;border:1px solid #FDE68A;border-radius:999px;padding:2px 8px}
    .own-tag{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:900;color:#065F46;background:#DCFCE7;border:1px solid #A7F3D0;border-radius:999px;padding:2px 7px}
    .aff-block{margin-top:16px;background:#FFFDF5;border:1.5px solid #FDE68A;border-radius:16px;padding:12px}
    .aff-block h3{margin:0 0 8px;font-size:13px;color:#854D0E}
    .aff-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #FDE68A;font-size:12.5px;align-items:flex-start}
    .aff-row:last-child{border-bottom:0}
    .aff-row .nm{font-weight:900;color:#0F172A}
    .aff-row .meta{color:#78716C;font-size:11px;line-height:1.55;margin-top:2px}
    .aff-row .am{font-weight:900;color:#059669;white-space:nowrap;text-align:right}
    .aff-row .am small{display:block;color:#94A3B8;font-weight:700;font-size:10px;margin-top:2px}
    .fps-hint{margin-top:14px;background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:12px;padding:11px 12px;font-size:12px;color:#475569;font-weight:700;text-align:center}
    .pay-block{margin-top:16px;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:14px;padding:12px}
    .pay-block h3{margin:0 0 8px;font-size:13px;color:#334155}
    .pay-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #E2E8F0;font-size:12px}
    .pay-row:last-child{border-bottom:0}
    .pay-row .tag{font-size:10px;font-weight:900;border-radius:999px;padding:1px 7px;margin-left:4px}
    .tag.cash{background:#FEF3C7;color:#92400E}
    .tag.fps{background:#DBEAFE;color:#1D4ED8}
    .tag.online{background:#DCFCE7;color:#065F46}
    .pay-row .amt{font-weight:900;white-space:nowrap;text-align:right}
    .payout-block{margin-top:18px}
    .payout-block h3{margin:0 0 8px;font-size:14px;color:#334155}
    .payout-card{background:#fff;border:1.5px solid #E2E8F0;border-left:4px solid #059669;border-radius:12px;padding:11px 12px;margin-bottom:9px}
    .payout-card.failed{border-left-color:#DC2626}
    .payout-card .pm{font-weight:900;font-size:13px}
    .payout-card .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#475569;margin-top:4px}
    .payout-card .ref{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#0F172A;background:#F1F5F9;border-radius:6px;padding:3px 6px;display:inline-block;margin-top:2px}
    .payout-card button{border:1px solid #CBD5E1;background:#fff;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer;margin-left:4px}
    .payout-card .ok{color:#059669;font-weight:900}
    .payout-card .bad{color:#DC2626;font-weight:900}
    .ps-card{margin-top:12px;background:#fff;border:1.5px solid #E2E8F0;border-radius:14px;padding:12px;font-size:12.5px;color:#475569}
    .ps-card b{color:#0F172A}
    .ps-card button{margin-top:8px;border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:7px 10px;font-weight:800;font-size:12px;cursor:pointer}
    .ps-modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;display:none;padding:14px;overflow:auto}
    .ps-modal.on{display:block}
    .ps-box{background:#fff;border-radius:16px;padding:16px;max-width:430px;margin:24px auto}
    .ps-box h3{margin:0 0 4px;font-size:17px}
    .ps-box label{display:block;font-size:12px;font-weight:800;color:#475569;margin:10px 0 4px}
    .ps-box input,.ps-box select{width:100%;box-sizing:border-box;border:1.5px solid #CBD5E1;border-radius:10px;padding:10px;font:inherit}
    .ps-box .row2{display:flex;gap:8px}
    .ps-box .row2 label{flex:1;display:flex;align-items:center;gap:5px;border:1.5px solid #CBD5E1;border-radius:9px;padding:8px;margin:0;font-size:12.5px;cursor:pointer}
    .ps-box .msg{font-size:12px;margin-top:8px;color:#B91C1C}
    .ps-box .dev{font-size:11.5px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:6px 8px;margin-top:6px;display:none}
    .e-actions{display:flex;gap:8px;margin-bottom:12px}
    .e-btn{flex:1;min-height:46px;border-radius:10px;border:1.5px solid #CBD5E1;background:#fff;font-weight:800;font-size:13px;cursor:pointer}
    .e-btn.primary{background:#059669;border-color:#059669;color:#fff}
    .e-month{font-size:13px;font-weight:800;color:#334155;margin:14px 0 8px}
    .e-row{background:#fff;border:1.5px solid #E2E8F0;border-radius:12px;padding:11px 12px;margin-bottom:8px}
    .e-row .top{display:flex;justify-content:space-between;gap:8px}
    .e-row .t{font-size:13.5px;font-weight:800}
    .e-row .m{font-size:11.5px;color:#64748B;margin-top:2px}
    .e-row .amt{font-size:15px;font-weight:900;color:#065F46;white-space:nowrap}
    .pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 8px;margin-top:5px}
    .pill.paid{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}
    .pill.pending{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
    .e-empty{text-align:center;color:#64748B;font-size:13px;padding:24px}
  </style>
</head>
<body>
  <div class="e-wrap">
    <div class="e-head">
      <h1>收入月結</h1>
      <button class="e-btn" id="prevM" type="button" aria-label="上一個月" style="padding:6px 10px">◀</button>
      <input type="month" id="month">
      <button class="e-btn" id="nextM" type="button" aria-label="下一個月" style="padding:6px 10px">▶</button>
    </div>
    <div id="riskBanner"></div>
    <div class="kpis" id="kpis"></div>
    <div class="e-actions">
      <button class="e-btn primary" id="csvBtn">📥 匯出 Excel / CSV 月結單</button>
      <button class="e-btn" id="psBtn" type="button">⚙️ 收款帳戶設定</button>
    </div>
    <div id="psCard"></div>
    <div class="e-month" id="monthLabel"></div>
    <div id="rows"><div class="e-empty">載入中…</div></div>
    <div id="payouts"></div>
  </div>
  <div class="ps-modal" id="psModal">
    <div class="ps-box">
      <h3>⚙️ FPS 收款帳戶設定</h3>
      <div style="font-size:12px;color:#64748B">更改後需輸入註冊手機收到嘅 6 位驗證碼；出糧前 24 小時至出糧日會鎖定。</div>
      <label>識別碼類型</label>
      <div class="row2">
        <label><input type="radio" name="psType" value="mobile" checked> 手機號碼</label>
        <label><input type="radio" name="psType" value="fps_id"> FPS ID</label>
      </div>
      <label>手機號碼 / FPS ID</label>
      <input id="psProxy" inputmode="numeric" placeholder="98765432">
      <label>收款銀行</label>
      <select id="psBank"></select>
      <label>收款人英文姓名（與銀行一致）</label>
      <input id="psHolder" placeholder="CHAN TAI MAN" style="text-transform:uppercase">
      <label>安全驗證</label>
      <div style="display:flex;gap:8px">
        <input id="psOtp" inputmode="numeric" maxlength="6" placeholder="6 位驗證碼" style="flex:1">
        <button id="psSendOtp" type="button" style="flex:0 0 auto;border:1px solid #CBD5E1;background:#fff;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px">發送</button>
      </div>
      <div class="dev" id="psDev"></div>
      <div class="msg" id="psMsg"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="psCancel" type="button" style="flex:1;border:1px solid #CBD5E1;background:#fff;border-radius:10px;padding:10px;font-weight:800">取消</button>
        <button id="psSave" type="button" style="flex:1.4;border:0;background:#059669;color:#fff;border-radius:10px;padding:10px;font-weight:900">✓ 確認並更新</button>
      </div>
    </div>
  </div>
<script src="assets/api.js?v=10"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hkd = (n) => "HK$" + Number(n || 0).toLocaleString("en-HK", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const hktMonth = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 7);
  let DATA = null;
  let PAYOUTS = [];

  async function load() {
    const m = $("month").value || hktMonth();
    const r = await api.get("/coach/earnings/summary?month=" + encodeURIComponent(m));
    if (!r.ok) { $("rows").innerHTML = `<div class="e-empty">${esc((r.data && r.data.error) || "讀取失敗")}</div>`; return; }
    DATA = r.data;
    render();
    const p = await api.get("/coach/earnings/payouts");
    PAYOUTS = p.ok && p.data && Array.isArray(p.data.data) ? p.data.data : [];
    renderPayouts();
    loadPayoutSettings();
  }

  function renderPayouts() {
    const box = $("payouts");
    if (!box) return;
    if (!PAYOUTS.length) {
      box.innerHTML = `<div class="payout-block"><h3>🏛️ 官方發放歷史（FPS 出糧記錄）</h3><div class="e-empty">未有 FPS 出糧紀錄。每月 5 號結算後，平台會登記交易參考編號。</div></div>`;
      return;
    }
    const label = { pending: "🟡 待發放", processing: "🔵 處理中", cleared: "🟢 銀行已結算", failed: "🔴 發放失敗" };
    box.innerHTML = `<div class="payout-block"><h3>🏛️ 官方發放歷史（FPS 出糧記錄）</h3>` +
      PAYOUTS.map((p) => `<div class="payout-card ${p.status === "failed" ? "failed" : ""}">
        <div class="row" style="margin-top:0"><span class="pm">${esc(p.month)} 結算</span><span class="${p.status === "failed" ? "bad" : "ok"}">${label[p.status] || esc(p.status)}</span></div>
        <div class="row"><span>發放金額</span><b>HK$ ${esc(p.net_payout_hkd)}</b></div>
        <div class="row"><span>發放日期</span><span>${esc(String(p.disbursed_at || "").replace("T", " ").slice(0, 19))}</span></div>
        <div class="row"><span>入數戶口</span><span>FPS Proxy · ${esc(p.fps_proxy_masked || "—")}</span></div>
        <div class="row" style="display:block"><div>交易參考編號</div><span class="ref" id="ref-${esc(p.id)}">${esc(p.bank_reference_no || "—")}</span>
          <button data-copyref="${esc(p.bank_reference_no || "")}">📋 複製</button>
          <button data-receipt="${esc(p.id)}">📄 入數單</button></div>
        <div class="row" style="display:block;color:#94A3B8">總應得 HK$ ${esc(p.gross_earnings_hkd)} · 現場沖抵 HK$ ${esc(p.offset_cash_hkd)} · 淨額 HK$ ${esc(p.net_payout_hkd)}</div>
        ${p.failure_reason ? `<div class="row" style="color:#B91C1C">原因：${esc(p.failure_reason)}</div>` : ""}
      </div>`).join("") + `</div>`;

    box.querySelectorAll("[data-copyref]").forEach((b) => {
      b.onclick = async () => {
        const v = b.dataset.copyref;
        if (!v) return;
        try { await navigator.clipboard.writeText(v); } catch (e) { alert(v); }
        b.textContent = "✅ 已複製";
        setTimeout(() => (b.textContent = "📋 複製"), 1500);
      };
    });
    box.querySelectorAll("[data-receipt]").forEach((b) => {
      b.onclick = () => {
        const p = PAYOUTS.find((x) => x.id === b.dataset.receipt);
        if (!p) return;
        const w = window.open("", "_blank");
        if (!w) return;
        w.document.write(`<!doctype html><meta charset="utf-8"><title>ZenPass 入數單 ${esc(p.month)}</title>
          <body style="font-family:system-ui,-apple-system,'PingFang HK',sans-serif;padding:32px;color:#0F172A;max-width:640px;margin:auto">
          <h2 style="color:#065F46;margin:0">ZenPass 教練收益入數單</h2>
          <p style="color:#64748B;margin:4px 0 20px">Hong Kong Leisure and Fitness Company Limited</p>
          <table style="width:100%;border-collapse:collapse;font-size:14px">
            <tr><td style="padding:8px;border-bottom:1px solid #E2E8F0">結算月份</td><td style="padding:8px;border-bottom:1px solid #E2E8F0;text-align:right">${esc(p.month)}</td></tr>
            <tr><td style="padding:8px;border-bottom:1px solid #E2E8F0">總應得</td><td style="padding:8px;border-bottom:1px solid #E2E8F0;text-align:right">HK$ ${esc(p.gross_earnings_hkd)}</td></tr>
            <tr><td style="padding:8px;border-bottom:1px solid #E2E8F0">現場實收沖抵</td><td style="padding:8px;border-bottom:1px solid #E2E8F0;text-align:right">-HK$ ${esc(p.offset_cash_hkd)}</td></tr>
            <tr><td style="padding:8px;border-bottom:2px solid #065F46;font-weight:900">實發金額</td><td style="padding:8px;border-bottom:2px solid #065F46;text-align:right;font-weight:900">HK$ ${esc(p.net_payout_hkd)}</td></tr>
            <tr><td style="padding:8px">FPS Proxy</td><td style="padding:8px;text-align:right">${esc(p.fps_proxy_masked || "—")}</td></tr>
            <tr><td style="padding:8px">交易參考編號</td><td style="padding:8px;text-align:right;font-family:monospace">${esc(p.bank_reference_no || "—")}</td></tr>
            <tr><td style="padding:8px">發放日期</td><td style="padding:8px;text-align:right">${esc(String(p.disbursed_at || "").slice(0, 19))}</td></tr>
          </table>
          <p style="margin-top:24px;color:#059669;font-weight:800;border:2px dashed #059669;display:inline-block;padding:8px 14px;border-radius:10px">✅ ZenPass 數位核證 · ${esc(p.status)}</p>
          </body>`);
        w.document.close();
        setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 350);
      };
    });
  }

  let PS = null, PS_OTP = null;
  async function loadPayoutSettings() {
    const r = await api.get("/coach/payout-settings");
    if (!r.ok) return;
    PS = r.data;
    renderPsCard();
    const rb = $("riskBanner");
    if (rb) {
      rb.innerHTML = PS.payout_status && PS.payout_status !== "active"
        ? `<div style="background:#FFFBEB;border:1.5px solid #FDE68A;color:#92400E;border-radius:12px;padding:11px 12px;font-size:12.5px;font-weight:700;line-height:1.6;margin-bottom:12px">⚠️ 帳戶安全保護中：偵測到收款資料於出糧日前變更或異常存取。為保障您的資金安全，本月出糧已暫時保留。您的帶班與記帳功能不受影響，請聯絡客服核實。</div>`
        : "";
    }
    const sel = $("psBank");
    if (sel && !sel.options.length) {
      sel.innerHTML = (PS.banks || []).map((b) => `<option value="${esc(b.code)}">${esc(b.code)} - ${esc(b.name)}</option>`).join("");
    }
  }
  function renderPsCard() {
    const box = $("psCard");
    if (!box || !PS) return;
    const s = PS.settings;
    const freeze = PS.freeze_window ? `<div style="margin-top:6px;color:#B45309;font-weight:800">⏳ 出糧凍結期：8 號後才可更改</div>` : "";
    box.innerHTML = s
      ? `<div class="ps-card"><div>🟢 <b>已驗證</b> · ${esc(s.bank_name)} · ${esc(s.fps_proxy_masked)}（${esc(s.fps_proxy_type || s.fps_type)}）</div>
         <div style="margin-top:4px">收款人：<b>${esc(s.account_holder_name)}</b> · 下次出糧將轉帳至此戶口</div>${freeze}</div>`
      : `<div class="ps-card">⚠️ 未設定 FPS 收款戶口，請盡快設定，否則無法出糧。${freeze}</div>`;
  }
  $("psBtn").onclick = () => {
    if (!PS) return;
    $("psMsg").textContent = "";
    $("psDev").style.display = "none";
    PS_OTP = null;
    if (PS.settings) {
      const t = PS.settings.fps_type;
      document.querySelectorAll('input[name="psType"]').forEach((x) => (x.checked = x.value === t));
      $("psProxy").value = PS.settings.fps_proxy_value || "";
      $("psBank").value = PS.settings.bank_code || "024";
      $("psHolder").value = PS.settings.account_holder_name || "";
    }
    $("psOtp").value = "";
    $("psModal").classList.add("on");
  };
  $("psCancel").onclick = () => $("psModal").classList.remove("on");
  $("psModal").onclick = (e) => { if (e.target.id === "psModal") $("psModal").classList.remove("on"); };
  $("psSendOtp").onclick = async () => {
    $("psMsg").textContent = "";
    $("psSendOtp").disabled = true;
    const r = await api.post("/coach/payout-settings/otp", {});
    $("psSendOtp").disabled = false;
    if (!r.ok) { $("psMsg").textContent = (r.data && r.data.error) || "發送失敗"; return; }
    PS_OTP = r.data.otp_session_id;
    $("psMsg").textContent = "已發送驗證碼至 " + (r.data.phone_masked || "");
    if (r.data.dev_code) {
      $("psDev").style.display = "block";
      $("psDev").textContent = "🧪 測試環境驗證碼：" + r.data.dev_code;
    }
  };
  $("psSave").onclick = async () => {
    if (!PS_OTP) { $("psMsg").textContent = "請先發送驗證碼"; return; }
    const type = (document.querySelector('input[name="psType"]:checked') || {}).value || "mobile";
    $("psSave").disabled = true;
    const r = await api.put("/coach/payout-settings", {
      otp_session_id: PS_OTP,
      otp_code: $("psOtp").value.replace(/\D/g, ""),
      fps_type: type,
      fps_proxy_value: $("psProxy").value.trim(),
      bank_code: $("psBank").value,
      account_holder_name: $("psHolder").value.trim(),
    });
    $("psSave").disabled = false;
    if (!r.ok) { $("psMsg").textContent = (r.data && r.data.error) || "更新失敗"; return; }
    PS.settings = r.data.settings;
    renderPsCard();
    $("psModal").classList.remove("on");
  };

  function render() {
    const d = DATA;
    $("monthLabel").textContent = d.month + " 班次明細 · " + (d.payout_rule || "每月 5 號 FPS 出糧");
    $("kpis").innerHTML = `
      <div class="kpi hero"><div class="k">本月總預計發放</div><div class="v">${hkd(d.total_earned)}</div><div class="s">80% 底薪 + 20% 自有補足 · 以出席人次計</div></div>
      <div class="kpi"><div class="k">💡 預計 FPS 自動入數</div><div class="v" style="color:#0F766E">${hkd(d.net_payout)}</div><div class="s">已扣現場實收沖抵 · 現金 ${Number(d.cash_count) || 0} 筆 / FPS ${Number(d.fps_count) || 0} 筆</div></div>
      <div class="kpi"><div class="k">💵 現場實收（教練已袋）</div><div class="v" style="color:#B45309">${hkd(d.cash_collected)}</div><div class="s">現金＋個人 FPS，月結自動沖抵</div></div>
      <div class="kpi"><div class="k">⏱️ 執教課堂數</div><div class="v">${d.total_sessions}</div><div class="s">${(d.total_hours || 0)} 小時 · 有出席紀錄嘅班次</div></div>
      <div class="kpi"><div class="k">👥 服務學員人次</div><div class="v">${d.total_attended_students}</div><div class="s">其中 👑 自有 ${Number(d.own_student_count) || 0} 人次</div></div>
      <div class="kpi"><div class="k">🟢 下次發放日</div><div class="v" style="font-size:15px;line-height:1.35;word-break:break-word">${esc(d.next_payout_label || "—")}</div><div class="s">待出帳 ${hkd(d.pending_payout)} · 已出帳 ${hkd(d.paid_payout)}</div></div>
      <div class="kpi hero gold"><div class="k"><span class="sub-tag">終身鎖定</span>💎 跨界被動分佣 (5%)</div><div class="v">${hkd(d.affiliate_passive)}</div><div class="s">來自 ${Number(d.affiliate_students_count) || 0} 位已鎖定學員跨班消費 · 平台提撥零扣減</div></div>
    `;
    const rows = (d.sessions_breakdown || []).filter((x) => x.attended_count > 0);
    const aff = d.affiliate_recent || [];
    if (!rows.length && !aff.length) { $("rows").innerHTML = '<div class="e-empty">本月暫時未有出席紀錄</div>'; return; }
    $("rows").innerHTML = rows.map((r) => `
      <div class="e-row">
        <div class="top"><div><div class="t">${esc(r.course_title)}</div>
        <div class="m">${esc(r.date)} · ${esc(r.venue || "")} · 實到 ${r.attended_count} 人（👑 自有 ${r.own_student_count || 0} · 100% ｜ 平台 ${r.platform_student_count || 0}）</div></div>
        <div class="amt">${hkd(r.session_payout)}<div style="font-size:10px;color:#94A3B8;font-weight:700">本堂實收</div></div></div>
        <span class="pill ${r.status === "paid" ? "paid" : "pending"}">${r.status === "paid" ? "已核實 · 已出帳" : "待出帳"}</span>
        ${r.own_student_count ? `<span class="own-tag">👑 自有學生 ${r.own_student_count} 人 · 100% · 省下平台費 ${hkd(r.saved_platform_fee)}</span>` : ""}
      </div>`).join("");
    if (aff.length) {
      $("rows").innerHTML += `<div class="aff-block"><h3>🌱 跨界 5% 被動收益明細（學生跨班消費）</h3>` +
        aff.map((a) => `<div class="aff-row">
          <div><div class="nm">👤 ${esc(a.student_name)} <span style="font-weight:400;color:#94A3B8;font-size:11px">(${esc(a.student_phone_masked || "")})</span></div>
          <div class="meta">報讀：${esc(a.course_title)}<br>執教：${esc(a.actual_coach_name || "教練")} · 實收 ${hkd(a.order_amount)} × 5%</div></div>
          <div class="am">+ ${hkd(a.commission)}<small>${esc(String(a.cleared_at || a.created_at || "").slice(5, 16))} 入帳</small></div>
        </div>`).join("") +
        `</div>`;
    }
    const pay = d.payment_breakdown || [];
    if (pay.length) {
      $("rows").innerHTML += `<div class="pay-block"><h3>💵 支付渠道與現金沖抵明細</h3>` +
        pay.slice(0, 60).map((p) => {
          const cls = /現金/.test(p.payment_channel) ? "cash" : /FPS/.test(p.payment_channel) ? "fps" : "online";
          const pend = Number(p.pending_cents) / 100;
          return `<div class="pay-row"><div>${esc(p.student_name)} <span class="tag ${cls}">${esc(p.payment_channel)}</span><br><span style="color:#94A3B8">${esc(p.booking_type)} · ${esc(p.split_mode)}</span></div>
            <div class="amt">${pend < 0 ? "-" : "+"}${hkd(Math.abs(pend))}<br><span style="color:#94A3B8;font-weight:600;font-size:10px">待發款項</span></div></div>`;
        }).join("") +
        `</div>`;
    }
    $("rows").innerHTML += `<div class="fps-hint">💡 下次 FPS 自動入數：${esc(d.next_payout_label || "每月 5 號")}</div>`;
  }

  $("csvBtn").onclick = async () => {
    const m = $("month").value || hktMonth();
    const token = (window.api && api.getToken && api.getToken()) || localStorage.getItem("zenpass_token") || "";
    const res = await fetch("/api/coach/earnings/export-csv?month=" + encodeURIComponent(m), {
      headers: token ? { Authorization: "Bearer " + token } : {},
      credentials: "include",
    });
    if (!res.ok) { alert("匯出失敗：" + res.status); return; }
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `zenpass-earnings-${m}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  $("month").onchange = load;
  function shiftMonth(delta) {
    const cur = $("month").value || hktMonth();
    const [y, m] = cur.split("-").map(Number);
    const d = new Date(Date.UTC(y, m - 1 + delta, 1));
    const next = d.toISOString().slice(0, 7);
    if (next > hktMonth()) return;
    $("month").value = next;
    load();
  }
  $("prevM").onclick = () => shiftMonth(-1);
  $("nextM").onclick = () => shiftMonth(1);
  (async () => {
    const me = await api.me();
    if (!me.ok) { location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search); return; }
    $("month").value = hktMonth();
    load();
  })();
</script>
</body>
</html>
