<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <meta name="robots" content="noindex" />
  <title>暫時離線 · ZenPass 禪流</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 32px; text-align: center; font-family: -apple-system, "SF Pro Text", "PingFang HK", "Noto Sans HK", sans-serif;
      background: linear-gradient(160deg, #fff8f4, #ffe9de); color: #1f2937;
    }
    .ic { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 12px 28px rgba(220,67,24,.28); }
    h1 { margin: 6px 0 0; font-size: 22px; letter-spacing: -.3px; }
    p { margin: 0; color: #6b7280; font-size: 14px; line-height: 1.6; max-width: 320px; }
    .btn {
      margin-top: 6px; display: inline-block; padding: 13px 26px; border: 0; border-radius: 999px;
      background: linear-gradient(150deg, #ff7a45, #dc4318); color: #fff; font: inherit; font-size: 15px; font-weight: 700;
      box-shadow: 0 8px 20px rgba(220,67,24,.32); cursor: pointer;
    }
    .btn:active { transform: scale(.97); }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .links { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
    .links a { font-size: 13px; font-weight: 600; color: #c2410c; text-decoration: none; background: #fff; border: 1px solid #f3d9cd; border-radius: 999px; padding: 8px 14px; }
  </style>
</head>
<body>
  <img class="ic" src="/icons/icon-192.png" alt="ZenPass" />
  <h1>暫時離線 🙈</h1>
  <p>而家連唔到網絡。你嘅瀏覽紀錄中已載入嘅頁面仍然可以睇，但最新課程、價錢同剩位需要連線先更新到。</p>
  <button class="btn" id="retry" type="button">🔄 重試連線</button>
  <div class="links">
    <a href="/index.html">主頁</a>
    <a href="/explore.html">探索課程</a>
    <a href="/my-bookings.html">我的預約</a>
  </div>
  <div class="hint" id="hint">ZenPass 禪流 · 已啟用離線模式</div>

  <script>
    var btn = document.getElementById("retry");
    var hint = document.getElementById("hint");
    function online() {
      location.replace("/index.html");
    }
    if (btn) btn.addEventListener("click", function () {
      if (navigator.onLine) { online(); return; }
      btn.textContent = "連線中…";
      setTimeout(function () {
        btn.textContent = navigator.onLine ? "🔄 重試連線" : "仍然離線，請檢查網絡";
        setTimeout(function () { btn.textContent = "🔄 重試連線"; }, 2000);
        if (navigator.onLine) online();
      }, 700);
    });
    window.addEventListener("online", function () {
      if (hint) hint.textContent = "已恢復連線，正在返回…";
      setTimeout(online, 400);
    });
    window.addEventListener("offline", function () {
      if (hint) hint.textContent = "仍然離線中…";
    });
  </script>
</body>
</html>
