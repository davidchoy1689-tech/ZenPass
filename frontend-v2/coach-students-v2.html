<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#059669" />
<meta name="robots" content="noindex" />
<title>學員名冊管理 · ZenPass 禪流</title>
<link rel="stylesheet" href="assets/v2.css?v=38" />
<style>
  :root{--brand:#059669;--brand-2:#10b981;--brand-dark:#047857;--brand-deep:#064e3b;--bg:#f1f5f9;--surface:#fff;--surface-2:#f8fafc;--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;--warn:#ea580c;--shadow:0 4px 20px rgba(15,23,42,.06);--radius:16px;--safe-b:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang TC","Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(20px + var(--safe-b))}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  .topbar a.back{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--border);background:#fff;text-decoration:none;color:var(--ink);font-size:18px;font-weight:600}
  .topbar h1{font-size:16px;font-weight:800;flex:1}
  .chip{font-size:11px;font-weight:700;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:999px;padding:4px 10px}
  .wrap{max-width:720px;margin:0 auto;padding:12px 14px 24px}
  .hero{background:linear-gradient(135deg,#10b981 0%,#059669 50%,#064e3b 100%);border-radius:20px;padding:16px 18px;color:#fff;margin-bottom:14px;box-shadow:0 10px 28px rgba(5,150,105,.28)}
  .hero .title{font-size:18px;font-weight:900}
  .hero .sub{font-size:12.5px;opacity:.9;margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  @media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
  .stat .v{font-size:20px;font-weight:900;color:var(--brand)}
  .stat .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .stat.warn .v{color:var(--warn)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .search-box{flex:1;min-width:160px;position:relative}
  .search-box input{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 12px 11px 38px;font:inherit;font-size:14px;font-weight:600;background:var(--surface);outline:none}
  .search-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
  .search-box::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
  .filter-sel{border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;font-size:13px;font-weight:700;background:var(--surface);color:var(--ink);min-width:110px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:999px;font:inherit;font-weight:800;font-size:13.5px;min-height:42px;padding:0 16px;cursor:pointer;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 16px rgba(5,150,105,.28)}
  .btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
  .btn-sm{min-height:34px;font-size:12px;padding:0 12px}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);min-height:34px;font-size:12px;padding:0 10px}
  .tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:14px;gap:3px}
  .tabs button{flex:1;border:none;background:transparent;border-radius:10px;padding:9px 6px;font:inherit;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(5,150,105,.25)}
  .list{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .card:hover{border-color:#a7f3d0}
  .row{display:flex;align-items:center;gap:12px}
  .av{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#a7f3d0,#6ee7b7);color:var(--brand-deep);display:grid;place-items:center;font-weight:900;font-size:16px}
  .av.off{background:#e2e8f0;color:#64748b}
  .info{flex:1;min-width:0}
  .info .name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .info .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:#64748b}
  .badge.on{background:#d1fae5;color:#047857}
  .badge.private{background:#fef3c7;color:#b45309}
  .badge.new{background:#dbeafe;color:#1d4ed8}
  .card-acts{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
  .card-acts .btn{flex:1;min-width:80px}
  .empty{text-align:center;padding:36px 16px;color:var(--muted);border:1.5px dashed var(--border);border-radius:16px;background:var(--surface-2)}
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#fff;border-radius:22px 22px 0 0;max-height:92vh;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(15,23,42,.15)}
  .sheet.on{transform:translateY(0)}
  .sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
  .sheet .hd b{font-size:16px;font-weight:900}
  .sheet .bd{padding:12px 16px 28px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .sec{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
  .lbl{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 0 4px}
  .lbl:first-of-type{margin-top:0}
  .fld{width:100%;border:1px solid var(--border);border-radius:11px;padding:11px 12px;font:inherit;font-size:14px;font-weight:600;background:#fff;outline:none}
  .fld:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
  .msg{font-size:12.5px;font-weight:700;color:var(--danger);min-height:16px;margin:6px 0}
  .enroll-row{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
  .enroll-row .t{flex:1;font-size:13px;font-weight:700;min-width:0}
  .enroll-row .s{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .s.pending{background:#f1f5f9;color:#64748b}
  .s.attended{background:#d1fae5;color:#047857}
  .s.absent{background:#fee2e2;color:#b91c1c}
  .s.booked{background:#ffedd5;color:#c2410c}
  .s.cancelled{background:#e2e8f0;color:#94a3b8}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:#fff}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
  th{background:var(--surface-2);font-weight:800;color:var(--muted);font-size:11px;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f0fdf4}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:100;opacity:0;pointer-events:none;transition:all .22s;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="coach-dashboard.html">‹</a>
  <h1>學員名冊管理</h1>
  <span class="chip">真實資料</span>
</div>
<div class="wrap">
  <div class="hero">
    <div class="title">學員資料庫</div>
    <div class="sub">登記 · 名冊 · 報名狀態 · 即時簽到</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="v" id="stTotal">—</div><div class="l">總學員</div></div>
    <div class="stat"><div class="v" id="stActive">—</div><div class="l">平台活躍</div></div>
    <div class="stat"><div class="v" id="stEnroll">—</div><div class="l">報名筆數</div></div>
    <div class="stat warn"><div class="v" id="stPending">—</div><div class="l">待簽到</div></div>
  </div>
  <div class="tabs" id="mainTabs">
    <button class="on" data-tab="roster">名冊</button>
    <button data-tab="enroll">報名紀錄</button>
    <button data-tab="db">資料庫</button>
  </div>

  <div id="tabRoster">
    <div class="toolbar">
      <div class="search-box"><input id="qSearch" placeholder="搜尋姓名／電話／標籤" /></div>
      <select class="filter-sel" id="qStatus">
        <option value="all">全部狀態</option>
        <option value="active">平台活躍</option>
        <option value="private">私人／未上平台</option>
      </select>
      <button class="btn btn-primary" id="btnAddStudent">＋ 登記學員</button>
    </div>
    <div class="list" id="studentList"></div>
  </div>

  <div id="tabEnroll" class="hidden">
    <div class="toolbar">
      <div class="search-box"><input id="qEnrollSearch" placeholder="搜尋學員／課堂" /></div>
      <select class="filter-sel" id="qEnrollStatus">
        <option value="all">全部</option>
        <option value="booked">已報名</option>
        <option value="attended">已出席</option>
        <option value="absent">缺席</option>
        <option value="pending">待確認</option>
      </select>
    </div>
    <div class="list" id="enrollList"></div>
  </div>

  <div id="tabDb" class="hidden">
    <div class="toolbar">
      <button class="btn btn-secondary btn-sm" id="btnExport">⬇ 匯出 CSV</button>
      <button class="btn btn-secondary btn-sm" id="btnReload">🔄 重新載入</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>姓名</th><th>電話</th><th>狀態</th><th>標籤</th><th>剩餘堂數</th><th>登記日</th></tr></thead>
        <tbody id="dbBody"></tbody>
      </table>
    </div>
    <div class="hint">資料即時來自 ZenPass 後端，非本機示範資料。</div>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="hd"><b id="sheetTitle">登記學員</b><button class="btn btn-secondary btn-sm" id="sheetClose">關閉</button></div>
  <div class="bd" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/api.js?v=20"></script>
<script src="assets/roles.js?v=3"></script>
<script>try { ZPRoles.guardPage("coach"); } catch (e) {}</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DATA = { students: [], sessions: [], enrollments: [], stats: {} };
  var editingId = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(m) {
    var t = $("toast");
    t.textContent = m;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function openSheet(title) { $("sheetTitle").textContent = title; $("sheet").classList.add("on"); $("mask").classList.add("on"); }
  function closeSheet() { $("sheet").classList.remove("on"); $("mask").classList.remove("on"); editingId = null; }
  $("sheetClose").onclick = closeSheet;
  $("mask").onclick = closeSheet;

  function statusInfo(st) {
    if (st === "registered" || st === "claimed") return { label: "平台活躍", cls: "on" };
    if (st === "private") return { label: "私人學生", cls: "private" };
    if (st === "expired") return { label: "邀請過期", cls: "private" };
    return { label: st || "未登記", cls: "" };
  }
  function tagsArr(s) {
    return String(s || "").split(/[,，]/).map(function (x) { return x.trim(); }).filter(Boolean);
  }

  async function load() {
    try {
      var r = await api.get("/coach/roster/overview");
      if (!r.ok) { toast((r.data && r.data.error) || "讀取名冊失敗"); return; }
      DATA.students = r.data.students || [];
      DATA.sessions = r.data.sessions || [];
      DATA.enrollments = r.data.enrollments || [];
      DATA.stats = r.data.stats || {};
      $("stTotal").textContent = DATA.stats.students || 0;
      $("stActive").textContent = DATA.stats.active || 0;
      $("stEnroll").textContent = DATA.stats.enrollments || 0;
      $("stPending").textContent = DATA.stats.pending || 0;
      renderRoster(); renderEnrolls(); renderDb();
    } catch (e) { toast("讀取失敗，請重試"); }
  }

  function filteredStudents() {
    var q = ($("qSearch").value || "").trim().toLowerCase();
    var st = $("qStatus").value;
    return DATA.students.filter(function (s) {
      if (st === "active" && !(s.status === "registered" || s.status === "claimed")) return false;
      if (st === "private" && !(s.status === "private" || s.status === "expired")) return false;
      if (!q) return true;
      return [s.name, s.phone, s.tags, s.notes].join(" ").toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderRoster() {
    var list = filteredStudents();
    var el = $("studentList");
    if (!list.length) {
      el.innerHTML = '<div class="empty"><p>搵唔到學員</p><button class="btn btn-primary" id="emptyAdd">＋ 登記學員</button></div>';
      var b = $("emptyAdd"); if (b) b.onclick = function () { openForm(null); };
      return;
    }
    el.innerHTML = list.map(function (s) {
      var si = statusInfo(s.status);
      var tags = tagsArr(s.tags).map(function (t) { return '<span class="badge ' + (t === "VIP" ? "private" : t === "新手" ? "new" : "") + '">' + esc(t) + "</span>"; }).join("");
      var cnt = DATA.enrollments.filter(function (e) { return e.student_name === s.name || e.phone === s.phone; }).length;
      return '<div class="card"><div class="row"><div class="av' + (si.cls === "on" ? "" : " off") + '">' + esc((s.name || "?").slice(0, 1)) + "</div>" +
        '<div class="info"><div class="name">' + esc(s.name) + ' <span class="badge ' + si.cls + '">' + si.label + "</span>" + tags + "</div>" +
        '<div class="meta">' + esc(s.phone || "—") + " · 報名 " + cnt + " 堂" + (s.remaining_sessions ? " · 剩 " + s.remaining_sessions + " 堂" : "") + "</div></div></div>" +
        '<div class="card-acts"><button class="btn btn-secondary btn-sm" data-view="' + esc(s.id) + '">詳情</button>' +
        '<button class="btn btn-secondary btn-sm" data-edit="' + esc(s.id) + '">編輯</button></div></div>';
    }).join("");
    el.querySelectorAll("[data-view]").forEach(function (b) { b.onclick = function () { detail(b.dataset.view); }; });
    el.querySelectorAll("[data-edit]").forEach(function (b) { b.onclick = function () { openForm(b.dataset.edit); }; });
  }

  function detail(id) {
    var s = DATA.students.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    var enrolls = DATA.enrollments.filter(function (e) { return e.student_name === s.name || e.phone === s.phone; });
    openSheet(s.name);
    $("sheetBody").innerHTML = '<div class="sec"><div class="lbl">聯絡資料</div>' +
      '<div style="font-weight:700">📞 ' + esc(s.phone || "—") + "</div>" +
      (s.notes ? '<div class="meta" style="font-size:12px;color:#64748b;margin-top:6px">📝 ' + esc(s.notes) + "</div>" : "") +
      '<div class="meta" style="font-size:12px;color:#64748b;margin-top:6px">📅 登記：' + esc(String(s.created_at || "").slice(0, 10)) + "</div></div>" +
      '<div class="sec"><div class="lbl">報名紀錄（' + enrolls.length + '）</div>' +
      (enrolls.length ? enrolls.map(function (e) {
        var st = statusLabel(e.status);
        return '<div class="enroll-row"><div class="t">' + esc(e.title) + '<div class="meta" style="font-size:11px;color:#64748b">' + esc(String(e.start_time || "").slice(0, 16).replace("T", " ")) + '</div></div><span class="s ' + st.c + '">' + st.t + "</span></div>";
      }).join("") : '<div class="meta" style="color:#64748b">未有報名紀錄</div>') + "</div>";
  }

  function openForm(id) {
    var s = id ? DATA.students.filter(function (x) { return x.id === id; })[0] : null;
    editingId = id || null;
    openSheet(s ? "編輯學員" : "登記新學員");
    $("sheetBody").innerHTML = '<div class="sec">' +
      '<label class="lbl">姓名 *</label><input class="fld" id="fName" maxlength="60" value="' + esc(s ? s.name : "") + '" />' +
      '<label class="lbl">電話 *（8 位香港電話）</label><input class="fld" id="fPhone" inputmode="numeric" maxlength="12" value="' + esc(s ? s.phone : "") + '" />' +
      '<label class="lbl">標籤（逗號分隔）</label><input class="fld" id="fTags" placeholder="VIP, 新手" value="' + esc(s ? s.tags : "") + '" />' +
      '<label class="lbl">備註</label><input class="fld" id="fNotes" maxlength="200" value="' + esc(s ? s.notes : "") + '" />' +
      '<div class="msg" id="fMsg"></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-secondary" id="fCancel" style="flex:1">取消</button>' +
      '<button class="btn btn-primary" id="fSave" style="flex:1">' + (s ? "儲存" : "確認登記") + "</button></div></div>";
    $("fCancel").onclick = closeSheet;
    $("fSave").onclick = async function () {
      var body = { name: ($("fName").value || "").trim(), phone: ($("fPhone").value || "").trim(), tags: ($("fTags").value || "").trim(), notes: ($("fNotes").value || "").trim() };
      if (!body.name) { $("fMsg").textContent = "請填姓名"; return; }
      var btn = $("fSave"); btn.disabled = true; btn.textContent = "儲存中…";
      var r = editingId
        ? await api.patch("/coach/students/" + encodeURIComponent(editingId), body)
        : await api.post("/coach/students", body);
      btn.disabled = false; btn.textContent = editingId ? "儲存" : "確認登記";
      if (!r.ok) { $("fMsg").textContent = (r.data && r.data.error) || "儲存失敗"; return; }
      toast(editingId ? "✅ 已更新學員" : "✅ 已登記學員");
      closeSheet(); load();
    };
  }

  function statusLabel(st) {
    return st === "attended" ? { t: "已出席", c: "attended" }
      : st === "absent" ? { t: "缺席", c: "absent" }
      : st === "pending" ? { t: "待確認", c: "pending" }
      : st === "cancelled" ? { t: "已取消", c: "cancelled" }
      : { t: "已報名", c: "booked" };
  }

  function filteredEnrolls() {
    var q = ($("qEnrollSearch").value || "").trim().toLowerCase();
    var st = $("qEnrollStatus").value;
    return DATA.enrollments.filter(function (e) {
      if (st !== "all" && e.status !== st) return false;
      if (!q) return true;
      return [e.student_name, e.phone, e.title].join(" ").toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderEnrolls() {
    var list = filteredEnrolls();
    var el = $("enrollList");
    if (!list.length) { el.innerHTML = '<div class="empty">未有報名紀錄</div>'; return; }
    el.innerHTML = list.map(function (e) {
      var st = statusLabel(e.status);
      var canMark = e.status === "booked" || e.status === "pending";
      return '<div class="enroll-row"><div class="t">' + esc(e.student_name) + ' · ' + esc(e.title) +
        '<div class="meta" style="font-size:11px;color:#64748b">' + esc(String(e.start_time || "").slice(0, 16).replace("T", " ")) + (e.group_size > 1 ? " · " + e.group_size + " 位" : "") + '</div></div>' +
        '<span class="s ' + st.c + '">' + st.t + "</span>" +
        (canMark ? '<button class="btn btn-ghost btn-sm" data-att="' + esc(e.booking_id) + '" data-sid="' + esc(e.schedule_id) + '">簽到</button>' +
          '<button class="btn btn-ghost btn-sm" data-abs="' + esc(e.booking_id) + '" data-sid="' + esc(e.schedule_id) + '">缺席</button>' : "") + "</div>";
    }).join("");
    el.querySelectorAll("[data-att]").forEach(function (b) { b.onclick = function () { mark(b.dataset.att, b.dataset.sid, "present"); }; });
    el.querySelectorAll("[data-abs]").forEach(function (b) { b.onclick = function () { mark(b.dataset.abs, b.dataset.sid, "absent_unexcused"); }; });
  }

  async function mark(bookingId, scheduleId, status) {
    var r = await api.post("/coach/attendance/batch", { session_id: scheduleId, records: [{ booking_id: bookingId, status: status }] });
    if (!r.ok) { toast((r.data && r.data.error) || "更新失敗"); return; }
    toast(status === "present" ? "✅ 已簽到" : "已標示缺席");
    load();
  }

  function renderDb() {
    $("dbBody").innerHTML = DATA.students.map(function (s) {
      var si = statusInfo(s.status);
      return "<tr><td>" + esc(s.name) + "</td><td>" + esc(s.phone || "—") + '</td><td><span class="badge ' + si.cls + '">' + si.label + "</span></td><td>" + esc(s.tags || "—") +
        "</td><td>" + (s.remaining_sessions == null ? "—" : esc(s.remaining_sessions)) + "</td><td>" + esc(String(s.created_at || "").slice(0, 10)) + "</td></tr>";
    }).join("");
  }

  function exportCsv() {
    var rows = [["id", "name", "phone", "status", "tags", "notes", "created_at"]];
    DATA.students.forEach(function (s) { rows.push([s.id, s.name, s.phone, s.status, s.tags, s.notes, s.created_at]); });
    var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
    var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "zenpass-students-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast("已匯出 CSV");
  }

  $("mainTabs").onclick = function (e) {
    var btn = e.target.closest("button"); if (!btn) return;
    Array.prototype.forEach.call($("mainTabs").children, function (b) { b.classList.toggle("on", b === btn); });
    var tab = btn.dataset.tab;
    $("tabRoster").classList.toggle("hidden", tab !== "roster");
    $("tabEnroll").classList.toggle("hidden", tab !== "enroll");
    $("tabDb").classList.toggle("hidden", tab !== "db");
  };
  $("qSearch").oninput = renderRoster;
  $("qStatus").onchange = renderRoster;
  $("qEnrollSearch").oninput = renderEnrolls;
  $("qEnrollStatus").onchange = renderEnrolls;
  $("btnAddStudent").onclick = function () { openForm(null); };
  $("btnExport").onclick = exportCsv;
  $("btnReload").onclick = load;

  load();
})();
</script>
<script src="assets/footer.js?v=6" defer></script>
</body>
</html>
