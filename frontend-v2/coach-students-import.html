<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>匯入現有學生 · ZenPass</title>
<style>
  :root{--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--brand:#059669;--bg:#F8FAFC}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"PingFang HK",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:32px}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .head h1{font-size:19px;margin:0;font-weight:900}
  .grow{flex:1}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:13px;cursor:pointer}
  .tab.on{background:#ECFDF5;border-color:#6EE7B7;color:#065F46}
  textarea{width:100%;min-height:170px;border:1.5px solid #CBD5E1;border-radius:10px;padding:10px;font:inherit;font-size:13px;line-height:1.6;resize:vertical}
  textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
  .hint{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:6px}
  .drop{border:2px dashed #CBD5E1;border-radius:12px;padding:22px;text-align:center;color:var(--mut);font-size:13px;cursor:pointer}
  .preview{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 8px;border-bottom:1px solid #EEF2F7;text-align:left;white-space:nowrap}
  th{background:#F8FAFC;font-size:11.5px;color:var(--mut)}
  tr.bad td{background:#FEF2F2;color:#B91C1C;font-weight:700}
  .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .kpi{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:800;color:#065F46}
  .invite{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #EEF2F7;font-size:13px;flex-wrap:wrap}
  .invite .n{font-weight:800}
  .invite .p{color:var(--mut);font-size:11.5px}
  .wa{background:#25D366;color:#fff;border:0;border-radius:8px;padding:7px 10px;font-weight:800;font-size:12px;text-decoration:none;white-space:nowrap}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0F172A;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999}
  .toast.on{opacity:1}
  .note{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:8px}
  .promise{background:linear-gradient(135deg,#ECFDF5,#F5F3FF);border:1.5px solid #A7F3D0;border-radius:14px;padding:14px;margin-bottom:12px}
  .promise h2{margin:0 0 8px;font-size:15px;color:#065F46;font-weight:900}
  .promise ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.8;color:#334155}
  .promise b{color:#065F46}
  .funnel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
  .fcard{background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .fcard .k{font-size:11px;color:var(--mut);font-weight:800}
  .fcard .v{font-size:22px;font-weight:900;margin-top:2px}
  .fcard .s{font-size:10.5px;color:#94A3B8;margin-top:1px}
  .fcard.green{background:#ECFDF5;border-color:#A7F3D0}
  .fcard.green .v{color:#065F46}
  .fcard.amber{background:#FFFBEB;border-color:#FDE68A}
  .fcard.amber .v{color:#92400E}
  .filters{display:flex;gap:6px;margin:6px 0 10px}
  .fbtn{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px;font-weight:800;font-size:12px;cursor:pointer}
  .fbtn.on{background:#ECFDF5;border-color:#6EE7B7;color:#065F46}
  .inv-card{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fff}
  .inv-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .inv-name{font-weight:900;font-size:14px}
  .inv-phone{font-weight:600;color:var(--mut);font-size:12px}
  .inv-warn{margin-top:3px;font-size:11.5px;color:#B45309;background:#FFFBEB;border:1px solid #FDE68A;border-radius:7px;padding:2px 6px;display:inline-block}
  .inv-when{font-size:11px;color:#94A3B8;margin-top:4px}
  .badge{font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 8px;white-space:nowrap}
  .badge.pending{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
  .badge.claimed{background:#DCFCE7;color:#065F46;border:1px solid #A7F3D0}
  .badge.expired{background:#F1F5F9;color:#64748B;border:1px solid #E2E8F0}
  .inv-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none;color:var(--ink)}
  .mini.wa{background:#25D366;border-color:#25D366;color:#fff}
  .own-badge{font-size:11px;font-weight:900;color:#065F46;background:#DCFCE7;border:1px solid #A7F3D0;border-radius:999px;padding:3px 8px}

    /* 桌面寬屏（zp-wide）：手機不變，平板 860，桌面 1200 */
    @media (min-width: 768px) and (max-width: 1023px) {
      body.zp-wide .wrap, body.zp-wide .topbar, body.zp-wide .bottomnav,
      body.zp-wide .hero-top { max-width: 860px; }
    }
    @media (min-width: 1024px) {
      body.zp-wide .wrap, body.zp-wide .topbar, body.zp-wide .bottomnav,
      body.zp-wide .hero-top { max-width: 1200px; }
    }
</style>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body class="zp-wide">
<div class="wrap">
  <div class="head">
    <h1>👥 匯入現有學生</h1>
    <span class="grow"></span>
    <a class="btn" href="coach-console.html" style="text-decoration:none;color:inherit">返回</a>
  </div>

  <div class="promise">
    <h2>🔒 您的學生，永遠是您的資產</h2>
    <ul>
      <li>自有學生報名您的班次：<b>平台 0% 抽佣，100% 學費全數歸您</b></li>
      <li>學生在平台報讀其他任何課程：<b>終身享 5% 被動回佣，每月 FPS 自動出糧</b></li>
    </ul>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab on" data-tab="text">📝 貼上文字（最快）</button>
      <button class="tab" data-tab="csv">📁 上傳 CSV</button>
    </div>

    <div id="paneText">
      <textarea id="raw" placeholder="直接貼 WhatsApp 名單，每行一位，例如：&#10;1. 陳大文 98765432 膝痛&#10;李淑芬 9123 4567 血壓高&#10;Mary 61234567"></textarea>
      <div class="hint">支援 +852、空格、破折號；系統會自動抽出姓名、8 位電話同舊患備註。</div>
    </div>

    <div id="paneCsv" hidden>
      <div class="drop" id="drop">拖放 .csv 到這裡，或<u>點擊選擇檔案</u><input type="file" id="file" accept=".csv,text/csv" hidden></div>
      <div class="hint">CSV 欄位：姓名,電話,備註,堂數（可無標題行）。<a href="#" id="tpl">下載範本</a></div>
    </div>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" id="parseBtn" style="flex:1">🔍 智能解析</button>
      <button class="btn btn-primary" id="importBtn" style="flex:1" disabled>⬆️ 一鍵匯入</button>
    </div>

    <div class="preview" id="preview" hidden></div>
    <div class="kpis" id="kpis" hidden></div>
    <div class="note" id="note" hidden>格式錯誤嘅行會標紅；可以返上面修正後再解析。</div>
  </div>

  <div class="card" id="resultCard" hidden>
    <b style="font-size:15px">✅ 已生成迎新連結</b>
    <div class="note" id="resultNote"></div>
    <div style="display:flex;gap:8px;margin:10px 0">
      <button class="btn" id="copyAll" style="flex:1">📋 複製全部連結</button>
      <button class="btn" id="copyWa" style="flex:1">💬 複製 WhatsApp 廣播文字</button>
    </div>
    <div id="inviteList"></div>
  </div>

  <div class="card">
    <b style="font-size:15px">📊 已匯入名單 · 迎新進度</b>
    <div class="funnel" id="invFunnel"></div>
    <div class="filters" id="invFilters">
      <button class="fbtn on" data-f="all">全部</button>
      <button class="fbtn" data-f="pending">待認領</button>
      <button class="fbtn" data-f="claimed">已開通</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn" id="copyPending" style="flex:1">📢 複製未認領清單</button>
      <button class="btn" id="refreshInv" style="flex:0 0 auto">🔄 更新</button>
    </div>
    <div class="note" id="invStats">載入中…</div>
    <div id="invList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/api.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); };
  let PARSED = [];
  let LAST = null;
  let ME = null;

  const NOTE_KW = /(膝|痛|手術|血壓|心臟|糖尿|關節|暈|中風|骨質|氣喘|哮喘|舊患|敏感|懷孕)/;
  function parseLine(raw) {
    let s = String(raw || "").replace(/\u3000/g, " ").trim();
    if (!s) return null;
    s = s.replace(/^[\s\-•*·]+/, "").replace(/^\d+\s*[.、)）:：]\s*/, "");
    const m = s.match(/(?:\+?852[\s-]?)?([4-9]\d{3}[\s-]?\d{4})/);
    if (!m) return { bad: true, raw: String(raw) };
    const phone = m[1].replace(/\D/g, "");
    let rest = s.replace(m[0], " ").replace(/\s+/g, " ").replace(/^[,，;；|:\-]+|[,，;；|:\-]+$/g, "").trim();
    let name = rest, notes = "";
    const parts = rest.split(/[,，;；|]+/).map((x) => x.trim()).filter(Boolean);
    if (parts.length > 1) { name = parts[0]; notes = parts.slice(1).join("；"); }
    else { const kw = rest.search(NOTE_KW); if (kw > 0) { name = rest.slice(0, kw).trim(); notes = rest.slice(kw).trim(); } }
    name = name.replace(/^[\s\-•*]+|[\s\-•*]+$/g, "").slice(0, 40);
    if (!name) return { bad: true, raw: String(raw) };
    return { name, phone, notes: notes.slice(0, 120), quota: 1 };
  }

  function parseAll() {
    const rows = $("raw").value.split(/\r?\n/).map(parseLine).filter(Boolean);
    PARSED = rows;
    renderPreview();
  }

  function renderPreview() {
    const good = PARSED.filter((x) => !x.bad);
    const badRows = PARSED.filter((x) => x.bad);
    $("preview").hidden = !PARSED.length;
    $("kpis").hidden = !PARSED.length;
    $("note").hidden = !badRows.length;
    $("importBtn").disabled = !good.length;
    $("kpis").innerHTML = `<span class="kpi">可匯入 ${good.length} 位</span><span class="kpi" style="${badRows.length ? "background:#FEF2F2;border-color:#FECACA;color:#B91C1C" : ""}">格式錯誤 ${badRows.length} 行</span>`;
    $("preview").innerHTML = `<table><thead><tr><th>姓名</th><th>電話</th><th>備註</th><th>堂數</th></tr></thead><tbody>` +
      PARSED.slice(0, 200).map((r) => r.bad
        ? `<tr class="bad"><td colspan="4">無法解析：${esc(r.raw)}</td></tr>`
        : `<tr><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.notes || "—")}</td><td>${r.quota || 1}</td></tr>`).join("") + "</tbody></table>";
  }

  $("parseBtn").onclick = () => { parseAll(); if (!PARSED.length) toast("請先貼上名單或選擇 CSV"); };

  document.querySelectorAll(".tab").forEach((t) => {
    t.onclick = () => {
      document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
      $("paneText").hidden = t.dataset.tab !== "text";
      $("paneCsv").hidden = t.dataset.tab !== "csv";
    };
  });

  const fileEl = $("file");
  $("drop").onclick = () => fileEl.click();
  $("drop").ondragover = (e) => { e.preventDefault(); };
  $("drop").ondrop = (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) readCsv(e.dataTransfer.files[0]); };
  fileEl.onchange = () => { if (fileEl.files[0]) readCsv(fileEl.files[0]); };
  function readCsv(f) {
    const rd = new FileReader();
    rd.onload = () => { $("raw").value = String(rd.result || ""); parseAll(); toast("已讀取 " + f.name); };
    rd.readAsText(f, "utf-8");
  }
  $("tpl").onclick = (e) => {
    e.preventDefault();
    const blob = new Blob(["\uFEFF姓名,電話,備註,堂數\n陳大文,98765432,膝關節手術,1\n李淑芬,91234567,血壓高,1\n"], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "zenpass-student-template.csv"; a.click();
  };

  $("importBtn").onclick = async () => {
    const good = PARSED.filter((x) => !x.bad).map((x) => ({ name: x.name, phone: x.phone, notes: x.notes, pass_quota: x.quota || 1 }));
    if (!good.length) return;
    $("importBtn").disabled = true; $("importBtn").textContent = "匯入中…";
    const r = await api.post("/coach/students/import-batch", { items: good });
    $("importBtn").disabled = false; $("importBtn").textContent = "⬆️ 一鍵匯入";
    if (!r.ok) { toast((r.data && r.data.error) || "匯入失敗"); return; }
    LAST = r.data;
    toast(`✅ 新增 ${r.data.created} · 更新 ${r.data.updated} · 跳過 ${r.data.skipped}`);
    renderResult();
    loadInvites();
  };

  function inviteUrl(token) { return location.origin + "/welcome.html?token=" + token; }

  function renderResult() {
    if (!LAST) return;
    const coach = (ME && ME.name) || "教練";
    const items = LAST.invites || [];
    $("resultCard").hidden = false;
    $("resultNote").textContent = `已為 ${items.length} 位學員生成 30 日有效迎新連結；學員點開即可免密碼認領手冊。`;
    $("inviteList").innerHTML = items.map((i) => `<div class="invite">
      <div><div class="n">${esc(i.name)}</div><div class="p">${esc(i.phone)}</div></div>
      <a class="wa" target="_blank" rel="noopener" href="https://wa.me/852${esc(i.phone)}?text=${encodeURIComponent(`你好 ${i.name}，我是 ${coach}！我已為你在 ZenPass 開通專屬運動進度手冊，之後嘅簽到、動作相片同回家伸展都會記錄喺度。請點擊連結認領：${inviteUrl(i.token)}`)}">💬 發送</a>
    </div>`).join("");
  }

  $("copyAll").onclick = async () => {
    if (!LAST) return;
    const txt = LAST.invites.map((i) => `${i.name} ${i.phone} ${inviteUrl(i.token)}`).join("\n");
    try { await navigator.clipboard.writeText(txt); toast("已複製 " + LAST.invites.length + " 條連結"); } catch (e) { alert(txt); }
  };
  $("copyWa").onclick = async () => {
    if (!LAST) return;
    const coach = (ME && ME.name) || "教練";
    const txt = LAST.invites.map((i) => `你好 ${i.name}，我是 ${coach}！我已為你在 ZenPass 開通專屬運動進度手冊，之後嘅簽到、動作相片同回家伸展都會記錄喺度。請點擊連結認領：${inviteUrl(i.token)}`).join("\n\n");
    try { await navigator.clipboard.writeText(txt); toast("已複製 WhatsApp 廣播文字"); } catch (e) { alert(txt); }
  };

  let INVITES = [];
  let STATS = {};
  let FILTER = "all";

  const fmtPhone = (p) => String(p || "").replace(/^(\d{4})(\d{4})$/, "$1 $2");
  function fmtWhen(v) {
    const s = String(v || "");
    if (!s) return "";
    const d = new Date(s.replace(" ", "T") + "Z");
    if (isNaN(d)) return s.slice(0, 16);
    return d.toLocaleString("zh-HK", { timeZone: "Asia/Hong_Kong", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  }
  const coachName = () => (ME && ME.name) || "教練";
  function waHref(i) {
    const days = Number(i.days_left) || 0;
    const expiry = days > 0 ? `仲有 ${days} 日到期` : "今日到期";
    const txt = `你好 ${i.student_name}，我是 ${coachName()}。早前為你建立嘅 ZenPass 專屬運動手冊${expiry}，點擊呢個連結一鍵開通，即可免費領取 ${i.initial_pass_quota || 1} 堂迎新體驗課：${inviteUrl(i.token)}`;
    return `https://wa.me/852${esc(i.phone)}?text=${encodeURIComponent(txt)}`;
  }

  function renderFunnel() {
    const s = STATS || {};
    $("invFunnel").innerHTML = `
      <div class="fcard"><div class="k">👥 總匯入人數</div><div class="v">${Number(s.total) || 0}</div><div class="s">歷史匯入名冊</div></div>
      <div class="fcard amber"><div class="k">⏳ 待認領</div><div class="v">${Number(s.pending) || 0}</div><div class="s">需發送提醒${s.expired ? ` · 已過期 ${s.expired}` : ""}</div></div>
      <div class="fcard green"><div class="k">✅ 已成功開通</div><div class="v">${Number(s.claimed) || 0}</div><div class="s">已綁定手冊</div></div>
      <div class="fcard"><div class="k">📈 啟動率</div><div class="v">${Number(s.rate) || 0}%</div><div class="s">舊生轉化進度</div></div>`;
    $("invStats").textContent = `共 ${Number(s.total) || 0} 位 · 待認領 ${Number(s.pending) || 0} · 已開通 ${Number(s.claimed) || 0}`;
  }

  function renderInvites() {
    const list = INVITES.filter((i) => FILTER === "all" || i.status === FILTER);
    if (!list.length) {
      $("invList").innerHTML = `<div class="note">${INVITES.length ? "此分類暫時未有學員" : "未有名單，貼上 WhatsApp 名單開始匯入。"}</div>`;
      return;
    }
    $("invList").innerHTML = list.slice(0, 200).map((i) => {
      const claimed = i.status === "claimed";
      const expired = i.status === "expired";
      const badge = claimed
        ? `<span class="badge claimed">🟢 已開通專屬手冊</span>`
        : expired
          ? `<span class="badge expired">⚪ 已過期</span>`
          : `<span class="badge pending">🟡 待認領（剩餘 ${Number(i.days_left) || 0} 天）</span>`;
      return `<div class="inv-card">
        <div class="inv-top">
          <div>
            <div class="inv-name">${esc(i.student_name)} <span class="inv-phone">(${esc(fmtPhone(i.phone))})</span></div>
            ${i.notes ? `<div class="inv-warn">⚠️ ${esc(i.notes)}</div>` : ""}
            <div class="inv-when">${claimed ? `✅ ${esc(fmtWhen(i.claimed_at))} 認領` : `${esc(fmtWhen(i.created_at))} 匯入`}</div>
          </div>
          ${badge}
        </div>
        <div class="inv-actions">
          ${claimed
            ? `<span class="own-badge">👑 自有學生 · 100% / 5%</span>
               <a class="mini" href="student-handbook.html?student_id=${encodeURIComponent(i.claimed_by_user_id || "")}">📘 檢視手冊</a>`
            : expired
              ? `<span class="note" style="margin:0">連結已過期，請重新匯入同一電話以生成新連結。</span>`
              : `<a class="mini wa" target="_blank" rel="noopener" href="${waHref(i)}">💬 發送 WhatsApp 迎新</a>
                 <button class="mini" data-copy="${esc(i.token)}">🔗 複製專屬連結</button>`}
        </div>
      </div>`;
    }).join("");

    $("invList").querySelectorAll("[data-copy]").forEach((b) => {
      b.onclick = async () => {
        const url = inviteUrl(b.dataset.copy);
        try { await navigator.clipboard.writeText(url); toast("已複製專屬連結"); } catch (e) { alert(url); }
      };
    });
  }

  async function loadInvites() {
    const r = await api.get("/coach/students/invites");
    if (!r.ok) { $("invStats").textContent = (r.data && r.data.error) || "讀取失敗"; return; }
    INVITES = r.data.invites || [];
    STATS = r.data.stats || {};
    renderFunnel();
    renderInvites();
  }

  document.querySelectorAll("#invFilters .fbtn").forEach((b) => {
    b.onclick = () => {
      FILTER = b.dataset.f;
      document.querySelectorAll("#invFilters .fbtn").forEach((x) => x.classList.toggle("on", x === b));
      renderInvites();
    };
  });

  $("refreshInv").onclick = () => { loadInvites().then(() => toast("已更新")); };

  $("copyPending").onclick = async () => {
    const pending = INVITES.filter((i) => i.status === "pending");
    if (!pending.length) return toast("冇待認領學員");
    const txt = pending.map((i) => `${i.student_name} ${fmtPhone(i.phone)} ${inviteUrl(i.token)}`).join("\n");
    try { await navigator.clipboard.writeText(txt); toast(`已複製 ${pending.length} 位待認領學員`); } catch (e) { alert(txt); }
  };

  (async () => {
    const me = await api.me();
    if (!me.ok) { location.href = "login.html?next=" + encodeURIComponent(location.pathname); return; }
    ME = me.data.user;
    if (!["coach", "partner_coach", "super_admin", "platform_manager", "admin"].includes(ME.role)) { location.href = "index.html"; return; }
    loadInvites();
  })();
</script>
  <script src="assets/senior-mode.js?v=1" defer></script>
</body>
</html>
