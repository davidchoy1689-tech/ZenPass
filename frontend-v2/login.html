<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>登入 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=25" />
  <style>input.field{border:1px solid var(--border);border-radius:12px;padding:13px 14px;width:100%;font:inherit;background:var(--surface);color:var(--text)}</style>
</head>
<body>
  <div class="wrap" style="padding-top:32px">
    <div class="center" style="margin:24px 0 8px">
      <div style="font-size:34px">🧭</div>
      <h1 style="margin:8px 0 2px">ZenPass 禪流</h1>
      <p class="muted">登入去預約你嘅課堂</p>
    </div>
    <div class="stack">
      <input class="field" id="email" placeholder="電郵" type="email" autocomplete="username" />
      <input class="field" id="pw" placeholder="密碼" type="password" autocomplete="current-password" />
      <div style="text-align:right;margin-top:-4px"><a href="forgot.html" style="font-size:13px;color:var(--brand-600);font-weight:600">忘記密碼？</a></div>
      <button class="btn btn-primary btn-block" id="go">登入</button>
      <div id="msg" class="muted center" style="font-size:13px"></div>
    </div>
    <div class="spacer"></div>
    <p class="muted center" style="font-size:13px">未有用戶？<a style="color:var(--brand-600);font-weight:700" href="register.html">註冊</a></p>
  </div>

  <script src="assets/api.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "my.html";
    async function doLogin() {
      const email = document.getElementById("email").value.trim();
      const pw = document.getElementById("pw").value;
      const msg = document.getElementById("msg");
      if (!email || !pw) { msg.textContent = "請輸入電郵同密碼"; return; }
      const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "登入中…";
      const r = await api.login(email, pw);
      btn.disabled = false; btn.textContent = "登入";
      if (r.ok) { location.href = next; }
      else { msg.textContent = (r.data && (r.data.error || r.data.message)) || "登入失敗"; }
    }
    document.getElementById("go").onclick = doLogin;
    document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
