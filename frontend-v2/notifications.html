<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>通知 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=24" />
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">通知</div></div>
  <div class="wrap">
    <div class="card" id="list"><div class="body muted">載入中…</div></div>
    <div class="spacer"></div>
  </div>
  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>
  <script src="assets/api.js"></script>
  <script>
    (async () => {
      if (!api.requireLogin("notifications.html")) return;
      const r = await api.get("/notifications?limit=30");
      const arr = (r.data && (r.data.notifications || r.data.items || r.data)) || [];
      const el = document.getElementById("list");
      if (!Array.isArray(arr) || !arr.length) { el.innerHTML = `<div class="body muted">暫無通知。</div>`; return; }
      el.innerHTML = arr.map(n => `<div class="row"><div>
        <div style="font-weight:600">${esc(n.title || n.subject || "通知")}</div>
        <div class="muted" style="font-size:12px">${esc((n.message || n.body || "").slice(0,80))}</div>
        <div class="muted" style="font-size:11px">${esc((n.created_at || "").slice(0,16))}</div>
      </div></div>`).join("");
    })();
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
