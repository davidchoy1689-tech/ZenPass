<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>項目圖案 · iOS 風格實驗</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:36px;font-family:-apple-system,"SF Pro Text","PingFang HK",sans-serif;background:#f5f5f7;color:#1d1d1f}
  h1{font-size:25px;margin:0 0 4px;letter-spacing:-.5px}
  p.sub{color:#6e6e73;margin:0 0 20px;font-size:13.5px}
  h2{font-size:13px;font-weight:600;color:#6e6e73;margin:26px 0 12px}
  .wrap{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;max-width:700px}
  .grid.small{grid-template-columns:repeat(10,1fr);max-width:700px;gap:12px}
  .tilewrap{text-align:center}
  .tile{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
  .tile svg{width:51px;height:51px;display:block}
  .tilewrap .lbl{font-size:11px;font-weight:600;color:#3a3a3c}
  /* iOS style */
  .ios{box-shadow:0 6px 14px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
  /* soft style */
  .soft{box-shadow:0 1px 3px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.04)}
  .phone{width:330px;background:#fff;border-radius:34px;box-shadow:0 10px 40px rgba(0,0,0,.14),0 0 0 10px #e9e9ee;overflow:hidden;flex:0 0 auto}
  .ph-status{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:#8e8e93}
  .ph-hero{background:linear-gradient(135deg,#ff6b35,#e55a2b);color:#fff;padding:15px 18px 17px;border-radius:0 0 22px 22px}
  .ph-hero h3{margin:0 0 5px;font-size:16.5px}
  .ph-hero p{margin:0;font-size:11px;opacity:.92}
  .ph-body{padding:12px 14px 6px}
  .ph-search{background:#f2f2f7;border-radius:11px;padding:9px 12px;font-size:12px;color:#8e8e93;margin-bottom:10px}
  .ph-title{font-size:13px;font-weight:700;margin:12px 2px 9px}
  .ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
  .ph-item .tile{width:58px;height:58px;border-radius:17px;margin-bottom:5px}
  .ph-item .tile svg{width:48px;height:48px}
  .ph-item .lbl{font-size:9.5px;font-weight:600;color:#3a3a3c}
  .ph-card{display:flex;gap:10px;align-items:center;border:1px solid #ececf0;border-radius:14px;padding:8px;margin-bottom:8px}
  .ph-card .tile{width:50px;height:50px;border-radius:14px;margin:0}
  .ph-card .tile svg{width:41px;height:41px}
  .ph-card .nm{font-size:12px;font-weight:600}
  .ph-card .s2{font-size:10px;color:#8e8e93}
  .ph-nav{display:flex;justify-content:space-around;border-top:.5px solid #e5e5ea;padding:9px 0 12px;font-size:9.5px;color:#8e8e93}
  .dark{background:#1c1c1e;border-radius:18px;padding:16px;display:flex;gap:12px;flex-wrap:wrap;max-width:700px}
</style>
</head>
<body>
  <h1>項目圖案 · iOS app icon 實驗</h1>
  <p class="sub">145 個・每項目獨立圖案 + 獨立顏色・圖案佔 82%。<b>上：彩色漸變底 + 白色圖（iOS 風）</b>；下：淡色底 + 同色圖。</p>
  <div class="wrap">
    <div>
      <h2>A. iOS 風：彩色漸變方塊 + 白色線稿（<span id="c1">0</span>）</h2>
      <div class="grid" id="ios"></div>
      <h2>B. 淡色版：柔和底 + 同色線稿（<span id="c2">0</span>）</h2>
      <div class="grid small" id="soft"></div>
      <h2>C. 深色底</h2>
      <div class="dark" id="dark"></div>
    </div>
    <div>
      <h2>手機版面預覽（iOS 風）</h2>
      <div class="phone">
        <div class="ph-status"><span>9:41</span><span>▮▮▯ 5G ▮</span></div>
        <div class="ph-hero"><h3>郁一郁，身體好</h3><p>搵堂、預約、簽到，一 app 搞掂</p></div>
        <div class="ph-body">
          <div class="ph-search">🔍 搜尋運動 / 課程 / 教練</div>
          <div class="ph-title">🏅 運動項目</div>
          <div class="ph-grid" id="phgrid"></div>
          <div class="ph-title">🆕 最新上架</div>
          <div id="phcards"></div>
        </div>
        <div class="ph-nav"><span>⌂ 主頁</span><span>⌕ 探索</span><span>▤ 預約</span><span>◍ 我的</span></div>
      </div>
    </div>
  </div>
<script>
  const H = c => { c=c.replace('#',''); return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]; };
  const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;
  const mix = (c, t, p) => { const a=H(c), b=H(t); return rgb(a.map((v,i)=>Math.round(v*(1-p)+b[i]*p))); };
  const darken = (c,p) => mix(c,'#000000',p);
  const lighten = (c,p) => mix(c,'#ffffff',p);
  const tint = (c,p) => mix(c,'#ffffff',1-p);
  let N1=0,N2=0;

  async function fill(el, slug, counter){
    try{
      const r = await fetch(slug + ".svg");
      if(!r.ok) throw 0;
      el.insertAdjacentHTML("afterbegin", await r.text());
      if(counter){ if(counter==="c1"){ document.getElementById("c1").textContent = ++N1; } else { document.getElementById("c2").textContent = ++N2; } }
    }catch(e){ const w = el.closest(".tilewrap") || el.closest(".ph-card"); if(w) w.remove(); }
  }

  Promise.all([fetch("../sports/manifest.json").then(r=>r.json()), fetch("colors.json").then(r=>r.json())]).then(([m,COL])=>{
    const col = {}; m.icons.forEach(i => col[i.slug] = COL[i.slug] || i.accent);
    // A. iOS
    document.getElementById("ios").innerHTML = m.icons.map(i => {
      const c = col[i.slug];
      return `<div class="tilewrap"><div class="tile ios" data-c="${c}" data-s="${i.slug}"
        style="background:linear-gradient(150deg,${lighten(c,.14)},${darken(c,.20)});color:#fff;--glow:${tint(c,.55)}"></div><div class="lbl">${i.name}</div></div>`;
    }).join("");
    // B. soft
    document.getElementById("soft").innerHTML = m.icons.map(i => {
      const c = col[i.slug];
      return `<div class="tilewrap"><div class="tile soft" data-c="${c}" data-s="${i.slug}"
        style="background:linear-gradient(150deg,${tint(c,.22)},${tint(c,.08)});color:${darken(c,.05)}"></div><div class="lbl">${i.name}</div></div>`;
    }).join("");
    // phone
    const pick = ["moelkkyla","floor-curling","roundnet","yoga","basketball","football","swimming","boxing"];
    document.getElementById("phgrid").innerHTML = pick.map(s => { const i=m.icons.find(x=>x.slug===s); if(!i) return ""; const c=col[s];
      return `<div class="ph-item"><div class="tile ios" data-s="${s}" style="background:linear-gradient(150deg,${lighten(c,.14)},${darken(c,.20)});color:#fff;--glow:${tint(c,.5)}"></div><div class="lbl">${i.name}</div></div>`; }).join("");
    const pc = [["yoga","流瑜伽 Flow Yoga","靜儀導師 · 60min"],["basketball","週末籃球班","Alex 教練 · 90min"]];
    document.getElementById("phcards").innerHTML = pc.map(([s,nm,sub])=>{ const c=col[s];
      return `<div class="ph-card"><div class="tile ios" data-s="${s}" style="background:linear-gradient(150deg,${lighten(c,.14)},${darken(c,.20)});color:#fff;--glow:${tint(c,.5)}"></div><div><div class="nm">${nm}</div><div class="s2">${sub}</div></div></div>`; }).join("");
    // dark
    const dp = ["yoga","basketball","football","swimming","cycling","running","boxing","dance","hiking","tai-chi"];
    document.getElementById("dark").innerHTML = dp.map(s=>{ const c=col[s];
      return `<div class="tile ios" data-s="${s}" style="width:52px;height:52px;border-radius:15px;background:linear-gradient(150deg,${lighten(c,.14)},${darken(c,.20)});color:#fff;--glow:rgba(0,0,0,.4)"></div>`; }).join("");
    // fill all
    document.querySelectorAll("[data-s]").forEach(el => fill(el, el.getAttribute("data-s"), el.closest("#ios")?"c1":(el.closest("#soft")?"c2":null)));
  });
</script>
</body>
</html>
