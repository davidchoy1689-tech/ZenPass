<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple 風格圖案 · 無重複</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:36px;font-family:-apple-system,"SF Pro Text","PingFang HK",sans-serif;background:#f5f5f7;color:#1d1d1f}
  h1{font-size:25px;margin:0 0 4px;letter-spacing:-.5px}
  p.sub{color:#6e6e73;margin:0 0 22px;font-size:13.5px}
  h2{font-size:13px;font-weight:600;color:#6e6e73;margin:22px 0 12px}
  .wrap{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;max-width:660px}
  .tilewrap{text-align:center}
  .tile{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;box-shadow:0 1px 3px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.04)}
  .tile img{width:32px;height:32px;display:block}
  .tilewrap .lbl{font-size:10.5px;font-weight:600;color:#3a3a3c}
  .phone{width:330px;background:#fff;border-radius:34px;box-shadow:0 10px 40px rgba(0,0,0,.14),0 0 0 10px #e9e9ee;overflow:hidden;flex:0 0 auto}
  .ph-status{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:#8e8e93}
  .ph-hero{background:linear-gradient(135deg,#ff6b35,#e55a2b);color:#fff;padding:15px 18px 17px;border-radius:0 0 22px 22px}
  .ph-hero h3{margin:0 0 5px;font-size:16.5px}
  .ph-hero p{margin:0;font-size:11px;opacity:.92}
  .ph-body{padding:12px 14px 6px}
  .ph-search{background:#f2f2f7;border-radius:11px;padding:9px 12px;font-size:12px;color:#8e8e93;margin-bottom:10px}
  .ph-title{font-size:13px;font-weight:700;margin:12px 2px 9px}
  .ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
  .ph-item .tile{width:50px;height:50px;border-radius:15px;margin-bottom:5px}
  .ph-item .tile img{width:28px;height:28px}
  .ph-item .lbl{font-size:9.5px;font-weight:600;color:#3a3a3c}
  .ph-card{display:flex;gap:10px;align-items:center;border:1px solid #ececf0;border-radius:14px;padding:8px;margin-bottom:8px}
  .ph-card .tile{width:44px;height:44px;border-radius:13px;margin:0}
  .ph-card .tile img{width:24px;height:24px}
  .ph-card .nm{font-size:12px;font-weight:600}
  .ph-card .s2{font-size:10px;color:#8e8e93}
  .ph-nav{display:flex;justify-content:space-around;border-top:.5px solid #e5e5ea;padding:9px 0 12px;font-size:9.5px;color:#8e8e93}
</style>
</head>
<body>
  <h1>Apple 風格圖案 · 每項目獨立（無重複）</h1>
  <p class="sub">通用項目用 Phosphor Icons (MIT)；HK 專屬項目自家繪製。已驗證：冇任何兩個項目共用同一圖案。</p>
  <div class="wrap">
    <div>
      <h2>已完成圖案（<span id="cnt">0</span> 個，未完成嘅自動隱藏）</h2>
      <div class="grid" id="grid"></div>
    </div>
    <div>
      <h2>手機版面預覽</h2>
      <div class="phone">
        <div class="ph-status"><span>9:41</span><span>▮▮▯ 5G ▮</span></div>
        <div class="ph-hero"><h3>郁一郁，身體好</h3><p>搵堂、預約、簽到，一 app 搞掂</p></div>
        <div class="ph-body">
          <div class="ph-search">🔍 搜尋運動 / 課程 / 教練</div>
          <div class="ph-title">🏅 運動項目</div>
          <div class="ph-grid" id="phgrid"></div>
          <div class="ph-title">🆕 最新上架</div>
          <div id="phcards"></div>
        </div>
        <div class="ph-nav"><span>⌂ 主頁</span><span>⌕ 探索</span><span>▤ 預約</span><span>◍ 我的</span></div>
      </div>
    </div>
  </div>
<script>
  const GTINT = {"新興運動":"#FFF0E9","課堂類別":"#F1EBFD","更多活動":"#EAF1FE","球類及其他":"#FDEBE3","香港熱門":"#E2F1FC","戶外及體能":"#E7F6EC","健體及新興":"#E3F5F2","舞蹈・文化・其他":"#FAE7FB","健體班・養生":"#E6F1E7","場地・戶外進階":"#F7EDE3","表演・小眾":"#FCE9F3","趣味・競技":"#EDEBFD"};
  let N = 0;
  function card(slug, name, group, cls) {
    const tint = GTINT[group] || "#F2F2F7";
    return `<div class="tilewrap ${cls||''}"><div class="tile" style="background:${tint}"><img src="${slug}.svg" alt="" loading="lazy" onerror="this.closest('.tilewrap').remove()" onload="window.__c()"></div><div class="lbl">${name}</div></div>`;
  }
  window.__c = () => { document.getElementById("cnt").textContent = ++N; };
  fetch("../sports/manifest.json").then(r=>r.json()).then(m=>{
    const groupOf = {}; Object.keys(m.groups).forEach(g=>m.groups[g].forEach(s=>groupOf[s]=g));
    document.getElementById("grid").innerHTML = m.icons.map(i=>card(i.slug, i.name, groupOf[i.slug]||"")).join("");
    // phone preview: pick first 8 that exist (common ones)
    const pick = ["yoga","basketball","football","swimming","running","cycling","boxing","dance"];
    document.getElementById("phgrid").innerHTML = pick.map(s=>{ const it=m.icons.find(x=>x.slug===s); return it? card(it.slug, it.name, groupOf[s]||"", "ph-item") : ""; }).join("");
    const pc = [["yoga","流瑜伽 Flow Yoga","靜儀導師 · 60min","課堂類別"],["basketball","週末籃球班","Alex 教練 · 90min","球類及其他"]];
    document.getElementById("phcards").innerHTML = pc.map(([s,nm,sub,g])=>`<div class="ph-card"><div class="tile" style="background:${GTINT[g]}"><img src="${s}.svg" alt=""></div><div><div class="nm">${nm}</div><div class="s2">${sub}</div></div></div>`).join("");
  });
</script>
</body>
</html>
