<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple 風格 · 彩色版</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:36px;font-family:-apple-system,"SF Pro Text","PingFang HK",sans-serif;background:#f5f5f7;color:#1d1d1f}
  h1{font-size:25px;margin:0 0 4px;letter-spacing:-.5px}
  p.sub{color:#6e6e73;margin:0 0 22px;font-size:13.5px}
  h2{font-size:13px;font-weight:600;color:#6e6e73;margin:22px 0 12px}
  .wrap{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;max-width:680px}
  .tilewrap{text-align:center}
  .tile{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 5px 14px rgba(0,0,0,.045),inset 0 .5px 0 rgba(255,255,255,.65)}
  .tile svg{width:33px;height:33px;display:block}
  .tilewrap .lbl{font-size:10.5px;font-weight:600;color:#3a3a3c}
  .phone{width:330px;background:#fff;border-radius:34px;box-shadow:0 10px 40px rgba(0,0,0,.14),0 0 0 10px #e9e9ee;overflow:hidden;flex:0 0 auto}
  .ph-status{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:#8e8e93}
  .ph-hero{background:linear-gradient(135deg,#ff6b35,#e55a2b);color:#fff;padding:15px 18px 17px;border-radius:0 0 22px 22px}
  .ph-hero h3{margin:0 0 5px;font-size:16.5px}
  .ph-hero p{margin:0;font-size:11px;opacity:.92}
  .ph-body{padding:12px 14px 6px}
  .ph-search{background:#f2f2f7;border-radius:11px;padding:9px 12px;font-size:12px;color:#8e8e93;margin-bottom:10px}
  .ph-title{font-size:13px;font-weight:700;margin:12px 2px 9px}
  .ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
  .ph-item .tile{width:52px;height:52px;border-radius:15px;margin-bottom:5px}
  .ph-item .tile svg{width:29px;height:29px}
  .ph-item .lbl{font-size:9.5px;font-weight:600;color:#3a3a3c}
  .ph-card{display:flex;gap:10px;align-items:center;border:1px solid #ececf0;border-radius:14px;padding:8px;margin-bottom:8px}
  .ph-card .tile{width:46px;height:46px;border-radius:13px;margin:0}
  .ph-card .tile svg{width:25px;height:25px}
  .ph-card .nm{font-size:12px;font-weight:600}
  .ph-card .s2{font-size:10px;color:#8e8e93}
  .ph-nav{display:flex;justify-content:space-around;border-top:.5px solid #e5e5ea;padding:9px 0 12px;font-size:9.5px;color:#8e8e93}
  .dark{background:#1c1c1e;border-radius:18px;padding:16px;display:flex;gap:12px;flex-wrap:wrap;max-width:680px}
</style>
</head>
<body>
  <h1>Apple 風格 · 彩色版</h1>
  <p class="sub">乾淨單線（Phosphor MIT + 自家繪製）＋ 每個項目有自己的主色，放喺柔和底色方塊。零重複。</p>
  <div class="wrap">
    <div>
      <h2>彩色方塊（<span id="cnt">0</span> 個）</h2>
      <div class="grid" id="grid"></div>
      <h2>深色底</h2>
      <div class="dark" id="dark"></div>
    </div>
    <div>
      <h2>手機版面預覽</h2>
      <div class="phone">
        <div class="ph-status"><span>9:41</span><span>▮▮▯ 5G ▮</span></div>
        <div class="ph-hero"><h3>郁一郁，身體好</h3><p>搵堂、預約、簽到，一 app 搞掂</p></div>
        <div class="ph-body">
          <div class="ph-search">🔍 搜尋運動 / 課程 / 教練</div>
          <div class="ph-title">🏅 運動項目</div>
          <div class="ph-grid" id="phgrid"></div>
          <div class="ph-title">🆕 最新上架</div>
          <div id="phcards"></div>
        </div>
        <div class="ph-nav"><span>⌂ 主頁</span><span>⌕ 探索</span><span>▤ 預約</span><span>◍ 我的</span></div>
      </div>
    </div>
  </div>
<script>
  const tint = (hex, a) => {
    const h = hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  };
  let N = 0;
  async function fill(el, slug){
    try{
      const r = await fetch(slug + ".svg");
      if(!r.ok) throw 0;
      el.insertAdjacentHTML("afterbegin", await r.text());
      document.getElementById("cnt").textContent = ++N;
    }catch(e){ const w = el.closest(".tilewrap") || el.closest(".ph-card"); if(w) w.remove(); }
  }
  fetch("../sports/manifest.json").then(r=>r.json()).then(m=>{
    const acc = {}; m.icons.forEach(i => acc[i.slug] = i.accent);
    const tile = (i, cls) => `<div class="tilewrap ${cls||''}"><div class="tile" data-s="${i.slug}" style="background:linear-gradient(150deg,${tint(i.accent,.22)},${tint(i.accent,.07)});color:${i.accent}"></div><div class="lbl">${i.name}</div></div>`;
    document.getElementById("grid").innerHTML = m.icons.map(i => tile(i)).join("");
    const pick = ["moelkkyla","floor-curling","roundnet","yoga","basketball","football","swimming","boxing"];
    document.getElementById("phgrid").innerHTML = pick.map(s => { const i = m.icons.find(x=>x.slug===s); return i ? `<div class="ph-item"><div class="tile" data-s="${i.slug}" style="background:linear-gradient(150deg,${tint(i.accent,.22)},${tint(i.accent,.07)});color:${i.accent}"></div><div class="lbl">${i.name}</div></div>` : ""; }).join("");
    const pc = [["yoga","流瑜伽 Flow Yoga","靜儀導師 · 60min"],["basketball","週末籃球班","Alex 教練 · 90min"]];
    document.getElementById("phcards").innerHTML = pc.map(([s,nm,sub])=>{ const i=m.icons.find(x=>x.slug===s); return `<div class="ph-card"><div class="tile" data-s="${s}" style="background:linear-gradient(150deg,${tint(i.accent,.22)},${tint(i.accent,.07)});color:${i.accent}"></div><div><div class="nm">${nm}</div><div class="s2">${sub}</div></div></div>`; }).join("");
    const dpick = ["yoga","basketball","football","swimming","cycling","running","boxing","dance","hiking","tai-chi"];
    document.getElementById("dark").innerHTML = dpick.map(s=>{ const i=m.icons.find(x=>x.slug===s); return i?`<div class="tile" data-s="${s}" style="background:${tint(i.accent,.28)};color:${i.accent}"></div>`:""; }).join("");
    // fill
    document.querySelectorAll("[data-s]").forEach(el => fill(el, el.getAttribute("data-s")));
  });
</script>
</body>
</html>
