<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple 風格圖案 v2</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:40px;font-family:-apple-system,"SF Pro Text","PingFang HK",sans-serif;background:#f5f5f7;color:#1d1d1f}
  h1{font-size:28px;margin:0 0 4px;letter-spacing:-.6px}
  p.sub{color:#6e6e73;margin:0 0 28px;font-size:14px}
  h2{font-size:13px;font-weight:600;color:#6e6e73;margin:30px 0 12px;letter-spacing:.2px}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:16px;max-width:920px}
  .tilewrap{text-align:center}
  .tile{width:60px;height:60px;border-radius:17px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;box-shadow:0 1px 3px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.04)}
  .tile svg{width:34px;height:34px;display:block}
  .tilewrap .lbl{font-size:11px;font-weight:600;color:#3a3a3c;line-height:1.25}
  .plain svg{width:40px;height:40px;color:#1d1d1f;display:block;margin:0 auto 8px}
  .rows{background:#fff;border-radius:16px;max-width:560px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;align-items:center;gap:12px;padding:11px 16px}
  .row + .row{border-top:.5px solid #e5e5ea}
  .row .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .row .ic svg{width:19px;height:19px;display:block}
  .row .nm{flex:1;font-size:15px}
  .row .ch{color:#c7c7cc;font-size:18px}
  .dark{background:#1c1c1e;border-radius:18px;padding:22px;display:flex;gap:18px;align-items:center;max-width:920px;flex-wrap:wrap}
  .dark .tile{box-shadow:none}
  .dark svg{color:#fff}
</style>
</head>
<body>
  <h1>Apple 風格圖案 v2</h1>
  <p class="sub">單線 monoline・圓頭圓角・可染色。加咗「圖示方塊」同清單排版效果 — 自家繪製，非 Apple SF Symbols。</p>

  <h2>圖示方塊（Settings 風）</h2>
  <div class="grid" id="tiles"></div>

  <h2>行內清單（iOS 列表）</h2>
  <div class="rows" id="rows"></div>

  <h2>單色 / 深色底</h2>
  <div class="grid plain" id="plain" style="grid-template-columns:repeat(8,1fr)"></div>
  <div class="dark" id="dark" style="margin-top:14px"></div>

<script>
  const items = [
    ["moelkkyla","芬蘭木柱","#FDF0E4","#B45309"],
    ["floor-curling","地板冰壺","#EAF1FE","#2563EB"],
    ["cornhole","布袋球","#FCE9E9","#DC2626"],
    ["air-storm","穿雲箭","#F1EBFD","#7C3AED"],
    ["roundnet","圓網球","#FFF0E9","#FF6B35"],
    ["rouliqiu","柔力球","#FCE9F3","#DB2777"],
    ["nordic-walking","北歐健步行","#E6F6F0","#059669"],
    ["yoga","瑜伽","#F1EBFD","#7C3AED"],
    ["meditation","冥想","#E4F4FD","#0EA5E9"],
    ["gym","健身","#FDEBE3","#EA580C"],
    ["tai-chi","太極","#E6F1E7","#166534"],
    ["basketball","籃球","#FDEBE3","#EA580C"],
    ["badminton","羽毛球","#F1EBFD","#7C3AED"],
    ["swimming","游泳","#E2F1FC","#0284C7"],
    ["climbing","攀岩","#FDF0E4","#B45309"],
    ["kids-fitness","兒童健體","#FEF3E2","#F59E0B"]
  ];
  const svgInto = (el, slug) => fetch(slug + ".svg").then(r => r.text()).then(t => el.insertAdjacentHTML("afterbegin", t));

  document.getElementById("tiles").innerHTML = items.map(([s,zh,bg,fg]) =>
    `<div class="tilewrap"><div class="tile" data-s="${s}" style="background:${bg};color:${fg}"></div><div class="lbl">${zh}</div></div>`).join("");

  document.getElementById("rows").innerHTML = items.slice(0,5).map(([s,zh,bg,fg]) =>
    `<div class="row"><span class="ic" data-s="${s}" style="background:${bg};color:${fg}"></span><span class="nm">${zh}</span><span class="ch">›</span></div>`).join("");

  document.getElementById("plain").innerHTML = items.map(([s,zh]) =>
    `<div class="tilewrap"><span data-s="${s}"></span><div class="lbl">${zh}</div></div>`).join("");

  document.getElementById("dark").innerHTML = items.slice(0,8).map(([s]) =>
    `<span class="tile" data-s="${s}" style="background:#2c2c2e;color:#fff"></span>`).join("");

  Promise.all([...document.querySelectorAll("[data-s]")].map(el => svgInto(el, el.getAttribute("data-s"))));
</script>
</body>
</html>
