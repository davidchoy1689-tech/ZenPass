<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>項目圖案 · A+B 混合版面</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:34px;font-family:-apple-system,"SF Pro Text","PingFang HK",sans-serif;background:#f5f5f7;color:#1d1d1f}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.5px}
  p.sub{color:#6e6e73;margin:0 0 18px;font-size:13px}
  h2{font-size:13px;font-weight:600;color:#6e6e73;margin:24px 0 12px}
  .wrap{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
  .left{flex:1 1 620px;max-width:700px}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:13px}
  .tilewrap{text-align:center}
  .tile{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
  .tile svg{width:51px;height:51px;display:block}
  .tilewrap .lbl{font-size:11px;font-weight:600;color:#3a3a3c}
  .ios{box-shadow:0 6px 14px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
  .soft{box-shadow:0 1px 3px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.04)}
  /* chips (B) */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px 6px 8px;border-radius:999px;font-size:12px;font-weight:600}
  .chip svg{width:20px;height:20px;display:block}
  /* course cards (B) */
  .ccard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #ececf0;border-radius:16px;padding:11px;margin-bottom:10px}
  .ccard .tile{width:52px;height:52px;border-radius:15px;margin:0}
  .ccard .tile svg{width:43px;height:43px}
  .ccard .nm{font-size:14px;font-weight:700}
  .ccard .s2{font-size:11.5px;color:#8e8e93}
  .ccard .price{margin-left:auto;color:#ff6b35;font-weight:800}
  /* phone */
  .phone{width:330px;background:#fff;border-radius:34px;box-shadow:0 10px 40px rgba(0,0,0,.14),0 0 0 10px #e9e9ee;overflow:hidden;flex:0 0 auto}
  .ph-status{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:#8e8e93}
  .ph-hero{background:linear-gradient(135deg,#ff6b35,#e55a2b);color:#fff;padding:15px 18px 17px;border-radius:0 0 22px 22px}
  .ph-hero h3{margin:0 0 5px;font-size:16.5px}
  .ph-hero p{margin:0;font-size:11px;opacity:.92}
  .ph-body{padding:12px 14px 6px}
  .ph-search{background:#f2f2f7;border-radius:11px;padding:9px 12px;font-size:12px;color:#8e8e93;margin-bottom:10px}
  .ph-chips{display:flex;gap:6px;overflow:hidden;margin-bottom:4px}
  .ph-chips .chip{font-size:11px;padding:4px 9px 4px 6px}
  .ph-chips .chip svg{width:16px;height:16px}
  .ph-title{font-size:13px;font-weight:700;margin:12px 2px 9px}
  .ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
  .ph-item .tile{width:56px;height:56px;border-radius:16px;margin-bottom:5px}
  .ph-item .tile svg{width:46px;height:46px}
  .ph-item .lbl{font-size:9.5px;font-weight:600;color:#3a3a3c}
  .ph-card{display:flex;gap:10px;align-items:center;border:1px solid #ececf0;border-radius:14px;padding:8px;margin-bottom:8px}
  .ph-card .tile{width:50px;height:50px;border-radius:14px;margin:0}
  .ph-card .tile svg{width:41px;height:41px}
  .ph-card .nm{font-size:12px;font-weight:600}
  .ph-card .s2{font-size:10px;color:#8e8e93}
  .ph-nav{display:flex;justify-content:space-around;border-top:.5px solid #e5e5ea;padding:9px 0 12px;font-size:9.5px;color:#8e8e93}
  .dark{background:#1c1c1e;border-radius:18px;padding:16px;display:flex;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
  <h1>項目圖案 · A + B 混合版面</h1>
  <p class="sub"><b>A（iOS 彩色方塊 + 白圖）</b> 用於主力卡片牆／項目總覽；<b>B（淡色底 + 同色圖）</b> 用於分類 chips、課程卡、清單。145 個・零重複・顏色全獨立。</p>
  <div class="wrap">
    <div class="left">
      <h2>B · 分類 chips</h2>
      <div class="chips" id="chips"></div>
      <h2>A · 運動項目卡片牆（全部）</h2>
      <div class="grid" id="ios"></div>
      <h2>B · 課程卡</h2>
      <div id="cards"></div>
      <h2>A · 深色底</h2>
      <div class="dark" id="dark"></div>
    </div>
    <div>
      <h2>手機版面（A 項目牆 + B 清單）</h2>
      <div class="phone">
        <div class="ph-status"><span>9:41</span><span>▮▮▯ 5G ▮</span></div>
        <div class="ph-hero"><h3>郁一郁，身體好</h3><p>搵堂、預約、簽到，一 app 搞掂</p></div>
        <div class="ph-body">
          <div class="ph-search">🔍 搜尋運動 / 課程 / 教練</div>
          <div class="ph-chips" id="phchips"></div>
          <div class="ph-title">🏅 運動項目</div>
          <div class="ph-grid" id="phgrid"></div>
          <div class="ph-title">🆕 最新上架</div>
          <div id="phcards"></div>
        </div>
        <div class="ph-nav"><span>⌂ 主頁</span><span>⌕ 探索</span><span>▤ 預約</span><span>◍ 我的</span></div>
      </div>
    </div>
  </div>
<script>
  const H=c=>{c=c.replace('#','');return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];};
  const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
  const mix=(c,t,p)=>{const a=H(c),b=H(t);return rgb(a.map((v,i)=>Math.round(v*(1-p)+b[i]*p)));};
  const darken=(c,p)=>mix(c,'#000000',p), lighten=(c,p)=>mix(c,'#ffffff',p), tint=(c,p)=>mix(c,'#ffffff',1-p);

  async function fill(el, slug){
    try{ const r=await fetch(slug+".svg"); if(!r.ok) throw 0; el.insertAdjacentHTML("afterbegin", await r.text()); }
    catch(e){ const w=el.closest(".tilewrap,.chip,.ccard,.ph-item,.ph-card"); if(w) w.remove(); }
  }
  const A=(c,slug,cls) => `<div class="${cls||'tilewrap'}"><div class="tile ios" data-s="${slug}" style="background:linear-gradient(150deg,${lighten(c,.14)},${darken(c,.20)});color:#fff;--glow:${tint(c,.55)}"></div>${cls?'':'<div class="lbl"></div>'}</div>`;
  const B=(c,slug,extra) => ({tile:`<div class="tile soft" data-s="${slug}" style="background:linear-gradient(150deg,${tint(c,.22)},${tint(c,.08)});color:${darken(c,.05)}"></div>${extra||''}`});

  Promise.all([fetch("../sports/manifest.json").then(r=>r.json()), fetch("colors.json").then(r=>r.json())]).then(([m,COL])=>{
    const col={}; m.icons.forEach(i=>col[i.slug]=COL[i.slug]||i.accent);
    const NI=s=>m.icons.find(x=>x.slug===s);
    // chips (B)
    const chipSlugs=["moelkkyla","yoga","basketball","swimming","hiking","boxing","dance","tai-chi"];
    document.getElementById("chips").innerHTML = chipSlugs.map(s=>{const i=NI(s);if(!i)return"";const c=col[s];
      return `<span class="chip" style="background:${tint(c,.16)};color:${darken(c,.08)}"><span data-s="${s}" style="color:${darken(c,.05)};display:flex"></span>${i.name}</span>`;}).join("");
    // ios grid (A) all
    document.getElementById("ios").innerHTML = m.icons.map(i=>`<div class="tilewrap"><div class="tile ios" data-s="${i.slug}" style="background:linear-gradient(150deg,${lighten(col[i.slug],.14)},${darken(col[i.slug],.20)});color:#fff;--glow:${tint(col[i.slug],.55)}"></div><div class="lbl">${i.name}</div></div>`).join("");
    // cards (B)
    const cc=[["yoga","流瑜伽 Flow Yoga","靜儀導師 · 60min · 剩 3 位",120],["basketball","週末籃球班","Alex 教練 · 90min · 剩 5 位",150],["swimming","兒童游泳入門","Miss Chan · 45min · 剩 8 位",130]];
    document.getElementById("cards").innerHTML = cc.map(([s,nm,sub,pr])=>{const c=col[s];
      return `<div class="ccard"><div class="tile soft" data-s="${s}" style="background:linear-gradient(150deg,${tint(c,.22)},${tint(c,.08)});color:${darken(c,.05)}"></div><div><div class="nm">${nm}</div><div class="s2">${sub}</div></div><div class="price">${pr}cr</div></div>`;}).join("");
    // dark (A)
    const dp=["yoga","basketball","football","swimming","cycling","running","boxing","dance","hiking","tai-chi"];
    document.getElementById("dark").innerHTML = dp.map(s=>{const c=col[s];
      return `<div class="tile ios" data-s="${s}" style="width:52px;height:52px;border-radius:15px;background:linear-gradient(150deg,${lighten(c,.14)},${darken(c,.20)});color:#fff;--glow:rgba(0,0,0,.45)"></div>`;}).join("");
    // phone
    document.getElementById("phchips").innerHTML = chipSlugs.slice(0,5).map(s=>{const i=NI(s);const c=col[s];
      return `<span class="chip" style="background:${tint(c,.16)};color:${darken(c,.08)}"><span data-s="${s}" style="color:${darken(c,.05)};display:flex"></span>${i.name}</span>`;}).join("");
    const pg=["moelkkyla","floor-curling","roundnet","yoga","basketball","football","swimming","boxing"];
    document.getElementById("phgrid").innerHTML = pg.map(s=>{const i=NI(s);if(!i)return"";const c=col[s];
      return `<div class="ph-item"><div class="tile ios" data-s="${s}" style="background:linear-gradient(150deg,${lighten(c,.14)},${darken(c,.20)});color:#fff;--glow:${tint(c,.5)}"></div><div class="lbl">${i.name}</div></div>`;}).join("");
    const pcar=[["yoga","流瑜伽 Flow Yoga","靜儀導師 · 60min"],["basketball","週末籃球班","Alex 教練 · 90min"]];
    document.getElementById("phcards").innerHTML = pcar.map(([s,nm,sub])=>{const c=col[s];
      return `<div class="ph-card"><div class="tile soft" data-s="${s}" style="background:linear-gradient(150deg,${tint(c,.22)},${tint(c,.08)});color:${darken(c,.05)}"></div><div><div class="nm">${nm}</div><div class="s2">${sub}</div></div></div>`;}).join("");
    document.querySelectorAll("[data-s]").forEach(el=>fill(el, el.getAttribute("data-s")));
    // labels for ios grid
    document.querySelectorAll("#ios .tilewrap").forEach((w,idx)=>{ const nm=w.querySelector(".lbl"); if(nm && !nm.textContent) nm.textContent=m.icons[idx]?m.icons[idx].name:""; });
  });
</script>
</body>
</html>
