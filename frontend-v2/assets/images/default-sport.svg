<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/><stop offset="55%" stop-color="#0b5c56"/><stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- 運動場線條 -->
  <g stroke="#ffffff" stroke-opacity="0.10" fill="none" stroke-width="6">
    <circle cx="1280" cy="240" r="200"/><circle cx="1280" cy="240" r="120"/>
    <path d="M0 760 H1600"/><path d="M0 820 H1600"/>
    <path d="M200 1000 V520 a180 180 0 0 1 360 0 V1000"/>
    <path d="M960 1000 V600 a220 220 0 0 1 440 0 V1000"/>
  </g>
  <!-- 動感線條 -->
  <g stroke="url(#gold)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M120 300 q180 -140 360 0 t360 0"/>
    <path d="M140 380 q160 -90 320 0" opacity="0.5"/>
  </g>
  <!-- 球類圖形 -->
  <g opacity="0.9">
    <circle cx="1180" cy="640" r="86" fill="none" stroke="#ffffff" stroke-width="8"/>
    <path d="M1180 554 v172 M1094 640 h172" stroke="#ffffff" stroke-width="6" opacity="0.7"/>
    <circle cx="420" cy="700" r="60" fill="url(#gold)" opacity="0.9"/>
    <rect x="700" y="620" width="120" height="120" rx="16" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.8"/>
    <circle cx="960" cy="820" r="34" fill="#ffffff" opacity="0.85"/>
  </g>
  <text x="110" y="880" font-family="PingFang HK,Noto Sans TC,sans-serif" font-size="64" font-weight="800" fill="#ffffff" opacity="0.95">ZENPASS</text>
  <text x="112" y="930" font-family="PingFang HK,Noto Sans TC,sans-serif" font-size="26" font-weight="600" fill="#ffffff" opacity="0.7">SPORT &amp; WELLNESS</text>
</svg>
