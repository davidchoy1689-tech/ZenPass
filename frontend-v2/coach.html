<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>教練中心 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=4" />
  <style>
    .kpis { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .kpi { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; }
    .kpi .big { font-size:22px; font-weight:800; color:var(--brand-600); }
    .kpi .lbl { font-size:12px; color:var(--text-muted); }
    .cl { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); }
    .cl:last-child { border-bottom:0; }
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">教練中心</div></div>

  <div class="wrap">
    <div id="guard" style="display:none"></div>
    <div id="main" style="display:none">
      <div class="section-title">收入概覽</div>
      <div class="kpis" id="kpis"><div class="kpi"><div class="big">—</div><div class="lbl">載入中…</div></div></div>
      <div class="spacer"></div>
      <div class="section-title">⭐ 我的評分（只你自己睇）</div>
      <div class="card" id="myRating"><div class="body muted">載入中…</div></div>
      <a class="btn btn-secondary btn-block" href="coach-attendance.html">🧑‍🏫 課堂簽到（為學生手動簽到）</a>
      <a class="btn btn-secondary btn-block" href="coach-jobs.html">🧰 工作機會（接 Job）</a>
      <a class="btn btn-secondary btn-block" href="venue-rentals.html">🏟️ 租用場地（開班用）</a>

      <div class="section-title">➕ 開新班</div>
      <a class="btn btn-primary btn-block" href="ai-open-class.html" style="margin-bottom:10px">🤖 AI 一鍵開班（影／貼宣傳單張自動填）</a>
      <div class="card"><div class="body">
        <p class="muted" style="font-size:12.5px;margin:0 0 10px">填完即刻上架，學生可以喺探索頁預約。</p>
        <label class="lbl">課程標題</label><input class="fld" id="ncTitle" placeholder="例：【新手體驗】芬蘭木柱 60 分鐘" />
        <div class="grid2">
          <div><label class="lbl">類別</label><select class="fld" id="ncCat"></select></div>
          <div><label class="lbl">難度</label><select class="fld" id="ncDiff">
            <option value="beginner">新手友善</option><option value="intermediate">中階</option><option value="advanced">進階</option></select></div>
        </div>
        <div class="grid2">
          <div><label class="lbl">時長（分鐘）</label><input class="fld" id="ncDur" type="number" value="60" min="15" max="300" /></div>
          <div><label class="lbl">名額</label><input class="fld" id="ncMax" type="number" value="12" min="1" max="200" /></div>
        </div>
        <label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:13.5px">
          <input type="checkbox" id="ncVip" checked style="width:18px;height:18px;margin-top:2px" />
          <span><b>VIP Pass 優先預約</b><br /><span class="muted" style="font-size:12px">新班頭 24 小時只限 VIP Pass 會員預約，之後開放給所有會員</span></span>
        </label>
        <div class="grid2">
          <div><label class="lbl">價錢 HK$</label><input class="fld" id="ncPrice" type="number" value="150" min="0" /></div>
          <div><label class="lbl">Credits（留空自動 = 價錢÷10）</label><input class="fld" id="ncCredits" type="number" min="0" /></div>
        </div>
        <label class="lbl">場地</label>
        <select class="fld" id="ncVenue"></select>
        <div id="ncVenueManual" style="display:none">
          <div class="grid2">
            <div><label class="lbl">場地名稱</label><input class="fld" id="ncVenueName" placeholder="例：觀塘社區中心" /></div>
            <div><label class="lbl">地區</label><input class="fld" id="ncVenueDistrict" placeholder="例：觀塘" /></div>
          </div>
          <label class="lbl">地址（可選）</label><input class="fld" id="ncVenueAddr" />
        </div>
        <label class="lbl">簡介（可選）</label><textarea class="fld" id="ncDesc" rows="3" placeholder="課堂內容、帶走咩、適合邊個"></textarea>
        <label class="lbl">時段</label>
        <div id="ncSlots"></div>
        <button class="btn btn-secondary btn-block" id="ncAddSlot" style="margin-top:8px">＋ 加多個時段</button>
        <button class="btn btn-primary btn-block" id="ncSubmit" style="margin-top:10px">開班並上架</button>
        <div class="muted center" id="ncMsg" style="font-size:12.5px;margin-top:8px"></div>
      </div></div>

      <div class="section-title">我嘅課程</div>
      <div class="card" id="classes"><div class="body muted">載入中…</div></div>

      <div class="section-title">出糧紀錄</div>
      <div class="card" id="payouts"><div class="body muted">載入中…</div></div>

      <div class="section-title">商戶合作</div>
      <div class="card" id="venues"><div class="body muted">載入中…</div></div>
      <div class="spacer"></div>
    </div>
    <div class="spacer"></div>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script>
    $ = (id) => document.getElementById(id);
    async function load() {
      const me = await api.get("/users/me");
      const u = (me.data && (me.data.user || me.data)) || {};
      const isCoach = u.is_coach || u.coach_verified || u.role === "admin" || u.role === "super_admin" || u.role === "coach";
      if (!isCoach) {
        $("guard").style.display = "";
        $("guard").innerHTML = `<div class="card"><div class="body center">呢頁只供教練使用。<br><br><a class="btn btn-secondary" href="my.html">返回</a></div></div>`;
        return;
      }
      $("main").style.display = "";

      const er = await api.get("/coach/earnings");
      const d = er.data || {}; const s = d.summary || {};
      $("kpis").innerHTML = [
        ["本月收入", hkd(s.monthly || 0)],
        ["總收入", hkd(d.total_earnings != null ? d.total_earnings : (s.total || 0))],
        ["待出糧", hkd(d.pending_payout || 0)],
        ["分賬比率", Math.round((d.commission_rate || 0) * 100) + "%"],
      ].map(([l, v]) => `<div class="kpi"><div class="big">${v}</div><div class="lbl">${l}</div></div>`).join("");

      await loadClasses();

      const pr = await api.get("/coach/payout-history");
      const pays = (pr.data && (pr.data.payouts || pr.data.history)) || [];
      $("payouts").innerHTML = pays.length ? pays.slice(0, 10).map(p =>
        `<div class="body" style="display:flex;justify-content:space-between"><span>${esc(p.created_at || p.requested_at || "")}</span><span>${hkd(p.amount || 0)}</span></div>`
      ).join("") : '<div class="body muted">暫無出糧紀錄。</div>';

      await loadVenues();
      await loadMyRating();
      await initNewClass();
    }

    async function loadMyRating() {
      const box = $("myRating");
      const r = await api.get("/coach/my-rating");
      if (!r.ok) { box.innerHTML = '<div class="body muted">暫無評分資料</div>'; return; }
      const d = (r.data && r.data.data) || {};
      const stars = "★★★★★".slice(0, Math.round(d.score || 0)) + "☆☆☆☆☆".slice(0, 5 - Math.round(d.score || 0));
      const recent = (d.recent || []).slice(0, 3);
      box.innerHTML =
        '<div class="body">' +
        '<div style="display:flex;align-items:baseline;gap:8px">' +
        '<div style="font-size:26px;font-weight:800">' + (d.count ? Number(d.score).toFixed(1) : "—") + '</div>' +
        '<div class="muted" style="font-size:13px">' + (d.count ? stars + " · " + d.count + " 則評價" : "暫時未收到評價") + '</div>' +
        '</div>' +
        (d.count ? '<div class="muted" style="font-size:12px;margin-top:4px">實際平均 ' + Number(d.raw_avg).toFixed(1) + ' 分（已按貝氏平滑，避免單一負評影響）</div>' : '') +
        '<div class="muted" style="font-size:12px;margin-top:6px">' + esc(d.note || "") + '</div>' +
        (recent.length ? '<div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:8px">' +
          recent.map(x => '<div style="font-size:12.5px;margin-bottom:6px">' + "★".repeat(x.rating) + " " + esc(x.comment || "（無留言）") + ' <span class="muted">· ' + esc(String(x.created_at || "").slice(0, 10)) + '</span></div>').join("") +
          '</div>' : "") +
        '</div>';
    }

    /* ===== ➕ 開新班 ===== */
    const NC_CATS = ["新興運動","身心伸展","兒童健體","健身體能","球類運動","舞蹈","戶外歷險","武術格鬥","養生復康","其他"];
    let ncVenues = [];

    function ncSlotRow() {
      const d = document.createElement("div");
      d.className = "nc-slot";
      d.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px";
      const now = new Date(Date.now() + 864e5);
      now.setMinutes(0, 0, 0);
      const pad = (n) => String(n).padStart(2, "0");
      const val = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + "T19:00";
      d.innerHTML = '<input class="fld" type="datetime-local" data-start value="' + val + '">' +
                    '<input class="fld" type="datetime-local" data-end value="' + val.replace("T19:00", "T20:00") + '">';
      return d;
    }

    async function initNewClass() {
      $("ncCat").innerHTML = NC_CATS.map(c => '<option>' + c + '</option>').join("");
      $("ncSlots").appendChild(ncSlotRow());
      $("ncAddSlot").onclick = () => { if ($("ncSlots").children.length < 10) $("ncSlots").appendChild(ncSlotRow()); };

      const r = await api.get("/coach/venues");
      ncVenues = (r.data && r.data.venues) || [];
      const opts = ncVenues.map(v => '<option value="' + esc(v.id) + '">' + esc(v.name) + (v.district ? "（" + esc(v.district) + "）" : "") + '</option>');
      $("ncVenue").innerHTML = opts.join("") + '<option value="">其他／自行輸入</option>';
      $("ncVenue").onchange = () => {
        $("ncVenueManual").style.display = $("ncVenue").value ? "none" : "block";
      };

      $("ncSubmit").onclick = submitNewClass;
    }

    async function submitNewClass() {
      const btn = $("ncSubmit"), msg = $("ncMsg");
      const title = $("ncTitle").value.trim();
      if (!title) { msg.textContent = "請填課程標題"; return; }
      const schedules = [...$("ncSlots").children].map(d => ({
        start_time: d.querySelector("[data-start]").value.replace("T", " ") + ":00",
        end_time: d.querySelector("[data-end]").value.replace("T", " ") + ":00",
      })).filter(s => s.start_time && s.end_time);
      if (!schedules.length) { msg.textContent = "請加最少一個時段"; return; }

      const venueSel = $("ncVenue").value;
      const body = {
        title,
        category: $("ncCat").value,
        difficulty: $("ncDiff").value,
        duration: Number($("ncDur").value),
        max_participants: Number($("ncMax").value),
        vip_priority_hours: $("ncVip") && $("ncVip").checked ? 24 : 0,
        price_hkd: Number($("ncPrice").value) || 0,
        credits_cost: $("ncCredits").value ? Number($("ncCredits").value) : undefined,
        description: $("ncDesc").value.trim(),
        venue: venueSel ? { partner_venue_id: venueSel } : {
          name: $("ncVenueName").value.trim(),
          district: $("ncVenueDistrict").value.trim(),
          address: $("ncVenueAddr").value.trim(),
        },
        schedules,
      };
      if (!venueSel && !body.venue.name) { msg.textContent = "請選擇場地或填場地名稱"; return; }

      btn.disabled = true; btn.textContent = "開班中…"; msg.textContent = "";
      const r = await api.post("/coach/classes", body);
      btn.disabled = false; btn.textContent = "開班並上架";
      if (r.ok) {
        msg.textContent = "✅ 已開班（" + ((r.data && r.data.data && r.data.data.schedules) || schedules.length) + " 個時段），已上架探索頁";
        $("ncTitle").value = ""; $("ncDesc").value = "";
        $("ncSlots").innerHTML = ""; $("ncSlots").appendChild(ncSlotRow());
        await loadClasses();
      } else {
        msg.textContent = (r.data && r.data.error) || "開班失敗";
      }
    }

    async function loadClasses() {
      const cr = await api.get("/coach/my-classes");
      const cls = (cr.data && cr.data.classes) || [];
      $("classes").innerHTML = cls.length ? cls.slice(0, 20).map(c =>
        `<a class="cl" href="detail.html?id=${encodeURIComponent(c.id)}"><span>${esc(c.title)}<span class="muted" style="font-size:12px"> · ${esc(c.category || "")}</span></span><span class="muted">›</span></a>`
      ).join("") : '<div class="body muted">暫無課程。可以上面「➕ 開新班」開第一個。</div>';
    }

    async function loadVenues() {
      const vr = await api.get("/coach/venues");
      const vs = (vr.data && vr.data.venues) || [];
      const right = (v) => v.my_status === "active"
        ? '<span class="badge ok">已加入</span>'
        : v.my_status === "pending"
          ? '<span class="badge warn">待審批</span>'
          : `<button class="btn btn-secondary" style="min-height:36px;padding:0 14px" data-join="${esc(v.id)}">申請加入</button>`;
      $("venues").innerHTML = vs.length
        ? vs.map(v => `<div class="cl"><div>${esc(v.name)}<div class="muted" style="font-size:12px">${esc([v.category, v.district].filter(Boolean).join(" · ") || "商戶")}</div></div><div>${right(v)}</div></div>`).join("")
        : '<div class="body muted">暫無商戶。</div>';
      $("venues").querySelectorAll("[data-join]").forEach(b => b.onclick = () => joinVenue(b.dataset.join, b));
    }

    async function joinVenue(id, btn) {
      if (!confirm("申請加入呢個商戶？")) return;
      btn.disabled = true; btn.textContent = "申請中…";
      const r = await api.post("/coach/join-venue", { partner_id: id });
      if (r.ok) { alert("✅ 已提交申請，待商戶審批"); await loadVenues(); }
      else { btn.disabled = false; btn.textContent = "申請加入"; alert((r.data && r.data.error) || "申請失敗"); }
    }
    if (api.requireLogin("coach.html")) load();
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
