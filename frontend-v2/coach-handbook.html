<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="robots" content="noindex" />
  <title>課後成長手冊 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <link rel="stylesheet" href="assets/polish.css?v=1" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    body{background:#F8FAFC;color:#0F172A}
    .hb-wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
    .hb-top{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
    .hb-top h1{font-size:18px;font-weight:900;margin:0}
    .hb-sub{font-size:12px;color:#64748B;margin:2px 0 0}
    .hb-card{background:#fff;border:1.5px solid #E2E8F0;border-radius:14px;padding:14px;margin-bottom:12px}
    .hb-name{font-size:15px;font-weight:800}
    .hb-meta{font-size:11.5px;color:#64748B;margin:2px 0 10px}
    .hb-card textarea{width:100%;min-height:84px;border:1.5px solid #CBD5E1;border-radius:10px;padding:10px;font:inherit;font-size:13px;resize:vertical}
    .hb-card textarea:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.12)}
    .hb-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
    .hb-file{font-size:11px;color:#475569;flex:1;min-width:160px}
    .hb-btn{min-height:42px;border:0;border-radius:10px;background:#059669;color:#fff;font-weight:800;font-size:13px;padding:0 14px;cursor:pointer}
    .hb-btn:disabled{opacity:.55}
    .hb-btn.ghost{background:#fff;border:1.5px solid #CBD5E1;color:#0F172A}
    .hb-done{background:#ECFDF5;border-color:#A7F3D0}
    .hb-hash{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#64748B;word-break:break-all}
    .hb-empty{color:#64748B;font-size:13px;text-align:center;padding:20px}
    .hb-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
    .hb-toast.on{opacity:1}
    .hb-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .hb-photos img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #E2E8F0}
    .hb-note{font-size:11px;color:#64748B;margin-top:8px;line-height:1.5;background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:8px;padding:7px 9px}
    .hb-quick{margin:0 0 12px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:10px 12px}
    .hb-quick-t{font-size:11.5px;font-weight:800;color:#065F46;margin-bottom:7px}
    .hb-quick-row{display:flex;gap:7px;flex-wrap:wrap}
    .hb-qbtn{border:1.5px solid #6EE7B7;background:#fff;color:#065F46;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;cursor:pointer}
    .hb-qbtn:active{transform:translateY(1px)}
    .hb-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
    .hb-tag{border:1.5px solid #CBD5E1;background:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;color:#475569;cursor:pointer}
    .hb-tag.on{background:#DCFCE7;border-color:#6EE7B7;color:#065F46}
    .hb-hw{width:100%;border:1.5px solid #CBD5E1;border-radius:10px;padding:9px 10px;font:inherit;font-size:12.5px;margin-top:6px}
  </style>
</head>
<body>
  <div class="hb-wrap">
    <div class="hb-top">
      <div style="flex:1">
        <h1>📖 課後成長手冊</h1>
        <div class="hb-sub" id="sub">載入中…</div>
      </div>
      <a class="hb-btn ghost" href="coach-dashboard.html" style="text-decoration:none;display:flex;align-items:center">返回</a>
    </div>
    <div class="hb-quick">
      <div class="hb-quick-t">⚡ 快速全班套用（只套用到已出席、未發佈嘅學員）</div>
      <div class="hb-quick-row">
        <button type="button" class="hb-qbtn" data-preset="gait">🌟 步態協調良好</button>
        <button type="button" class="hb-qbtn" data-preset="relax">🧘 深層放鬆完成</button>
      </div>
    </div>
    <div id="list"><div class="hb-empty">載入中…</div></div>
  </div>
  <div class="hb-toast" id="toast"></div>

<script src="assets/api.js?v=10"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const SID = new URLSearchParams(location.search).get("schedule_id") || "";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function fmtT(t) {
    const d = new Date(String(t || "").replace(" ", "T"));
    return isNaN(d) ? String(t || "") : d.toLocaleString("zh-HK", { month: "short", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
  }
  let toastTimer;
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2200); }

  async function readCompressed(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("只支援 JPEG／PNG／WebP");
    const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
    const max = 1000;
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let out = c.toDataURL("image/jpeg", 0.72);
    if (out.length > 1.5 * 1024 * 1024) out = c.toDataURL("image/jpeg", 0.5);
    if (out.length > 1.6 * 1024 * 1024) throw new Error("相片壓縮後仍然過大，請影細張啲");
    return out;
  }

  let STUDENTS = [], BOOKS = {};

  async function load() {
    if (!SID) { $("list").innerHTML = '<div class="hb-empty">缺少 schedule_id</div>'; return; }
    const me = await api.me();
    if (!me.ok) { location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search); return; }
    const r = await api.get("/coach/class-students?schedule_id=" + encodeURIComponent(SID));
    if (!r.ok) { $("list").innerHTML = `<div class="hb-empty">${esc((r.data && r.data.error) || "讀取失敗")}</div>`; return; }
    const sch = r.data.schedule || {};
    STUDENTS = (r.data.students || []).filter((s) => ["confirmed", "attended", "no_show"].includes(s.booking_status));
    $("sub").textContent = `${sch.title || ""} · ${fmtT(sch.start_time)} · ${STUDENTS.length} 位`;
    try {
      const ids = [...new Set(STUDENTS.map((s) => s.user_id).filter(Boolean))];
      const res = await Promise.all(ids.map((id) => api.get("/coach/handbook/students/" + encodeURIComponent(id))));
      res.forEach((hr, i) => {
        const h = (hr.ok && hr.data.handbooks && hr.data.handbooks[0]) || null;
        if (h) BOOKS[ids[i]] = h;
      });
    } catch (e) {}
    render();
  }

  function render() {
    if (!STUDENTS.length) { $("list").innerHTML = '<div class="hb-empty">此班暫時未有學員</div>'; return; }
    $("list").innerHTML = STUDENTS.map((s) => {
      const h = BOOKS[s.user_id];
      const name = s.attendee_type === "child" ? (s.child_name || s.name) : (s.name || "學員");
      const photos = h ? (h.photos || []) : [];
      const selTags = h ? (h.tags || []) : [];
      return `<div class="hb-card ${h ? "hb-done" : ""}" data-bid="${esc(s.id)}" data-sid="${esc(s.user_id)}">
        <div class="hb-name">${esc(name)} ${h ? '<span style="font-size:10.5px;color:#059669;font-weight:800">✅ 已發佈</span>' : ""}</div>
        <div class="hb-meta">${esc(s.phone || "")} · ${esc(s.booking_status)}</div>
        <textarea placeholder="今日表現、進步位、下次練習建議…（最少 2 字）" data-comment>${h ? esc(h.comment) : ""}</textarea>
        <div class="hb-tags">${["握法熟練","步法穩定","力量控制得宜","關節活動度提升","防跌重心穩健","坐站無痛舒緩","呼吸節奏協調"].map((t) => `<button type="button" class="hb-tag ${selTags.includes(t) ? "on" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>
        <input class="hb-hw" placeholder="🏠 回家功課（選填，例如：每日 10 次坐站伸展）" value="${h ? esc(h.homework || "") : ""}" data-hw>
        <div class="hb-photos">${photos.map((p) => `<img src="${esc(p)}" alt="手冊相片">`).join("")}</div>
        <div class="hb-row">
          <input class="hb-file" type="file" accept="image/jpeg,image/png,image/webp" multiple data-file>
          <button class="hb-btn" data-send>${h ? "更新手冊" : "發佈手冊"}</button>
        </div>
        <div class="hb-note">📷 現階段支援最多 3 張動作姿勢照片（自動壓縮）；為保障學員私隱及傳輸效能，短片記錄功能將於下一階段啟用。</div>
        ${h ? `<div class="hb-hash">SHA-256：${esc(h.sha256)}${h.block_id ? " · 區塊：" + esc(String(h.block_id).slice(0, 8)) : ""}</div>` : ""}
      </div>`;
    }).join("");

    $("list").querySelectorAll("[data-send]").forEach((btn) => {
      btn.onclick = async () => {
        const card = btn.closest(".hb-card");
        const bid = card.dataset.bid;
        const comment = card.querySelector("[data-comment]").value.trim();
        if (comment.length < 2) return toast("評語最少 2 字");
        btn.disabled = true; const old = btn.textContent; btn.textContent = "⏳ 發佈中…";
        try {
          const files = Array.from(card.querySelector("[data-file]").files || []).slice(0, 3);
          const photos = [];
          for (const f of files) photos.push(await readCompressed(f));
          const tags = Array.from(card.querySelectorAll(".hb-tag.on")).map((x) => x.dataset.tag);
          const homework = (card.querySelector("[data-hw]") || {}).value || "";
          const r = await api.post("/coach/handbook/log", { session_id: SID, student_id: card.dataset.sid, comment, tags, homework, photos });
          if (r.ok) {
            toast(`✅ 已發佈${r.data.updated ? "（更新）" : ""} · ${String(r.data.sha256).slice(0, 10)}…`);
            const hr = await api.get("/coach/handbook/students/" + encodeURIComponent(card.dataset.sid));
            if (hr.ok && hr.data.handbooks && hr.data.handbooks[0]) BOOKS[card.dataset.sid] = hr.data.handbooks[0];
            render();
          } else {
            toast("❌ " + ((r.data && r.data.error) || "發佈失敗"));
          }
        } catch (e) {
          toast("❌ " + (e.message || "相片處理失敗"));
        } finally {
          btn.disabled = false; btn.textContent = old;
        }
      };
    });
    $("list").querySelectorAll(".hb-tag").forEach((t) => { t.onclick = () => t.classList.toggle("on"); });

    // ⚡ 快速全班套用：只影響已出席、未發佈嘅學員
    const PRESETS = {
      gait: { tags: ["步法穩定", "關節活動度提升"], comment: "今日全班步態協調表現良好，關節活動度有明顯進步，繼續保持。" },
      relax: { tags: ["關節活動度提升", "坐站無痛舒緩"], comment: "今日完成全身深層放鬆，坐站動作暢順，回家記得做溫和伸展。" },
    };
    document.querySelectorAll(".hb-qbtn").forEach((btn) => {
      btn.onclick = () => {
        const p = PRESETS[btn.dataset.preset];
        if (!p) return;
        let n = 0;
        STUDENTS.forEach((s) => {
          if (s.booking_status !== "attended" || BOOKS[s.user_id]) return;
          const card = document.querySelector(`.hb-card[data-bid="${s.id}"]`);
          if (!card) return;
          card.querySelectorAll(".hb-tag").forEach((t) => { if (p.tags.includes(t.dataset.tag)) t.classList.add("on"); });
          const ta = card.querySelector("[data-comment]");
          if (ta && !ta.value.trim()) ta.value = p.comment;
          n++;
        });
        toast(n ? `✅ 已套用到 ${n} 位學員，請個別微調後發佈` : "冇可套用嘅學員（需先完成簽到）");
      };
    });
  }

  load();
</script>
</body>
</html>
