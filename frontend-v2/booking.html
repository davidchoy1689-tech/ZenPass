<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>預約 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css" />
</head>
<body>
  <div class="topbar"><a class="back" href="javascript:history.back()">‹</a><div class="title" id="title">預約</div><div style="margin-left:auto" class="price" id="topPrice"></div></div>

  <div class="stepper">
    <div class="step active" id="s1"><span class="dot">1</span>選時段</div>
    <div class="line"></div>
    <div class="step" id="s2"><span class="dot">2</span>確認</div>
    <div class="line"></div>
    <div class="step" id="s3"><span class="dot">3</span>付款</div>
  </div>

  <div class="wrap">
    <section id="step1">
      <div class="section-title">選擇時段</div>
      <div class="stack" id="slots"><div class="card"><div class="body muted">載入中…</div></div></div>
      <div class="spacer"></div>
      <button class="btn btn-primary btn-block" id="toStep2">下一步：確認</button>
    </section>

    <section id="step2" class="hide">
      <div class="section-title">確認預約</div>
      <div class="card" id="summary"></div>
      <div class="spacer"></div>
      <div class="banner">ℹ️ 開課前一日可自由取消（退回 credit）</div>
      <div class="section-title">付款方式</div>
      <div class="stack">
        <label class="card"><div class="body" style="display:flex;justify-content:space-between;align-items:center">
          <span>🎫 用 Credit 扣</span><input type="radio" name="pm" value="credits" checked /></div></label>
        <label class="card"><div class="body" style="display:flex;justify-content:space-between;align-items:center">
          <span>💳 信用卡 / FPS / PayMe</span><input type="radio" name="pm" value="single" /></div></label>
      </div>
      <div class="spacer"></div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-muted)">
        <input type="checkbox" id="consent" />
        <span>我明白如缺席（no-show）會按政策收取 penalty credits。</span>
      </label>
      <div class="spacer"></div>
      <div class="card"><div class="body">
        <div class="muted" style="font-size:13px;margin-bottom:6px">優惠碼（可選，適用於信用卡/FPS）</div>
        <div style="display:flex;gap:8px">
          <input id="promo" placeholder="輸入優惠碼" style="flex:1;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--text)" />
          <button class="btn btn-secondary" id="applyPromo">套用</button>
        </div>
        <div id="promoMsg" class="muted" style="font-size:12px;margin-top:6px"></div>
      </div></div>
      <div class="spacer"></div>
      <div class="grid2">
        <button class="btn btn-secondary" id="back1">上一步</button>
        <button class="btn btn-primary" id="toStep3">確認付款</button>
      </div>
    </section>

    <section id="step3" class="hide">
      <div class="banner" id="holdBanner">⏳ 名額已為你保留 · <b id="countdown">15:00</b></div>
      <div class="section-title">付款</div>
      <div class="card" id="paySummary"></div>
      <div class="spacer"></div>
      <button class="btn btn-primary btn-block" id="payNow">立即確認預約</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-block" id="back2">返回</button>
    </section>

    <section id="done" class="hide center">
      <div style="font-size:56px;margin:24px 0 8px" id="doneIcon">✅</div>
      <h2 style="margin:0 0 6px" id="doneTitle">預約成功！</h2>
      <p class="muted" id="doneMsg"></p>
      <div class="card" style="text-align:left;margin-top:16px" id="doneInfo"></div>
      <div class="spacer"></div>
      <a class="btn btn-primary btn-block" href="my-bookings.html">去我的預約</a>
      <div class="spacer"></div>
      <a class="btn btn-secondary btn-block" href="index.html">返回主頁</a>
    </section>
  </div>

  <script src="assets/api.js"></script>
  <script>
    const $ = (x) => document.getElementById(x);
    const show = (x) => ["step1","step2","step3","done"].forEach(s => $(s).classList.toggle("hide", s !== x));
    const setStep = (n) => [1,2,3].forEach(i => { $( "s"+i).classList.toggle("active", i===n); $( "s"+i).classList.toggle("done", i<n); });
    const params = new URLSearchParams(location.search);
    const classId = params.get("id");
    let scheduleId = params.get("sid") || "";
    let cls = null, schedules = [];
    let promoFinal = null;

    if (!api.requireLogin("booking.html" + location.search)) { /* redirected */ }
    else (async () => {
      if (!classId) { $("slots").innerHTML = `<div class="card"><div class="body">缺少課程。</div></div>`; return; }
      const r = await api.get("/classes/" + encodeURIComponent(classId));
      cls = r.data && r.data.class;
      schedules = ((r.data && r.data.schedules) || []).filter(s => s.status !== "cancelled" && (s.max_participants - s.enrolled_count) > 0);
      if (!cls) { $("slots").innerHTML = `<div class="card"><div class="body">搵唔到課程。</div></div>`; return; }
      $("title").textContent = cls.title;
      $("topPrice").innerHTML = cr(cls.price_hkd) + "cr";
      if (!scheduleId && schedules[0]) scheduleId = schedules[0].id;
      renderSlots();
    })();

    function renderSlots() {
      $("slots").innerHTML = schedules.length ? schedules.map(s => {
        const left = (s.max_participants||0) - (s.enrolled_count||0);
        return `<div class="card slot2" data-sid="${esc(s.id)}" style="border-color:${s.id===scheduleId?'var(--brand-500)':'var(--border)'}">
          <div class="body" style="display:flex;justify-content:space-between"><span>${fmtTime(s.start_time)}</span><span class="badge ok">剩 ${left} 位</span></div></div>`;
      }).join("") : `<div class="card"><div class="body muted">暫無可預約時段。</div></div>`;
      document.querySelectorAll(".slot2").forEach(el => el.onclick = () => { scheduleId = el.dataset.sid; renderSlots(); });
    }
    function chosen() { return schedules.find(s => s.id === scheduleId); }

    $("toStep2").onclick = () => {
      if (!scheduleId) { alert("請揀一個時段"); return; }
      const s = chosen();
      $("summary").innerHTML = `
        <div class="row"><span class="k">課程</span><span class="v">${esc(cls.title)}</span></div>
        <div class="row"><span class="k">時間</span><span class="v">${fmtTime(s.start_time)}</span></div>
        <div class="row"><span class="k">地點</span><span class="v">${esc(cls.venue_name || "-")}</span></div>
        <div class="row"><span class="k">價錢</span><span class="v">${cr(cls.price_hkd)} credits / ${hkd(cls.price_hkd)}</span></div>`;
      show("step2"); setStep(2);
    };
    $("back1").onclick = () => { show("step1"); setStep(1); };
    $("applyPromo").onclick = async () => {
      const code = $("promo").value.trim();
      const msg = $("promoMsg");
      if (!code) { msg.textContent = "請輸入優惠碼"; return; }
      msg.textContent = "檢查中…";
      const r = await api.get("/promo/validate?code=" + encodeURIComponent(code) + "&class_id=" + encodeURIComponent(classId));
      if (r.ok && r.data && r.data.success) {
        promoFinal = { code: code.toUpperCase(), final_price: r.data.final_price };
        msg.innerHTML = `✅ 已套用 · 折後 <b>${hkd(r.data.final_price)}</b>（省 ${hkd(r.data.discount)}）`;
      } else {
        promoFinal = null;
        msg.textContent = "❌ " + ((r.data && r.data.error) || "優惠碼無效");
      }
    };
    $("toStep3").onclick = () => {
      if (!$("consent").checked) { alert("請先同意缺席政策"); return; }
      const pm = document.querySelector("input[name=pm]:checked").value;
      let acc;
      if (pm === "credits") acc = cr(cls.price_hkd) + " credits";
      else if (promoFinal) acc = hkd(promoFinal.final_price) + " <small class='muted'>（已用優惠碼）</small>";
      else acc = hkd(cls.price_hkd);
      $("paySummary").innerHTML = `<div class="row"><span class="k">應付</span><span class="v" style="color:var(--brand-600)">${acc}</span></div>`;
      $("holdBanner").style.display = pm === "credits" ? "none" : "flex";
      show("step3"); setStep(3);
    };
    $("back2").onclick = () => { show("step2"); setStep(2); };

    $("payNow").onclick = async () => {
      const pm = document.querySelector("input[name=pm]:checked").value;
      const btn = $("payNow"); btn.disabled = true; btn.textContent = "處理中…";
      const payload = { scheduleId, classId, paymentType: pm, penaltyConsent: true };
      if (promoFinal) payload.promo_code = promoFinal.code;
      const r = await api.post("/bookings", payload);
      btn.disabled = false;
      if (r.status === 201 || r.ok) {
        const b = r.data || {};
        const ref = b.booking_reference || b.booking_id || b.bookingId || "";
        const pending = b.status === "pending_payment" || b.requires_payment;
        $("doneIcon").textContent = pending ? "💳" : "✅";
        $("doneTitle").textContent = pending ? "預約已建立，待付款" : "預約成功！";
        $("doneMsg").textContent = ref ? ("預約號 " + ref) : "";
        $("doneInfo").innerHTML = `<div class="row"><span class="k">時間</span><span class="v">${fmtTime(chosen().start_time)}</span></div>
          <div class="row"><span class="k">課程</span><span class="v">${esc(cls.title)}</span></div>`;
        show("done");
      } else {
        const msg = (r.data && (r.data.error || r.data.message)) || "預約失敗";
        if (r.status === 401) { location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search); return; }
        alert(msg);
      }
    };
  </script>
</body>
</html>
