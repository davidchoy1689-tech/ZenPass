<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>預約 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=10" />
  <style>
    .sess { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); }
    .sess:last-child { border-bottom:0; }
    .sess .t { flex:1; }
    .sess .t small { color:var(--text-muted); display:block; }
    .sess input[type=checkbox]{ width:20px; height:20px; }
    .monthbar { display:flex; justify-content:space-between; align-items:center; margin:16px 0 6px; }
    .monthbar b { font-size:15px; }
    .monthbar button { background:none; border:0; color:var(--brand-600); font-weight:700; font:inherit; cursor:pointer; }
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="javascript:history.back()">‹</a><div class="title" id="title">預約</div><div style="margin-left:auto" class="price" id="topPrice"></div></div>

  <div class="stepper">
    <div class="step active" id="s1"><span class="dot">1</span>選班別/堂數</div>
    <div class="line"></div>
    <div class="step" id="s2"><span class="dot">2</span>確認</div>
    <div class="line"></div>
    <div class="step" id="s3"><span class="dot">3</span>付款</div>
  </div>

  <div class="wrap" style="padding-bottom:110px">
    <section id="step1">
      <p class="muted" style="font-size:13px">預設已選該月全部堂數；如有人缺席，可取消勾選減少堂數。</p>
      <div class="card" id="courseInfo"></div>
      <div class="spacer"></div>
      <div class="hscroll" id="banchips"></div>
      <div id="groups"></div>
    </section>

    <section id="step2" class="hide">
      <div class="section-title">確認預約</div>
      <div class="card" id="summary"></div>
      <div class="spacer"></div>
      <div class="banner">ℹ️ 開課前一日可自由取消（退回 credit）</div>
      <div class="section-title">付款方式</div>
      <div class="stack">
        <label class="card"><div class="body" style="display:flex;justify-content:space-between;align-items:center">
          <span>🎫 用 Credit 扣</span><input type="radio" name="pm" value="credits" checked /></div></label>
        <label class="card"><div class="body" style="display:flex;justify-content:space-between;align-items:center">
          <span>💳 信用卡 / FPS / PayMe</span><input type="radio" name="pm" value="single" /></div></label>
      </div>
      <div class="spacer"></div>
      <div class="card"><div class="body">
        <div class="muted" style="font-size:13px;margin-bottom:6px">優惠碼（可選）</div>
        <div style="display:flex;gap:8px">
          <input id="promo" placeholder="輸入優惠碼" style="flex:1;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--text)" />
          <button class="btn btn-secondary" id="applyPromo">套用</button>
        </div>
        <div id="promoMsg" class="muted" style="font-size:12px;margin-top:6px"></div>
      </div></div>
      <div class="spacer"></div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-muted)">
        <input type="checkbox" id="consent" />
        <span>我明白如缺席（no-show）會按政策收取 penalty credits。</span>
      </label>
      <div class="spacer"></div>
      <div class="grid2">
        <button class="btn btn-secondary" id="back1">上一步</button>
        <button class="btn btn-primary" id="toStep3">確認付款</button>
      </div>
    </section>

    <section id="step3" class="hide">
      <div class="banner" id="holdBanner">⏳ 名額已為你保留 · <b id="countdown">15:00</b></div>
      <div class="section-title">付款</div>
      <div class="card" id="paySummary"></div>
      <div class="spacer"></div>
      <button class="btn btn-primary btn-block" id="payNow">立即確認預約</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-block" id="back2">返回</button>
    </section>

    <section id="pay" class="hide">
      <div class="banner" id="payBanner">⏳ 名額已為你保留，請於 <b id="payCountdown">15:00</b> 內完成付款</div>
      <div class="section-title">付款</div>
      <div class="card" id="paySummary2"></div>
      <div class="spacer"></div>
      <div class="hscroll" id="payTabs"></div>
      <div id="payPanels"></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-block" id="backFromPay">返回</button>
    </section>

    <section id="done" class="hide center">
      <div style="font-size:56px;margin:24px 0 8px" id="doneIcon">✅</div>
      <h2 style="margin:0 0 6px" id="doneTitle">預約完成！</h2>
      <p class="muted" id="doneMsg"></p>
      <div class="spacer"></div>
      <a class="btn btn-primary btn-block" href="my-bookings.html">去我的預約</a>
      <div class="spacer"></div>
      <a class="btn btn-secondary btn-block" href="index.html">返回主頁</a>
    </section>
  </div>

  <div id="bar" class="cta" style="display:none">
    <div><div id="barTotal" style="font-weight:800;color:var(--brand-600);font-size:18px">—</div>
      <div class="muted" style="font-size:12px" id="barCount">已選 0 堂</div></div>
    <button class="btn btn-primary" style="flex:1" id="barNext">下一步</button>
  </div>

  <script src="assets/holidays.js"></script>
  <script src="assets/api.js"></script>
  <script>
    const $ = (x) => document.getElementById(x);
    const show = (x) => ["step1","step2","step3","pay","done"].forEach(s => $(s).classList.toggle("hide", s !== x));
    const setStep = (n) => [1,2,3].forEach(i => { $("s"+i).classList.toggle("active", i===n); $("s"+i).classList.toggle("done", i<n); });
    const params = new URLSearchParams(location.search);
    const classId = params.get("id");
    let cls = null, sessions = [], sel = new Set(), promoFinal = null, ban = "A";
    let payIds = [], payUnit = 0, payMethod = "fps", cdTimer = null;

    const banOf = (s) => (s.notes||"").includes("A班") ? "A" : (s.notes||"").includes("B班") ? "B" : "全";
    const monthKey = (iso) => { const d = new Date(iso); return d.getFullYear() + "年" + (d.getMonth()+1) + "月"; };
    const unit = () => (promoFinal ? promoFinal.final_price : (cls ? cls.price_hkd : 0));
    const visible = () => sessions.filter(s => ban === "all" || banOf(s) === ban);

    if (api.requireLogin("booking.html" + location.search)) (async () => {
      if (!classId) { $("groups").innerHTML = `<div class="card"><div class="body">缺少課程。</div></div>`; return; }
      const r = await api.get("/classes/" + encodeURIComponent(classId));
      cls = r.data && r.data.class;
      sessions = ((r.data && r.data.schedules) || []).filter(s => s.status !== "cancelled" && (s.max_participants - s.enrolled_count) > 0 && !(window.zpIsHoliday && zpIsHoliday(s.start_time)));
      if (!cls) { $("groups").innerHTML = `<div class="card"><div class="body">搵唔到課程。</div></div>`; return; }
      $("title").textContent = cls.title;
      $("topPrice").innerHTML = cr(cls.price_hkd) + "cr";
      const _loc = [cls.venue_name, cls.venue_address].filter(Boolean).join("（") + (cls.venue_name && cls.venue_address ? "）" : "");
      $("courseInfo").innerHTML = `<div class="body">
        <div class="row"><span class="k">📍 地點</span><span class="v">${esc(_loc || "待定")}</span></div>
        <div class="row"><span class="k">📅 對象</span><span class="v">${esc(cls.target_audience || "—")}</span></div>
        <div class="row"><span class="k">👥 人數上限</span><span class="v">${esc(cls.max_participants || "-")} 人</span></div>
        <div class="row"><span class="k">⏱ 時長</span><span class="v">${esc(cls.duration || "-")} 分鐘</span></div>
        ${cls.description ? `<div class="muted" style="font-size:13px;margin-top:8px">${esc(cls.description)}</div>` : ""}
      </div>`;
      // 預設：A班 + 選足最近一個月
      const hasA = sessions.some(s => banOf(s) === "A");
      ban = hasA ? "A" : (sessions.some(s => banOf(s) === "B") ? "B" : "all");
      renderChips();
      defaultSelectFirstMonth();
      render();
    })();

    function renderChips() {
      const hasA = sessions.some(s => banOf(s) === "A");
      const hasB = sessions.some(s => banOf(s) === "B");
      const el = $("banchips");
      // 班別已拆成獨立課程時，冇需要再分 — 隱藏班別 chips
      if (!hasA && !hasB) { el.innerHTML = ""; el.style.display = "none"; return; }
      el.style.display = "";
      const opts = [["A","A班（星期二）"],["B","B班（星期四）"],["all","全部"]].filter(([k]) => k==="all" || sessions.some(s=>banOf(s)===k));
      el.innerHTML = opts.map(([k,l]) => `<span class="chip ${ban===k?"on":""}" data-ban="${k}">${l}</span>`).join("");
      document.querySelectorAll("#banchips .chip").forEach(c => c.onclick = () => { sel.clear(); ban = c.dataset.ban; renderChips(); defaultSelectFirstMonth(); render(); });
    }
    function defaultSelectFirstMonth() {
      const vis = visible().slice().sort((a,b)=>a.start_time.localeCompare(b.start_time));
      if (!vis.length) return;
      const m0 = monthKey(vis[0].start_time);
      vis.filter(s => monthKey(s.start_time) === m0).forEach(s => sel.add(s.id));
    }

    function render() {
      const vis = visible();
      const byM = {};
      vis.forEach(s => { (byM[monthKey(s.start_time)] ||= []).push(s); });
      const months = Object.keys(byM);
      $("groups").innerHTML = months.length ? months.map(m => `
        <div class="monthbar"><b>${esc(m)} · ${byM[m].length} 堂</b><button data-month="${esc(m)}">全選 / 取消</button></div>
        <div class="card">${byM[m].map(s => `
          <label class="sess"><input type="checkbox" data-sid="${esc(s.id)}" ${sel.has(s.id)?"checked":""} />
            <span class="t">${fmtTime(s.start_time)}<small>${s.notes ? esc(s.notes) + " · " : ""}剩 ${(s.max_participants-s.enrolled_count)} 位</small></span>
          </label>`).join("")}</div>`).join("")
        : `<div class="card"><div class="body muted">暫無可預約時段。</div></div>`;

      document.querySelectorAll("input[data-sid]").forEach(cb => cb.onchange = () => {
        cb.checked ? sel.add(cb.dataset.sid) : sel.delete(cb.dataset.sid); updateBar(); });
      document.querySelectorAll(".monthbar button").forEach(b => b.onclick = () => {
        const list = byM[b.dataset.month]; const allOn = list.every(s => sel.has(s.id));
        list.forEach(s => allOn ? sel.delete(s.id) : sel.add(s.id)); render(); });
      updateBar();
    }
    function updateBar() {
      const n = sel.size;
      $("barCount").textContent = "已選 " + n + " 堂";
      $("barTotal").innerHTML = n ? (cr(unit()*n) + "cr <span class='muted' style='font-weight:500;font-size:12px'>/ " + hkd(unit()*n) + "</span>") : "—";
      $("bar").style.display = ($("step1").classList.contains("hide") ? "none" : "flex");
    }

    $("barNext").onclick = () => {
      if (!sel.size) { alert("請揀最少一堂"); return; }
      const chosen = sessions.filter(s => sel.has(s.id)).sort((a,b)=>a.start_time.localeCompare(b.start_time));
      $("summary").innerHTML = `<div class="row"><span class="k">課程</span><span class="v">${esc(cls.title)}</span></div>
        <div class="row"><span class="k">地點</span><span class="v">${esc(cls.venue_name || "—")}</span></div>
        <div class="row"><span class="k">對象</span><span class="v">${esc(cls.target_audience || "—")}</span></div>
        <div class="row"><span class="k">堂數</span><span class="v">${chosen.length} 堂</span></div>`
        + chosen.map(s => `<div class="row"><span class="k">${fmtTime(s.start_time)}</span><span class="v muted">${esc(s.notes||"")}</span></div>`).join("");
      show("step2"); setStep(2); updateBar();
    };
    $("toStep3").onclick = () => {
      if (!$("consent").checked) { alert("請先同意缺席政策"); return; }
      const pm = document.querySelector("input[name=pm]:checked").value;
      const n = sel.size;
      const unitPrice = promoFinal ? promoFinal.final_price : cls.price_hkd;
      const promoTag = promoFinal ? " <small class='muted'>（已用優惠碼）</small>" : "";
      let acc = pm === "credits" ? (cr(unitPrice*n) + " credits" + promoTag)
        : (hkd(unitPrice*n) + promoTag);
      $("paySummary").innerHTML = `<div class="row"><span class="k">堂數</span><span class="v">${n} 堂</span></div>
        <div class="row"><span class="k">應付</span><span class="v" style="color:var(--brand-600)">${acc}</span></div>`;
      $("holdBanner").style.display = pm === "credits" ? "none" : "flex";
      show("step3"); setStep(3); updateBar();
    };
    $("back1").onclick = () => { show("step1"); setStep(1); updateBar(); };
    $("back2").onclick = () => { show("step2"); setStep(2); };
    $("applyPromo").onclick = async () => {
      const code = $("promo").value.trim(); const msg = $("promoMsg");
      if (!code) { msg.textContent = "請輸入優惠碼"; return; }
      msg.textContent = "檢查中…";
      const pvUrl = `/promo/validate?code=${encodeURIComponent(code)}&class_id=${encodeURIComponent(classId)}`;
      const r = await api.get(pvUrl);
      if (r.ok && r.data && r.data.success) {
        promoFinal = { code: code.toUpperCase(), final_price: r.data.final_price };
        msg.innerHTML = `✅ 已套用 · 每堂折後 <b>${hkd(r.data.final_price)}</b>（總額會用折後價）`;
      } else { promoFinal = null; msg.textContent = "❌ " + ((r.data && r.data.error) || "優惠碼無效"); }
      if (typeof updateBar === "function") updateBar();
    };

    $("payNow").onclick = async () => {
      const pm = document.querySelector("input[name=pm]:checked").value;
      const items = sessions.filter(s => sel.has(s.id)).map(s => ({
        scheduleId: s.id, classId, paymentType: pm, penaltyConsent: true,
        promoCode: promoFinal ? promoFinal.code : undefined,
      }));
      const btn = $("payNow"); btn.disabled = true; btn.textContent = "處理中…";
      const r = await api.post("/bookings/batch", { items });
      btn.disabled = false; btn.textContent = "立即確認預約";
      if (r.ok && r.data && r.data.success) {
        const d = r.data;
        const created = (d.results || []).filter(x => x.status === 201);
        const resumable = (d.results || []).filter(x => x.status === 200 && x.body && x.body.requires_payment);
        if (pm === "single" && (created.length || resumable.length)) {
          // 信用卡/FPS/PayMe：booking 係 pending_payment，要完成付款（含未完成付款嘅舊 booking）
          startPayStep(created.concat(resumable).map(x => x.body.booking_id), unitForPay());
        } else {
          $("doneIcon").textContent = d.created ? "✅" : "⚠️";
          $("doneTitle").textContent = d.created + " / " + d.total + " 堂預約成功";
          const failed = (d.results || []).filter(x => x.status !== 201).length;
          $("doneMsg").textContent = failed ? (failed + " 堂未能預約（可能已滿或重複）") : "全部預約成功 🎉";
          show("done"); $("bar").style.display = "none";
        }
      } else if (r.status === 401 || r.status === 403) {
        alert("登入已過期，請重新登入");
        location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search);
      } else {
        alert((r.data && (r.data.error || r.data.message)) || "預約失敗");
      }
    };

    function unitForPay(){ return promoFinal ? promoFinal.final_price : cls.price_hkd; }
    function startPayStep(ids, unit){
      payIds = ids; payUnit = unit; payMethod = "fps";
      $("paySummary2").innerHTML = `<div class="row"><span class="k">堂數</span><span class="v">${ids.length} 堂</span></div>
        <div class="row"><span class="k">應付</span><span class="v" style="color:var(--brand-600)">${hkd(unit*ids.length)}</span></div>`;
      renderPayTabs();
      show("pay"); setStep(3); $("bar").style.display = "none";
      startCountdown();
    }
    function renderPayTabs(){
      const opts=[["fps","轉數快 FPS"],["payme","PayMe"],["card","信用卡"]];
      $("payTabs").innerHTML = opts.map(([k,l])=>`<span class="chip ${payMethod===k?'on':''}" data-pm="${k}">${l}</span>`).join("");
      document.querySelectorAll("#payTabs .chip").forEach(c=>c.onclick=()=>{ payMethod=c.dataset.pm; renderPayTabs(); });
      renderPayPanel();
    }
    function renderPayPanel(){
      const input = `<input id="payRef" placeholder="輸入${payMethod==="fps"?" FPS ":" PayMe "}參考編號" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--text)" />`;
      if(payMethod==="fps"){
        $("payPanels").innerHTML = `<div class="card"><div class="body">
          <p class="muted" style="font-size:13px;margin:0 0 8px">請用「轉數快 FPS」轉賬至：</p>
          <p style="font-weight:800;font-size:20px;margin:0">9033 5538</p>
          <p class="muted" style="font-size:12px;margin:4px 0 12px">收款：ZenPass（HSBC）</p>
          ${input}<div style="height:10px"></div>
          <button class="btn btn-primary btn-block" id="paySubmit">我已付款，提交核實</button>
        </div></div>`;
      } else if(payMethod==="payme"){
        $("payPanels").innerHTML = `<div class="card"><div class="body">
          <p class="muted" style="font-size:13px;margin:0 0 8px">請用「PayMe」付款至：</p>
          <p style="font-weight:800;font-size:20px;margin:0">9492 5828</p>
          <p class="muted" style="font-size:12px;margin:4px 0 12px">備註：ZenPass 課程</p>
          ${input}<div style="height:10px"></div>
          <button class="btn btn-primary btn-block" id="paySubmit">我已付款，提交核實</button>
        </div></div>`;
      } else {
        $("payPanels").innerHTML = `<div class="card"><div class="body">
          <p class="muted" style="font-size:13px;margin:0 0 12px">信用卡（Stripe 安全付款）</p>
          <button class="btn btn-primary btn-block" id="payCard">前往信用卡付款</button>
        </div></div>`;
      }
      const sub=$("paySubmit"); if(sub) sub.onclick=submitManualPay;
      const cd=$("payCard"); if(cd) cd.onclick=payByCard;
    }
    async function submitManualPay(){
      const ref=$("payRef").value.trim(); if(!ref){ alert("請輸入參考編號"); return; }
      const btn=$("paySubmit"); btn.disabled=true; btn.textContent="提交中…";
      let ok=0;
      for(const id of payIds){
        const body={ booking_id:id, amount:payUnit };
        if(payMethod==="fps") body.fps_reference=ref; else body.payme_reference=ref;
        const r = await api.post("/payments/"+payMethod, body);
        if(r.ok) ok++;
      }
      if(ok){ payDone(payMethod==="fps"?"轉數快":"PayMe"); }
      else { btn.disabled=false; btn.textContent="我已付款，提交核實"; alert("提交失敗，請重試"); }
    }
    async function payByCard(){
      const r = await api.post("/payments/stripe/create-checkout", { amount: payUnit*payIds.length, booking_id: payIds[0], description: (cls?cls.title:"ZenPass 課程") });
      if(r.ok && r.data && r.data.checkout_url){ location.href = r.data.checkout_url; }
      else if(r.data && r.data.dev_mode){ alert("信用卡測試模式未開放，請改用轉數快或 PayMe 完成付款。"); }
      else { alert((r.data&&r.data.error)||"信用卡暫不可用"); }
    }
    function payDone(label){
      stopCountdown();
      $("doneIcon").textContent="✅";
      $("doneTitle").textContent = label+" 資料已提交";
      $("doneMsg").textContent = "管理員核實後，預約會轉為「已確認」。你可喺「我的預約」睇最新狀態。";
      show("done");
    }
    function startCountdown(){
      stopCountdown();
      let s=15*60; const el=$("payCountdown"); const p=n=>String(n).padStart(2,"0");
      el.textContent="15:00";
      cdTimer=setInterval(()=>{ s--; if(s<0){ stopCountdown(); el.textContent="00:00"; return; } el.textContent=p(Math.floor(s/60))+":"+p(s%60); },1000);
    }
    function stopCountdown(){ if(cdTimer){ clearInterval(cdTimer); cdTimer=null; } }
    $("backFromPay").onclick = () => { stopCountdown(); show("step3"); setStep(3); };
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
