<!doctype html>
<html lang="zh-HK"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ff6b35" /><title>帳戶設定 · ZenPass 禪流</title>
<link rel="stylesheet" href="assets/v2.css?v=26" />
  <link rel="stylesheet" href="assets/polish.css?v=1" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
<style>input.field{border:1px solid var(--border);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;font:inherit;background:var(--surface);color:var(--text)}.lbl{font-size:13px;color:var(--text-muted);margin:0 0 6px}</style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">帳戶設定</div></div>
  <div class="wrap">
    <div id="phoneWarn" class="card" style="display:none;border:1.5px solid #f59e0b;margin-bottom:12px"><div class="body">
      <b>⚠️ 仲未填電話號碼</b>
      <div class="muted" style="font-size:13px;margin-top:4px">教練需要電話聯絡你（例如天氣取消、遲到安排）。請補填 8 位香港電話。</div>
    </div></div>
    <div class="section-title">個人資料</div>
    <div class="card"><div class="body" style="display:flex;flex-direction:column;gap:12px">
      <div><div class="lbl">姓名</div><input class="field" id="name" placeholder="姓名" /></div>
      <div><div class="lbl">電話（必填）</div><input class="field" id="phone" type="tel" inputmode="tel" placeholder="8 位香港電話" /></div>
      <div><div class="lbl">電郵</div><input class="field" id="email" disabled /></div>
      <details>
        <summary style="cursor:pointer;font-weight:700;font-size:13px">＋ 更多資料（選填）</summary>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">
          <div><div class="lbl">出生年份</div><input class="field" id="birthYear" inputmode="numeric" maxlength="4" placeholder="例如 1990" /></div>
          <div><div class="lbl">性別</div>
            <select class="field" id="gender">
              <option value="">未填</option>
              <option value="female">女</option>
              <option value="male">男</option>
              <option value="other">其他</option>
              <option value="na">不願透露</option>
            </select>
          </div>
          <div><div class="lbl">緊急聯絡人姓名</div><input class="field" id="emName" placeholder="選填" /></div>
          <div><div class="lbl">緊急聯絡人電話</div><input class="field" id="emPhone" type="tel" inputmode="tel" placeholder="選填" /></div>
          <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4">
            <input type="checkbox" id="health" style="margin-top:3px" />
            <span>我確認身體狀況適合參與運動課堂，並已閱讀<a href="waiver.html" style="color:var(--brand-600)">免責聲明</a>。</span>
          </label>
        </div>
      </details>
      <button class="btn btn-primary btn-block" id="save">儲存</button>
      <div id="msg" class="muted center" style="font-size:13px"></div>
    </div></div>

    <div class="section-title">更改密碼</div>
    <div class="card" id="upgradeCard" style="display:none;border:1.5px solid #f59e0b;margin-bottom:12px"><div class="body" style="display:flex;flex-direction:column;gap:10px">
      <b>🔐 設定登入電郵同密碼</b>
      <div class="muted" style="font-size:13px">你係用 QR 極速登記。設定之後，換電話／換機都可以用電郵登入。</div>
      <input class="field" id="upEmail" type="email" placeholder="你的電郵" autocomplete="username" />
      <input class="field" id="upPw" type="password" placeholder="設定密碼（至少 8 位，含字母及數字）" autocomplete="new-password" />
      <button class="btn btn-primary btn-block" id="upSave">設定登入資料</button>
      <div id="upMsg" class="muted center" style="font-size:13px"></div>
    </div></div>

    <div class="card"><div class="body" style="display:flex;flex-direction:column;gap:12px">
      <div><div class="lbl">新密碼（至少 6 位）</div><input class="field" id="npw" type="password" autocomplete="new-password" /></div>
      <div><div class="lbl">確認新密碼</div><input class="field" id="npw2" type="password" autocomplete="new-password" /></div>
      <button class="btn btn-secondary btn-block" id="chpw">更新密碼</button>
      <div id="pwmsg" class="muted center" style="font-size:13px"></div>
    </div></div>

    <div class="spacer"></div>
    <div class="card menu"><a href="javascript:api.logout()"><span>🚪 登出</span><span class="muted">›</span></a></div>
    <div class="spacer"></div>
  </div>
  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>
  <script src="assets/api.js?v=3"></script>
  <script>
    async function load() {
      const r = await api.get("/users/me");
      const u = (r.data && (r.data.user || r.data)) || {};
      document.getElementById("name").value = u.name || "";
      document.getElementById("phone").value = u.phone || "";
      document.getElementById("email").value = u.email || "";
      document.getElementById("birthYear").value = u.birth_year || "";
      document.getElementById("gender").value = u.gender || "";
      document.getElementById("emName").value = u.emergency_name || "";
      document.getElementById("emPhone").value = u.emergency_phone || "";
      document.getElementById("health").checked = Number(u.health_declared) === 1;
      if (!u.phone) document.getElementById("phoneWarn").style.display = "block";
      // QR 極速登記帳號：email 係佔位地址 → 提示設定真電郵＋密碼
      if (u.email && String(u.email).endsWith("@phone.zenpass.local")) {
        document.getElementById("upgradeCard").style.display = "block";
      }
    }
    document.getElementById("save").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const birth_year = document.getElementById("birthYear").value.trim();
      const gender = document.getElementById("gender").value;
      const emergency_name = document.getElementById("emName").value.trim();
      const emergency_phone = document.getElementById("emPhone").value.trim();
      const health_declared = document.getElementById("health").checked;
      const msg = document.getElementById("msg");
      if (!name) { msg.textContent = "請輸入姓名"; return; }
      const digits = phone.replace(/\D/g, "").replace(/^852/, "").replace(/^0/, "");
      if (!digits) { msg.textContent = "請填寫電話號碼"; return; }
      if (digits.length !== 8) { msg.textContent = "電話號碼格式不正確（香港 8 位數字）"; return; }
      const btn = document.getElementById("save"); btn.disabled = true; btn.textContent = "儲存中…";
      const r = await api.put("/users/profile", {
        name, phone: digits, birth_year, gender, emergency_name, emergency_phone, health_declared,
      });
      btn.disabled = false; btn.textContent = "儲存";
      msg.textContent = (r.ok && r.data) ? "✅ 資料已更新" : "❌ " + ((r.data && r.data.error) || "更新失敗");
      if (r.ok) {
        const u = api.getUser() || {}; u.name = name; u.phone = digits; api.setUser(u);
        document.getElementById("phoneWarn").style.display = "none";
      }
    };
    document.getElementById("upSave").onclick = async () => {
      const email = document.getElementById("upEmail").value.trim();
      const pw = document.getElementById("upPw").value;
      const msg = document.getElementById("upMsg");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = "電郵格式不正確"; return; }
      if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) { msg.textContent = "密碼至少 8 位，並需含字母及數字"; return; }
      const r = await api.post("/auth/upgrade-account", { email, password: pw });
      msg.textContent = r.ok ? "✅ 已設定，之後可以用電郵登入" : "❌ " + ((r.data && r.data.error) || "設定失敗");
      if (r.ok) {
        const u = api.getUser() || {}; u.email = email; api.setUser(u);
        document.getElementById("email").value = email;
        document.getElementById("upgradeCard").style.display = "none";
      }
    };
    document.getElementById("chpw").onclick = async () => {
      const p1 = document.getElementById("npw").value, p2 = document.getElementById("npw2").value;
      const msg = document.getElementById("pwmsg");
      if (p1.length < 6) { msg.textContent = "密碼至少需要 6 個字元"; return; }
      if (p1 !== p2) { msg.textContent = "兩次輸入的密碼唔一致"; return; }
      const btn = document.getElementById("chpw"); btn.disabled = true; btn.textContent = "更新中…";
      const r = await api.post("/auth/change-password", { new_password: p1 });
      btn.disabled = false; btn.textContent = "更新密碼";
      msg.textContent = (r.ok && r.data) ? "✅ 密碼已更新" : "❌ " + ((r.data && r.data.error) || "更新失敗");
      if (r.ok) { document.getElementById("npw").value = ""; document.getElementById("npw2").value = ""; }
    };
    if (api.requireLogin("profile.html")) load();
  </script>
  <script src="assets/footer.js?v=5" defer></script>
</body></html>
