<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>積分計劃 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=27" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=3" />
  <style>
    .pts-hero{background:linear-gradient(135deg,#ff6b35,#c94420);color:#fff;border:0}
    .pts-hero .big{font-size:42px;font-weight:800;line-height:1.05}
    .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:10px}
    .bar > i{display:block;height:100%;background:#fff;border-radius:99px}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
    .tabs button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600}
    .tabs button.on{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
    .rw{display:flex;gap:12px;align-items:center}
    .rw .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#fff7ed;flex:0 0 auto}
    .rw .meta{flex:1;min-width:0}
    .rw .nm{font-weight:700;font-size:14.5px}
    .rw .ds{font-size:12px;color:var(--muted);margin-top:2px}
    .cost{font-weight:800;color:var(--brand-700)}
    .earn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .earn .e{border:1px solid var(--border);border-radius:14px;padding:12px;background:var(--surface)}
    .earn .e b{display:block;font-size:13.5px}
    .earn .e span{font-size:12px;color:var(--muted)}
    @media(max-width:420px){.earn{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">積分計劃</div></div>
  <div class="wrap">
    <div class="card pts-hero"><div class="body">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="opacity:.9;font-size:13px">我嘅積分</div>
          <div class="big" id="pts">—</div>
        </div>
        <div style="text-align:right;font-size:13px;opacity:.95" id="tier">—</div>
      </div>
      <div class="bar"><i id="tierBar" style="width:0%"></i></div>
      <div style="font-size:12px;opacity:.92;margin-top:6px" id="tierHint">—</div>
      <div style="font-size:11px;opacity:.85;margin-top:6px">ℹ️ 呢個係「積分等級」（按累積積分）；「會籍等級」（銅／銀／金／鉑金）按每月上課次數計算，兩者分開。</div>
      <button class="btn" id="checkinBtn" style="margin-top:12px;background:#fff;color:#c94420;font-weight:800;border:0">📅 每日簽到 +5 分</button>
    </div></div>

    <div class="section-title">💰 點樣賺積分</div>
    <div class="earn">
      <div class="e"><b>📅 每日簽到</b><span>+5 分（連續每 5 日再加 +2，上限 +10）</span></div>
      <div class="e"><b>🎟️ 完成一堂</b><span>+50 分（出席簽到後自動入賬）</span></div>
      <div class="e"><b>⭐ 課後評價</b><span>+20 分（每堂一次）</span></div>
      <div class="e"><b>🤝 推薦朋友</b><span>+100 分（朋友完成首堂後）</span></div>
    </div>
    <p class="muted" style="font-size:12px;margin:10px 2px 0">⏳ 積分有效期：連續 <b>12 個月</b>無任何積分活動（簽到／上堂／兌換）會自動失效。</p>

    <div class="section-title" style="margin-top:16px">🎁 積分商城</div>
    <div class="tabs" id="tabs">
      <button data-tab="shop" class="on">可兌換</button>
      <button data-tab="my">兌換紀錄</button>
      <button data-tab="hist">積分紀錄</button>
      <button data-tab="rank">排行榜</button>
    </div>
    <div class="stack" id="list"><div class="card"><div class="body muted">載入中…</div></div></div>
    <div class="spacer"></div>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script>
    let state = { points: 0, tab: "shop", rewards: [] };

    function setTab(t) {
      state.tab = t;
      document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
      render();
    }

    async function loadSummary() {
      const s = await api.get("/points");
      const d = (s.data && (s.data.summary || s.data)) || s.data || {};
      state.points = Number(d.points || 0);
      document.getElementById("pts").textContent = state.points.toLocaleString();

      const t = d.tier || d.tier_info || {};
      const label = typeof t === "string" ? t : ((t.emoji || "") + " " + (t.name || t.label || "")).trim();
      document.getElementById("tier").textContent = label || "🥉 銅牌";

      // 進度條：用 tiers API
      const tr = await api.get("/points/tiers");
      const tiers = (tr.data && (tr.data.tiers || tr.data.data)) || [];
      const arr = Array.isArray(tiers) ? tiers : Object.values(tiers);
      const next = arr.find(x => (x.min_points ?? x.minPoints ?? 0) > state.points);
      if (next) {
        const curMin = arr.filter(x => (x.min_points ?? x.minPoints ?? 0) <= state.points).pop() || { min_points: 0 };
        const lo = curMin.min_points ?? curMin.minPoints ?? 0;
        const hi = next.min_points ?? next.minPoints ?? 0;
        const pct = Math.max(4, Math.min(100, Math.round(((state.points - lo) / Math.max(1, hi - lo)) * 100)));
        document.getElementById("tierBar").style.width = pct + "%";
        document.getElementById("tierHint").textContent = "再儲 " + (hi - state.points) + " 分升級 " + (next.emoji || "") + (next.name || next.label || "");
      } else {
        document.getElementById("tierBar").style.width = "100%";
        document.getElementById("tierHint").textContent = "已達最高等級 👑";
      }
    }

    function rewardCard(x) {
      const affordable = state.points >= Number(x.points_cost);
      const soldOut = x.stock != null && x.stock !== -1 && x.stock <= 0;
      return `<div class="card"><div class="body">
        <div class="rw">
          <div class="ico">${esc(x.icon || "🎁")}</div>
          <div class="meta">
            <div class="nm">${esc(x.name)}</div>
            <div class="ds">${esc(x.description || "")}</div>
          </div>
          <div style="text-align:right">
            <div class="cost">${Number(x.points_cost).toLocaleString()} 分</div>
            ${soldOut ? '<div class="ds" style="color:#b91c1c">已換完</div>' : ""}
          </div>
        </div>
        <button class="btn ${affordable && !soldOut ? "btn-primary" : "btn-secondary"} btn-block" style="margin-top:10px"
          data-redeem="${esc(x.id)}" ${affordable && !soldOut ? "" : "disabled"}>
          ${soldOut ? "已換完" : affordable ? "立即兌換" : "需要多 " + (x.points_cost - state.points) + " 分"}
        </button>
      </div></div>`;
    }

    async function render() {
      const box = document.getElementById("list");
      const tab = state.tab;

      if (tab === "shop") {
        box.innerHTML = state.rewards.length ? state.rewards.map(rewardCard).join("")
          : '<div class="card"><div class="body muted">暫無獎勵。</div></div>';
        box.querySelectorAll("[data-redeem]").forEach(b => b.onclick = () => redeem(b.dataset.redeem));
        return;
      }

      if (tab === "my") {
        const r = await api.get("/points/redemptions");
        const arr = (r.data && (r.data.redemptions || r.data.data)) || [];
        box.innerHTML = arr.length ? arr.map(x => `<div class="card"><div class="body" style="display:flex;justify-content:space-between;gap:8px">
          <div><b>${esc(x.reward_name || x.name || "獎勵")}</b>
            <div class="ds">${esc(String(x.created_at || x.redeemed_at || "").slice(0, 16))}</div></div>
          <div style="text-align:right"><span class="cost">-${esc(x.points_spent || x.points_cost || 0)}</span>
            ${x.status ? `<div class="ds">${esc(x.status)}</div>` : ""}</div>
        </div></div>`).join("") : '<div class="card"><div class="body muted">仲未有兌換紀錄。</div></div>';
        return;
      }

      if (tab === "hist") {
        const r = await api.get("/points/history");
        const arr = (r.data && (r.data.history || r.data.transactions || r.data.data)) || [];
        box.innerHTML = arr.length ? arr.map(x => `<div class="card"><div class="body" style="display:flex;justify-content:space-between;gap:8px">
          <div><b>${esc(x.description || x.reason || "")}</b>
            <div class="ds">${esc(String(x.created_at || "").slice(0, 16))}</div></div>
          <div class="cost" style="color:${Number(x.points || x.amount || 0) >= 0 ? "#15803d" : "#b91c1c"}">
            ${Number(x.points || x.amount || 0) >= 0 ? "+" : ""}${esc(x.points || x.amount || 0)}</div>
        </div></div>`).join("") : '<div class="card"><div class="body muted">仲未有積分紀錄。</div></div>';
        return;
      }

      const r = await api.get("/points/leaderboard");
      const arr = (r.data && (r.data.leaderboard || r.data.data)) || [];
      box.innerHTML = arr.length ? arr.map((x, i) => `<div class="card"><div class="body" style="display:flex;justify-content:space-between">
        <div><b>${["🥇","🥈","🥉"][i] || (i + 1) + "."} ${esc(x.name || x.user_name || "用戶")}</b></div>
        <div class="cost">${Number(x.points || 0).toLocaleString()} 分</div>
      </div></div>`).join("") : '<div class="card"><div class="body muted">暫無排行榜資料。</div></div>';
    }

    async function redeem(id) {
      const rw = state.rewards.find(x => x.id === id);
      if (!rw) return;
      if (!confirm(`兌換「${rw.name}」？\n會扣 ${rw.points_cost} 分。`)) return;
      const r = await api.post("/points/redeem", { reward_id: id });
      if (r.ok) {
        const rd = (r.data && r.data.redemption) || {};
        const isd = rd.issued || {};
        alert("🎉 兌換成功！\n" + (rd.rewardName || "") +
          (isd.text ? "\n" + isd.text : "") +
          (rd.expiresAt ? "\n使用期限：" + String(rd.expiresAt).slice(0,10) : ""));
        await refresh();
      } else {
        alert((r.data && r.data.error) || "兌換失敗");
      }
    }

    async function refresh() {
      await loadSummary();
      const r = await api.get("/points/rewards");
      state.rewards = (r.data && (r.data.rewards || r.data.data)) || [];
      await render();
    }

    document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));

    document.getElementById("checkinBtn").onclick = async function () {
      const btn = this;
      btn.disabled = true;
      const r = await api.post("/points/checkin", {});
      btn.disabled = false;
      if (r.ok) {
        const d = (r.data && (r.data.data || r.data)) || {};
        const got = d.points || d.points_earned || 5;
        alert((d.streak ? "🔥 連續 " + d.streak + " 日！" : "") + "簽到成功 +" + got + " 分" + (d.streakBonus ? "（含連續獎勵 +" + d.streakBonus + "）" : ""));
        await refresh();
      } else {
        alert((r.data && r.data.error) || "簽到失敗");
      }
    };

    (async () => {
      if (!api.requireLogin("points.html")) return;
      try { await refresh(); } catch (e) {
        document.getElementById("list").innerHTML = '<div class="card"><div class="body muted">載入失敗，請重新整理。</div></div>';
      }
    })();
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
