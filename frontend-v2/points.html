<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>積分 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=4" />
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">積分與兌換</div></div>
  <div class="wrap">
    <div class="card" style="background:linear-gradient(135deg,var(--brand-500),var(--brand-700));color:#fff;border:0">
      <div class="body center">
        <div style="opacity:.9;font-size:13px">積分</div>
        <div style="font-size:38px;font-weight:800" id="pts">—</div>
        <div style="opacity:.9;font-size:13px" id="tier"></div>
      </div>
    </div>
    <div class="section-title">可兌換</div>
    <div class="stack" id="rewards"><div class="card"><div class="body muted">載入中…</div></div></div>
    <div class="spacer"></div>
  </div>
  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script>
    (async () => {
      if (!api.requireLogin("points.html")) return;
      const s = await api.get("/points");
      const d = (s.data && (s.data.summary || s.data)) || {};
      document.getElementById("pts").textContent = (d.points != null ? d.points : 0).toLocaleString();
      const tier = d.tier || (d.tier_info && d.tier_info.name) || "";
      document.getElementById("tier").textContent = tier ? (typeof tier === "string" ? tier : (tier.emoji || "") + " " + (tier.name || "")) : "";

      const r = await api.get("/points/rewards");
      const arr = (r.data && r.data.rewards) || [];
      document.getElementById("rewards").innerHTML = arr.length ? arr.map(x =>
        `<div class="card"><div class="body" style="display:flex;justify-content:space-between;align-items:center">
          <span>${esc(x.icon || "🎁")} ${esc(x.name)}</span><b>${esc(x.points_cost)} 分</b></div></div>`).join("")
        : `<div class="card"><div class="body muted">暫無獎勵。</div></div>`;
    })();
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
