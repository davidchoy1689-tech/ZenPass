<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>ZenPass 禪流（升級版預覽）</title>
  <link rel="stylesheet" href="assets/v2.css" />
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <strong style="font-size:15px;letter-spacing:.5px">ZenPass 禪流 · <span style="opacity:.8">v2 預覽</span></strong>
      </div>
      <h1>郁一郁，身體好</h1>
      <p>芬蘭木柱・地板冰壺・布袋球… 搵堂、預約、簽到，一 app 搞掂。</p>
      <a class="btn btn-primary btn-block" href="booking.html">即刻預約 →</a>
    </div>

    <div style="padding:12px 0 0">
      <input class="card" style="width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px"
             placeholder="🔍 搜尋運動 / 課程 / 教練" />
    </div>

    <div class="hscroll">
      <span class="chip on">全部</span>
      <span class="chip">芬蘭木柱</span>
      <span class="chip">地板冰壺</span>
      <span class="chip">布袋球</span>
      <span class="chip">穿雲箭</span>
      <span class="chip">圓網球</span>
    </div>

    <div class="section-title">🔥 今日熱門</div>
    <div class="stack">
      <a class="card" href="booking.html">
        <div class="body course">
          <div class="thumb"></div>
          <div class="meta">
            <p class="name">芬蘭木柱體驗班</p>
            <p class="sub">旺角・週六 10:00・60 分鐘</p>
            <span class="badge ok" style="margin-top:6px">剩 3 位</span>
          </div>
          <div class="price">17cr<br /><small class="muted" style="font-weight:500">$170</small></div>
        </div>
      </a>

      <a class="card" href="booking.html">
        <div class="body course">
          <div class="thumb" style="background:linear-gradient(135deg,#2563eb,#1e3a8a)"></div>
          <div class="meta">
            <p class="name">地板冰壺入門</p>
            <p class="sub">銅鑼灣・週日 14:00・90 分鐘</p>
            <span class="badge pending" style="margin-top:6px">新上架</span>
          </div>
          <div class="price">12cr<br /><small class="muted" style="font-weight:500">$120</small></div>
        </div>
      </a>

      <a class="card" href="booking.html">
        <div class="body course">
          <div class="thumb" style="background:linear-gradient(135deg,#047857,#065f46)"></div>
          <div class="meta">
            <p class="name">布袋球家庭班</p>
            <p class="sub">沙田・週六 15:00・60 分鐘</p>
            <span class="badge warn" style="margin-top:6px">快滿</span>
          </div>
          <div class="price">12cr<br /><small class="muted" style="font-weight:500">$120</small></div>
        </div>
      </a>
    </div>

    <div class="section-title">📍 你附近</div>
    <div class="card"><div class="body muted">開啟定位後，顯示最近場地同班。</div></div>

    <div class="spacer"></div>
    <p class="muted center" style="font-size:12px">此為 UI 升級樣板（v2 預覽）· 正式站不受影響</p>
  </div>

  <nav class="bottomnav">
    <a class="active" href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="index.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a href="index.html"><span class="ic">🎫</span>我的</a>
  </nav>
</body>
</html>
