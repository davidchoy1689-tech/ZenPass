<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css" />
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <strong style="font-size:15px;letter-spacing:.5px">ZenPass 禪流</strong>
        <a href="my.html" style="font-size:13px;opacity:.9">我的 ›</a>
      </div>
      <h1>郁一郁，身體好</h1>
      <p>芬蘭木柱・地板冰壺・布袋球… 搵堂、預約、簽到，一 app 搞掂。</p>
      <a class="btn btn-primary btn-block" href="explore.html">即刻預約 →</a>
    </div>

    <div style="padding:12px 0 0">
      <input id="q" class="card" style="width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px"
             placeholder="🔍 搜尋運動 / 課程 / 教練" />
    </div>

    <div class="hscroll" id="cats">
      <span class="chip on" data-cat="">全部</span>
    </div>

    <div class="section-title">🔥 熱門課程</div>
    <div class="stack" id="courses">
      <div class="card"><div class="body muted">載入中…</div></div>
    </div>

    <div class="spacer"></div>
    <p class="muted center" style="font-size:12px">ZenPass 禪流 · v2</p>
  </div>

  <nav class="bottomnav">
    <a class="active" href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script>
    const box = document.getElementById("courses");
    function card(c) {
      return `<a class="card" href="class-detail.html?id=${encodeURIComponent(c.id)}">
        <div class="body course">
          <div class="thumb"></div>
          <div class="meta">
            <p class="name">${esc(c.title)}</p>
            <p class="sub">${esc(c.category || "")}${c.duration ? " · " + c.duration + " 分鐘" : ""}</p>
          </div>
          <div class="price">${cr(c.price_hkd)}cr<br /><small class="muted" style="font-weight:500">${hkd(c.price_hkd)}</small></div>
        </div></a>`;
    }
    async function load(cat, q) {
      box.innerHTML = `<div class="card"><div class="body muted">載入中…</div></div>`;
      let url = "/classes?limit=6&sort=popular";
      if (cat) url += "&category=" + encodeURIComponent(cat);
      if (q) url += "&search=" + encodeURIComponent(q);
      const r = await api.get(url);
      const list = (r.data && (r.data.classes || r.data.items)) || [];
      if (!list.length) { box.innerHTML = `<div class="card"><div class="body muted">暫時冇課程。</div></div>`; return; }
      box.innerHTML = list.map(card).join("");
    }
    document.getElementById("cats").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip"); if (!chip) return;
      document.querySelectorAll("#cats .chip").forEach(x => x.classList.remove("on"));
      chip.classList.add("on");
      load(chip.dataset.cat, document.getElementById("q").value.trim());
    });
    let t; document.getElementById("q").addEventListener("input", (e) => {
      clearTimeout(t); t = setTimeout(() => load(document.querySelector("#cats .chip.on").dataset.cat, e.target.value.trim()), 350);
    });
    (async () => {
      const r = await api.get("/classes/categories");
      const cats = (r.data && (r.data.categories || r.data)) || [];
      if (Array.isArray(cats)) {
        document.getElementById("cats").innerHTML = `<span class="chip on" data-cat="">全部</span>` +
          cats.map(c => { const n = (typeof c === "string" ? c : (c.name || c.category)); return `<span class="chip" data-cat="${esc(n)}">${esc(n)}</span>`; }).join("");
      }
      load("", "");
    })();
  </script>
</body>
</html>
