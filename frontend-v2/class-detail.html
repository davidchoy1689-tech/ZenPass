<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>課程詳情 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=17" />
  <style>
    .hero-img { height: 200px; background: linear-gradient(135deg, var(--brand-500), var(--brand-700)); position: relative; }
    .hero-img .top { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; }
    .hero-img .hero-ic { position: absolute; inset: 0; margin: auto; width: 92px; height: 92px; display: none; }
    .hero-img .hero-ic.show { display: block; }
    .iconbtn { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; font-size: 16px; }
    .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--border); padding: 0 16px; position: sticky; top: 0; background: var(--surface); z-index: 10; }
    .tabs a { padding: 12px 0; font-weight: 700; color: var(--text-muted); border-bottom: 2px solid transparent; }
    .tabs a.on { color: var(--brand-600); border-color: var(--brand-500); }
    .cta { position: fixed; left: 0; right: 0; bottom: 0; max-width: var(--max-w); margin: 0 auto;
           background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
    .month-label { font-size: 13px; font-weight: 800; color: var(--text-muted); margin: 16px 0 6px; letter-spacing: .3px; }
    .month-label:first-child { margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap" style="padding-bottom:96px">
    <div class="hero-img" style="margin:0 -16px;border-radius:0 0 24px 24px">
      <img class="hero-ic" id="heroIc" alt="">
      <div class="top"><a class="iconbtn" href="javascript:history.back()">‹</a><div style="display:flex;gap:8px"><button class="iconbtn" id="wish" title="收藏">♡</button><button class="iconbtn" id="share" title="分享">↗</button></div></div>
    </div>

    <div style="margin-top:16px" id="head">
      <div class="card"><div class="body muted">載入中…</div></div>
    </div>

    <div class="tabs" style="margin-top:16px">
      <a class="on" href="#intro">介紹</a><a href="#schedule">時間表</a><a href="#reviews">評價</a>
    </div>

    <section id="intro">
      <div class="section-title">課程內容</div>
      <p id="desc" class="muted">…</p>
      <div class="section-title" style="font-size:15px">課程資料</div>
      <div class="card"><div class="body" id="facts"></div></div>
    </section>

    <section id="schedule">
      <div class="section-title">近期時段</div>
      <div class="stack" id="scheds"><div class="card"><div class="body muted">載入中…</div></div></div>
    </section>

    <section id="reviews">
      <div class="section-title">學員評價</div>
      <div class="stack" id="revs"><div class="card"><div class="body muted">暫無評價。</div></div></div>
    </section>
  </div>

  <div class="cta">
    <div><div id="price" style="font-weight:800;color:var(--brand-600);font-size:18px">—</div>
      <div class="muted" style="font-size:12px">開課前一日可取消</div></div>
    <a id="book" class="btn btn-primary" style="flex:1" href="#">即刻預約</a>
  </div>

  <script src="assets/holidays.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/sport-icons.js?v=3"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const wrap = document.getElementById("head");
    let firstSid = "";
    (async () => {
      if (!id) { wrap.innerHTML = `<div class="card"><div class="body">課程不存在。</div></div>`; return; }
      const r = await api.get("/classes/" + encodeURIComponent(id));
      const c = r.data && r.data.class;
      if (!c) { wrap.innerHTML = `<div class="card"><div class="body">搵唔到課程。</div></div>`; return; }
      document.title = c.title + " · ZenPass 禪流";
      var _hi = (typeof getCategoryIcon === "function") ? getCategoryIcon(c.category || "") : "";
      if (_hi) { var _el = document.getElementById("heroIc"); _el.src = _hi; _el.classList.add("show"); }
      wrap.innerHTML = `
        <div style="display:flex;gap:8px;margin-bottom:8px"><span class="chip on">${esc(c.category || "課程")}</span></div>
        <h1 style="margin:0 0 6px;font-size:22px">${esc(c.title)}</h1>
        <p class="muted" style="margin:0">👤 ${esc(c.coach_name || "教練")} · ⏱ ${c.duration || "-"} 分鐘${c.venue_name ? " · 📍 " + esc(c.venue_name) : ""}</p>`;
      document.getElementById("desc").textContent = c.description || "暫無介紹。";
      const _dmap = { beginner: "初級 / 新手友善", intermediate: "中級", advanced: "高級" };
      const _loc = [c.venue_name, c.venue_address].filter(Boolean).join("（") + (c.venue_name && c.venue_address ? "）" : "");
      document.getElementById("facts").innerHTML = [
        ["📅 對象", c.target_audience || _dmap[c.difficulty] || "適合初學者"],
        ["📍 地點", _loc || "待定"],
        ["👥 人數上限", (c.max_participants || "-") + " 人"],
        ["📊 程度", _dmap[c.difficulty] || c.difficulty || "新手友善"],
        ["⏱ 時長", (c.duration || "-") + " 分鐘"],
        ["💰 價錢", `${cr(c.price_hkd)} credits (${hkd(c.price_hkd)})`],
      ].map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("");
      document.getElementById("price").innerHTML = `${cr(c.price_hkd)}cr <span class="muted" style="font-weight:500;font-size:13px">/ ${hkd(c.price_hkd)}</span>`;

      const scheds = (r.data.schedules || []).filter(s => s.status !== "cancelled" && !(window.zpIsHoliday && zpIsHoliday(s.start_time)));
      firstSid = scheds[0] ? scheds[0].id : "";
      const _d = (t) => new Date(String(t).replace(" ", "T"));
      const _p = (n) => String(n).padStart(2, "0");
      const _wd = ["日","一","二","三","四","五","六"];
      const monthLabel = (t) => { const d = _d(t); return isNaN(d) ? "" : (d.getFullYear() + "年" + (d.getMonth() + 1) + "月"); };
      const dayLine = (s) => {
        const d = _d(s.start_time); if (isNaN(d)) return s.start_time;
        let out = `${d.getDate()}日（週${_wd[d.getDay()]}） ${_p(d.getHours())}:${_p(d.getMinutes())}`;
        const e = _d(s.end_time); if (!isNaN(e)) out += `–${_p(e.getHours())}:${_p(e.getMinutes())}`;
        return out;
      };
      const schedsEl = document.getElementById("scheds");
      if (!scheds.length) {
        schedsEl.innerHTML = `<div class="card"><div class="body muted">暫無可預約時段。</div></div>`;
      } else {
        const groups = {};
        scheds.forEach(s => { const k = monthLabel(s.start_time); (groups[k] = groups[k] || []).push(s); });
        schedsEl.innerHTML = Object.keys(groups).map(m =>
          `<div class="month-label">${esc(m)}</div>` +
          groups[m].map(s => {
            const left = (s.max_participants || 0) - (s.enrolled_count || 0);
            const full = left <= 0;
            return `<a class="card" href="booking.html?id=${encodeURIComponent(id)}&sid=${encodeURIComponent(s.id)}"><div class="body" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <span>${dayLine(s)}</span>
              <span class="badge ${full ? "off" : "ok"}">${full ? "已滿" : "剩 " + left + " 位"}</span></div></a>`;
          }).join("")
        ).join("");
      }

      const revs = r.data.reviews || [];
      document.getElementById("revs").innerHTML = revs.length ? revs.map(v =>
        `<div class="card"><div class="body"><p style="margin:0 0 4px">${esc(v.rating_text || "★★★★★")}</p><span class="muted" style="font-size:13px">— ${esc(v.user_name || "學員")}</span></div></div>`).join("")
        : `<div class="card"><div class="body muted">暫無評價。</div></div>`;

      document.getElementById("book").href = "booking.html?id=" + encodeURIComponent(id) + (firstSid ? "&sid=" + encodeURIComponent(firstSid) : "");

      loadWish();
    })();

    const wishBtn = document.getElementById("wish");
    let wishlisted = false;
    function paintWish() { wishBtn.textContent = wishlisted ? "♥" : "♡"; wishBtn.style.color = wishlisted ? "#ef4444" : ""; }
    async function loadWish() {
      if (!api.isLoggedIn()) return;
      const r = await api.get("/wishlist/check/" + encodeURIComponent(id));
      wishlisted = !!(r.data && r.data.wishlisted); paintWish();
    }
    wishBtn.onclick = async () => {
      if (!api.isLoggedIn()) { location.href = "login.html?next=" + encodeURIComponent("class-detail.html?id=" + encodeURIComponent(id)); return; }
      if (wishlisted) { const r = await api.del("/wishlist/" + encodeURIComponent(id)); if (r.ok) { wishlisted = false; paintWish(); } else alert((r.data && r.data.error) || "移除失敗"); }
      else { const r = await api.post("/wishlist/" + encodeURIComponent(id), {}); if (r.ok) { wishlisted = true; paintWish(); alert("已加入收藏 ♥"); } else alert((r.data && r.data.error) || "加入失敗"); }
    };
    document.getElementById("share").onclick = async () => {
      const url = location.href, title = document.title;
      try { if (navigator.share) { await navigator.share({ title, url }); return; } } catch (e) {}
      try { await navigator.clipboard.writeText(url); alert("已複製課程連結"); } catch (e) { prompt("複製連結", url); }
    };
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
