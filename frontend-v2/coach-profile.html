<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>教練檔案 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=25" />
  <style>
    .avi { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--brand-500),var(--brand-700)); color:#fff; display:grid; place-items:center; font-weight:800; font-size:24px; }
    .row { display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid var(--border); gap:10px; }
    .row:last-child { border-bottom:0; }
    .stat { text-align:center; flex:1; }
    .stat .big { font-weight:800; font-size:18px; }
    .stat .lbl { font-size:11px; color:var(--text-muted); }
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="coaches.html">‹</a><div class="title">教練檔案</div></div>
  <div class="wrap">
    <div id="prof"><div class="card"><div class="body muted">載入中…</div></div></div>
    <div class="section-title">課程</div>
    <div class="card" id="classes"><div class="body muted">載入中…</div></div>
    <div class="section-title">學員評價</div>
    <div class="card" id="revs"><div class="body muted">載入中…</div></div>
    <div class="spacer"></div>
  </div>
  <script src="assets/api.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    (async () => {
      if (!id) { document.getElementById("prof").innerHTML = `<div class="card"><div class="body">教練不存在。</div></div>`; return; }
      const cl = await api.get("/coach/list?limit=200");
      const c = ((cl.data && cl.data.coaches) || []).find(x => String(x.id) === String(id)) || {};
      document.getElementById("prof").innerHTML = `<div class="card"><div class="body">
        <div style="display:flex;gap:14px;align-items:center">
          <div class="avi">${esc((c.name || "教").slice(0,1))}</div>
          <div><h2 style="margin:0;font-size:20px">${esc(c.name || "教練")}</h2>
            <div class="muted" style="font-size:13px">⭐ ${Number(c.rating) > 0 ? esc(c.rating) : "暫無評分"}</div></div>
        </div>
        ${c.bio ? `<p class="muted" style="font-size:14px;margin:12px 0 0">${esc(c.bio)}</p>` : ""}
        <div style="display:flex;margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
          <div class="stat"><div class="big">${c.courses || 0}</div><div class="lbl">課程</div></div>
          <div class="stat"><div class="big">${c.students || 0}</div><div class="lbl">學生</div></div>
          <div class="stat"><div class="big">${Number(c.rating) > 0 ? esc(c.rating) : "—"}</div><div class="lbl">評分</div></div>
        </div>
      </div></div>`;

      const cs = await api.get("/classes?coach_id=" + encodeURIComponent(id));
      const classes = (cs.data && cs.data.classes) || [];
      document.getElementById("classes").innerHTML = classes.length ? classes.map(x =>
        `<a class="row" href="class-detail.html?id=${encodeURIComponent(x.id)}"><span>${esc(x.title)}<span class="muted" style="font-size:12px"> · ${esc(x.category || "")}</span></span><span class="muted">${x.price_hkd ? hkd(x.price_hkd) : ""} ›</span></a>`).join("")
        : `<div class="body muted">暫無課程。</div>`;

      const rr = await api.get("/ratings/coach/" + encodeURIComponent(id));
      const revs = (rr.data && (rr.data.ratings || rr.data.reviews)) || [];
      document.getElementById("revs").innerHTML = revs.length ? revs.map(v =>
        `<div class="body" style="border-bottom:1px solid var(--border)"><div style="font-weight:700">${"★".repeat(v.rating || 0)}${"☆".repeat(Math.max(0, 5 - (v.rating || 0)))}</div><div class="muted" style="font-size:13px">${esc(v.comment || "")}</div><div class="muted" style="font-size:12px">— ${esc(v.user_name || "學員")}</div></div>`).join("")
        : `<div class="body muted">暫無評價。</div>`;
    })();
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
