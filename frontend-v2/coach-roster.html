<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="robots" content="noindex" />
  <title>點名冊 · ZenPass</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <link rel="stylesheet" href="assets/polish.css?v=1" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    body{background:#F8FAFC;color:#0F172A}
    .r-wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
    .r-top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid #E2E8F0;padding:12px 14px;margin:-14px -14px 12px}
    .r-title{font-size:16px;font-weight:900}
    .r-sub{font-size:12px;color:#64748B;margin-top:2px}
    .r-bar{height:8px;border-radius:99px;background:#E2E8F0;margin-top:10px;overflow:hidden}
    .r-bar i{display:block;height:100%;background:#059669;border-radius:99px;transition:width .2s}
    .r-stat{display:flex;justify-content:space-between;font-size:11.5px;color:#475569;margin-top:5px;font-weight:700}
    .r-filters{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;margin:0 -14px;scrollbar-width:none}
    .r-filters::-webkit-scrollbar{display:none}
    .r-filter{flex:0 0 auto;height:34px;padding:0 12px;border-radius:999px;border:1.5px solid #94A3B8;background:#fff;color:#0F172A;font-size:12.5px;font-weight:700;cursor:pointer}
    .r-filter.on{background:#059669;border-color:#059669;color:#fff}
    .r-card{background:#fff;border:1.5px solid #E2E8F0;border-radius:14px;padding:12px;margin-bottom:10px}
    .r-card.present{border-color:#6EE7B7;background:#F0FDF4}
    .r-card.excused{border-color:#FDE047;background:#FEFCE8}
    .r-card.absent{border-color:#FCA5A5;background:#FEF2F2}
    .r-name{font-size:16px;font-weight:900}
    .r-meta{font-size:11.5px;color:#64748B;margin-top:2px}
    .r-warn{margin-top:6px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;border-radius:8px;padding:6px 8px;font-size:11.5px;font-weight:700}
    .r-danger{margin-top:6px;background:#FEE2E2;color:#991B1B;border:1px solid #F87171;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:800;line-height:1.45}
    .wi-btn{display:block;width:calc(100% - 32px);margin:0 16px 12px;border:1.5px dashed #059669;background:#ECFDF5;color:#065F46;border-radius:12px;padding:11px;font-weight:900;font-size:14px;cursor:pointer}
    .wi-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:none;padding:16px;overflow:auto}
    .wi-mask.on{display:block}
    .wi-card{background:#fff;border-radius:16px;padding:16px;max-width:420px;margin:36px auto}
    .wi-card h3{margin:0 0 4px;font-size:17px}
    .wi-card label{display:block;font-size:12px;font-weight:800;color:#475569;margin:10px 0 4px}
    .wi-card input[type=text],.wi-card input[type=tel]{width:100%;box-sizing:border-box;border:1.5px solid #CBD5E1;border-radius:10px;padding:10px;font:inherit}
    .wi-pay{display:flex;gap:8px;margin-top:4px}
    .wi-pay label{flex:1;display:flex;align-items:center;gap:6px;border:1.5px solid #CBD5E1;border-radius:10px;padding:9px;font-size:13px;font-weight:700;color:#0F172A;margin:0;cursor:pointer}
    .r-acts{display:flex;gap:6px;margin-top:10px}
    .r-pill{flex:1;min-height:42px;border-radius:10px;border:1.5px solid #CBD5E1;background:#fff;font-size:12.5px;font-weight:800;cursor:pointer;color:#334155}
    .r-pill.on[data-s="present"]{background:#059669;border-color:#059669;color:#fff}
    .r-pill.on[data-s="absent_notified"]{background:#F59E0B;border-color:#F59E0B;color:#fff}
    .r-pill.on[data-s="absent_unexcused"]{background:#DC2626;border-color:#DC2626;color:#fff}
    .r-pill:disabled{opacity:.55}
    .r-links{display:flex;gap:8px;margin-top:12px}
    .r-links a{flex:1;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1.5px solid #CBD5E1;background:#fff;color:#0F172A;text-decoration:none;font-weight:800;font-size:13px}
    .r-empty{text-align:center;color:#64748B;font-size:13px;padding:24px}
    .r-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;z-index:99;pointer-events:none}
    .r-toast.on{opacity:1}
  </style>
</head>
<body>
  <div class="r-wrap">
    <div class="r-top">
      <div class="r-title" id="title">點名冊</div>
      <div class="r-sub" id="sub">載入中…</div>
      <div class="r-bar"><i id="bar" style="width:0%"></i></div>
      <div class="r-stat"><span id="stat">已簽到 0 / 0</span><span id="sync">已同步</span></div>
    </div>
    <div class="r-filters" id="filters">
      <button class="r-filter on" data-f="all">全部</button>
      <button class="r-filter" data-f="present">已簽到</button>
      <button class="r-filter" data-f="unmarked">未簽到</button>
      <button class="r-filter" data-f="excused">請假</button>
    </div>
    <button class="wi-btn" id="walkinBtn" type="button">➕ 現場補錄學員（現金／現場 FPS）</button>
    <div class="wi-mask" id="wiMask">
      <div class="wi-card">
        <h3>➕ 現場補錄學員</h3>
        <div style="font-size:12px;color:#64748B">適用於長者即場帶朋友；會即時簽到並計入本堂收入。</div>
        <label>學員姓名</label>
        <input type="text" id="wiName" maxlength="40" placeholder="例如：陳大文" autocomplete="off" />
        <label>聯絡電話（8 位）</label>
        <input type="tel" id="wiPhone" inputmode="numeric" maxlength="8" placeholder="91234567" autocomplete="off" />
        <label>收費方式</label>
        <div class="wi-pay">
          <label><input type="radio" name="wiPay" value="cash" checked /> 💵 已收現金</label>
          <label><input type="radio" name="wiPay" value="fps_direct" /> 📲 現場 FPS</label>
        </div>
        <label>備註（可選）</label>
        <input type="text" id="wiNotes" maxlength="120" placeholder="例如：婆婆朋友，膝痛" />
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn btn-secondary" id="wiCancel" type="button" style="flex:1">取消</button>
          <button class="btn btn-primary" id="wiSubmit" type="button" style="flex:1.4">✅ 補錄並簽到</button>
        </div>
        <div id="wiMsg" style="font-size:12px;color:#B91C1C;margin-top:8px"></div>
      </div>
    </div>
    <div id="list"><div class="r-empty">載入中…</div></div>
    <div class="r-links">
      <a id="handbookLink" href="#">📖 課後手冊</a>
      <a href="coach-dashboard.html">← 返回後台</a>
    </div>
  </div>
  <div class="r-toast" id="toast"></div>

<script src="assets/api.js?v=10"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const SID = new URLSearchParams(location.search).get("schedule_id") || "";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let DATA = null, FILTER = "all";
  const timers = {}, busy = {};
  let toastTimer;
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 1800); };

  function counts() {
    const r = DATA.roster;
    return {
      total: r.length,
      present: r.filter((x) => x.status === "present" || x.status === "late").length,
      excused: r.filter((x) => x.status === "absent_notified").length,
      absent: r.filter((x) => x.status === "absent_unexcused").length,
      unmarked: r.filter((x) => !x.status).length,
    };
  }

  function render() {
    if (!DATA) return;
    const s = DATA.schedule || {};
    $("title").textContent = s.title || "點名冊";
    $("sub").textContent = `${s.venue_name || ""} · ${fmt(s.start_time)}–${hhmm(s.end_time)}`;
    const c = counts();
    const done = c.present + c.excused + c.absent;
    $("bar").style.width = c.total ? Math.round((done / c.total) * 100) + "%" : "0%";
    $("stat").textContent = `已簽到 ${c.present} / ${c.total} 人${c.excused ? ` · 請假 ${c.excused}` : ""}${c.absent ? ` · 缺席 ${c.absent}` : ""}`;
    $("handbookLink").href = "coach-handbook.html?schedule_id=" + encodeURIComponent(SID);

    let list = DATA.roster;
    if (FILTER === "present") list = list.filter((x) => x.status === "present" || x.status === "late");
    else if (FILTER === "unmarked") list = list.filter((x) => !x.status);
    else if (FILTER === "excused") list = list.filter((x) => x.status === "absent_notified");
    if (!list.length) {
      $("list").innerHTML = DATA.roster.length
        ? '<div class="r-empty">（無符合篩選嘅學員）</div>'
        : '<div class="r-empty">呢班暫時未有已確認學員<br><span style="font-size:12px;opacity:.7">有新報名會自動出現</span></div>';
      return;
    }

    $("list").innerHTML = list.map((x) => {
      const cls = x.status === "present" || x.status === "late" ? "present" : x.status === "absent_notified" ? "excused" : x.status === "absent_unexcused" ? "absent" : "";
      return `<div class="r-card ${cls}" data-bid="${esc(x.booking_id)}">
        <div class="r-name">${esc(x.student_name || x.name)} ${x.status === "late" ? '<span style="font-size:11px;color:#B45309">🕐 遲到</span>' : ""}</div>
        <div class="r-meta">${x.pass_remaining != null ? `🎫 剩 ${x.pass_remaining}/${x.pass_total} 堂 · ` : ""}${esc(x.phone || "")}</div>
        ${x.medical_notes ? (() => {
          const t = String(x.medical_notes);
          const danger = /心臟|心管|血壓|手術|膝|關節|糖尿|暈|中風|骨質|氣喘|哮喘/i.test(t);
          return `<div class="${danger ? "r-danger" : "r-warn"}">${danger ? "⚠️ 舊患注意：" : "⚠️ "}${esc(t)}</div>`;
        })() : ""}
        <div class="r-acts">
          <button class="r-pill ${x.status === "present" ? "on" : ""}" data-s="present" ${busy[x.booking_id] ? "disabled" : ""}>🟢 出席</button>
          <button class="r-pill ${x.status === "absent_notified" ? "on" : ""}" data-s="absent_notified" ${busy[x.booking_id] ? "disabled" : ""}>🟡 請假</button>
          <button class="r-pill ${x.status === "absent_unexcused" ? "on" : ""}" data-s="absent_unexcused" ${busy[x.booking_id] ? "disabled" : ""}>🔴 缺席</button>
        </div>
      </div>`;
    }).join("");

    $("list").querySelectorAll(".r-pill").forEach((btn) => {
      btn.onclick = () => pick(btn.closest(".r-card").dataset.bid, btn.dataset.s);
    });
  }

  function pick(bid, status) {
    const stu = DATA.roster.find((x) => x.booking_id === bid);
    if (!stu || busy[bid]) return;
    // Optimistic UI（即時反饋）
    stu.status = status;
    render();
    $("sync").textContent = "⏳ 同步中…";
    // 2 秒防抖：同一學員連續切換只送最後一次
    clearTimeout(timers[bid]);
    timers[bid] = setTimeout(() => save(bid, stu), 2000);
  }

  async function save(bid, stu) {
    busy[bid] = true;
    try {
      const r = await api.post("/coach/attendance/batch", {
        session_id: SID,
        records: [{ booking_id: bid, status: stu.status, notes: stu.notes || "" }],
      });
      if (!r.ok) throw new Error((r.data && r.data.error) || "同步失敗");
      $("sync").textContent = "✅ 已同步";
      const res = (r.data.results || [])[0];
      if (res && res.pass_restored) toast("已退回 1 堂通行卡");
    } catch (e) {
      $("sync").textContent = "⚠️ 未同步";
      toast("❌ " + (e.message || "同步失敗"));
      const fresh = await api.get("/coach/sessions/" + encodeURIComponent(SID) + "/roster");
      if (fresh.ok) { DATA = fresh.data; render(); }
    } finally {
      busy[bid] = false;
    }
  }

  function fmt(t) { const d = new Date(String(t || "").replace(" ", "T")); return isNaN(d) ? String(t || "") : d.toLocaleString("zh-HK", { month: "short", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }); }
  function hhmm(t) { const d = new Date(String(t || "").replace(" ", "T")); return isNaN(d) ? "" : String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

  $("filters").querySelectorAll(".r-filter").forEach((b) => {
    b.onclick = () => {
      FILTER = b.dataset.f;
      $("filters").querySelectorAll(".r-filter").forEach((x) => x.classList.toggle("on", x === b));
      render();
    };
  });

  async function reloadRoster() {
    const r = await api.get("/coach/sessions/" + encodeURIComponent(SID) + "/roster");
    if (r.ok) { DATA = r.data; render(); }
  }

  $("walkinBtn").onclick = () => { $("wiMask").classList.add("on"); $("wiMsg").textContent = ""; setTimeout(() => $("wiName").focus(), 60); };
  $("wiCancel").onclick = () => $("wiMask").classList.remove("on");
  $("wiMask").onclick = (e) => { if (e.target.id === "wiMask") $("wiMask").classList.remove("on"); };
  $("wiSubmit").onclick = async () => {
    const name = $("wiName").value.trim();
    const phone = $("wiPhone").value.replace(/\D/g, "");
    const pay = (document.querySelector('input[name="wiPay"]:checked') || {}).value || "cash";
    if (name.length < 2) { $("wiMsg").textContent = "請輸入學員姓名（最少 2 字）"; return; }
    if (phone.length !== 8) { $("wiMsg").textContent = "請輸入 8 位香港電話"; return; }
    $("wiSubmit").disabled = true; $("wiSubmit").textContent = "補錄中…"; $("wiMsg").textContent = "";
    const r = await api.post("/coach/attendance/walk-in", { session_id: SID, student_name: name, contact_phone: phone, payment_method: pay, notes: $("wiNotes").value });
    $("wiSubmit").disabled = false; $("wiSubmit").textContent = "✅ 補錄並簽到";
    if (!r.ok) { $("wiMsg").textContent = (r.data && r.data.error) || "補錄失敗，請重試"; return; }
    $("wiMask").classList.remove("on");
    $("wiName").value = ""; $("wiPhone").value = ""; $("wiNotes").value = "";
    toast("✅ 已補錄並簽到：" + name);
    reloadRoster();
  };

  (async () => {
    if (!SID) { $("list").innerHTML = '<div class="r-empty">缺少 schedule_id</div>'; return; }
    const me = await api.me();
    if (!me.ok) { location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search); return; }
    const r = await api.get("/coach/sessions/" + encodeURIComponent(SID) + "/roster");
    if (!r.ok) { $("list").innerHTML = `<div class="r-empty">${esc((r.data && r.data.error) || "讀取失敗")}</div>`; return; }
    DATA = r.data;
    render();
  })();
</script>
</body>
</html>
