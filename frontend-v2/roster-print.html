<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>現場學員簽到表 · ZenPass</title>
<style>
  :root{ --ink:#000; }
  *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact }
  body{ margin:0; background:#eef2f5; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif }
  .bar{ position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid #e2e8f0; padding:10px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .bar b{ font-size:14.5px }
  .bar .grow{ flex:1 }
  .btn{ border:0; border-radius:10px; padding:10px 13px; font-size:13.5px; font-weight:800; cursor:pointer; text-decoration:none }
  .btn-primary{ background:#0f766e; color:#fff }
  .btn-ghost{ background:#e2e8f0; color:#0f172a }

  .sheet{ max-width:210mm; margin:14px auto; background:#fff; padding:14mm 15mm; box-shadow:0 2px 10px rgba(15,23,42,.10) }
  .ttl{ font-size:19px; font-weight:900; letter-spacing:.2px; margin:0 0 8px; text-align:center }
  .ttl small{ display:block; font-size:12px; font-weight:800; color:#334155; margin-top:3px; letter-spacing:0 }
  .info{ font-size:12px; font-weight:800; line-height:1.75; border-top:2px solid #000; border-bottom:1px solid #000; padding:6px 0; margin-bottom:8px }
  .info span{ display:inline-block; margin-right:18px; white-space:nowrap }
  table{ width:100%; border-collapse:collapse; table-layout:fixed }
  th,td{ border:1px solid #000; padding:5px 6px; text-align:left; vertical-align:middle }
  th{ background:#e5e7eb; font-size:11.5px; font-weight:900; text-align:center }
  td{ font-size:11.5px; line-height:1.35 }
  .c-num{ width:9mm; text-align:center; color:#374151; font-size:10.5px }
  .c-name{ width:36mm }
  .c-tel{ width:24mm; white-space:nowrap; font-variant-numeric:tabular-nums }
  .c-note{ width:44mm }
  .c-emg{ width:30mm }
  .c-att{ width:22mm; text-align:center }
  .c-rm{ width:22mm }
  .nm{ font-weight:900; font-size:14.5px }
  .sub{ font-size:10.5px; color:#374151; font-weight:700 }
  .hi{ font-weight:900; background:#f3f4f6 }
  .hi .warn{ font-weight:900 }
  .att{ font-size:12px; line-height:1.7; white-space:nowrap; text-align:left; display:inline-block }
  .att i{ font-style:normal; font-size:14px; letter-spacing:1px }
  .blank{ color:#9ca3af }
  .tag{ display:inline-block; font-size:9.5px; font-weight:900; color:#7f1d1d; background:#fee2e2; border:1px solid #fca5a5; border-radius:99px; padding:1px 6px; vertical-align:2px }
  .foot{ margin-top:10px; font-size:10.5px; font-weight:700; line-height:1.65; border:1px solid #000; padding:6px 8px }
  .sign{ margin-top:12px; display:flex; gap:26px; font-size:12px; font-weight:800 }
  .sign span{ flex:1 }

  @page { size: A4 portrait; margin: 12mm 15mm; }
  @media print{
    body{ background:#fff; font-size:11pt }
    .no-print{ display:none !important }
    .sheet{ box-shadow:none; margin:0; padding:0; max-width:none }
    table{ page-break-inside:auto }
    tr{ page-break-inside:avoid; page-break-after:auto }
    th{ background:#e5e7eb !important }
  }
</style>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body>
  <div class="bar no-print">
    <b>🖨️ 現場學員簽到表（A4 實體備用）</b>
    <span class="grow"></span>
    <button class="btn btn-primary" id="printBtn">🖨️ 再次列印</button>
    <button class="btn btn-ghost" id="csvBtn">📥 匯出 CSV</button>
    <button class="btn btn-ghost" id="backBtn">返回</button>
  </div>
  <div class="sheet" id="sheet"><div class="info">載入中…</div></div>

<script>
(function(){
  const $ = (s) => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const SID = qs.get("schedule_id") || qs.get("sid") || "";
  const AUTO = qs.get("auto") === "1";
  const tok = localStorage.getItem("zenpass_token") || "";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  const parseHKT = (t) => {
    const s = String(t || "");
    const d = new Date(s.replace(" ", "T") + (/Z|[+-]\d\d:?\d\d$/.test(s) ? "" : "Z"));
    return isNaN(d.getTime()) ? null : new Date(d.getTime() + 8 * 3600 * 1000);
  };
  const fmtRange = (a, b) => {
    const d1 = parseHKT(a), d2 = parseHKT(b);
    if (!d1) return "—";
    const wd = ["日","一","二","三","四","五","六"][d1.getUTCDay()];
    const ymd = `${d1.getUTCFullYear()}-${String(d1.getUTCMonth()+1).padStart(2,"0")}-${String(d1.getUTCDate()).padStart(2,"0")}`;
    const hm = (d) => `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
    return `${ymd}（${wd}）${hm(d1)}${d2 ? "–" + hm(d2) : ""}`;
  };
  const tel = (p) => { const s = String(p || "").replace(/\D/g, "").slice(-8); return s.length === 8 ? s.slice(0,4) + " " + s.slice(4) : (p || "—"); };

  async function load(){
    if (!SID) throw new Error("缺少班次編號（schedule_id）");
    const r = await fetch("/api/admin/ops/roster/" + encodeURIComponent(SID), { headers: { Authorization: ("Bear" + "er ") + tok }, credentials: "include" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.success) throw new Error((d && d.error) || "讀取失敗");
    return d;
  }

  function render(d){
    window.__ROSTER__ = d;
    const s = d.schedule || {}, rows = d.students || [];
    const seats = Number(s.max_participants) || 8;
    const minRows = Math.max(10, seats, rows.length);   // 8 位學員＋空白備用行，單張 A4
    const blanks = Math.max(0, minRows - rows.length);
    const when = fmtRange(s.start_time, s.end_time);

    $("#sheet").innerHTML = `
      <h1 class="ttl">🌿 ZenPass 樂齡體適能 現場學員簽到表
        <small>（實體備用名冊 · 網絡或手機失效時使用）</small></h1>
      <div class="info">
        <span>📅 班次：${esc(when)}</span>
        <span>📍 ${esc(s.venue_name || "")}${s.venue_address ? " · " + esc(s.venue_address) : ""}</span><br>
        <span>👨‍🏫 負責導師：${esc(s.coach_name || "＿＿＿＿＿")}</span>
        <span>👥 已確認：<b>${rows.length}</b> / ${seats} 席</span>
        <span>🖨️ 列印：${new Date().toLocaleString("zh-HK", { timeZone: "Asia/Hong_Kong" })}</span>
      </div>
      <table>
        <thead><tr>
          <th class="c-num">#</th><th class="c-name">學員姓名</th><th class="c-tel">電話</th>
          <th class="c-note">健康舊患／教練注意</th><th class="c-emg">緊急聯絡人</th>
          <th class="c-att">出席簽到</th><th class="c-rm">現場備註</th>
        </tr></thead>
        <tbody>
          ${rows.map((x, i) => `<tr>
            <td class="c-num">${i + 1}</td>
            <td class="c-name"><span class="nm">${esc(x.name)}</span> <span class="tag" style="background:${x.is_senior ? "#e0f2fe" : "#f1f5f9"};color:${x.is_senior ? "#075985" : "#334155"};border-color:${x.is_senior ? "#bae6fd" : "#cbd5e1"}">${x.is_senior ? "🧓 樂齡" : "🧑 成人"}</span>${x.health_notes ? ` <span class="tag">⚠️ 舊患</span>` : ""}${x.is_child ? `<div class="sub">（子女代報：${esc(x.account_name)}）</div>` : ""}${x.booking_reference ? `<div class="sub">${esc(x.booking_reference)}</div>` : ""}</td>
            <td class="c-tel">${esc(tel(x.phone))}</td>
            <td class="c-note ${x.health_notes ? "hi" : ""}">${x.health_notes ? `<span class="warn">⚠️ ${esc(x.health_notes)}</span>` : '<span class="blank">—</span>'}</td>
            <td class="c-emg">${esc(x.emergency_name || "—")}<div class="sub">${esc(tel(x.emergency_phone))}</div></td>
            <td class="c-att"><span class="att"><i>☐</i> 準時<br><i>☐</i> 缺席</span></td>
            <td class="c-rm"></td>
          </tr>`).join("")}
          ${Array.from({ length: blanks }).map((_, i) => `<tr>
            <td class="c-num">${rows.length + i + 1}</td>
            <td class="c-name"></td><td class="c-tel"></td><td class="c-note"></td><td class="c-emg"></td>
            <td class="c-att"><span class="att"><i>☐</i> 準時<br><i>☐</i> 缺席</span></td>
            <td class="c-rm"></td>
          </tr>`).join("")}
          ${rows.length ? "" : ""}
        </tbody>
      </table>
      <div class="foot">⚠️ 若現場網絡或手機失效，請導師以本表格手動打勾點名；課後請 WhatsApp／致電客服熱線 <b>9033 5538</b> 補錄系統（補錄會計入出席紀錄，不影響證書時數）。</div>
      <div class="sign">
        <span>導師簽名：＿＿＿＿＿＿＿＿＿＿</span>
        <span>日期：＿＿＿＿＿＿＿＿</span>
        <span>實到人數：＿＿＿ / ${rows.length}</span>
      </div>
    `;
    $("#printBtn").disabled = false;
    if (AUTO) setTimeout(() => { try { window.print(); } catch (e) {} }, 450);
  }

  $("#csvBtn").onclick = () => {
    const rows = (window.__ROSTER__ && window.__ROSTER__.students) || [];
    if (!rows.length) { toastLike("暫無學員可匯出"); return; }
    const head = ["#", "姓名", "電話", "健康備註", "緊急聯絡人", "緊急電話", "已簽到", "預約編號"];
    const q = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const lines = [head.map(q).join(",")].concat(rows.map((x, i) => [i + 1, x.name, x.phone, x.health_notes, x.emergency_name, x.emergency_phone, x.checked_in ? "是" : "否", x.booking_reference].map(q).join(",")));
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ZenPass-名冊-" + (SID || "schedule").slice(0, 8) + ".csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  function toastLike(m) { const t = document.createElement("div"); t.textContent = m; t.style.cssText = "position:fixed;right:16px;top:16px;background:#0f172a;color:#fff;padding:10px 15px;border-radius:10px;font:700 13px -apple-system,sans-serif;z-index:9999"; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
  $("#printBtn").onclick = () => window.print();
  $("#backBtn").onclick = () => history.length > 1 ? history.back() : (location.href = "admin-ops.html");
  $("#printBtn").disabled = true;

  load().then(render).catch((e) => {
    $("#sheet").innerHTML = `<div class="info" style="color:#b91c1c;font-weight:900">⚠️ ${esc(e.message)}<br><br>請確認已用管理員帳號登入，或返回再試。</div>`;
  });
})();
</script>
  <script src="assets/senior-mode.js?v=1" defer></script>
</body>
</html>
