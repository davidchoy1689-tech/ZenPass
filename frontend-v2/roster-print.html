<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>紙本點名名冊 · ZenPass</title>
<style>
  :root{ --ink:#0f172a; --brand:#1A5336; }
  *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact }
  body{ margin:0; background:#eef2f5; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif }
  .bar{ position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid #e2e8f0; padding:10px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .bar b{ font-size:14.5px }
  .bar .grow{ flex:1 }
  .btn{ border:0; border-radius:10px; padding:10px 13px; font-size:13.5px; font-weight:800; cursor:pointer; text-decoration:none }
  .btn-primary{ background:#0f766e; color:#fff }
  .btn-ghost{ background:#e2e8f0; color:#0f172a }
  .wrap{ max-width:210mm; margin:14px auto; background:#fff; padding:14px 16px 22px; box-shadow:0 2px 10px rgba(15,23,42,.10) }
  h1{ font-size:17px; margin:0 0 4px }
  .meta{ font-size:12.5px; color:#475569; line-height:1.6 }
  .badge{ display:inline-block; background:#ecfdf5; color:#047857; font-weight:800; border-radius:99px; padding:2px 9px; font-size:11.5px; margin-left:6px }
  table{ width:100%; border-collapse:collapse; margin-top:12px }
  th,td{ border:1px solid #cbd5e1; padding:7px 8px; text-align:left; vertical-align:top }
  th{ background:#f1f5f9; font-size:12.5px }
  td{ font-size:13px }
  .num{ width:8mm; text-align:center; color:#64748b }
  .box{ width:12mm; text-align:center; font-size:16px; color:#94a3b8 }
  .nm{ font-weight:900; font-size:14.5px }
  .sub{ font-size:11.5px; color:#64748b }
  .hi{ background:#fff7d6; color:#7f1d1d; font-weight:900 }
  .foot{ margin-top:14px; font-size:11.5px; color:#64748b; line-height:1.7 }
  .sign{ margin-top:18px; display:flex; gap:24px; font-size:12px; color:#475569 }
  @page { size: A4 portrait; margin: 12mm }
  @media print{
    body{ background:#fff }
    .no-print{ display:none !important }
    .wrap{ box-shadow:none; margin:0; padding:0; max-width:none }
    th{ background:#eee !important }
    tr{ page-break-inside:avoid; break-inside:avoid }
  }
</style>
</head>
<body>
  <div class="bar no-print">
    <b>🖨️ 紙本點名名冊</b>
    <span class="grow"></span>
    <button class="btn btn-primary" id="printBtn">🖨️ 列印（A4）</button>
    <button class="btn btn-ghost" id="backBtn">返回</button>
  </div>
  <div class="wrap" id="sheet"><div class="meta">載入中…</div></div>

<script>
(function(){
  const $ = (s) => document.querySelector(s);
  const sid = new URLSearchParams(location.search).get("sid") || "";
  const tok = localStorage.getItem("zenpass_token") || "";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const fmtDT = (t) => {
    const d = new Date(String(t || "").replace(" ", "T") + (/Z|[+-]\d\d:?\d\d$/.test(String(t || "")) ? "" : "Z"));
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleString("zh-HK", { timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short", hour: "2-digit", minute: "2-digit" });
  };
  const tel = (p) => { const s = String(p || "").replace(/\D/g, "").slice(-8); return s.length === 8 ? s.slice(0,4) + " " + s.slice(4) : (p || "—"); };

  async function load(){
    if (!sid) throw new Error("缺少班次編號");
    const r = await fetch("/api/admin/ops/roster/" + encodeURIComponent(sid), { headers: { Authorization: "Bearer " + tok }, credentials: "include" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.success) throw new Error((d && d.error) || "讀取失敗");
    return d;
  }

  function render(d){
    const s = d.schedule || {}, rows = d.students || [];
    const when = fmtDT(s.start_time);
    $("#sheet").innerHTML = `
      <h1>${esc(s.title || "課堂")} — 現場點名名冊 <span class="badge">共 ${rows.length} 位</span></h1>
      <div class="meta">
        📅 ${esc(when)}（${esc(String(s.end_time || "").slice(11,16))} 完）<br>
        📍 ${esc(s.venue_name || "")}${s.venue_address ? " · " + esc(s.venue_address) : ""}<br>
        👨‍🏫 導師：${esc(s.coach_name || "—")} ｜ 名額：${Number(s.enrolled_count) || 0}/${Number(s.max_participants) || 0} ｜ 列印時間：${new Date().toLocaleString("zh-HK", { timeZone: "Asia/Hong_Kong" })}
      </div>
      <table>
        <thead><tr><th class="num">#</th><th>學員姓名</th><th>聯絡電話</th><th>健康備註（⚠️ 特別注意）</th><th>緊急聯絡人</th><th class="box">簽到</th></tr></thead>
        <tbody>
          ${rows.map((x, i) => `<tr>
            <td class="num">${i + 1}</td>
            <td><span class="nm">${esc(x.name)}</span>${x.is_child ? `<div class="sub">（子女代報：${esc(x.account_name)}）</div>` : ""}${x.booking_reference ? `<div class="sub">${esc(x.booking_reference)}</div>` : ""}</td>
            <td>${esc(tel(x.phone))}</td>
            <td class="${x.health_notes ? "hi" : ""}">${x.health_notes ? "⚠️ " + esc(x.health_notes) : "—"}</td>
            <td>${esc(x.emergency_name || "—")}<div class="sub">${esc(tel(x.emergency_phone))}</div></td>
            <td class="box">${x.checked_in ? "✔" : "☐"}</td>
          </tr>`).join("") || `<tr><td colspan="6" style="text-align:center;color:#94a3b8">此班暫無學員</td></tr>`}
        </tbody>
      </table>
      <div class="foot">✍️ 現場如系統／網絡故障：以本紙本名冊點名，導師簽名後交回平台補錄（補錄會計入出席紀錄，唔影響證書時數）。<br>🆘 緊急支援：ZenPass 9033 5538</div>
      <div class="sign"><span>導師簽名：＿＿＿＿＿＿＿＿</span><span>日期：＿＿＿＿＿＿</span><span>實到人數：＿＿／${rows.length}</span></div>
    `;
    $("#printBtn").disabled = false;
  }

  $("#printBtn").onclick = () => window.print();
  $("#backBtn").onclick = () => history.length > 1 ? history.back() : (location.href = "admin-ops.html");
  $("#printBtn").disabled = true;

  load().then(render).catch((e) => {
    $("#sheet").innerHTML = `<div class="meta" style="color:#b91c1c;font-weight:800">⚠️ ${esc(e.message)}<br><br>請確認已用管理員帳號登入，或返回再試。</div>`;
  });
})();
</script>
</body>
</html>
