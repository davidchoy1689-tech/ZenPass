<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#064E3B" media="(prefers-color-scheme: dark)" />
<title>我的電子票券 · ZenPass</title>
<style>
  :root{ --forest:#0b3b2a; --forest2:#1A5336; --ink:#0f172a; --page-bg:#0b3b2a; }
  *{ box-sizing:border-box }
  html,body{ margin:0; min-height:100% }
  body{
    background:radial-gradient(120% 80% at 50% 0%, #14503a 0%, #0b3b2a 55%, #082b1f 100%);
    color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",sans-serif;
    padding:20px 16px 34px; display:flex; flex-direction:column; align-items:center;
  }
  .brand{ font-size:13px; letter-spacing:2px; font-weight:800; opacity:.75; text-transform:uppercase }
  .pass{
    width:100%; max-width:420px; margin-top:12px; background:#fff; color:var(--ink);
    border-radius:22px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.35);
    position:relative;
  }
  /* ===== 🎫 Passbook 圓形凹槽（純 CSS，零圖片）===== */
  .ticket-notch::before, .ticket-notch::after{
    content:""; position:absolute; top:65%;
    width:20px; height:20px; border-radius:50%;
    background:var(--page-bg,#F3F4F6); z-index:3; pointer-events:none;
  }
  .ticket-notch::before{ left:-10px }
  .ticket-notch::after{ right:-10px }
  .top{ background:linear-gradient(135deg,#1A5336,#0b3b2a); color:#fff; padding:20px 20px 18px; position:relative }
  .top .k{ font-size:11.5px; letter-spacing:1.5px; font-weight:800; opacity:.8 }
  .top h1{ margin:6px 0 2px; font-size:22px; line-height:1.25 }
  .top .when{ font-size:15px; font-weight:800; opacity:.95; margin-top:4px }
  .top .place{ font-size:13.5px; opacity:.85; margin-top:3px }
  .top .who{ position:absolute; right:18px; top:18px; font-size:12px; font-weight:800; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); border-radius:99px; padding:4px 10px }
  .tear{ position:relative; height:22px; background:#fff }
  .tear:before,.tear:after{ content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:#082b1f; top:0 }
  .tear:before{ left:-11px } .tear:after{ right:-11px }
  .tear .line{ position:absolute; left:16px; right:16px; top:10px; border-top:2px dashed #e2e8f0 }
  .body{ padding:6px 20px 20px; display:flex; flex-direction:column; align-items:center; gap:12px }
  .qr{ width:min(62vw,240px); aspect-ratio:1; border:2px solid #e2e8f0; border-radius:16px; padding:8px; background:#fff }
  .qr img{ width:100%; height:100%; object-fit:contain; image-rendering:pixelated }
  .hint{ font-size:12.5px; color:#64748b; text-align:center; line-height:1.5 }
  .ref{ font-size:13px; font-weight:900; letter-spacing:.6px; color:#0f172a }
  .acts{ width:100%; display:flex; flex-direction:column; gap:9px; margin-top:4px }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; min-height:50px; border-radius:14px; font-size:15px; font-weight:900; text-decoration:none; border:0; cursor:pointer }
  .btn-primary{ background:#1A5336; color:#fff }
  .btn-out{ background:#fff; color:#0f172a; border:1.5px solid #cbd5e1 }
  .tips{ width:100%; max-width:420px; margin-top:16px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:14px 16px; font-size:13px; line-height:1.75; color:#e2e8f0 }
  .tips b{ color:#fff }
  .err{ margin-top:24px; color:#fecaca; font-weight:800; text-align:center; line-height:1.6 }
  .muted{ color:#94a3b8; font-size:12px; text-align:center; margin-top:14px }

  /* ===== Cross-Document View Transitions（原生跨頁淡入淡出） ===== */
  @view-transition { navigation: auto; }
  ::view-transition-old(root){ animation: 180ms cubic-bezier(0.4,0,0.2,1) both zpVtOut }
  ::view-transition-new(root){ animation: 180ms cubic-bezier(0.4,0,0.2,1) both zpVtIn }
  @keyframes zpVtOut { from{opacity:1} to{opacity:0} }
  @keyframes zpVtIn  { from{opacity:0} to{opacity:1} }
  @media (prefers-reduced-motion: reduce){
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*){ animation: none !important; }
  }
</style>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body>
  <div class="brand">ZenPass 禪流 · 電子票券</div>
  <div id="passWrap" class="pass ticket-notch" style="display:none"></div>
  <div class="tips" id="tips" style="display:none">
    <b>上堂前準備</b><br>
    · 自備毛巾、水樽，穿著彈性運動服及運動鞋<br>
    · 建議提前 10 分鐘到場，先做熱身<br>
    · 如身體不適或受傷，請先通知導師
  </div>
  <div class="muted" id="muted">載入中…</div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const ID = qs.get("id") || qs.get("booking_id") || "";
  const GUEST = qs.get("token") || "";
  const SHARE = qs.get("share") || "";
  const DEMO = qs.get("demo") === "1";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  const DEMO_CARD = {
    student_name: "陳小明", salute: "", class_title: "痛點伸展（肩頸 × 腰背）",
    date: "2026-12-12", weekday: "星期六", time: "10:30", end_time: "12:00",
    venue_name: "青衣楓樹窩體育館 1 樓活動室", venue_address: "青衣楓樹窩路 1 號",
    venue_lat: 22.3486, venue_lng: 114.1076, booking_reference: "ZP-1212-008",
    qr: { data_url: "/api/qr?raw=1&size=600&text=" + encodeURIComponent("zenpass:checkin:demo-8:abcdefghij") },
  };

  async function load(){
    if (DEMO) return DEMO_CARD;
    let url, headers = {};
    if (SHARE) {
      url = "/api/public/bookings/" + encodeURIComponent(ID) + "?share=" + encodeURIComponent(SHARE);
    } else if (GUEST) {
      const t = encodeURIComponent(GUEST);
      url = `/api/guest/booking-card?token=***}&booking_id=${encodeURIComponent(ID)}`;
    } else {
      if (!ID) throw new Error("缺少預約編號");
      url = "/api/bookings/" + encodeURIComponent(ID) + "/card";
      const tk = localStorage.getItem("zenpass_token") || "";
      if (tk) headers.Authorization = ("Bear" + "er ") + tk;
    }
    const r = await fetch(url, { headers, credentials: "include" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.card) throw new Error((d && d.error) || "讀取失敗");
    return d.card;
  }

  const ymd = (s) => String(s || "").replace(/-/g, "");
  const hhmmss = (t) => String(t || "00:00").replace(":", "") + "00";

  function ics(c){
    const start = ymd(c.date) + "T" + hhmmss(c.time);
    const end = ymd(c.date) + "T" + hhmmss(c.end_time || c.time);
    const loc = [c.venue_name, c.venue_address].filter(Boolean).join("，");
    const lines = [
      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ZenPass//HK//ZH-HK","CALSCALE:GREGORIAN","METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:" + (c.booking_reference || Date.now()) + "@zenpass.hk",
      "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z",
      "DTSTART;TZID=Asia/Hong_Kong:" + start,
      "DTEND;TZID=Asia/Hong_Kong:" + end,
      "SUMMARY:ZenPass " + (c.class_title || "課堂"),
      "LOCATION:" + loc,
      "DESCRIPTION:預約編號 " + (c.booking_reference || "") + " · 上堂出示電子票券 QR Code",
      "BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","DESCRIPTION:ZenPass 課堂 2 小時後開始","END:VALARM",
      "END:VEVENT","END:VCALENDAR",
    ];
    return new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  }

  function render(c){
    const src = c.qr && (c.qr.data_url || c.qr.payload)
      ? (String(c.qr.data_url || c.qr.payload).startsWith("zenpass:")
          ? "/api/qr?raw=1&size=600&text=" + encodeURIComponent(c.qr.payload)
          : c.qr.data_url)
      : "";
    const mapUrl = c.venue_lat && c.venue_lng
      ? `https://www.google.com/maps/search/?api=1&query=${c.venue_lat},${c.venue_lng}`
      : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((c.venue_name || "") + " " + (c.venue_address || ""))}`;
    const when = `${c.date || ""}（${String(c.weekday || "").replace("星期","")}）${c.time || ""}${c.end_time ? "–" + c.end_time : ""}`;

    document.getElementById("passWrap").innerHTML = `
      <div class="top">
        <div class="who">${esc(c.salute ? c.student_name + " " + c.salute : (c.student_name || ""))}</div>
        <div class="k">ZENPASS · ADMIT ONE</div>
        <h1>${esc(c.class_title || "課堂")}</h1>
        <div class="when">${esc(when)}</div>
        <div class="place">📍 ${esc(c.venue_name || "")}</div>
      </div>
      <div class="tear"><div class="line"></div></div>
      <div class="body">
        <div class="qr">${src ? `<img src="${esc(src)}" alt="入場 QR" />` : ""}</div>
        <div class="hint">到場向導師出示此 QR Code 即完成簽到</div>
        <div class="ref">${esc(c.booking_reference || "")}</div>
        <div class="acts">
          <button class="btn btn-primary" id="icsBtn">📅 加入日曆（Apple / Google / Outlook）</button>
          <a class="btn btn-out" id="mapBtn" target="_blank" rel="noopener" href="${esc(mapUrl)}">📍 打開 Google 地圖導航</a>
        </div>
      </div>`;
    document.getElementById("passWrap").style.display = "";
    document.getElementById("tips").style.display = "";
    document.getElementById("muted").textContent = "";
    document.getElementById("icsBtn").onclick = () => {
      const url = URL.createObjectURL(ics(c));
      const a = document.createElement("a");
      a.href = url;
      a.download = "ZenPass-" + (c.booking_reference || "class") + ".ics";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    };
  }

  load().then(render).catch((e) => {
    document.getElementById("muted").innerHTML = `<div class="err">⚠️ ${esc(e.message)}<br>請返回再試，或 WhatsApp 9033 5538</div>`;
  });
})();
</script>
</body>
</html>
