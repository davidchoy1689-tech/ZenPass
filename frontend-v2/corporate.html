<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZenPass for Business · 企業員工健康福利</title>
<link rel="stylesheet" href="/assets/style.css?v=12">
<style>
  body{margin:0;font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  .hero{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;border-radius:20px;padding:26px 22px;margin-bottom:18px}
  .hero h1{margin:0 0 6px;font-size:24px}
  .hero p{margin:0;opacity:.9;font-size:14px;line-height:1.6}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
  input{width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;outline:none}
  input:focus{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.12)}
  button{width:100%;margin-top:12px;padding:14px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#0f766e;color:#fff;cursor:pointer}
  button:disabled{opacity:.55;cursor:not-allowed}
  .muted{color:#64748b;font-size:13px;line-height:1.7}
  .ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  .err{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  .badge{display:inline-block;background:#ecfdf5;color:#065f46;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
  ul{padding-left:18px;margin:8px 0;color:#334155;font-size:14px;line-height:1.9}
  .quota{display:flex;gap:10px;margin-top:12px}
  .quota div{flex:1;background:#f1f5f9;border-radius:12px;padding:12px;text-align:center}
  .quota b{display:block;font-size:22px;color:#0f766e}
  a{color:#0f766e}
</style>
<link rel="stylesheet" href="assets/fonts.css?v=4">
<link rel="preload" href="assets/fonts/NotoSansTC-subset-v3.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🏢 ZenPass for Business</h1>
    <p>企業員工專屬健康福利 — 每月免費堂數，全港 18 區瑜伽、泰拳、痛症小班自由選。免報銷、免發票、App 內一鍵預約。</p>
  </div>

  <div class="card" id="loginCard" style="display:none">
    <p class="muted">請先登入 ZenPass 帳戶，再驗證公司工作電郵。</p>
    <button onclick="location.href='/login.html?next=/corporate.html'">登入 / 註冊</button>
  </div>

  <div class="card" id="verifyCard">
    <label for="workEmail">公司工作電郵</label>
    <input id="workEmail" type="email" placeholder="alex.chan@morganstanley.com" autocomplete="email">
    <button id="sendBtn">✉️ 寄送驗證碼到公司郵箱</button>
    <div id="msg" class="muted" style="margin-top:12px"></div>

    <div id="otpBox" style="display:none;margin-top:16px">
      <label for="otp">6 位驗證碼</label>
      <input id="otp" inputmode="numeric" maxlength="6" placeholder="123456">
      <button id="confirmBtn">✅ 驗證並開通企業福利</button>
    </div>
  </div>

  <div class="card" id="memberCard" style="display:none">
    <span class="badge" id="memberBadge"></span>
    <div class="quota">
      <div><b id="qQuota">0</b><span class="muted">每月配額</span></div>
      <div><b id="qUsed">0</b><span class="muted">已用</span></div>
      <div><b id="qLeft">0</b><span class="muted">剩餘</span></div>
    </div>
    <button onclick="location.href='/explore.html'">🔍 立即預約課堂</button>
    <button style="background:#0ea5e9" onclick="location.href='/corporate-dashboard.html'">📊 企業 HR 看板</button>
  </div>

  <div class="card">
    <b>✨ 合作企業專享</b>
    <ul>
      <li>每月免費 4 堂全港 18 區瑜伽 / 泰拳 / 痛症小班</li>
      <li>免付費、免向公司報銷、App 內一鍵預約</li>
      <li>企業預付款池統一結算，員工零墊支</li>
      <li>企業福利只限本人使用，不可轉贈</li>
    </ul>
    <p class="muted">想為公司開通？請聯絡 <a href="mailto:info.zenpass@gmail.com">info.zenpass@gmail.com</a></p>
  </div>
</div>

<script src="/assets/api.js?v=14"></script>
<script>
const $ = (id) => document.getElementById(id);
function token() { return localStorage.getItem("zenpass_token"); }
function say(el, text, cls) { el.className = "muted " + (cls || ""); el.textContent = text; }

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "content-type": "application/json", authorization: "Bearer " + token(), "x-csrf-token": (window.ZenPassCSRF && ZenPassCSRF()) || "" },
    body: body ? JSON.stringify(body) : undefined,
  });
  return { status: r.status, body: await r.json().catch(() => ({})) };
}

async function refreshMe() {
  if (!token()) { $("loginCard").style.display = "block"; $("verifyCard").style.display = "none"; return; }
  const r = await api("/api/b2b/employee/me");
  const c = r.body.corporate;
  if (c) {
    $("verifyCard").style.display = "none";
    $("memberCard").style.display = "block";
    $("memberBadge").textContent = c.badge;
    const q = r.body.quota || {};
    $("qQuota").textContent = q.quota || 0;
    $("qUsed").textContent = q.used || 0;
    $("qLeft").textContent = q.remaining || 0;
  }
}

$("sendBtn").onclick = async () => {
  const email = $("workEmail").value.trim();
  if (!email) return say($("msg"), "請輸入公司工作電郵", "err");
  $("sendBtn").disabled = true;
  const r = await api("/api/b2b/employee/verify", { work_email: email });
  $("sendBtn").disabled = false;
  if (r.status === 200) {
    say($("msg"), r.body.email_sent ? "驗證碼已寄到你的公司電郵，10 分鐘內有效。" : "驗證碼已生成；如收不到電郵，請聯絡企業管理員。", "ok");
    $("otpBox").style.display = "block";
    if (r.body.dev_code) $("otp").value = r.body.dev_code;
  } else {
    say($("msg"), r.body.error || "發送失敗", "err");
  }
};

$("confirmBtn").onclick = async () => {
  const email = $("workEmail").value.trim();
  const code = $("otp").value.trim();
  if (!/^\d{6}$/.test(code)) return say($("msg"), "請輸入 6 位驗證碼", "err");
  $("confirmBtn").disabled = true;
  const r = await api("/api/b2b/employee/verify/confirm", { work_email: email, code });
  $("confirmBtn").disabled = false;
  if (r.status === 200) {
    say($("msg"), "✅ 已開通 " + r.body.corporate.name + " 企業福利", "ok");
    setTimeout(refreshMe, 600);
  } else {
    say($("msg"), r.body.error || "驗證失敗", "err");
  }
};

refreshMe();
</script>
</body>
</html>
