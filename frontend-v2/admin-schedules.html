<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>更表 · 緊急代堂指派 · ZenPass</title>
<style>
  :root{--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--bg:#F1F5F9;--red:#DC2626;--amber:#D97706;--green:#059669;--blue:#2563EB}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"PingFang HK","Noto Sans HK",sans-serif;background:var(--bg);color:var(--ink);padding:14px 14px 40px}
  .wrap{max-width:1080px;margin:0 auto}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .top a{color:var(--muted);text-decoration:none;font-weight:900;font-size:18px}
  h1{font-size:19px;margin:0}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.ok{background:var(--green);border-color:var(--green);color:#fff}
  .btn.warn{background:#FFFBEB;border-color:#FCD34D;color:#92400E}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input[type=date]{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;background:#fff}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:first-child{grid-column:1/-1}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .kpi .l{font-size:11.5px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:23px;font-weight:900;margin-top:4px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .session{padding:14px;border-bottom:1px solid #F1F5F9}
  .session:last-child{border-bottom:0}
  .srow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .time{font-size:15px;font-weight:900;min-width:76px}
  .title{font-weight:900;font-size:14.5px}
  .meta{color:var(--muted);font-size:12px;line-height:1.6;margin-top:3px}
  .chip{display:inline-block;font-size:10.5px;font-weight:900;border-radius:999px;padding:4px 9px;white-space:nowrap}
  .chip.orange{background:#FEF3C7;color:#92400E}
  .chip.green{background:#DCFCE7;color:#065F46}
  .chip.red{background:#FEE2E2;color:#991B1B}
  .chip.blue{background:#DBEAFE;color:#1E40AF}
  .chip.grey{background:#E2E8F0;color:#334155}
  .empty{text-align:center;color:#94A3B8;padding:44px 16px;font-size:13px}
  .drawer-bg{position:fixed;inset:0;background:rgba(15,23,42,.56);display:flex;justify-content:flex-end;z-index:9998}
  .drawer-bg[hidden]{display:none}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.56);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9998}
  .modal-bg[hidden]{display:none}
  .drawer{background:#fff;width:100%;max-width:560px;height:100%;overflow:auto;box-shadow:-20px 0 60px rgba(15,23,42,.25)}
  .dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;z-index:2}
  .dh h2{font-size:16px;margin:0 0 3px}
  .x{border:0;background:#F1F5F9;border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer;color:#475569}
  .db{padding:14px 16px 26px}
  .sec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .sec h3{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .cand{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;cursor:pointer}
  .cand.on{border-color:var(--blue);background:#F8FAFF}
  .cand.dis{opacity:.55;cursor:not-allowed}
  .cand .nm{font-weight:900;font-size:13.5px}
  .cand .pl{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.55}
  .cand input{margin-top:3px;width:17px;height:17px;accent-color:var(--blue)}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:10px;font-weight:800;background:#F1F5F9;color:#475569;border-radius:999px;padding:2px 7px}
  .tag.ok{background:#DCFCE7;color:#065F46}
  .tag.bad{background:#FEE2E2;color:#991B1B}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:6px}
  .warn{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-bottom:10px}
  .good{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-bottom:10px}
  .blue{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF;border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-bottom:10px}
  textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;min-height:66px;resize:vertical}
  .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:#0F172A;color:#fff;padding:10px 16px;border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;transition:.22s;z-index:99999;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .toast.err{background:#991B1B}
  .inc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .inc-actions .btn{padding:6px 10px;font-size:11.5px}

    /* 桌面寬屏（zp-wide）：手機不變 */
    @media (min-width: 768px) and (max-width: 1023px) {
      body.zp-wide .wrap, body.zp-wide .topbar, body.zp-wide .bottomnav { max-width: 860px; }
    }
    @media (min-width: 1024px) {
      body.zp-wide .wrap, body.zp-wide .topbar, body.zp-wide .bottomnav { max-width: 1240px; }
    }
</style>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body class="zp-wide">
<div class="wrap">
  <div class="top">
    <a href="admin-ops.html">‹</a>
    <div>
      <h1>⚡ 緊急代堂指派</h1>
      <div class="sub">原教練被熔斷時，一鍵轉移課堂、PLI 雙軌覆蓋、點名冊即時交接。</div>
    </div>
    <div class="spacer"></div>
    <a class="btn" href="admin-risk-console.html">🚨 風控台</a>
  </div>

  <div class="bar">
    <input type="date" id="date" />
    <label style="font-size:12.5px;font-weight:800;color:#475569;display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="showAll" style="width:16px;height:16px" /> 顯示全部班次
    </label>
    <button class="btn" id="refresh">↻ 重新整理</button>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="l">受影響班次</div><div class="v" id="kTotal">—</div></div>
    <div class="kpi"><div class="l">待安排代堂</div><div class="v" id="kOpen" style="color:#B45309">—</div></div>
    <div class="kpi"><div class="l">已覆蓋</div><div class="v" id="kDone" style="color:#047857">—</div></div>
  </div>

  <div class="panel" id="list"><div class="empty">載入中…</div></div>
</div>

<div class="drawer-bg" id="drBg" hidden>
  <div class="drawer">
    <div class="dh">
      <div><h2>⚡ 指派代堂</h2><div class="sub" id="drSub"></div></div>
      <button class="x" id="drClose">✕</button>
    </div>
    <div class="db" id="drBody"></div>
  </div>
</div>
<div class="modal-bg" id="incBg" hidden>
  <div style="background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(15,23,42,.28)">
    <div class="dh"><div><h2 style="color:#B91C1C">🚨 登記意外事故</h2><div class="sub" id="incSub"></div></div><button class="x" id="incClose">✕</button></div>
    <div class="db">
      <div class="warn">請如實記錄事發時間與現場處置；報告會同 PLI 保單時序比對，匯出後封存 SHA-256。</div>
      <label style="font-size:12px;font-weight:800;color:#64748B">受傷學員</label>
      <select id="incStudent" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin-bottom:8px"></select>
      <div id="incManual" style="display:none">
        <input id="incName" placeholder="學員姓名" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin-bottom:8px" />
        <input id="incPhone" inputmode="numeric" placeholder="學員電話" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin-bottom:8px" />
      </div>
      <label style="font-size:12px;font-weight:800;color:#64748B">事故時間（HKT）</label>
      <input type="datetime-local" id="incTime" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin-bottom:8px" />
      <div style="display:flex;gap:8px">
        <select id="incType" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px">
          <option value="">事故分類 *</option>
          <option value="slip_and_fall">跌倒滑倒</option>
          <option value="joint_muscle_strain">關節扭傷／拉傷</option>
          <option value="dizziness_faint">頭暈昏厥／血壓不適</option>
          <option value="collision">碰撞／擦傷</option>
          <option value="cardiovascular">心血管急症</option>
          <option value="other">其他突發</option>
        </select>
        <select id="incSeverity" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px">
          <option value="">嚴重程度 *</option>
          <option value="minor">輕微（現場處理後自行離場）</option>
          <option value="moderate">中度（需親友陪同就醫）</option>
          <option value="severe">嚴重（999 送急症室）</option>
          <option value="critical">危殆／重大事故</option>
        </select>
      </div>
      <input id="incInjury" placeholder="受傷部位 *（例：左膝關節、右腕骨）" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin-top:8px" />
      <label style="font-size:12px;font-weight:800;color:#64748B;display:block;margin-top:8px">事發經過 *（至少 20 字，含動作名稱與環境）</label>
      <textarea id="incDesc" placeholder="例：10:45 進行下肢伸展時失去平衡跌坐地面，左膝著地挫傷，當時地面乾爽、使用椅子輔助"></textarea>
      <div class="hint" id="incCount">0 / 20 字</div>
      <label style="font-size:12px;font-weight:800;color:#64748B;display:block;margin-top:8px">現場即時急救處置 *（至少 5 字）</label>
      <textarea id="incAction" placeholder="例：暫停全班動作、RICE 冰敷、量度血壓、坐椅休息"></textarea>
      <div class="sec" style="margin-top:10px">
        <label class="chk" style="border-bottom:0"><input type="checkbox" id="incAmb" /> 已召喚 999 救護車</label>
        <div id="incAmbBox" style="display:none;margin-top:6px">
          <input type="datetime-local" id="incAmbTime" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin-bottom:6px" />
          <input id="incHospital" placeholder="送往醫院（例：瑪嘉烈醫院急症室）" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px" />
        </div>
      </div>
      <div class="sec">
        <label class="chk" style="border-bottom:0"><input type="checkbox" id="incGuardianNotified" /> 已通知家長／監護人</label>
        <div id="incGuardianBox" style="display:none;margin-top:6px">
          <input id="incGuardian" placeholder="監護人姓名" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin-bottom:6px" />
          <input id="incGuardianPhone" inputmode="numeric" placeholder="已通知的監護人電話（8 位）" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px" />
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="incInsNotified" /> 已通知保險公司</label>
      <input id="incCaseNo" placeholder="保險索償案號（可後補）" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin-top:6px" />
      <div class="acts"><button class="btn" id="incCancel">取消</button><button class="btn" style="background:#B91C1C;border-color:#B91C1C;color:#fff" id="incSave">儲存事故紀錄</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/api.js?v=16"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const hkTime = (v) => { const d = new Date(String(v).replace(" ", "T") + "Z"); return isNaN(d) ? "—" : d.toLocaleTimeString("zh-HK", { timeZone: "Asia/Hong_Kong", hour: "2-digit", minute: "2-digit", hour12: false }); };
const hkDate = (v) => { const d = new Date(String(v).replace(" ", "T") + "Z"); return isNaN(d) ? "—" : d.toLocaleDateString("zh-HK", { timeZone: "Asia/Hong_Kong", month: "2-digit", day: "2-digit", weekday: "short" }); };
const money = (n) => "HK$ " + Number(n || 0).toLocaleString("en-HK");

let SESSIONS = [];
let CURRENT = null;
let PICK = null;
let SHOW_ALL = false;

function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600);
}

async function load() {
  const d = $("date").value || new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const r = await api.get("/admin/emergency-sessions?date=" + encodeURIComponent(d) + (SHOW_ALL ? "&all=1" : ""));
  if (!r.ok) { $("list").innerHTML = `<div class="empty">${esc((r.data && r.data.error) || "讀取失敗")}</div>`; return; }
  SESSIONS = (r.data.data && r.data.data.sessions) || [];
  $("kTotal").textContent = SESSIONS.length;
  $("kOpen").textContent = SESSIONS.filter(
    (s) => !s.coach_override_id && (s.payout_status === "frozen_stolen" || Number(s.is_active) === 0),
  ).length;
  $("kDone").textContent = SESSIONS.filter((s) => !!s.coach_override_id).length;
  if (!SESSIONS.length) {
    $("list").innerHTML = '<div class="empty">✓ 當日冇被熔斷教練的班次</div>';
    return;
  }
  $("list").innerHTML = SESSIONS.map((s) => `
    <div class="session">
      <div class="srow">
        <div style="display:flex;gap:12px;min-width:0">
          <div class="time">${esc(hkTime(s.start_time))}<div class="meta">${esc(hkTime(s.end_time))}</div></div>
          <div style="min-width:0">
            <div class="title">${esc(s.title)}</div>
            <div class="meta">
              ${esc(hkDate(s.start_time))} · ${esc(s.district || "")} · ${esc(s.venue_name || "")}<br>
              原教練 <b>${esc(s.original_coach_name || s.original_coach_id)}</b>
              ${s.payout_status === "frozen_stolen"
                ? '<span class="chip red" style="margin-left:6px">🚨 已熔斷</span>'
                : Number(s.is_active) === 0
                  ? '<span class="chip red" style="margin-left:6px">已停用</span>'
                  : ""}
              · ${Number(s.enrolled_count) || 0}/${Number(s.max_participants) || 0} 人
            </div>
          </div>
        </div>
        <div style="text-align:right;min-width:160px">
          ${s.coach_override_id
            ? `<span class="chip green">✓ 代堂中（${esc(s.substitute_name || s.coach_override_id)}）</span>
               <div class="meta">點名冊已轉移</div>`
            : s.payout_status === "frozen_stolen" || Number(s.is_active) === 0
              ? `<span class="chip orange">⚠️ 待安排代堂</span>
               <div style="margin-top:8px"><button class="btn warn" data-go="${esc(s.id)}">⚡ 一鍵指派代堂</button></div>`
              : `<span class="chip grey">正常班次</span>`}
          }
          <div class="inc-actions">${incidentControls(s)}</div>
        </div>
      </div>
    </div>`).join("");
  $("list").querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => openDrawer(b.dataset.go)));
  $("list").querySelectorAll("[data-inc]").forEach((b) => (b.onclick = () => openIncident(b.dataset.inc)));
  $("list").querySelectorAll("[data-exp]").forEach((b) => (b.onclick = () => downloadDossier(b.dataset.exp, b.dataset.fmt)));
}

function incidentControls(s) {
  const has = Number(s.incident_count) > 0;
  const buttons = [
    has
      ? `<span class="chip red">🚨 事故已登記</span>`
      : `<button class="btn" data-inc="${esc(s.id)}">🚨 登記意外事故</button>`,
  ];
  if (has) {
    for (const f of ["pdf", "csv", "json"]) {
      buttons.push(`<button class="btn" data-exp="${esc(s.id)}" data-fmt="${f}">📥 ${f.toUpperCase()}</button>`);
    }
  }
  if (!s.has_insurance && !has) buttons.push(`<span class="meta" style="color:#B45309">未見 PLI 備案</span>`);
  return buttons.join("");
}

async function openDrawer(scheduleId) {
  PICK = null;
  const s = SESSIONS.find((x) => x.id === scheduleId);
  if (!s) return;
  CURRENT = s;
  $("drSub").textContent = `${s.title} · ${hkDate(s.start_time)} ${hkTime(s.start_time)}`;
  $("drBody").innerHTML = '<div class="empty">正在核對資質與保險…</div>';
  $("drBg").hidden = false;
  const r = await api.get("/admin/emergency-candidates?schedule_id=" + encodeURIComponent(scheduleId));
  if (!r.ok) {
    $("drBody").innerHTML = `<div class="warn">${esc((r.data && r.data.error) || "無法載入候選教練")}</div>`;
    return;
  }
  const d = r.data.data;
  const umb = d.umbrella || {};
  const list = d.candidates || [];
  const avail = list.filter((c) => c.eligible);
  $("drBody").innerHTML = `
    <div class="blue">
      <b>${esc(s.title)}</b><br>
      ${esc(hkDate(s.start_time))} ${esc(hkTime(s.start_time))}–${esc(hkTime(s.end_time))} · ${esc(s.venue_name || "")}<br>
      原教練：<b>${esc(s.original_coach_name)}</b>（已熔斷） · 學員 ${Number(s.enrolled_count) || 0} 人
    </div>
    <div class="sec">
      <h3>合資格代堂教練（${avail.length}）</h3>
      ${list.length ? list.map((c) => `
        <label class="cand ${c.eligible ? "" : "dis"}" data-c="${esc(c.id)}">
          <input type="radio" name="pick" value="${esc(c.id)}" ${c.eligible ? "" : "disabled"} />
          <div style="flex:1;min-width:0">
            <div class="nm">${esc(c.name)} ${c.district_match ? '<span class="chip blue">同區</span>' : ""}</div>
            <div class="pl">${esc(c.license_type || "教練")} · ⭐ ${Number(c.rating || 0).toFixed(1)} · ${esc(c.phone_masked || "")}</div>
            <div class="tags">
              ${(c.qualified_sports || []).slice(0, 4).map((x) => `<span class="tag ok">${esc(x)}</span>`).join("")}
              <span class="tag ${c.pli_source === "personal" ? "ok" : c.pli_source === "umbrella" ? "" : "bad"}">${esc(c.pli_label)}</span>
            </div>
            ${c.blockers.length ? `<div class="pl" style="color:#B91C1C">✕ ${esc(c.blockers.join("；"))}</div>` : ""}
          </div>
        </label>`).join("") : '<div class="empty">冇合資格教練</div>'}
    </div>
    <div id="pliBox"></div>
    <div class="sec">
      <h3>指派原因（必填）</h3>
      <textarea id="reason" placeholder="例：原教練帳號遭入侵已熔斷，需即時安排代堂"></textarea>
      <div class="hint">指派後即時轉移點名冊／手冊權限；學員與代堂教練會收到通知；保險憑證寫入 schedule_insurance_logs。</div>
    </div>
    <div class="acts">
      <button class="btn" id="cancel">取消</button>
      <button class="btn primary" id="confirm" disabled>確認緊急代堂</button>
    </div>`;

  $("drBody").querySelectorAll("input[name=pick]").forEach((el) => {
    el.onchange = () => {
      PICK = (d.candidates || []).find((c) => c.id === el.value) || null;
      document.querySelectorAll(".cand").forEach((x) => x.classList.toggle("on", x.dataset.c === el.value));
      renderPli(umb);
    };
  });
  $("cancel").onclick = () => ($("drBg").hidden = true);
  $("confirm").onclick = () => submitAssign();
}

function renderPli(umb) {
  const box = $("pliBox");
  if (!PICK) { box.innerHTML = ""; return; }
  if (PICK.pli_source === "personal") {
    box.innerHTML = `<div class="good">✅ PLI 審核通過：代堂教練個人保單有效（至 ${esc(PICK.insurance_expiry || "")}）</div>`;
  } else if (PICK.pli_source === "umbrella") {
    box.innerHTML = `<div class="good">✅ PLI 審核通過：平台保險單生效（保額 ${money(umb.coverage_hkd)}）<br>
      <span style="font-size:11.5px">${esc(umb.insurer || "")} · ${esc(umb.policy_no || "")} · 已自動啟用臨時覆蓋</span></div>`;
  } else {
    box.innerHTML = `<div class="warn">此教練冇有效 PLI，平台底網亦未啟用，無法指派。</div>`;
  }
  $("confirm").disabled = !(PICK.eligible && PICK.pli_source);
}

async function submitAssign() {
  if (!PICK || !CURRENT) return;
  const reason = ($("reason") && $("reason").value || "").trim();
  if (reason.length < 4) return toast("請填寫指派原因（最少 4 字）", true);
  const btn = $("confirm"); btn.disabled = true;
  const r = await api.post("/admin/schedules/" + encodeURIComponent(CURRENT.id) + "/assign-substitute", {
    substitute_coach_id: PICK.id,
    reason,
    force_platform_pli: PICK.pli_source === "umbrella",
  });
  if (!r.ok) {
    toast((r.data && r.data.error) || "指派失敗", true);
    btn.disabled = false;
    return;
  }
  const out = (r.data && r.data.data) || {};
  toast(`✅ 已指派代堂${out.pli_coverage_source === "platform_umbrella_pli" ? "（平台 PLI）" : ""}，權限即時轉移`);
  $("drBg").hidden = true;
  load();
}

$("drClose").onclick = () => ($("drBg").hidden = true);
$("drBg").onclick = (e) => { if (e.target === $("drBg")) $("drBg").hidden = true; };

let INC_SESSION = null;
function toLocalInput(utc) {
  const d = new Date(String(utc).replace(" ", "T") + "Z");
  if (isNaN(d)) return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 16);
  return new Date(d.getTime() + 8 * 3600e3).toISOString().slice(0, 16);
}
async function openIncident(id) {
  const s = SESSIONS.find((x) => x.id === id);
  if (!s) return;
  INC_SESSION = s;
  $("incSub").textContent = `${s.title} · ${hkDate(s.start_time)} ${hkTime(s.start_time)}`;
  const nowHk = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 16);
  const sStart = toLocalInput(s.start_time);
  const sEnd = toLocalInput(s.end_time);
  $("incTime").value = nowHk < sStart ? sStart : nowHk > sEnd ? sEnd : nowHk;
  $("incType").value = "";
  $("incInjury").value = "";
  $("incDesc").value = "";
  $("incCount").textContent = "0 / 20 字";
  $("incAction").value = "";
  $("incSeverity").value = "";
  $("incAmb").checked = false;
  $("incAmbBox").style.display = "none";
  $("incAmbTime").value = "";
  $("incHospital").value = "";
  $("incGuardianNotified").checked = false;
  $("incGuardianBox").style.display = "none";
  $("incGuardian").value = "";
  $("incGuardianPhone").value = "";
  $("incInsNotified").checked = false;
  $("incCaseNo").value = "";
  $("incStudent").innerHTML = '<option value="">載入名單中…</option>';
  $("incBg").hidden = false;
  const r = await api.get("/admin/schedules/" + encodeURIComponent(id) + "/roster");
  const list = (r.ok && r.data.data) || [];
  $("incStudent").innerHTML =
    '<option value="">請選擇受傷學員</option>' +
    list.map((x) => `<option value="${esc(x.user_id)}">${esc(x.student_name)} · ${esc(x.phone_masked || "")}</option>`).join("") +
    '<option value="__manual">其他／不在名單</option>';
  $("incStudent").onchange = () => {
    $("incManual").style.display = $("incStudent").value === "__manual" ? "block" : "none";
  };
}

$("incDesc").oninput = () => {
  const n = $("incDesc").value.trim().length;
  $("incCount").textContent = n + " / 20 字";
  $("incCount").style.color = n >= 20 ? "#047857" : "#B45309";
};
$("incAmb").onchange = () => { $("incAmbBox").style.display = $("incAmb").checked ? "block" : "none"; };
$("incGuardianNotified").onchange = () => { $("incGuardianBox").style.display = $("incGuardianNotified").checked ? "block" : "none"; };

$("incClose").onclick = $("incCancel").onclick = () => ($("incBg").hidden = true);
$("incBg").onclick = (e) => { if (e.target === $("incBg")) $("incBg").hidden = true; };
$("incSave").onclick = async () => {
  if (!INC_SESSION) return;
  const sel = $("incStudent").value;
  const manual = sel === "__manual";
  const name = manual ? $("incName").value.trim() : "";
  const phone = manual ? $("incPhone").value.trim().replace(/\D/g, "").replace(/^852/, "") : "";
  const type = $("incType").value;
  const severity = $("incSeverity").value;
  const injury = $("incInjury").value.trim();
  const desc = $("incDesc").value.trim();
  const firstAid = $("incAction").value.trim();
  const timeVal = $("incTime").value;
  if (!sel) return toast("請選擇受傷學員", true);
  if (manual && name.length < 2) return toast("請填寫受傷長者真實姓名（至少 2 字）", true);
  if (manual && !/^[4-9]\d{7}$/.test(phone)) return toast("請提供有效的 8 位香港聯絡電話", true);
  if (!timeVal) return toast("請選擇具體事發時間", true);
  const incDate = new Date(timeVal + ":00+08:00");
  if (incDate.getTime() > Date.now() + 2 * 60 * 1000) return toast("事發時間不能晚於當前時間", true);
  const start = new Date(String(INC_SESSION.start_time).replace(" ", "T") + "Z");
  const end = new Date(String(INC_SESSION.end_time).replace(" ", "T") + "Z");
  if (incDate < new Date(start.getTime() - 30 * 60 * 1000) || incDate > new Date(end.getTime() + 30 * 60 * 1000)) {
    return toast("事發時間超出本班次現場責任覆蓋時段（課前／課後 30 分鐘外）", true);
  }
  if (!type) return toast("請選取事故分類", true);
  if (!severity) return toast("請選取嚴重程度", true);
  if (injury.length < 2) return toast("請註明受傷身體部位", true);
  if (desc.length < 20) return toast(`事發經過至少 20 字（目前 ${desc.length} 字）`, true);
  if (firstAid.length < 5) return toast("請記錄現場即時急救處置（至少 5 字）", true);
  const amb = $("incAmb").checked;
  if (["severe", "critical"].includes(severity) && !amb) return toast("嚴重／危殆級事故必須召喚 999 救護車", true);
  if (amb && !$("incAmbTime").value) return toast("請填寫致電 999 時間", true);
  if (amb && $("incHospital").value.trim().length < 2) return toast("請填寫送往醫院名稱", true);
  const gNotified = $("incGuardianNotified").checked;
  const gPhone = $("incGuardianPhone").value.trim().replace(/\D/g, "").replace(/^852/, "");
  if (gNotified && !/^[4-9]\d{7}$/.test(gPhone)) return toast("請填寫已通知的監護人 8 位香港電話", true);
  const body = {
    student_user_id: manual ? null : sel,
    student_name: manual ? name : undefined,
    student_phone: manual ? phone : undefined,
    incident_time: timeVal,
    incident_type: type,
    severity_level: severity,
    injury_location: injury,
    description: desc,
    first_aid_given: firstAid,
    ambulance_called: amb,
    ambulance_call_time: amb ? $("incAmbTime").value : null,
    hospital_name: amb ? $("incHospital").value.trim() : null,
    guardian_notified: gNotified,
    guardian_phone_notified: gNotified ? gPhone : null,
    guardian_name: $("incGuardian").value.trim(),
    guardian_phone: gNotified ? gPhone : null,
    insurance_notified: $("incInsNotified").checked,
    insurance_case_no: $("incCaseNo").value.trim() || null,
  };
  const btn = $("incSave");
  btn.disabled = true;
  try {
    const r = await api.post("/admin/schedules/" + encodeURIComponent(INC_SESSION.id) + "/incidents", body);
    if (!r.ok) return toast((r.data && r.data.error) || "登記失敗", true);
    toast("🚨 事故已登記，可匯出索償報告");
    $("incBg").hidden = true;
    load();
  } finally {
    btn.disabled = false;
  }
};

async function downloadDossier(id, fmt) {
  const token = localStorage.getItem("zenpass_token") || "";
  const url = "/api/admin/schedules/" + encodeURIComponent(id) + "/export-pli-incident?format=" + encodeURIComponent(fmt);
  toast("正在生成報告…");
  try {
    const res = await fetch(url, { credentials: "include", headers: token ? { Authorization: "Bearer " + token } : {} });
    if (!res.ok) {
      let msg = "匯出失敗";
      try { const j = await res.json(); msg = j.error || msg; } catch (e) {}
      return toast(msg, true);
    }
    const blob = await res.blob();
    const cd = res.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename="([^"]+)"/);
    const name = m ? m[1] : `ZP-CLIENT-${id}.${fmt}`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("✅ 報告已下載");
  } catch (e) {
    toast("匯出失敗", true);
  }
}

$("refresh").onclick = load;
$("date").onchange = load;
$("showAll").onchange = () => { SHOW_ALL = $("showAll").checked; load(); };

  const me = await api.me();
  if (!me.ok) { location.href = "login.html?next=" + encodeURIComponent(location.pathname); return; }
  $("date").value = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  load();
})();
