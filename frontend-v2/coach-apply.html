<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>成為教練 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <style>
    .fld{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:inherit;background:var(--surface);color:var(--text)}
    label.lbl{font-size:13px;color:var(--text-muted);display:block;margin:10px 0 4px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
    .chips label{font-size:13px;border:1px solid var(--border);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--surface)}
    .chips input{display:none}
    .chips input:checked + span{color:var(--brand-600);font-weight:700}
    .chips label.on{border-color:var(--brand-500);background:#fff5f0}
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">成為教練</div></div>
  <div class="wrap">
    <div id="status"></div>
    <div id="form">
      <div class="card" style="margin-bottom:10px"><div class="body">
        <b>點解做 ZenPass 教練？</b>
        <div class="muted" style="font-size:13px;margin-top:6px;line-height:1.9">
          ✅ 自由接單，時間自己話事<br>
          ✅ 平台幫你收錢、準時出糧<br>
          ✅ 接觸更多學生同場地<br>
          ✅ 免費上架你嘅課程
        </div>
        <a class="btn btn-secondary btn-block" href="https://wa.me/85290335538?text=%E6%88%91%E6%83%B3%E7%94%B3%E8%AB%8B%E5%81%9AZenPass%E6%95%99%E7%B7%B4" target="_blank" rel="noopener" style="margin-top:10px">💬 WhatsApp 即刻查詢</a>
      </div></div>
      <p class="muted" style="font-size:13px">填寫資料後，我哋會喺 3 個工作日內完成審批。</p>
      <label class="lbl">姓名 *</label><input class="fld" id="f-name" />
      <label class="lbl">頭銜 / 標語（顯示於課程頁）</label><input class="fld" id="f-headline" placeholder="例：新興運動教練 · 10 年經驗" />
      <label class="lbl">電話 *</label><input class="fld" id="f-phone" type="tel" />
      <label class="lbl">電郵 *</label><input class="fld" id="f-email" type="email" />
      <div class="grid2">
        <div><label class="lbl">年資（年）</label><input class="fld" id="f-years" type="number" min="0" /></div>
        <div><label class="lbl">證書 / 資格（可選）</label><input class="fld" id="f-certs" placeholder="例：NSCA-CPT" /></div>
      </div>
      <label class="lbl">專長（可多選）</label>
      <div class="chips" id="specialties"></div>
      <label class="lbl">簡介（會顯示於課程詳情頁）</label><textarea class="fld" id="f-bio" rows="4" placeholder="例：10 年新興運動教學經驗，擅長用遊戲方式帶新手掌握技巧，服務過 30+ 學校同企業團隊。"></textarea>
      <label class="lbl">授課語言（可多選）</label>
      <div class="chips" id="langs"></div>
      <label class="lbl">頭像連結（可選，https://…）</label><input class="fld" id="f-avatar" placeholder="https://…" />
      <label class="lbl">身份證明文件 *（JPG / PNG / PDF）</label>
      <input class="fld" id="f-iddoc" type="file" accept="image/*,application/pdf" />
      <label class="lbl">資歷／證書證明 *（可影多張，最多 3 個）</label>
      <input class="fld" id="f-certdoc" type="file" accept="image/*,application/pdf" multiple />
      <div class="card" style="margin-top:12px;background:#fff7ed;border:1px solid #fed7aa"><div class="body" style="padding:12px">
        <b style="font-size:13.5px">🛡️ 保險及風險聲明 *</b>
        <p class="muted" style="font-size:12.5px;margin:6px 0">ZenPass 只提供配對（轉介）平台，課堂由你以獨立服務提供者身分提供。<b>公眾責任保險及相關風險由你自行負責</b>，請按個別情況購買合適保險。</p>
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:6px">
          <input type="checkbox" id="f-ins" style="margin-top:3px" />
          <span>本人確認已購買（或將於開班前購買）適用嘅公眾責任保險，並會保持有效。</span>
        </label>
        <div class="grid2" style="margin-top:10px">
          <div><label class="lbl">保單到期日（可選）</label><input class="fld" id="f-ins-exp" type="date" /></div>
          <div><label class="lbl">上載保單（可選）</label><input class="fld" id="f-ins-doc" type="file" accept="image/*,application/pdf" /></div>
        </div>
      </div></div>
      <label class="lbl">慣用場地名稱（可選）</label><input class="fld" id="f-venue" />
      <label class="lbl">居住地區 / 地址 *</label><input class="fld" id="f-address" />
      <div class="spacer"></div>
      <button class="btn btn-primary btn-block" id="submit">提交申請</button>
      <div id="msg" class="center muted" style="font-size:13px;margin-top:10px"></div>
    </div>
    <div class="spacer"></div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    const SPECS = ["芬蘭木柱","地板冰壺","布袋球","穿雲箭","北歐式健步行","圓網球","柔力球","健體","瑜伽","伸展","兒童健體","其他"];
    const LANGS = ["廣東話","English","普通話"];
    let chosen = new Set();
    const chosenLang = new Set();

    (async () => {
      if (!api.requireLogin("coach-apply.html")) return;
      // 專長 chips
      document.getElementById("specialties").innerHTML = SPECS.map(s =>
        `<label><input type="checkbox" value="${s}"><span>${s}</span></label>`).join("");
      document.querySelectorAll("#specialties input").forEach(cb => cb.onchange = () => {
        cb.closest("label").classList.toggle("on", cb.checked);
        if (cb.checked) chosen.add(cb.value); else chosen.delete(cb.value);
      });
      document.getElementById("langs").innerHTML = LANGS.map(s =>
        `<label><input type="checkbox" value="${s}"><span>${s}</span></label>`).join("");
      document.querySelectorAll("#langs input").forEach(cb => cb.onchange = () => {
        cb.closest("label").classList.toggle("on", cb.checked);
        if (cb.checked) chosenLang.add(cb.value); else chosenLang.delete(cb.value);
      });
      // 姓名 / 電郵 / 電話一律留空，唔預填帳戶資料
      // 已有申請？
      const ap = await api.get("/coach/application");
      const app = ap.data && ap.data.application;
      if (app) { showStatus(app); if (app.status === "approved") await showProfileEditor(); }
      document.getElementById("submit").onclick = submit;
    })();

    const statusText = (s) => ({ pending: "⏳ 審批中", approved: "✅ 已通過", rejected: "❌ 未通過" }[s] || s);

    function showStatus(app) {
      document.getElementById("form").style.display = "none";
      document.getElementById("status").innerHTML =
        `<div class="card"><div class="body">
          <h3 style="margin:0 0 6px">你嘅申請</h3>
          <p class="muted" style="margin:0;font-size:13px">編號：${esc(app.application_reference || "")} · ${statusText(app.status)}</p>
          <p class="muted" style="margin:8px 0 0;font-size:13px">提交時間：${esc((app.created_at || "").slice(0, 16))}</p>
        </div></div>`;
    }

    /* 已批核教練 → 可直接維護公開資料（會自動顯示於課程頁） */
    async function showProfileEditor() {
      const r = await api.get("/coach/public-profile");
      const d = (r.data && r.data.data) || {};
      const tags = String(d.coach_tags || "").split(",").filter(Boolean);
      const langs = String(d.coach_languages || "").split(",").filter(Boolean);
      const box = document.getElementById("status");
      box.innerHTML +=
        `<div class="card" style="margin-top:10px"><div class="body">
          <h3 style="margin:0 0 4px">🪪 我的教練資料</h3>
          <p class="muted" style="font-size:12.5px;margin:0 0 10px">呢啲資料會自動顯示喺你每個課程嘅詳情頁。</p>
          <label class="lbl">頭銜 / 標語</label><input class="fld" id="p-headline" value="${esc(d.coach_headline || "")}" />
          <label class="lbl">簡介</label><textarea class="fld" id="p-bio" rows="4">${esc(d.coach_bio || "")}</textarea>
          <div class="grid2">
            <div><label class="lbl">教學年資（年）</label><input class="fld" id="p-years" type="number" min="0" value="${d.coach_years || ""}" /></div>
            <div><label class="lbl">頭像連結</label><input class="fld" id="p-avatar" value="${esc(d.avatar_url || "")}" /></div>
          </div>
          <label class="lbl">資歷 / 標籤（逗號分隔）</label><input class="fld" id="p-tags" value="${esc(tags.join(", "))}" placeholder="認可導師, 新手友善" />
          <label class="lbl">授課語言（逗號分隔）</label><input class="fld" id="p-langs" value="${esc(langs.join(", "))}" placeholder="廣東話, English" />
          <button class="btn btn-primary btn-block" id="p-save" style="margin-top:12px">儲存教練資料</button>
          <div id="p-msg" class="center muted" style="font-size:13px;margin-top:8px"></div>
        </div></div>`;
      document.getElementById("p-save").onclick = async () => {
        const btn = document.getElementById("p-save");
        btn.disabled = true; btn.textContent = "儲存中…";
        const body = {
          headline: document.getElementById("p-headline").value.trim(),
          bio: document.getElementById("p-bio").value.trim(),
          years: document.getElementById("p-years").value,
          avatar_url: document.getElementById("p-avatar").value.trim(),
          tags: document.getElementById("p-tags").value.split(",").map(x => x.trim()).filter(Boolean),
          languages: document.getElementById("p-langs").value.split(",").map(x => x.trim()).filter(Boolean),
        };
        const res2 = await api.post("/coach/public-profile", body);
        btn.disabled = false; btn.textContent = "儲存教練資料";
        document.getElementById("p-msg").textContent = res2.ok ? "✅ 已儲存，課程頁會即時更新" : ((res2.data && res2.data.error) || "儲存失敗");
      };
    }

    /* 上載證明文件 → 回傳 URL */
    async function uploadDocs(files) {
      if (!files || !files.length) return [];
      const fd = new FormData();
      for (const f of files) fd.append("files", f);
      const conf = await api.get("/csrf-token").catch(() => null);
      const res = await fetch((window.API_BASE || "") + "/api/upload", {
        method: "POST",
        credentials: "include",
        headers: conf && conf.data && conf.data.token ? { "x-csrf-token": conf.data.token } : {},
        body: fd,
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || "上載失敗");
      return (j.files || []).map(x => x.url).filter(Boolean);
    }

    async function submit() {
      const msg = document.getElementById("msg");
      const body = {
        name: document.getElementById("f-name").value.trim(),
        phone: document.getElementById("f-phone").value.trim(),
        email: document.getElementById("f-email").value.trim(),
        venue_address: document.getElementById("f-address").value.trim(),
        years_experience: document.getElementById("f-years").value || null,
        certificates: document.getElementById("f-certs").value.trim() || null,
        specialties: [...chosen],
        bio: document.getElementById("f-bio").value.trim() || null,
        venue_name: document.getElementById("f-venue").value.trim() || null,
        headline: document.getElementById("f-headline").value.trim() || null,
        languages: [...chosenLang],
        avatar_url: document.getElementById("f-avatar").value.trim() || null,
      };

      // 📎 上載證明文件（身份證 + 資歷證書）
      if (!document.getElementById("f-ins").checked) {
        msg.textContent = "請確認保險聲明（平台只提供配對，保險由教練自行負責）";
        return;
      }
      const idFiles = document.getElementById("f-iddoc").files;
      const certFiles = document.getElementById("f-certdoc").files;
      if (!idFiles.length) { msg.textContent = "請上載身份證明文件（用於核實身份）"; return; }
      if (!certFiles.length) { msg.textContent = "請上載最少一份資歷／證書"; return; }
      const btn0 = document.getElementById("submit");
      if (btn0) { btn0.disabled = true; btn0.textContent = "上載文件中…"; }
      try {
        const ids = await uploadDocs(idFiles);
        const certs = await uploadDocs(Array.from(certFiles).slice(0, 3));
        body.id_doc_url = ids[0] || null;
        body.cert_doc_url = certs.join(",") || null;
        if (!body.id_doc_url) throw new Error("身份證上載失敗");
        body.insurance_declared = true;
        body.insurance_expiry = document.getElementById("f-ins-exp").value || null;
        const insFile = document.getElementById("f-ins-doc").files;
        if (insFile.length) {
          const urls = await uploadDocs(insFile);
          body.insurance_doc_url = urls[0] || null;
        }
      } catch (e) {
        msg.textContent = "文件上載失敗：" + e.message;
        if (btn0) { btn0.disabled = false; btn0.textContent = "提交申請"; }
        return;
      }
      if (btn0) { btn0.disabled = false; btn0.textContent = "提交申請"; }
      if (!body.name || !body.phone || !body.email || !body.venue_address) { msg.textContent = "請填姓名、電話、電郵同地址"; return; }
      const btn = document.getElementById("submit"); btn.disabled = true; btn.textContent = "提交中…";
      const r = await api.post("/coach/apply", body);
      btn.disabled = false; btn.textContent = "提交申請";
      if (r.ok) {
        document.getElementById("form").innerHTML = `<div class="card"><div class="body center"><div style="font-size:40px">🎉</div><p>${esc((r.data && r.data.message) || "申請已提交，我哋會盡快審批")}</p></div></div>`;
      } else {
        msg.textContent = (r.data && r.data.error) || "提交失敗";
      }
    }
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
