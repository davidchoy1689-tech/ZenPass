<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <meta name="robots" content="noindex" />
  <meta name="zp-build" content="2026-10-25 18:52" />
  <title>教練排班後台 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    .hero{background:linear-gradient(135deg,var(--brand-500),var(--brand-700));color:#fff;border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center;margin:6px 0 12px}
    .hero .av{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:20px;font-weight:800}
    .hero .nm{font-size:18px;font-weight:800;line-height:1.2}
    .hero .tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}
    .hero .tags span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 9px;font-size:11.5px}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .metric{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px}
    .metric .v{font-size:21px;font-weight:800;color:var(--brand-600);line-height:1.15}
    .metric .l{font-size:12px;color:var(--text-muted);margin-top:3px}
    .tabs{display:flex;gap:8px;margin:4px 0 10px;overflow-x:auto}
    .tabs button{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--text-muted)}
    .tabs button.on{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
    .cls{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
    .cls .tl{display:flex;justify-content:space-between;gap:10px;align-items:start}
    .cls .t{font-weight:800;font-size:15px;line-height:1.3}
    .cls .m{font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.5}
    .bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
    .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-500),var(--brand-700))}
    .badge2{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
    .b-on{background:#ecfdf5;color:#047857}
    .b-recruit{background:#fff7ed;color:#c2410c}
    .b-full{background:#f3e8ff;color:#7e22ce}
    .b-off{background:#f1f5f9;color:#64748b}
    .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .acts .btn{min-height:38px;padding:0 12px;font-size:13px}
    .sh{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9998;opacity:0;pointer-events:none;transition:opacity .22s}
    .sh.on{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .26s cubic-bezier(.16,1,.3,1);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
    .sheet.on{transform:translateY(0)}
    .sheet .hd{position:sticky;top:0;background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .sheet .hd b{font-size:16px}
    .sheet .bd{padding:14px 16px}
    .fld3{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:11px;padding:11px 12px;font:inherit;font-size:15px;background:var(--surface);color:var(--text);margin-bottom:10px}
    .lbl3{font-size:12.5px;font-weight:700;color:var(--text-muted);display:block;margin:0 0 5px 2px}
    .stu{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
    .stu:last-child{border-bottom:0}
    .stu .n{font-weight:700;font-size:14px}
    .stu .s{font-size:12px;color:var(--text-muted);margin-top:2px}
    .stu .code{font-family:ui-monospace,Menlo,monospace;font-weight:800;color:var(--brand-600);letter-spacing:2px}
    .toast3{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:rgba(15,23,42,.93);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:10000}
    .bottomnav .ic{font-size:18px}
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="coach-dashboard.html">‹</a><div class="title">教練排班後台</div></div>
  <div class="wrap">
    <div id="guard"></div>
    <div id="app" hidden>
      <div class="hero" id="hero"></div>
      <div class="metrics" id="metrics"></div>
      <div class="muted" id="updatedAt" style="font-size:11.5px;text-align:right;margin:-4px 2px 8px;color:var(--text-muted)">—</div>
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <button class="btn btn-primary" id="btnQuick" style="flex:2">➕ 快速新增課堂時段</button>
        <button class="btn btn-secondary" id="btnScan" style="flex:1">📷 掃描核銷</button>
      </div>
      <div class="seg2" id="viewSeg" style="display:flex;gap:8px;margin-bottom:10px">
        <button class="on" data-v="cal" style="flex:1;border:1px solid var(--border);background:var(--brand-500);color:#fff;border-radius:12px;padding:9px 0;font:inherit;font-weight:800;font-size:13.5px">📅 月曆</button>
        <button data-v="list" style="flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:12px;padding:9px 0;font:inherit;font-weight:800;font-size:13.5px">📋 列表</button>
      </div>

      <!-- 📅 微型月曆 + 當日時程 -->
      <div id="calView">
      <div class="card" style="padding:12px 12px 6px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <button class="btn btn-secondary" id="calPrev" style="min-height:32px;padding:0 12px;font-size:14px">◀</button>
          <b id="calTitle" style="font-size:15px">—</b>
          <button class="btn btn-secondary" id="calNext" style="min-height:32px;padding:0 12px;font-size:14px">▶</button>
        </div>
        <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px">
          <div class="cal-wd">日</div><div class="cal-wd">一</div><div class="cal-wd">二</div>
          <div class="cal-wd">三</div><div class="cal-wd">四</div><div class="cal-wd">五</div><div class="cal-wd">六</div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--text-muted);margin-top:8px">
          <span>🟢 開班</span><span>🟡 報名中</span><span>⚪ 空置</span>
        </div>
      </div>
      <div class="sect" id="agendaTitle" style="margin-top:2px">今日時程</div>
      <div id="agenda"></div>
      </div>

      <div id="listView" hidden>
      <div class="tabs" id="tabs">
        <button class="on" data-f="upcoming">即將開班</button>
        <button data-f="completed">已結束</button>
        <button data-f="cancelled">已取消</button>
      </div>
      <div id="list"></div>
      </div>
    </div>
    <div class="spacer"></div>
  </div>

  <nav class="bottomnav">
    <a class="active" href="coach-dashboard.html"><span class="ic">📅</span>課堂管理</a>
    <a href="#" id="navAdd"><span class="ic">➕</span>新增時段</a>
    <a href="coach-dashboard.html"><span class="ic">💰</span>帳目</a>
    <a href="coach-dashboard.html"><span class="ic">👤</span>中心</a>
  </nav>

  <div class="sh" id="shMask"></div>
  <div class="sheet" id="shSheet">
    <div class="hd"><b id="shTitle">—</b><button class="btn btn-secondary" style="min-height:34px;padding:0 12px" id="shClose">關閉</button></div>
    <div class="bd" id="shBody"></div>
  </div>

  <script src="assets/api.js?v=3"></script>
  <script src="assets/vendor/html5-qrcode.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const hkd = (n) => "HK$" + Number(n || 0).toLocaleString("en-HK");
    const fmt = (t) => { const d = new Date(String(t).replace(" ", "T")); return isNaN(d) ? String(t) : d.toLocaleString("zh-HK", { month: "short", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }); };
    const hhmm = (t) => { const d = new Date(String(t).replace(" ", "T")); return isNaN(d) ? "" : d.toLocaleTimeString("zh-HK", { hour: "2-digit", minute: "2-digit", hour12: false }); };
    let FILTER = "upcoming";
    let DEMO = false;
    let DEMO_SESSIONS = [];
    let MY_CLASSES = [];
    let ME = {};

    function toast(msg) {
      const t = document.createElement("div"); t.className = "toast3"; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
    }
    function openSheet(title, html) {
      $("shTitle").textContent = title;
      $("shBody").innerHTML = html;
      $("shMask").classList.add("on");
      $("shSheet").classList.add("on");
    }
    function closeSheet() { try { stopScan(); } catch (e) {} $("shMask").classList.remove("on"); $("shSheet").classList.remove("on"); }
    $("shMask").onclick = closeSheet;
    $("shClose").onclick = closeSheet;
    $("navAdd").onclick = (e) => { e.preventDefault(); quickSheet(); };
    const _btnScan = $("btnScan"); if (_btnScan) _btnScan.onclick = openScanner;

    (async () => {
      if (!api.getUser()) {
        // 2026-10-25：未登入直接示範（唔再跳任何頁）
        DEMO = true;
        $("app").hidden = false;
        const _fab = $("fab"); if (_fab) _fab.hidden = false;
        $("hero").innerHTML = `<div class="av">陳</div><div><div class="nm">陳大文（示範）</div><div class="tags"><span>🎯 芬蘭木柱</span><span>🥌 地板冰壺</span></div></div>`;
        $("metrics").innerHTML = [
          ["🗓️ 本月已開堂數", "12 堂"], ["👥 本月學員人次", "78 人"],
          ["💰 本月預估結算", "HK$5,850"], ["⭐ 學員評分", "4.95"],
        ].map(([l, v]) => `<div class="metric"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
        DEMO_SESSIONS = [
          { id: "d1", class_id: "dc1", title: "🎯 芬蘭木柱 週末體驗班", start_time: new Date(Date.now()+3600e3).toISOString(), end_time: new Date(Date.now()+9000e3).toISOString(), venue_name: "觀塘室內運動場", district: "觀塘", max_participants: 8, booked: 6, min_participants: 4, price_hkd: 150, status: "available" },
          { id: "d2", class_id: "dc2", title: "🥌 地板冰壺 新手班", start_time: new Date(Date.now()+86400e3).toISOString(), end_time: new Date(Date.now()+90000e3).toISOString(), venue_name: "旺角社區中心", district: "油尖旺", max_participants: 10, booked: 10, min_participants: 4, price_hkd: 150, status: "available" },
          { id: "d3", class_id: "dc3", title: "🧘‍♀️ 身心伸展 午間班", start_time: new Date(Date.now()+172800e3).toISOString(), end_time: new Date(Date.now()+176400e3).toISOString(), venue_name: "中環瑜伽室", district: "中西區", max_participants: 15, booked: 3, min_participants: 4, price_hkd: 120, status: "available" },
        ];
        $("tabs").onclick = (e) => {
          const b = e.target.closest("button"); if (!b) return;
          [...$("tabs").children].forEach((x) => x.classList.toggle("on", x === b));
          FILTER = b.dataset.f; DEMO_LIST();
        };
        $("btnQuick").onclick = () => toast("示範模式：開班表單已停用");
        const _fb = $("fab"); if (_fb) _fb.onclick = () => toast("示範模式：開班表單已停用");
        $("navAdd").onclick = (e) => { e.preventDefault(); toast("示範模式：開班表單已停用"); };
        DEMO_LIST();
        // 延後執行，等日曆模組嘅 let 宣告完成（避免 TDZ）
        setTimeout(function () {
          CAL_SESSIONS = DEMO_SESSIONS.slice();
          SEL_DAY = new Date().toISOString().slice(0, 10);
          renderCal(); renderAgenda();
        }, 0);
        return;
      }
      if (false) {
        const next = encodeURIComponent("coach-dashboard.html");
        $("guard").innerHTML = `<div class="card"><div class="body center" style="padding:24px 16px">
          <div style="font-size:38px">📅</div>
          <b style="display:block;font-size:16px;margin-top:6px">教練排班後台</b>
          <div class="muted" style="font-size:13px;margin-top:8px;line-height:1.7">需要教練帳號登入。想先睇介面可以用示範模式。</div>
          <div style="display:grid;gap:9px;margin-top:14px">
            <a class="btn btn-primary" href="login.html?next=${next}">🔑 教練登入</a>
            <a class="btn btn-secondary" href="coach-dashboard.html?demo=1">👀 示範預覽（Demo）</a>
            <a class="btn btn-secondary" href="coach-apply.html">✍️ 申請成為教練</a>
          </div></div></div>`;
        $("guard").style.display = "";
        return;
      }
      const me = await api.get("/users/me");
      ME = (me.data && (me.data.user || me.data)) || api.getUser() || {};
      if (!Number(ME.is_coach) && ME.role !== "super_admin" && ME.role !== "admin") {
        $("guard").innerHTML = `<div class="card"><div class="body center">呢頁只供已認證教練使用。<br><br><a class="btn btn-secondary" href="coach-apply.html">申請成為教練</a></div></div>`;
        return;
      }
      $("app").hidden = false;
      $("hero").innerHTML = `
        <div class="av">${esc((ME.name || "教練").slice(0, 1))}</div>
        <div style="min-width:0">
          <div class="nm">${esc(ME.name || "教練")}</div>
          <div class="tags" id="heroTags"></div>
        </div>`;
      $("tabs").onclick = (e) => {
        const b = e.target.closest("button"); if (!b) return;
        [...$("tabs").children].forEach((x) => x.classList.toggle("on", x === b));
        FILTER = b.dataset.f; loadList();
      };
      $("btnQuick").onclick = quickSheet;
      await loadStats();
      await loadList();
      loadCal();
      // 🔄 即時數據：每 20 秒靜默更新（有抽屜開住就暫停，免得打斷操作）
      setInterval(async () => {
        if (document.hidden) return;
        if ($("shSheet").classList.contains("on")) return;
        try { await loadStats(true); await loadList(true); } catch (e) {}
      }, 20000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadStats(true); loadList(true); } });
    })();

    /* ===== 📅 月曆 + 當日時程 ===== */
    let CAL = { y: new Date().getFullYear(), m: new Date().getMonth() }; // m: 0-11
    let CAL_SESSIONS = [];   // 全部時段（<=300）
    let SEL_DAY = new Date().toISOString().slice(0, 10);

    const dayKey = (t) => {
      const d = new Date(String(t).replace(" ", "T"));
      return isNaN(d) ? "" : d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    };
    const hhmm2 = (t) => { const d = new Date(String(t).replace(" ", "T")); return isNaN(d) ? "" : d.toLocaleTimeString("zh-HK", { hour: "2-digit", minute: "2-digit", hour12: false }); };

    function renderCal() {
      const grid = $("calGrid");
      if (!grid) return;
      const first = new Date(CAL.y, CAL.m, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(CAL.y, CAL.m + 1, 0).getDate();
      const prevDays = new Date(CAL.y, CAL.m, 0).getDate();
      $("calTitle").textContent = `${CAL.y} 年 ${CAL.m + 1} 月`;

      const byDay = {};
      CAL_SESSIONS.forEach((x) => {
        const k = dayKey(x.start_time);
        if (!k) return;
        (byDay[k] = byDay[k] || []).push(x);
      });

      let html = "";
      for (let i = 0; i < startDow; i++) {
        html += `<div class="cal-cell mute">${prevDays - startDow + 1 + i}</div>`;
      }
      const todayK = new Date().toISOString().slice(0, 10);
      for (let d = 1; d <= daysInMonth; d++) {
        const k = `${CAL.y}-${String(CAL.m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const list = byDay[k] || [];
        let dots = "";
        if (list.length) {
          const greens = list.filter((x) => x.status !== "cancelled" && (Number(x.booked) || 0) >= Math.max(1, Number(x.min_participants) || 1)).length;
          const yellows = list.filter((x) => x.status !== "cancelled" && (Number(x.booked) || 0) < Math.max(1, Number(x.min_participants) || 1)).length;
          const dotsArr = [];
          for (let i = 0; i < Math.min(2, greens); i++) dotsArr.push("d-g");
          for (let i = 0; i < Math.min(2, yellows); i++) dotsArr.push("d-y");
          if (list.every((x) => x.status === "cancelled")) dotsArr.push("d-b");
          dots = `<div class="cal-dots">${dotsArr.slice(0, 3).map((c) => `<i class="${c}"></i>`).join("")}</div>`;
        }
        const cls = ["cal-cell", k === todayK ? "today" : "", k === SEL_DAY ? "sel" : ""].filter(Boolean).join(" ");
        html += `<div class="${cls}" data-day="${k}">${d}${dots}</div>`;
      }
      grid.innerHTML = html;
      grid.querySelectorAll("[data-day]").forEach((el) => (el.onclick = () => { SEL_DAY = el.dataset.day; renderCal(); renderAgenda(); }));
    }

    function renderAgenda() {
      const box = $("agenda");
      if (!box) return;
      const list = CAL_SESSIONS.filter((x) => dayKey(x.start_time) === SEL_DAY);
      const d = new Date(SEL_DAY + "T00:00:00");
      const wd = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
      $("agendaTitle").textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日（${wd}）· ${list.length} 節時段`;
      if (!list.length) {
        box.innerHTML = `<div class="card"><div class="body center muted" style="padding:18px 12px">呢日暫時冇課堂。<br><br>
          <button class="btn btn-primary" id="agAdd">➕ 喺呢日開班</button></div></div>`;
        const b = $("agAdd"); if (b) b.onclick = () => quickSheet();
        return;
      }
      box.innerHTML = `<div class="card">${list.map((x) => {
        const cap = Number(x.max_participants) || 0;
        const booked = Number(x.booked) || 0;
        const min = Math.max(1, Number(x.min_participants) || 1);
        const pct = cap ? Math.min(100, Math.round((booked / cap) * 100)) : 0;
        const noClass = x.status === "cancelled";
        const tag = noClass ? "⚪ 已取消" : booked >= cap && cap ? "🔵 已滿額" : booked >= min ? "🟢 已開班" : `🟡 報名中（差 ${min - booked} 人）`;
        const price = Number(x.price_hkd) || 0;
        const rate = 0.8;
        const net = Math.round(booked * price * 0.8);
        const venueRent = x.rental_price_per_hour ? Math.round((Number(x.duration) || 60) / 60 * Number(x.rental_price_per_hour)) : 0;
        return `<div class="ag">
          <div class="t">${esc(hhmm2(x.start_time))} – ${esc(hhmm2(x.end_time))} · ${esc(tag)}</div>
          <div class="m" style="font-size:13.5px;color:var(--text);font-weight:700;margin-top:4px">${esc(x.title)}</div>
          <div class="m">📍 ${esc(x.venue_name || "場地待定")}${x.district ? " · " + esc(x.district) : ""}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="m">👥 ${booked} / ${cap || "?"} 人（最低成團 ${min}）</div>
          <div class="money">
            <span>教練預估 <b>${hkd(net)}</b></span>
            ${venueRent ? `<span>場地成本 <b style="color:#b45309">${hkd(venueRent)}</b></span>` : `<span class="muted">場地：自租／未綁定</span>`}
          </div>
          <div class="acts2">
            <button class="btn btn-primary" data-ag-roster="${esc(x.id)}">📋 現場點名</button>
            <button class="btn btn-secondary" data-ag-settle="${esc(x.id)}">🏁 對賬</button>
            ${!noClass && booked < min ? `<button class="btn btn-secondary" data-ag-recruit="${esc(x.id)}" style="background:#25d366;color:#04331c;border-color:#25d366">💬 招募</button>` : ""}
          </div></div>`;
      }).join("")}</div>`;
      box.querySelectorAll("[data-ag-roster]").forEach((b) => (b.onclick = () => roster(b.dataset.agRoster)));
      box.querySelectorAll("[data-ag-recruit]").forEach((b) => (b.onclick = () => {
        const x = CAL_SESSIONS.find((z) => z.id === b.dataset.agRecruit) || {};
        const left = Math.max(0, (Number(x.min_participants) || 1) - (Number(x.booked) || 0));

    /* 📱 左右滑動切換日期（月曆檢視） */
    (function swipe() {
      const el = $("calView"); if (!el) return;
      let x0 = null, y0 = null;
      el.addEventListener("touchstart", (e) => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
      el.addEventListener("touchend", (e) => {
        if (x0 == null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - x0, dy = t.clientY - y0;
        x0 = null;
        if (Math.abs(dx) < 50 || Math.abs(dy) > 60) return;
        const d = new Date(SEL_DAY + "T00:00:00");
        d.setDate(d.getDate() + (dx < 0 ? 1 : -1));
        SEL_DAY = d.toISOString().slice(0, 10);
        CAL.y = d.getFullYear(); CAL.m = d.getMonth();
        renderCal(); renderAgenda();
      }, { passive: true });
    })();

      const price = Number(sch && sch.price_hkd) || 0;

      const hasPartner = !!sch.partner_venue_id;
      const hours = (Number(sch.duration) || 60) / 60;
      const venueAuto = hasPartner ? Math.round((Number(sch.rental_price_per_hour) || 0) * hours) : 0;
      const platformFee = Math.round(gross * (1 - rate));
      let venueMode = hasPartner ? "partner" : "self";
      let venueFee = hasPartner ? venueAuto : 0;
      const calcNet = () => Math.max(0, gross - venueFee - platformFee);

      const report = `🧾 *【ZenPass 禪流 · 課堂結算報表】*

      openSheet("🏁 課堂結算確認", `

          <div style="background:var(--surface-2);border-radius:12px;padding:9px;text-align:center"><div class="muted" style="font-size:11px">應到人數</div><b>${enrolled} 位</b></div>
          <div style="background:var(--surface-2);border-radius:12px;padding:9px;text-align:center"><div class="muted" style="font-size:11px">實到簽到</div><b style="color:#047857">${attended} 位</b></div>
          <div style="background:var(--surface-2);border-radius:12px;padding:9px;text-align:center"><div class="muted" style="font-size:11px">缺席</div><b style="color:#e11d48">${Math.max(0, enrolled - attended)} 位</b></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>課堂總學費（實到 × ${hkd(price)}）</span><b>${hkd(gross)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--text-muted)"><span>平台服務費（${Math.round((1-rate)*100)}%）</span><span id="pfLine">- ${hkd(platformFee)}</span></div>

        <div style="background:var(--surface-2);border-radius:12px;padding:10px;margin:8px 0 10px">
          <div style="font-size:12.5px;font-weight:800;margin-bottom:6px">🏟️ 場地費</div>
          <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px">
            <input type="radio" name="vmode" value="partner" ${hasPartner ? "checked" : ""} ${hasPartner ? "" : "disabled"} />
            平台合作場地${hasPartner ? `（${esc(sch.partner_venue_name || sch.venue_name || "")} · 自動 ${hkd(venueAuto)}）` : "（此班未綁定合作場地）"}
          </label>
          <label style="display:flex;gap:8px;align-items:center;font-size:13px">
            <input type="radio" name="vmode" value="self" ${hasPartner ? "" : "checked"} />
            我自己租場地（自付租金）
          </label>
          <div id="selfBox" style="margin-top:8px;${hasPartner ? "display:none" : ""}">
            <input class="fld" id="venueFeeIn" type="number" min="0" step="10" value="${venueFee}" placeholder="實際場地租金（可留空 = 0）" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--border);border-radius:10px;font:inherit" />
            <div class="muted" style="font-size:11px;margin-top:4px">呢筆錢係你俾場地方嘅，我哋只會喺結算表列出，唔會代收。</div>
          </div>
          <div id="venueLine" class="muted" style="font-size:12px;margin-top:8px"></div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);padding-top:10px;margin-bottom:12px"><b>教練應收（已扣平台費＋場地費）</b><b id="netLine" style="font-size:20px;color:#047857">${hkd(net)}</b></div>
        <div class="muted" style="font-size:11.5px;margin-bottom:12px">📋 出席：${esc(names)}</div>
        <a class="btn btn-primary btn-block" style="background:#25d366;color:#04331c;margin-bottom:8px" href="https://wa.me/85290335538?text=${encodeURIComponent(report)}" target="_blank" rel="noopener">💬 一鍵發送結算單至 WhatsApp</a>
        <button class="btn btn-secondary btn-block" id="rsGo">✅ 確認結算並封存此課堂</button>
        <div class="muted" id="rsMsg" style="text-align:center;margin-top:8px;font-size:12px"></div>`);
      const refreshCalc = () => {
        const sel = document.querySelector('input[name="vmode"]:checked');
        venueMode = sel ? sel.value : "self";
        const inp = $("venueFeeIn");
        venueFee = venueMode === "partner" ? venueAuto : Math.max(0, Number(inp && inp.value) || 0);
        net = calcNet();
        $("netLine").textContent = hkd(net);
        $("venueLine").textContent = venueMode === "partner"
          ? `場地費：${hkd(venueFee)}（平台合作場地，會由平台同場地方結算）`
          : `場地費：${hkd(venueFee)}（你自己租，平台唔代收）`;
        const sb = $("selfBox"); if (sb) sb.style.display = venueMode === "partner" ? "none" : "block";
      };
      document.querySelectorAll('input[name="vmode"]').forEach((r) => (r.onchange = refreshCalc));
      const vf = $("venueFeeIn"); if (vf) vf.oninput = refreshCalc;
      refreshCalc();

      $("rsGo").onclick = async () => {
        const b = $("rsGo"); b.disabled = true; b.textContent = "封存中…";
        const rr = await api.post("/coach/schedules/" + encodeURIComponent(sid) + "/settle", { attended_heads: attended, venue_mode: venueMode, venue_fee: venueFee });
        b.disabled = false; b.textContent = "✅ 確認結算並封存此課堂";
        if (rr.ok) { $("rsMsg").textContent = "🎉 已封存，數據已記錄"; toast("🎉 已結算封存"); setTimeout(() => { closeSheet(); loadStats(); loadList(); }, 1200); }
        else $("rsMsg").textContent = (rr.data && rr.data.error) || "結算失敗";
      };
    }

    async function cancelSession(sid) {
      if (!confirm("確定取消此時段？已有預約嘅時段唔可以取消，需先聯絡客服安排退款。")) return;
      const r = await api.post("/coach/schedules/" + encodeURIComponent(sid) + "/cancel", {});
      if (r.ok) { toast("已取消時段"); loadList(); loadStats(); }
      else alert((r.data && r.data.error) || "取消失敗");
    }

    /* ===== 📷 掃描核銷（彈窗，免跳頁） ===== */
    let _scanner = null, _scanning = false, _lastScan = 0;

    function openScanner() {
      openSheet("📷 掃描核銷", `
        <div style="display:flex;gap:8px;margin-bottom:10px" id="scSeg">
          <button class="tog on" data-m="cam" style="flex:1">📷 相機</button>
          <button class="tog" data-m="code" style="flex:1">⌨️ 4 位碼</button>
        </div>
        <div id="scCam">
          <div id="scReader" style="width:100%;border-radius:16px;overflow:hidden;background:#0b1220;min-height:220px"></div>
          <div class="muted" id="scNote" style="font-size:12px;text-align:center;margin-top:8px">撳「啟動鏡頭」開始掃描學員憑證</div>
          <button class="btn btn-primary btn-block" id="scStart" style="margin-top:10px">啟動鏡頭</button>
        </div>
        <div id="scCode" hidden>
          <input id="scInput" inputmode="numeric" maxlength="4" placeholder="輸入 4 位核銷碼"
            style="width:100%;box-sizing:border-box;padding:14px;font:800 24px/1 ui-monospace,Menlo,monospace;letter-spacing:6px;text-align:center;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--surface);color:var(--text)" />
          <input id="scRef" placeholder="預約編號（可留空）"
            style="width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface);color:var(--text);font:inherit" />
          <button class="btn btn-primary btn-block" id="scGo">核銷簽到</button>
        </div>
        <div id="scOut" style="margin-top:12px"></div>`);
      $("scSeg").onclick = (e) => {
        const b = e.target.closest("button"); if (!b) return;
        [...$("scSeg").children].forEach((x) => x.classList.toggle("on", x === b));
        $("scCam").hidden = b.dataset.m === "code";
        $("scCode").hidden = b.dataset.m !== "code";
        if (b.dataset.m === "code") { stopScan(); setTimeout(() => $("scInput").focus(), 100); }
      };
      $("scStart").onclick = startScan;
      $("scGo").onclick = () => {
        const code = ($("scInput").value || "").replace(/\D/g, "");
        const ref = ($("scRef").value || "").trim().toUpperCase();
        if (!code && !ref) { scanMsg(false, "請輸入 4 位核銷碼或預約編號"); return; }
        doCheckin(ref ? { booking_reference: ref, code: code || undefined } : { code });
      };
    }

    async function startScan() {
      if (_scanning) return;
      try {
        if (!window.Html5Qrcode) { $("scNote").textContent = "掃描模組載入失敗，請用 4 位碼"; return; }
        _scanner = _scanner || new Html5Qrcode("scReader", { verbose: false });
        await _scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 230, height: 230 } },
          (text) => { const n = Date.now(); if (n - _lastScan < 2500) return; _lastScan = n; doCheckin({ qr_data: text }); },
          () => {});
        _scanning = true;
        $("scNote").textContent = "將學員 QR Code 對準框內…";
      } catch (e) {
        $("scNote").textContent = "開唔到鏡頭（" + (e && e.message ? e.message : "權限被拒") + "）→ 請用 4 位碼";
      }
    }
    async function stopScan() {
      try { if (_scanner && _scanning) await _scanner.stop(); } catch (e) {}
      _scanning = false;
      try { if (_scanner) _scanner.clear(); } catch (e) {}
    }

    function scanMsg(ok, msg) {
      const box = $("scOut"); if (!box) return;
      box.innerHTML = `<div style="padding:12px;border-radius:12px;font-size:13.5px;font-weight:700;text-align:center;${ok ? "background:#ecfdf5;color:#047857" : "background:#fef2f2;color:#b91c1c"}">${esc(msg)}</div>`;
      if (navigator.vibrate) navigator.vibrate(ok ? [80, 40, 80] : 60);
      setTimeout(() => { const o = $("scOut"); if (o) o.innerHTML = ""; }, 5000);
    }

    async function doCheckin(payload) {
      if (typeof DEMO !== "undefined" && DEMO) {
        const code = payload.code || (payload.qr_data ? "QR" : "");
        window.__SCAN_SEEN = window.__SCAN_SEEN || {};
        if (window.__SCAN_SEEN[code]) { scanMsg(false, "⚠️ 此憑證已簽到過，請勿重複放行"); return; }
        window.__SCAN_SEEN[code] = 1;
        scanMsg(true, "✅ 簽到成功：Alex Wong（示範）");
        return;
      }
      const r = await api.post("/bookings/checkin", payload);
      const d = r.data || {};
      if (r.ok && !d.already_checked_in) {
        scanMsg(true, `✅ 簽到成功：${d.student_name || ""}`);
        loadStats(true); loadList(true);
      } else if (d.already_checked_in) {
        scanMsg(false, "⚠️ 此憑證已簽到過，請勿重複放行");
      } else {
        scanMsg(false, "❌ " + (d.error || "無效票券／非本班次"));
      }
      if ($("scInput")) $("scInput").value = "";
    }

    function quickSheet() {
      if (!MY_CLASSES.length) {
        openSheet("快速新增課堂時段", `<div class="muted" style="line-height:1.7">你仲未有課程，所以未可以加時段。<br><br>
          <a class="btn btn-primary btn-block" href="coach-console.html">去開新班 →</a></div>`);
        return;
      }
      const opts = MY_CLASSES.filter((c) => c.status === "active").map((c) => `<option value="${esc(c.id)}">${esc(c.title)}（${esc(c.category || "")}）</option>`).join("");
      const today = new Date(Date.now() + 864e5);
      const pad = (n) => String(n).padStart(2, "0");
      const dv = today.getFullYear() + "-" + pad(today.getMonth() + 1) + "-" + pad(today.getDate());
      openSheet("快速新增課堂時段", `
        <label class="lbl3">課程</label>
        <select class="fld3" id="qClass">${opts}</select>
        <label class="lbl3">日期</label>
        <input class="fld3" type="date" id="qDate" value="${dv}" />
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><label class="lbl3">開始</label><input class="fld3" type="time" id="qStart" value="14:00" /></div>
          <div><label class="lbl3">結束</label><input class="fld3" type="time" id="qEnd" value="15:30" /></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><label class="lbl3">人數上限</label><input class="fld3" type="number" id="qCap" min="2" max="60" value="8" /></div>
          <div><label class="lbl3">最低成團</label><input class="fld3" type="number" id="qMin" min="1" max="60" value="4" /></div>
        </div>
        <div class="muted" style="font-size:12px;margin:2px 0 10px">最低成團人數會影響「🟡 還差 N 位」提示；價格沿用課程設定。</div>
        <button class="btn btn-primary btn-block" id="qSubmit">儲存時段</button>
        <div class="muted center" id="qMsg" style="margin-top:8px;font-size:12.5px"></div>
      `);
      $("qSubmit").onclick = async () => {
        const cls = MY_CLASSES.find((c) => c.id === $("qClass").value) || {};
        const st = new Date($("qDate").value + "T" + $("qStart").value);
        const en = new Date($("qDate").value + "T" + $("qEnd").value);
        if (isNaN(st) || isNaN(en) || en <= st) { $("qMsg").textContent = "時間有誤"; return; }
        const btn = $("qSubmit"); btn.disabled = true; btn.textContent = "儲存中…";
        const r = await api.post("/coach/schedules", {
          class_id: cls.id, start_time: st.toISOString(), end_time: en.toISOString(),
          max_participants: Number($("qCap").value) || 8,
        });
        btn.disabled = false; btn.textContent = "儲存時段";
        if (!r.ok) { $("qMsg").textContent = (r.data && r.data.error) || "儲存失敗"; return; }
        toast("✅ 已新增時段");
        closeSheet();
        loadList(); loadStats();
      };
    }
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
