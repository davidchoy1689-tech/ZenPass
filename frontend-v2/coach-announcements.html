<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="robots" content="noindex" />
  <title>課堂公告 · ZenPass</title>
  <link rel="stylesheet" href="assets/v2.css?v=33" />
  <link rel="stylesheet" href="assets/polish.css?v=1" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    body{background:#F8FAFC;color:#0F172A}
    .a-wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
    .a-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .a-head h1{font-size:17px;font-weight:900;margin:0;flex:1}
    .a-head a{font-size:12.5px;font-weight:700;color:#059669;text-decoration:none}
    .a-tpl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
    .a-tpl button{min-height:44px;border-radius:10px;border:1.5px solid #CBD5E1;background:#fff;font-weight:800;font-size:12px;cursor:pointer;padding:4px}
    .a-card{background:#fff;border:1.5px solid #E2E8F0;border-radius:14px;padding:14px;margin-bottom:12px}
    label{font-size:11.5px;font-weight:800;color:#475569;display:block;margin:8px 0 3px}
    input,select,textarea{width:100%;border:1.5px solid #CBD5E1;border-radius:9px;padding:9px;font:inherit;font-size:13px}
    textarea{min-height:120px;resize:vertical}
    .row{display:flex;gap:8px}.row>div{flex:1}
    .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-top:8px}
    .chk input{width:18px;height:18px}
    .a-btn{width:100%;min-height:48px;border:0;border-radius:10px;background:#059669;color:#fff;font-weight:900;font-size:14px;margin-top:12px;cursor:pointer}
    .a-btn.ghost{background:#fff;color:#0F172A;border:1.5px solid #CBD5E1}
    .a-bcast{background:#ECFDF5;border-color:#A7F3D0}
    .a-list .item{background:#fff;border:1.5px solid #E2E8F0;border-radius:12px;padding:12px;margin-bottom:8px;position:relative}
    .a-list .item.pin{border-color:#FDE68A;background:#FFFBEB}
    .a-list .t{font-size:13.5px;font-weight:800;padding-right:60px}
    .a-list .m{font-size:11px;color:#64748B;margin-top:2px}
    .a-list .c{font-size:12px;color:#334155;margin-top:6px;white-space:pre-line;line-height:1.55}
    .a-list .del{position:absolute;right:10px;top:10px;border:0;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:800;cursor:pointer}
    .a-list .edit{position:absolute;right:64px;top:10px;border:0;background:#E0F2FE;color:#075985;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:800;cursor:pointer}
    .a-badge{position:absolute;right:10px;bottom:10px;font-size:10px;font-weight:800;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;border-radius:999px;padding:1px 7px}
    .a-phones{font-size:11px;color:#334155;background:#fff;border:1px dashed #CBD5E1;border-radius:8px;padding:8px;margin-top:8px;word-break:break-all;white-space:pre-wrap}
    .a-empty{text-align:center;color:#64748B;font-size:13px;padding:20px}
  </style>
<link rel="preload" href="assets/fonts/NotoSansTC-subset-v1.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div class="a-wrap">
    <div class="a-head"><h1>課堂公告</h1><a href="coach-dashboard.html">返回後台</a></div>

    <div class="a-tpl">
      <button data-tpl="weather">🌧️<br>暴雨/颱風</button>
      <button data-tpl="equipment">🎒<br>裝備提醒</button>
      <button data-tpl="earlybird">🎉<br>早鳥續報</button>
    </div>

    <div class="a-card">
      <div class="row">
        <div><label>對象</label><select id="targetType"><option value="all_students">全部學生</option><option value="session_specific">指定班次</option><option value="course_specific">指定課程</option></select></div>
        <div id="targetWrap" hidden><label>選擇</label><select id="targetId"></select></div>
      </div>
      <label>標題</label><input id="title" maxlength="120" placeholder="例如：🌧️ 課堂受極端天氣影響安排通知">
      <label>內容</label><textarea id="content" maxlength="2000" placeholder="輸入公告內容…"></textarea>
      <label class="chk"><input type="checkbox" id="pinned"> 📌 置頂</label>
      <button class="a-btn" id="publish">發佈公告</button>
    </div>

    <div class="a-card a-bcast">
      <label>📣 WhatsApp 廣播（可選班次）</label>
      <select id="bcastSession"><option value="">— 選擇班次 —</option></select>
      <div class="a-phones" id="phones">未選擇班次</div>
      <div style="font-size:11px;color:#64748B;margin-top:6px">可勾選個別學員（預設全選）；單獨發送時只會私訊該位</div>
      <div class="row" style="margin-top:8px">
        <button class="a-btn ghost" id="copyPhones" style="margin:0">📋 複製電話清單</button>
        <button class="a-btn" id="waBtn" style="margin:0">💬 一鍵發送 WhatsApp</button>
      </div>
    </div>

    <div class="a-list" id="list"><div class="a-empty">載入中…</div></div>
  </div>
<script src="assets/api.js?v=10"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let SESSIONS = [], PHONES = [], ANN = [], EDIT_ID = null, TEMPLATE = "general";
  const fmtT = (t) => { const d = new Date(String(t || "").replace(" ", "T")); return isNaN(d) ? String(t || "").slice(0, 16) : d.toLocaleString("zh-HK", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };

  const TPL = {
    weather: {
      title: "🌧️ 課堂受極端天氣（颱風/黑雨）影響安排通知",
      content: "各位學員好：因天文台已發出八號風球/黑色暴雨警告信號，為保障學員安全，原定課堂將暫停。受影響堂數將自動保留，稍後會由客服及教練跟進補堂安排，請大家留在室內注意安全！",
    },
    equipment: {
      title: "🎒 明日上課前準備與攜帶物品提醒",
      content: "各位學員好：期待明天見面！請穿著舒適運動服裝及平底運動鞋，並自備水樽（現場備有飲水機）。所有專用器材現場均已備齊，提早 10 分鐘到場即可完成簽到。",
    },
    earlybird: {
      title: "🎉 4 堂通行卡早鳥續報優惠",
      content: "完成本期體驗的學員，現可享續購 4 堂通行卡（平均 $120/堂）及優先保留固定席位禮遇，如有意續報可聯絡教練或平台客服。",
    },
  };

  document.querySelectorAll("[data-tpl]").forEach((b) => {
    b.onclick = () => {
      const t = TPL[b.dataset.tpl];
      $("title").value = t.title;
      $("content").value = t.content;
      TEMPLATE = b.dataset.tpl;
    };
  });

  $("targetType").onchange = () => {
    const t = $("targetType").value;
    $("targetWrap").hidden = t === "all_students";
    const sel = $("targetId");
    if (t === "session_specific") {
      sel.innerHTML = SESSIONS.map((s) => `<option value="${esc(s.id)}">${esc(s.title)} · ${esc(fmtT(s.start_time))}</option>`).join("");
    } else if (t === "course_specific") {
      const map = {};
      SESSIONS.forEach((s) => { map[s.class_id] = s.title; });
      sel.innerHTML = Object.entries(map).map(([id, t2]) => `<option value="${esc(id)}">${esc(t2)}</option>`).join("");
    }
  };

  async function loadSessions() {
    const r = await api.get("/coach/sessions?filter=all");
    SESSIONS = (r.data && r.data.sessions) || [];
    $("bcastSession").innerHTML = '<option value="">— 選擇班次 —</option>' +
      SESSIONS.slice(0, 60).map((s) => `<option value="${esc(s.id)}">${esc(s.title)} · ${esc(fmtT(s.start_time))}</option>`).join("");
    $("targetType").onchange();
  }

  async function loadAnn() {
    const r = await api.get("/coach/announcements");
    ANN = (r.data && r.data.announcements) || [];
    $("list").innerHTML = ANN.length ? ANN.map((a) => `
      <div class="item ${a.is_pinned ? "pin" : ""}" data-id="${esc(a.id)}">
        <button class="del" data-del="${esc(a.id)}">刪除</button>
        <button class="edit" data-edit="${esc(a.id)}">編輯</button>
        <div class="t">${esc(a.title)}</div>
        <div class="m">${esc(String(a.created_at).slice(0, 16))} · ${a.target_type === "all_students" ? "全部學生" : a.target_type === "session_specific" ? "指定班次" : "指定課程"}</div>
        <div class="c">${esc(a.content)}</div>
        ${a.is_pinned ? '<span class="a-badge">📌 置頂中</span>' : ""}
      </div>`).join("") : '<div class="a-empty">仲未發佈公告</div>';
    $("list").querySelectorAll("[data-del]").forEach((b) => {
      b.onclick = async () => {
        if (!confirm("確定刪除？")) return;
        const r2 = await api.del("/coach/announcements/" + encodeURIComponent(b.dataset.del));
        if (r2.ok) { if (EDIT_ID === b.dataset.del) resetForm(); loadAnn(); } else alert((r2.data && r2.data.error) || "刪除失敗");
      };
    });
    $("list").querySelectorAll("[data-edit]").forEach((b) => {
      b.onclick = () => {
        const a = ANN.find((x) => x.id === b.dataset.edit);
        if (!a) return;
        EDIT_ID = a.id;
        $("targetType").value = a.target_type;
        $("targetType").onchange();
        if (a.target_id) $("targetId").value = a.target_id;
        $("title").value = a.title;
        $("content").value = a.content;
        $("pinned").checked = !!a.is_pinned;
        const btn = $("publish");
        btn.textContent = "💾 儲存修改";
        $("title").focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    });
  }

  function resetForm() {
    EDIT_ID = null;
    TEMPLATE = "general";
    $("title").value = ""; $("content").value = ""; $("pinned").checked = false;
    $("publish").textContent = "發佈公告";
  }

  $("publish").onclick = async () => {
    const body = {
      target_type: $("targetType").value,
      target_id: $("targetType").value === "all_students" ? null : $("targetId").value,
      title: $("title").value,
      content: $("content").value,
      is_pinned: $("pinned").checked,
      template_type: TEMPLATE || "general",
    };
    if (body.title.trim().length < 2 || body.content.trim().length < 2) return alert("請填標題及內容");
    const r = EDIT_ID
      ? await api.put("/coach/announcements/" + encodeURIComponent(EDIT_ID), body)
      : await api.post("/coach/announcements", body);
    if (r.ok) {
      resetForm();
      loadAnn();
    } else alert((r.data && r.data.error) || (EDIT_ID ? "更新失敗" : "發佈失敗"));
  };

  $("bcastSession").onchange = async () => {
    const sid = $("bcastSession").value;
    if (!sid) { PHONES = []; $("phones").textContent = "未選擇班次"; return; }
    const r = await api.get("/coach/class-students?schedule_id=" + encodeURIComponent(sid));
    const students = (r.data && r.data.students) || [];
    PHONES = [...new Set(students.map((s) => (s.attendee_type === "parent" && s.parent_phone) || s.phone).filter(Boolean).map((p) => String(p).replace(/\D/g, "")))];
    $("phones").innerHTML = PHONES.length
      ? PHONES.map((p) => `<label style="display:flex;align-items:center;gap:7px;padding:5px 0;font-size:13px;font-weight:700;color:#0F172A"><input type="checkbox" class="ph-chk" value="${esc(p)}" checked /> ${p.slice(0,4)} ${p.slice(4)}</label>`).join("")
      : "此班未有電話";
  };

  function selectedPhones() {
    return [...document.querySelectorAll(".ph-chk:checked")].map((x) => x.value);
  }

  $("copyPhones").onclick = async () => {
    const list = selectedPhones();
    if (!list.length) return alert("請先勾選學員");
    try { await navigator.clipboard.writeText(list.join(", ")); $("copyPhones").textContent = `✅ 已複製 ${list.length} 個`; setTimeout(() => ($("copyPhones").textContent = "📋 複製電話清單"), 1600); }
    catch (e) { alert(list.join(", ")); }
  };

  $("waBtn").onclick = () => {
    const title = $("title").value.trim();
    const content = $("content").value.trim();
    if (!content) return alert("請先輸入公告內容");
    const text = (title ? title + "\n\n" : "") + content;
    const list = selectedPhones();
    const url = list.length === 1
      ? "https://wa.me/852" + list[0] + "?text=" + encodeURIComponent(text)
      : "https://wa.me/?text=" + encodeURIComponent(text);
    window.open(url, "_blank");
  };

  (async () => {
    const me = await api.me();
    if (!me.ok) { location.href = "login.html?next=" + encodeURIComponent(location.pathname); return; }
    await loadSessions();
    await loadAnn();
  })();
</script>
</body>
</html>
