<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>探索課程 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css" />
</head>
<body>
  <div class="topbar"><div class="title">探索課程</div></div>

  <div class="wrap">
    <input id="q" class="card" style="width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px"
           placeholder="🔍 搜尋運動 / 課程 / 教練" />
    <div class="hscroll" id="cats"><span class="chip on" data-cat="">全部</span></div>

    <div class="section-title" id="count">課程</div>
    <div class="stack" id="list">
      <div class="card"><div class="body muted">載入中…</div></div>
    </div>
    <div class="spacer"></div>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a class="active" href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script src="assets/sport-icons.js"></script>
  <script>
    const list = document.getElementById("list");
    function card(c) {
      const wd = ["日", "一", "二", "三", "四", "五", "六"];
      const s = (c.schedules && c.schedules[0]) || null;
      let next = "";
      if (s) {
        const d = new Date(String(s.start_time).replace(" ", "T"));
        if (!isNaN(d)) {
          const p = (n) => String(n).padStart(2, "0");
          const left = (s.max_participants || 0) - (s.enrolled_count || 0);
          next = `${d.getMonth() + 1}/${d.getDate()}（週${wd[d.getDay()]}）${p(d.getHours())}:${p(d.getMinutes())} · 剩 ${left} 位`;
        }
      }
      const aud = c.target_audience || ({ beginner: "初級 / 新手友善", intermediate: "中級", advanced: "高級" }[c.difficulty]) || "";
      return `<a class="card" href="class-detail.html?id=${encodeURIComponent(c.id)}"><div class="body course">
        <div class="thumb">${(typeof sportIconImg === "function" ? sportIconImg(c.category || c.cat || "", 52) : "")}</div>
        <div class="meta"><p class="name">${esc(c.title)}</p>
          <p class="sub">${esc(c.category || "")}${c.duration ? " · " + c.duration + " 分鐘" : ""}${c.venue_name ? " · 📍 " + esc(c.venue_name) : ""}</p>
          ${next ? `<p class="sub" style="color:var(--brand-600)">📅 ${esc(next)}</p>` : `<p class="sub">暫無時段</p>`}
          <p class="sub">${esc(aud)}${c.max_participants ? " · 上限 " + c.max_participants + " 人" : ""}</p></div>
        <div class="price">${cr(c.price_hkd)}cr</div>
      </div></a>`;
    }
    async function load(cat, q) {
      list.innerHTML = `<div class="card"><div class="body muted">載入中…</div></div>`;
      let url = "/classes?limit=60&sort=newest";
      if (cat) url += "&category=" + encodeURIComponent(cat);
      if (q) url += "&search=" + encodeURIComponent(q);
      const r = await api.get(url);
      const arr = (r.data && (r.data.classes || r.data.items)) || [];
      document.getElementById("count").textContent = arr.length + " 個課程";
      list.innerHTML = arr.length ? arr.map(card).join("") : `<div class="card"><div class="body muted">冇符合嘅課程，試下清除篩選。</div></div>`;
    }
    document.getElementById("cats").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip"); if (!chip) return;
      document.querySelectorAll("#cats .chip").forEach(x => x.classList.remove("on")); chip.classList.add("on");
      load(chip.dataset.cat, document.getElementById("q").value.trim());
    });
    let t; document.getElementById("q").addEventListener("input", (e) => {
      clearTimeout(t); t = setTimeout(() => load(document.querySelector("#cats .chip.on").dataset.cat, e.target.value.trim()), 350);
    });
    (async () => {
      const r = await api.get("/classes/categories");
      const cats = (r.data && (r.data.categories || r.data)) || [];
      if (Array.isArray(cats) && cats.length) {
        document.getElementById("cats").innerHTML = `<span class="chip on" data-cat="">全部</span>` +
          cats.map(c => { const n = (typeof c === "string" ? c : (c.name || c.category)); return `<span class="chip" data-cat="${esc(n)}">${esc(n)}</span>`; }).join("");
      }
      load("", "");
    })();
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
