<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>探索課程 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=30" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=4" />
</head>
<body>
  <div class="topbar"><div class="title">探索課程</div></div>

  <div class="wrap">
    <input id="q" class="card" style="width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px"
           placeholder="🔍 搜尋運動 / 課程 / 教練" />
    <div class="hscroll" id="cats"><span class="chip on" data-cat="">全部</span></div>

    <div class="section-title" id="count">課程</div>
    <div class="stack" id="list">
      <div class="card"><div class="body muted">載入中…</div></div>
    </div>

    <div class="section-title">🏅 更多運動項目 <span class="sport-count">撳一下即搵該項目課堂</span></div>
    <div class="sport-grid" id="sportGrid"></div>
    <div class="spacer"></div>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a class="active" href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/covers.js?v=8"></script>
  <script src="assets/api.js"></script>
  <script src="assets/sport-icons.js?v=14"></script>
  <script>
    const list = document.getElementById("list");
    function card(c) {
      const wd = ["日", "一", "二", "三", "四", "五", "六"];
      const expired = Number(c.is_expired) === 1;
      const unopened = !expired && (c.booking_open === 0 || c.booking_open === false || c.booking_open === null || c.booking_open === undefined);
      const s = (c.schedules && c.schedules[0]) || null;
      let next = "";
      if (s) {
        const d = new Date(String(s.start_time).replace(" ", "T"));
        if (!isNaN(d)) {
          const p = (n) => String(n).padStart(2, "0");
          next = `${d.getMonth() + 1}/${d.getDate()}（週${wd[d.getDay()]}）${p(d.getHours())}:${p(d.getMinutes())}`;
        }
      }
      const aud = c.target_audience || ({ beginner: "初級 / 新手友善", intermediate: "中級", advanced: "高級" }[c.difficulty]) || "";
      // 信任元素（只用真實資料，唔造假）
      const trust = [];
      const rating = Number(c.avg_rating || c.rating || 0);
      const rc = Number(c.review_count || c.rating_count || 0);
      if (rating > 0) trust.push("⭐ " + rating.toFixed(1) + (rc > 0 ? " (" + rc + "則評價)" : ""));
      if (s) {
        const left = (Number(s.max_participants) || 0) - (Number(s.enrolled_count) || 0);
        if (left > 0 && left <= 5) trust.push("👥 剩 " + left + " 個名額");
      }
      if (String(c.difficulty || "") === "beginner") trust.push("🧩 新手友善");
      const trustHtml = trust.length ? `<p class="trust">` + trust.map((t) => `<span>${esc(t)}</span>`).join("") + `</p>` : "";
      const stateLine = expired
        ? `<p class="sub" style="color:#9ca3af">已完結</p>`
        : unopened
          ? `<p class="sub" style="color:#9ca3af">🔒 已約滿</p>`
          : next
            ? `<p class="sub" style="color:var(--brand-600)">📅 ${esc(next)}</p>`
            : `<p class="sub">暫無時段</p>`;
      return `<a class="card${expired ? " expired" : ""}" href="detail.html?id=${encodeURIComponent(c.id)}"><div class="body course">
        <div class="thumb" style="${(() => { const pick = (typeof cardImage === "function") ? cardImage(c, "list") : { url: c.image_url || "" }; return pick.url ? `background-image:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.28)),url('${esc(pick.url)}');background-size:cover;background-position:center` : `background:${(typeof courseTint === "function" ? courseTint(c, 0.14) : "#f4f4f6")}`; })()}">${""}</div>
        <div class="meta"><p class="name">${esc(c.title)} ${expired ? '<span class="tag-gray">已完結</span>' : unopened ? '<span class="tag-gray">已約滿</span>' : ""}</p>
          <p class="sub">${esc(c.category || "")}${c.duration ? " · " + c.duration + " 分鐘" : ""}${c.venue_name ? " · 📍 " + esc(c.venue_name) : ""}</p>
          ${stateLine}
          ${trustHtml}
          <p class="sub">${esc(aud)}${c.max_participants ? " · 上限 " + c.max_participants + " 人" : ""}</p></div>
        <div class="price">${cr(c.price_hkd)}cr</div>
      </div></a>`;
    }
    async function load(cat, q) {
      list.innerHTML = `<div class="card"><div class="body muted">載入中…</div></div>`;
      let url = "/classes?limit=60&sort=newest";
      if (cat) url += "&category=" + encodeURIComponent(cat);
      if (q) url += "&search=" + encodeURIComponent(q);
      const r = await api.get(url);
      let arr = (r.data && (r.data.classes || r.data.items)) || [];
      arr = arr.filter(inArea).filter(inScene).filter(inZone).filter(inDate).filter(inTime);
      const cnt = document.getElementById("count");
      const lbl = (ZONE && ZONES[ZONE] ? ZONES[ZONE].label + " · " : "") + (SCENE && SCENES[SCENE] ? SCENES[SCENE].label + " · " : "");
      cnt.textContent = lbl + arr.length + " 個課程";
      list.innerHTML = arr.length ? arr.map(card).join("") : `<div class="card"><div class="body muted">冇符合嘅課程，試下清除篩選。</div></div>`;
    }
    document.getElementById("cats").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip"); if (!chip) return;
      document.querySelectorAll("#cats .chip").forEach(x => x.classList.remove("on")); chip.classList.add("on");
      load(chip.dataset.cat, document.getElementById("q").value.trim());
    });
    let t; document.getElementById("q").addEventListener("input", (e) => {
      clearTimeout(t); t = setTimeout(() => load(document.querySelector("#cats .chip.on").dataset.cat, e.target.value.trim()), 350);
    });
    const AREA_KW = {
      "香港島": ["中環","上環","西環","西營盤","堅尼地城","灣仔","銅鑼灣","跑馬地","天后","北角","炮台山","鰂魚涌","太古","西灣河","筲箕灣","柴灣","香港仔","鴨脷洲","薄扶林","半山","山頂","赤柱","淺水灣","數碼港","金鐘"],
      "九龍": ["尖沙咀","佐敦","油麻地","旺角","太子","大角咀","深水埗","長沙灣","荔枝角","美孚","九龍城","土瓜灣","紅磡","何文田","黃大仙","鑽石山","新蒲崗","彩虹","牛頭角","九龍灣","觀塘","藍田","油塘","啟德","樂富","慈雲山","尖東"],
      "新界": ["沙田","大圍","火炭","馬鞍山","大埔","粉嶺","上水","元朗","天水圍","屯門","荃灣","葵涌","青衣","將軍澳","西貢","深井","東涌","錦田","長洲","大嶼山"]
    };
    const AREA0 = new URLSearchParams(location.search).get("area") || "";
    function inArea(c) {
      if (!AREA0) return true;
      const kws = AREA_KW[AREA0] || [];
      const hay = [c.venue_name, c.venue_address, c.location, c.area, c.district].filter(Boolean).join(" ");
      return kws.some(k => hay.indexOf(k) >= 0);
    }
    // 場景 / 情境快捷搜尋
    const SCENES = {
      family:   { label: "👨‍👩‍👧‍👦 親子 / 樂齡好去處", kw: ["兒童", "親子", "長者", "樂齡", "銀髮", "kids", "senior", "家庭", "小童", "幼"] },
      office:   { label: "💼 放工放鬆 / 辦公室伸展", kw: ["瑜伽", "伸展", "身心", "冥想", "普拉提", "pilates", "yoga", "stretch", "頌缽", "放鬆", "舒壓", "氣功", "太極", "barre"] },
      burn:     { label: "🥊 高效燃脂 / 減脂汗水", kw: ["hiit", "燃脂", "減脂", "健身", "拳擊", "體能", "飛輪", "跳繩", "核心", "boxing", "cardio", "有氧", "塑形", "體重", "spinning"] },
      beginner: { label: "🧩 新手友善 / 無需經驗", kw: ["新手", "體驗", "入門", "初級", "beginner", "零基礎", "基礎"] },
    };
    const SCENE = new URLSearchParams(location.search).get("scene") || "";
    function inScene(c) {
      if (!SCENE || !SCENES[SCENE]) return true;
      if (SCENE === "beginner" && String(c.difficulty || "").toLowerCase() === "beginner") return true;
      const hay = [c.title, c.category, c.target_audience, c.sport_slug, c.difficulty].filter(Boolean).join(" ").toLowerCase();
      return SCENES[SCENE].kw.some(k => hay.indexOf(k) >= 0);
    }
    // 地區分區快速搵堂（香港 18 區）
    const ZONES = {
      cw: { label: "📍 中西區", kw: ["中環", "上環", "西環", "西營盤", "堅尼地城", "半山", "山頂", "金鐘", "中區", "石塘咀"] },
      wc: { label: "📍 灣仔", kw: ["灣仔", "銅鑼灣", "跑馬地", "天后", "大坑", "摩理臣山", "鵝頸"] },
      east: { label: "📍 東區", kw: ["北角", "炮台山", "鰂魚涌", "太古", "西灣河", "筲箕灣", "柴灣", "杏花邨", "小西灣", "東區"] },
      south: { label: "📍 南區", kw: ["香港仔", "鴨脷洲", "薄扶林", "置富", "赤柱", "淺水灣", "深水灣", "數碼港", "黃竹坑", "石澳", "大潭"] },
      ytm: { label: "📍 油尖旺", kw: ["尖沙咀", "尖東", "佐敦", "油麻地", "旺角", "太子", "大角咀", "奧運", "西九"] },
      ssp: { label: "📍 深水埗", kw: ["深水埗", "長沙灣", "荔枝角", "美孚", "南昌", "蘇屋", "石硤尾"] },
      kc: { label: "📍 九龍城", kw: ["九龍城", "土瓜灣", "紅磡", "何文田", "馬頭圍", "啟德", "九龍塘", "黃埔"] },
      wts: { label: "📍 黃大仙", kw: ["黃大仙", "鑽石山", "新蒲崗", "彩虹", "慈雲山", "樂富", "橫頭磡", "竹園"] },
      kt: { label: "📍 觀塘", kw: ["觀塘", "牛頭角", "九龍灣", "藍田", "油塘", "秀茂坪", "四順"] },
      kts: { label: "📍 葵青", kw: ["葵涌", "葵芳", "青衣", "荔景", "大窩口"] },
      tw: { label: "📍 荃灣", kw: ["荃灣", "深井", "馬灣", "汀九"] },
      tm: { label: "📍 屯門", kw: ["屯門", "兆康", "蝴蝶灣", "龍門", "小欖"] },
      yl: { label: "📍 元朗", kw: ["元朗", "天水圍", "錦田", "八鄉", "新田", "流浮山", "洪水橋"] },
      north: { label: "📍 北區", kw: ["粉嶺", "上水", "聯和墟", "沙頭角", "古洞"] },
      tp: { label: "📍 大埔", kw: ["大埔", "太和", "白石角", "林村"] },
      st: { label: "📍 沙田", kw: ["沙田", "大圍", "火炭", "馬鞍山", "沙田圍", "石門", "第一城"] },
      sk: { label: "📍 西貢", kw: ["西貢", "將軍澳", "坑口", "寶琳", "康城", "調景嶺", "清水灣"] },
      islands: { label: "📍 離島", kw: ["東涌", "長洲", "大嶼山", "愉景灣", "坪洲", "南丫島", "赤鱸角", "機場", "梅窩"] },
    };
    // 日期快捷（今天 / 明天 / 本週末）
    const DATEQ = new URLSearchParams(location.search).get("date") || "";
    const TIMEQ = new URLSearchParams(location.search).get("time") || "";
    function _dayStr(d) {
      const p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }
    function _targetDays() {
      const now = new Date();
      if (DATEQ === "today") return [_dayStr(now)];
      if (DATEQ === "tomorrow") { const d = new Date(now); d.setDate(d.getDate() + 1); return [_dayStr(d)]; }
      if (DATEQ === "weekend") {
        const d = new Date(now); const dow = d.getDay();
        const toSat = (6 - dow + 7) % 7;
        const sat = new Date(d); sat.setDate(d.getDate() + toSat);
        const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
        return [_dayStr(sat), _dayStr(sun)];
      }
      return [];
    }
    const _DAYS = _targetDays();
    // 將 DB 時間（UTC）轉香港時間，避免 date/time 篩選因時區出錯
    function _hkt(s) {
      if (!s) return null;
      var iso = String(s);
      if (!/Z|[+-]\d\d:?\d\d$/.test(iso)) iso = iso.replace(" ", "T") + "Z";
      var d = new Date(iso);
      if (isNaN(d)) return null;
      var parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", hour12: false,
      }).formatToParts(d);
      var o = {};
      parts.forEach(function (p) { o[p.type] = p.value; });
      return { date: o.year + "-" + o.month + "-" + o.day, hour: Number(o.hour) };
    }
    function inDate(c) {
      if (!DATEQ) return true;
      const days = (c.schedules || []).map((x) => { const h = _hkt(x.start_time); return h && h.date; }).filter(Boolean);
      return days.some((d) => _DAYS.indexOf(d) >= 0);
    }
    function inTime(c) {
      if (TIMEQ !== "evening") return true;
      return (c.schedules || []).some((x) => { const h = _hkt(x.start_time); return h && h.hour >= 18; });
    }

    const ZONE = new URLSearchParams(location.search).get("zone") || "";
    function inZone(c) {
      if (!ZONE || !ZONES[ZONE]) return true;
      const z = ZONES[ZONE];
      const name = String(z.label || "").replace(/^📍\s*/, "");
      // 有結構化 district → 精準比對（標準 18 區名或區内地段）
      if (c.district) return c.district === name || (z.kw || []).indexOf(c.district) >= 0;
      // 未有 district（舊資料）→ 退回關鍵字比對
      const hay = [c.venue_name, c.venue_address, c.location, c.area, c.district].filter(Boolean).join(" ");
      return z.kw.some(k => hay.indexOf(k) >= 0);
    }
    (async () => {
      const q0 = new URLSearchParams(location.search).get("q") || "";
      if (AREA0) {
        const cats = document.getElementById("cats");
        cats.insertAdjacentHTML("beforebegin", '<div class="area-bar">📍 ' + AREA0 + ' <a href="explore.html' + (q0 ? ("?q=" + encodeURIComponent(q0)) : "") + '">✕ 清除</a></div>');
      }
      if (SCENE && SCENES[SCENE]) {
        const cats = document.getElementById("cats");
        cats.insertAdjacentHTML("beforebegin", '<div class="area-bar">' + SCENES[SCENE].label + ' <a href="explore.html' + (q0 ? ("?q=" + encodeURIComponent(q0)) : "") + '">✕ 清除</a></div>');
      }
      if (DATEQ) {
        const label = DATEQ === "today" ? "📅 今天" : DATEQ === "tomorrow" ? "📅 明天" : "📅 本週末";
        const cats = document.getElementById("cats");
        cats.insertAdjacentHTML("beforebegin", '<div class="area-bar">' + label + ' <a href="explore.html' + (q0 ? ("?q=" + encodeURIComponent(q0)) : "") + '">✕ 清除</a></div>');
      }
      if (ZONE && ZONES[ZONE]) {
        const cats = document.getElementById("cats");
        cats.insertAdjacentHTML("beforebegin", '<div class="area-bar">' + ZONES[ZONE].label + ' <a href="explore.html' + (q0 ? ("?q=" + encodeURIComponent(q0)) : "") + '">✕ 清除</a></div>');
      }
      if (q0) document.getElementById("q").value = q0;
      const r = await api.get("/classes/categories");
      const cats = (r.data && (r.data.categories || r.data)) || [];
      if (Array.isArray(cats) && cats.length) {
        document.getElementById("cats").innerHTML = `<span class="chip on" data-cat="">全部</span>` +
          cats.map(c => { const n = (typeof c === "string" ? c : (c.name || c.category)); return `<span class="chip" data-cat="${esc(n)}">${esc(n)}</span>`; }).join("");
      }
      load("", q0);
    })();
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
