<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>管理後台 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <style>
    .kv { font-size: 13px; color: var(--text-muted); margin: 3px 0; }
    .amt { font-size: 18px; font-weight: 800; color: var(--brand-600); }
    .adm-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 8px; margin: 0 -16px 8px; padding-left:16px; padding-right:16px; position: sticky; top: 0; background: var(--bg, #fff); z-index: 10; }
    .adm-tabs button { white-space: nowrap; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
    .adm-tabs button.on { background: var(--brand-500); color: #fff; border-color: var(--brand-500); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
    .row:last-child { border-bottom: 0; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .kpi .big { font-size: 20px; font-weight: 800; color: var(--brand-600); }
    .kpi .lbl { font-size: 12px; color: var(--text-muted); }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--border); }
    .pill.ok { background:#dcfce7; color:#166534; } .pill.warn { background:#fef3c7; color:#92400e; } .pill.off { background:#e5e7eb; color:#374151; }
    .ef { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; font: inherit; background: var(--surface); color: var(--text); }
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">管理後台</div></div>
  <div class="wrap">
    <div class="adm-tabs" id="tabs"></div>
    <div id="panel"><div class="card"><div class="body muted">載入中…</div></div></div>
    <div class="spacer"></div>
  </div>
  <script src="assets/api.js"></script>
  <script>
    const $ = (x) => document.getElementById(x);
    const panel = () => $("panel");
    const esc2 = (v) => esc(v == null ? "" : v);
    const money = (n) => hkd(Number(n) || 0);
    const st = (s) => ({ confirmed:"已確認", attended:"已出席", pending_payment:"待付款", cancelled:"已取消", no_show:"缺席", pending:"待處理", approved:"已通過", rejected:"已拒絕", active:"生效" }[s] || s || "");

    const TABS = [
      ["dash","概覽"], ["pay","付款核實"], ["topup","增值待確認"], ["inq","查詢"], ["classes","課程"],
      ["bookings","預約"], ["users","用戶"], ["coach","教練申請"], ["payouts","出糧"],
      ["reports","報表"], ["corp","企業"], ["partners","商戶"], ["jobs","Job"], ["pricing","定價"], ["penalty","罰則"], ["analytics","分析"], ["nps","評價"], ["promo","優惠碼"], ["marketing","推廣"], ["migrate","遷移"], ["audit","審計"],
    ];
    let cur = "dash";

    function renderTabs() {
      $("tabs").innerHTML = TABS.map(([k,l]) => `<button data-t="${k}" class="${cur===k?"on":""}">${l}</button>`).join("");
      document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { cur = b.dataset.t; renderTabs(); load(); });
    }
    const loading = () => { panel().innerHTML = `<div class="card"><div class="body muted">載入中…</div></div>`; };
    const needAdmin = () => { panel().innerHTML = `<div class="card"><div class="body center">🔒 需要管理員權限。<br><br><a class="btn btn-primary" href="login.html?next=admin.html">管理員登入</a></div></div>`; };
    const row = (l, r) => `<div class="row"><span>${l}</span><span style="text-align:right">${r||""}</span></div>`;

    async function load() {
      loading();
      try {
        if (cur === "dash") return dash();
        if (cur === "pay") return payments();
        if (cur === "topup") return topupOrders();
        if (cur === "inq") return inquiries();
        if (cur === "classes") return clsTab();
        if (cur === "bookings") return listGeneric("/admin/bookings?limit=100", "bookings", bkRow, "預約");
        if (cur === "users") return usersTab();
        if (cur === "coach") return coachApps();
        if (cur === "payouts") return payouts();
        if (cur === "reports") return reports();
        if (cur === "corp") return listGeneric("/corporate/companies", "companies", corpRow, "企業");
        if (cur === "partners") return partnersTab();
        if (cur === "migrate") return migrateTab();
        if (cur === "jobs") return listGeneric("/admin/jobs", "jobs", jobRow, "Job");
        if (cur === "pricing") return pricing();
        if (cur === "penalty") return penalty();
        if (cur === "analytics") return analytics();
        if (cur === "nps") return npsTab();
        if (cur === "marketing") return marketingTab();
        if (cur === "promo") return promoTab();
        if (cur === "audit") return listGeneric("/admin/audit-log?limit=100", "entries", auditRow, "審計記錄");
      } catch (e) { panel().innerHTML = `<div class="card"><div class="body muted">載入失敗：${esc2(e.message)}</div></div>`; }
    }

    async function dash() {
      const r = await api.get("/admin/stats");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const s = (r.data && r.data.stats) || {};
      panel().innerHTML = `<div class="kpis">
        <div class="kpi"><div class="big">${s.total_users||0}</div><div class="lbl">總用戶</div></div>
        <div class="kpi"><div class="big">${s.total_classes||0}</div><div class="lbl">課程總數</div></div>
        <div class="kpi"><div class="big">${s.total_bookings||0}</div><div class="lbl">總預約</div></div>
        <div class="kpi"><div class="big">${s.confirmed_bookings||0}</div><div class="lbl">已確認</div></div>
        <div class="kpi"><div class="big">${s.pending_payments||0}</div><div class="lbl">待核實付款</div></div>
        <div class="kpi"><div class="big">${money(s.total_revenue)}</div><div class="lbl">總收入</div></div>
      </div>`;
    }

    async function payments() {
      const r = await api.get("/admin/pending-payments");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const arr = (r.data && r.data.pending_payments) || [];
      if (!arr.length) { panel().innerHTML = `<div class="card"><div class="body muted center">目前冇待核實付款 ✅</div></div>`; return; }
      panel().innerHTML = arr.map(p => {
        const pm = p.payment_method === "fps" ? "轉數快 FPS" : (p.payment_method === "payme" ? "PayMe" : (p.payment_method||"—"));
        const ref = p.fps_reference || p.payme_reference || "—";
        return `<div class="card" data-bid="${esc2(p.booking_id)}"><div class="body">
          <div style="display:flex;justify-content:space-between"><b>${esc2(p.class_title||"課程")}</b><span class="amt">${money(p.amount)}</span></div>
          <p class="kv">${esc2(p.user_name)} · ${esc2(p.user_email)}${p.user_phone?" · "+esc2(p.user_phone):""}</p>
          <p class="kv">${esc2(pm)} · 參考 ${esc2(ref)} · ${esc2(p.booking_reference||"")}</p>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-primary" data-a="approve" style="flex:1">✅ 確認收款</button>
            <button class="btn btn-ghost" data-a="reject" style="flex:1">✖ 拒絕</button></div>
        </div></div>`;
      }).join("");
      panel().querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
        const id = b.closest(".card").dataset.bid; const a = b.dataset.a; b.disabled = true;
        if (a === "approve") { if (!confirm("確認已收到此筆付款？")) { b.disabled=false; return; } const r = await api.post("/admin/approve-payment", { booking_id: id }); if (r.ok && r.data && r.data.success !== false) return load(); b.disabled=false; alert((r.data&&r.data.error)||"失敗"); }
        else { const reason = prompt("拒絕原因（可留空）") || ""; const r = await api.post("/admin/reject-payment", { booking_id: id, reason }); if (r.ok && r.data && r.data.success !== false) return load(); b.disabled=false; alert((r.data&&r.data.error)||"失敗"); }
      });
    }

    async function topupOrders() {
      const r = await api.get("/credits/admin/pending");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const arr = (r.data && r.data.data) || [];
      if (!arr.length) { panel().innerHTML = `<div class="card"><div class="body muted center">目前冇待確認增值 ✅</div></div>`; return; }
      panel().innerHTML = arr.map(o => `<div class="card" data-oid="${esc2(o.id)}"><div class="body">
        <div style="display:flex;justify-content:space-between"><b>${esc2(o.user_name||"用戶")}</b><span class="amt">${money(o.amount_hkd)}</span></div>
        <p class="kv">${esc2(o.user_email||"")} · ${esc2((o.method||"").toUpperCase())} · 參考 ${esc2(o.reference||"—")}</p>
        <p class="kv">將會加 ${o.credits + o.bonus_credits} credits${o.bonus_credits?`（含贈送 ${o.bonus_credits}）`:""} · ${esc2(String(o.created_at||"").slice(0,16))}</p>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-primary" data-t="ok" style="flex:1">✅ 確認收款</button>
          <button class="btn btn-ghost" data-t="no" style="flex:1">✖ 拒絕</button></div>
      </div></div>`).join("");
      panel().querySelectorAll("[data-t]").forEach(b => b.onclick = async () => {
        const id = b.closest(".card").dataset.oid; const act = b.dataset.t; b.disabled = true;
        if (act === "ok") {
          if (!confirm("確認已收到此筆款項？")) { b.disabled = false; return; }
          const rr = await api.post(`/credits/admin/${id}/confirm`, {});
          if (rr.ok) return load();
          b.disabled = false; alert((rr.data && rr.data.error) || "失敗");
        } else {
          const reason = prompt("拒絕原因（可留空）") || "";
          const rr = await api.post(`/credits/admin/${id}/reject`, { reason });
          if (rr.ok) return load();
          b.disabled = false; alert((rr.data && rr.data.error) || "失敗");
        }
      });
    }

    async function inquiries() {
      const [s, c] = await Promise.all([api.get("/school/inquiries"), api.get("/corporate/inquiries")]);
      if (s.status===401||s.status===403||c.status===401||c.status===403) return needAdmin();
      const rows = [
        ...((c.data&&c.data.inquiries)||[]).map(x=>({type:"🏢 企業", who:x.company_name, ct:x.contact_name, em:x.contact_email, ph:x.contact_phone, it:x.activities, msg:x.message, st:x.status, at:x.created_at})),
        ...((s.data&&s.data.inquiries)||[]).map(x=>({type:"🏫 學校", who:x.school_name, ct:x.contact_name, em:x.contact_email, ph:x.contact_phone, it:x.sports_of_interest, msg:x.message, st:x.status, at:x.created_at})),
      ].sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
      if (!rows.length) { panel().innerHTML = `<div class="card"><div class="body muted center">暫無查詢。</div></div>`; return; }
      panel().innerHTML = rows.map(x => `<div class="card"><div class="body">
        <div style="display:flex;justify-content:space-between"><b>${x.type} ${esc2(x.who)}</b><span class="pill ${x.st==='pending'?'warn':'ok'}">${esc2(st(x.st))}</span></div>
        <p class="kv">${esc2(x.ct)} · ${esc2(x.em)}${x.ph?" · "+esc2(x.ph):""}</p>
        ${x.it?`<p class="kv">有興趣：${esc2(x.it)}</p>`:""}
        ${x.msg?`<p class="kv">備註：${esc2(x.msg)}</p>`:""}
        <p class="kv">${esc2(String(x.at||"").slice(0,16))}</p></div></div>`).join("");
    }

    async function listGeneric(url, key, rowFn, emptyLabel) {
      const r = await api.get(url);
      if (r.status === 401 || r.status === 403) return needAdmin();
      const arr = (r.data && r.data[key]) || [];
      if (!arr.length) { panel().innerHTML = `<div class="card"><div class="body muted center">暫無${emptyLabel}。</div></div>`; return; }
      panel().innerHTML = `<div class="card">${arr.map(rowFn).join("")}</div>`;
    }
    const clsRow = (c) => row(`${esc2(c.title)}<div class="kv">${esc2(c.category||"")} · ${c.duration||""}分 · ${c.max_participants||""}人</div>`, `${c.price_hkd?money(c.price_hkd):((c.credits_cost||0)+"cr")} <span class="pill ${c.status==='active'?'ok':'off'}">${esc2(st(c.status))}</span>`);
    const userRow = (u) => row(`${esc2(u.name||u.email)}<div class="kv">${esc2(u.email)}${u.role?" · "+esc2(u.role):""}${u.is_coach?" · 🧑‍🏫":""}</div>`, `${u.credits||0} cr <span class="pill">${esc2(u.membership_type||"none")}</span>`);
    const bkRow = (b) => row(`${esc2(b.booking_reference||b.id)}<div class="kv">${esc2(b.class_title||b.class_id||"")}</div>`, `${b.amount?money(b.amount):(b.credits_used||"")} <span class="pill ${b.status==='attended'?'ok':(b.status==='cancelled'||b.status==='no_show'?'off':'warn')}">${esc2(st(b.status))}</span>`);
    const auditRow = (e) => row(`${esc2(e.description||e.action_type)}<div class="kv">${esc2(e.entity_type||"")} ${esc2(String(e.created_at||"").slice(0,16))}</div>`, `<span class="pill">${esc2(e.action_type||"")}</span>`);
    const corpRow = (c) => row(`${esc2(c.name)}<div class="kv">${esc2(c.contact_email||"")} · 可用 ${c.credit_pool||0} / 已用 ${c.credit_used||0}</div>`, `<span class="pill ${c.status==='active'?'ok':'off'}">${esc2(st(c.status))}</span>`);
    const jobRow = (j) => row(`${esc2(j.title)}<div class="kv">${esc2(j.job_date||"")}${j.venue?" · "+esc2(j.venue):""}${j.pay_hkd?" · HK$"+j.pay_hkd:""}</div>`, `${j.accepted_count||0}/${j.slots||1} <span class="pill ${j.status==='open'?'ok':'off'}">${esc2(st(j.status))}</span>`);

    function openModal(html) { const o = document.createElement("div"); o.className = "modal-overlay"; o.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(o); o.onclick = (ev) => { if (ev.target === o) o.remove(); }; return o; }
    window.closeModal = (el) => { const o = el.closest(".modal-overlay"); if (o) o.remove(); };

    async function usersTab() {
      const r = await api.get("/admin/users?limit=200");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const arr = (r.data && r.data.users) || [];
      if (!arr.length) { panel().innerHTML = `<div class="card"><div class="body muted center">暫無用戶。</div></div>`; return; }
      panel().innerHTML = `<div class="card">${arr.map(u => `<div class="row" data-u="${esc2(u.id)}" style="cursor:pointer"><span>${esc2(u.name || u.email)}<div class="kv">${esc2(u.email)}${u.is_coach ? " · 🧑‍🏫" : ""}</div></span><span style="text-align:right">${u.credits||0} cr <span class="pill">${esc2(u.membership_type||"none")}</span> ›</span></div>`).join("")}</div>`;
      panel().querySelectorAll("[data-u]").forEach(el => el.onclick = () => openUser(el.dataset.u));
    }
    async function openUser(id) {
      const r = await api.get("/admin/user-detail/" + encodeURIComponent(id));
      if (!r.ok) { alert((r.data&&r.data.error)||"載入失敗"); return; }
      const u = r.data.user || {}; const bk = r.data.bookings || []; const mem = r.data.membership; const tx = r.data.transactions || [];
      const wt = await api.get("/wallet/admin/txs/" + encodeURIComponent(id) + "?limit=50");
      const txs = (wt.data && wt.data.transactions) || [];
      openModal(`<h3>👤 ${esc2(u.name || u.email)}</h3>
        <p class="kv">${esc2(u.email)} · ${esc2(u.phone||"")}${u.role?" · "+esc2(u.role):""}${u.is_coach?" · 🧑‍🏫":""}</p>
        <p class="kv">Credits：${u.credits||0} · 會籍：${esc2(u.membership_type||(mem&&mem.type)||"none")}</p>
        <p class="kv">預約：${bk.length} 筆 · 交易：${tx.length} 筆 · 錢包紀錄：${txs.length} 筆</p>
        ${bk.length?`<div style="max-height:150px;overflow:auto">${bk.slice(0,10).map(b=>`<div class="kv">${esc2(b.booking_reference||b.id)} · ${esc2(st(b.status))} · ${b.amount?money(b.amount):""}</div>`).join("")}</div>`:""}
        ${txs.length?`<div style="max-height:150px;overflow:auto;border-top:1px solid var(--border);margin-top:8px;padding-top:8px">${txs.slice(0,15).map(t=>`<div class="kv">${esc2(t.type||"")} ${t.amount?money(t.amount):""} ${esc2(String(t.created_at||"").slice(0,10))}</div>`).join("")}</div>`:""}
        <div class="actions"><button class="btn btn-secondary" onclick="closeModal(this)">關閉</button></div>`);
    }

    async function npsTab() {
      const r = await api.get("/nps/stats");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const d = r.data || {}; const s = d.stats || {}; const dist = d.distribution || {}; const recent = d.recent || [];
      let html = `<div class="card"><div class="body"><b>NPS 概覽</b>`;
      html += Object.keys(s).length ? Object.entries(s).map(([k,v])=>row(esc2(k), esc2(typeof v==="object"?JSON.stringify(v):v))).join("") : '<div class="kv">暫無資料</div>';
      html += `</div></div>`;
      const dk = Object.keys(dist);
      if (dk.length) html += `<div class="card" style="margin-top:10px"><div class="body"><b>評分分佈</b>${dk.map(k=>row(esc2(k)+" 分", esc2(dist[k]))).join("")}</div></div>`;
      html += `<div class="card" style="margin-top:10px">${recent.length?recent.slice(0,15).map(v=>row(`${esc2(v.class_title||v.booking_id||"")}<div class="kv">${esc2(v.comment||"")} ${esc2(String(v.created_at||"").slice(0,10))}</div>`, `⭐ ${esc2(v.rating||0)}`)).join(""):'<div class="body muted center">暫無評價。</div>'}</div>`;
      panel().innerHTML = html;
    }

    async function pricing() {
      const r = await api.get("/pricing/admin/pricing");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const cats = (r.data && r.data.categories) || [];
      panel().innerHTML = cats.length ? `<div class="card">${cats.map(c => row(`${esc2(c.name || c.category || "")}<div class="kv">${esc2(c.tiers ? JSON.stringify(c.tiers) : (c.base_price != null ? "基本 " + money(c.base_price) : ""))}</div>`, "")).join("")}</div>` : `<div class="card"><div class="body muted center">暫無定價資料。</div></div>`;
    }

    async function penalty() {
      const [s, st] = await Promise.all([api.get("/penalty/settings"), api.get("/penalty/stats")]);
      if (s.status === 401 || s.status === 403) return needAdmin();
      const set = s.data || {}; const stats = (st.data && st.data.stats) || {};
      panel().innerHTML = `<div class="card"><div class="body">
        <b>罰則設定</b>
        ${row("No-show 罰分", esc2(set.noShowPenalty != null ? set.noShowPenalty : "—"))}
        ${row("寬限分鐘", esc2(set.graceMinutes != null ? set.graceMinutes : "—"))}
      </div></div>
      <div class="card" style="margin-top:10px"><div class="body"><b>統計</b>
        ${Object.keys(stats).length ? Object.entries(stats).map(([k, v]) => row(esc2(k), esc2(typeof v === "object" ? JSON.stringify(v) : v))).join("") : '<div class="kv">暫無資料</div>'}
      </div></div>`;
    }

    async function analytics() {
      const [cr, rt] = await Promise.all([api.get("/reporting/coach-ranking"), api.get("/reporting/revenue-trend")]);
      if (cr.status === 401 || cr.status === 403) return needAdmin();
      const coaches = (cr.data && cr.data.coaches) || [];
      const monthly = (rt.data && rt.data.monthly) || [];
      let html = `<div class="card"><div class="body"><b>教練排名</b>${coaches.length ? coaches.slice(0, 15).map(c => row(`${esc2(c.name || c.coach_name || c.coach_id || "")}<div class="kv">⭐ ${esc2(c.avg_rating || c.rating || 0)} · ${esc2(c.total_students || c.students || 0)} 學生</div>`, "")).join("") : '<div class="kv">暫無資料</div>'}</div></div>`;
      html += `<div class="card" style="margin-top:10px"><div class="body"><b>每月收入趨勢</b>${monthly.length ? monthly.slice(-6).map(m => row(esc2(m.month || m.period || ""), money(m.revenue || m.total))).join("") : '<div class="kv">暫無資料</div>'}</div></div>`;
      panel().innerHTML = html;
    }

    async function partnersTab() {
      const [pl, ap] = await Promise.all([api.get("/partner/admin/partner-list"), api.get("/partner/admin/partner-applications")]);
      if (pl.status === 401 || pl.status === 403) return needAdmin();
      const arr = (pl.data && pl.data.data) || [];
      const apps = (ap.data && ap.data.data) || [];
      let html = "";
      if (apps.length) {
        html += `<div class="card" style="margin-bottom:10px"><div class="body"><b>待審批申請（${apps.length}）</b>${apps.map(a => `<div class="row"><span>${esc2(a.name)}<div class="kv">${esc2(a.email||"")} ${esc2([a.category,a.district].filter(Boolean).join(" · "))}</div></span><span style="white-space:nowrap"><button class="btn btn-primary" data-pa="accept" data-vid="${esc2(a.id)}">批准</button> <button class="btn btn-ghost" data-pa="reject" data-vid="${esc2(a.id)}">拒絕</button></span></div>`).join("")}</div></div>`;
      }
      html += `<div class="card" style="margin-bottom:10px"><div class="body"><button class="btn btn-secondary btn-block" id="pp-payout">💸 處理商戶出糧</button><div id="pp-status" class="muted center" style="font-size:13px;margin-top:8px"></div></div></div>`;
      html += arr.length ? `<div class="card">${arr.map(p => `<div class="row" data-pid="${esc2(p.id)}" style="cursor:pointer"><span>${esc2(p.name)}<div class="kv">${esc2([p.category,p.district].filter(Boolean).join(" · "))}${p.phone?" · "+esc2(p.phone):""}</div></span><span>${esc2(st(p.status||'active'))} ›</span></div>`).join("")}</div>` : `<div class="card"><div class="body muted center">暫無商戶。</div></div>`;
      panel().innerHTML = html;
      panel().querySelectorAll("[data-pid]").forEach(el => el.onclick = () => openPartner(el.dataset.pid));
      panel().querySelectorAll("[data-pa]").forEach(b => b.onclick = () => approvePartner(b.dataset.vid, b.dataset.pa));
      document.getElementById("pp-payout").onclick = processPayouts;
    }
    async function approvePartner(venueId, action) {
      if (!confirm((action==="accept"?"通過":"拒絕") + "呢個商戶申請？")) return;
      const r = await api.post("/partner/admin/partner-approve", { venue_id: venueId, action });
      if (r.ok && r.data && r.data.success !== false) { alert((r.data&&r.data.message)||"已處理"); load(); }
      else alert((r.data&&r.data.error)||"失敗");
    }
    async function processPayouts() {
      if (!confirm("確定處理所有商戶出糧？")) return;
      const b = document.getElementById("pp-payout"); b.disabled = true; b.textContent = "處理中…";
      const r = await api.post("/partner/admin/process-partner-payouts", {});
      b.disabled = false; b.textContent = "💸 處理商戶出糧";
      document.getElementById("pp-status").textContent = r.ok ? ("✅ " + ((r.data&&r.data.message)||"完成")) : ("❌ " + ((r.data&&r.data.error)||"失敗"));
    }
    async function openPartner(id) {
      const r = await api.get("/partner/admin/partner/" + encodeURIComponent(id) + "/revenue");
      if (!r.ok) { alert((r.data&&r.data.error)||"載入失敗"); return; }
      const v = r.data.venue || {}; const t = r.data.totals || {}; const ms = r.data.monthly_stats || []; const po = r.data.payouts || [];
      openModal(`<h3>🏪 ${esc2(v.name||"")}</h3>
        <p class="kv">${esc2([v.category,v.district].filter(Boolean).join(" · "))} · ${esc2(v.email||"")}</p>
        <p class="kv">總預約 ${t.total_bookings||0} · 場地實收 ${money(t.total_venue_earned)} · 平台費 ${money(t.total_platform_fee)} · 總額 ${money(t.total_revenue)}</p>
        ${ms.length?`<div style="max-height:150px;overflow:auto;border-top:1px solid var(--border);margin-top:8px;padding-top:8px">${ms.slice(0,12).map(m=>`<div class="kv">${esc2(m.month)}：${m.booking_count} 堂 · ${money(m.venue_earned)}</div>`).join("")}</div>`:""}
        ${po.length?`<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px"><b>出糧紀錄</b>${po.slice(0,10).map(p=>`<div class="kv">${esc2(String(p.created_at||"").slice(0,10))} · ${money(p.net_amount||p.amount)} · ${esc2(p.status||"")}</div>`).join("")}</div>`:""}
        <div class="actions"><button class="btn btn-secondary" onclick="closeModal(this)">關閉</button></div>`);
    }

    async function migrateTab() {
      const r = await api.get("/migrate/course-contents");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const d = r.data || {};
      panel().innerHTML = `<div class="card"><div class="body">
        <b>🔧 課程內容遷移</b>
        <p class="kv">狀態：${d.exists ? "✅ 已存在／已遷移" : "⏳ 可執行"}</p>
        <p class="kv">${esc2(d.message||"")}</p>
        <button class="btn btn-secondary btn-block" id="mg-run" style="margin-top:8px">執行遷移</button>
        <div id="mg-status" class="muted center" style="font-size:13px;margin-top:8px"></div>
      </div></div>`;
      document.getElementById("mg-run").onclick = async () => {
        if (!confirm("確定執行課程內容遷移？（demo 資料）")) return;
        const b = document.getElementById("mg-run"); b.disabled = true; b.textContent = "執行中…";
        const pr = await api.post("/migrate/course-contents", {});
        b.disabled = false; b.textContent = "執行遷移";
        document.getElementById("mg-status").textContent = pr.ok ? ("✅ " + ((pr.data&&pr.data.message)||"完成")) : ("❌ " + ((pr.data&&pr.data.error)||"失敗"));
      };
    }

    async function clsTab() {
      const r = await api.get("/admin/classes?limit=100");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const arr = (r.data && r.data.classes) || [];
      if (!arr.length) { panel().innerHTML = `<div class="card"><div class="body muted center">暫無課程。</div></div>`; return; }
      panel().innerHTML = `<div class="card">${arr.map(c => `<div class="row" data-c="${esc2(c.id)}" style="cursor:pointer"><span>${esc2(c.title)}<div class="kv">${esc2(c.category||"")} · ${c.duration||""}分 · ${c.max_participants||""}人</div></span><span style="text-align:right">${c.price_hkd?money(c.price_hkd):((c.credits_cost||0)+"cr")} <span class="pill ${c.status==='active'?'ok':'off'}">${esc2(st(c.status))}</span> ›</span></div>`).join("")}</div>`;
      panel().querySelectorAll("[data-c]").forEach(el => el.onclick = () => openCourse(el.dataset.c));
    }
    async function openCourse(id) {
      const r = await api.get("/admin/course-detail/" + encodeURIComponent(id));
      if (!r.ok) { alert((r.data&&r.data.error)||"載入失敗"); return; }
      const c = r.data.course || {};
      const dif = ["beginner","intermediate","advanced"].map(d=>`<option value="${d}" ${c.difficulty===d?"selected":""}>${d}</option>`).join("");
      const stt = ["active","inactive"].map(s=>`<option value="${s}" ${c.status===s?"selected":""}>${s}</option>`).join("");
      const o = openModal(`<h3>✏️ 編輯課程</h3>
        <input class="ef" id="ef-title" value="${esc2(c.title||"")}" placeholder="標題">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <input class="ef" id="ef-category" value="${esc2(c.category||"")}" placeholder="類別">
          <select class="ef" id="ef-difficulty">${dif}</select>
          <input class="ef" id="ef-duration" type="number" value="${c.duration||""}" placeholder="時長(分)">
          <input class="ef" id="ef-price" type="number" value="${c.price_hkd||""}" placeholder="HK$">
          <input class="ef" id="ef-credits" type="number" value="${c.credits_cost||""}" placeholder="Credits">
          <input class="ef" id="ef-max" type="number" value="${c.max_participants||""}" placeholder="人數上限">
        </div>
        <input class="ef" id="ef-venue" value="${esc2(c.venue_name||"")}" placeholder="場地名稱" style="margin-top:8px">
        <input class="ef" id="ef-address" value="${esc2(c.venue_address||"")}" placeholder="場地地址" style="margin-top:8px">
        <textarea class="ef" id="ef-desc" rows="4" placeholder="課程內容" style="margin-top:8px">${esc2(c.description||"")}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px"><select class="ef" id="ef-status">${stt}</select><button class="btn btn-secondary" id="ef-gen" style="white-space:nowrap">🤖 生成描述</button></div>
        <div id="ef-genopts"></div>
        <div class="actions"><button class="btn btn-secondary" onclick="closeModal(this)">取消</button><button class="btn btn-primary" id="ef-save">儲存</button></div>`);
      const v = (id2) => o.querySelector("#" + id2).value;
      o.querySelector("#ef-gen").onclick = async () => {
        const b = o.querySelector("#ef-gen"); b.disabled = true; b.textContent = "生成中…";
        const gr = await api.post("/admin/generate-description", { title: v("ef-title"), category: v("ef-category"), difficulty: v("ef-difficulty"), venue_name: v("ef-venue") });
        b.disabled = false; b.textContent = "🤖 生成描述";
        const list = (gr.data && (gr.data.descriptions || gr.data.descriptions)) || (gr.data && gr.data.descriptions) || [];
        if (Array.isArray(list) && list.length) {
          o.querySelector("#ef-genopts").innerHTML = list.map((d,i)=>`<div class="card" data-d="${i}" style="margin-top:8px;cursor:pointer"><div class="body" style="font-size:13px">${esc2(d)}</div></div>`).join("");
          o.querySelectorAll("#ef-genopts [data-d]").forEach(el=>el.onclick=()=>{ o.querySelector("#ef-desc").value = list[Number(el.dataset.d)]; });
        } else alert("冇生成結果（可能未設 AI key）");
      };
      o.querySelector("#ef-save").onclick = async () => {
        const data = { title: v("ef-title"), category: v("ef-category"), difficulty: v("ef-difficulty"), duration: parseInt(v("ef-duration"))||0, price_hkd: parseFloat(v("ef-price"))||0, credits_cost: parseInt(v("ef-credits"))||0, max_participants: parseInt(v("ef-max"))||0, venue_name: v("ef-venue"), venue_address: v("ef-address"), description: v("ef-desc"), status: v("ef-status") };
        const sr = await api.post("/admin/update-course/" + encodeURIComponent(id), data);
        if (sr.ok && sr.data && sr.data.success !== false) { o.remove(); alert((sr.data&&sr.data.message)||"已更新"); load(); }
        else alert((sr.data&&sr.data.error)||"更新失敗");
      };
    }

    async function promoTab() {
      const r = await api.get("/promo");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const codes = (r.data && r.data.codes) || [];
      const typeOpts = [["fixed_price", "固定價"], ["fixed_discount", "固定減"], ["percent", "百分比"]];
      let html = `<div class="card" style="margin-bottom:10px"><div class="body">
        <b>➕ 新增優惠碼</b>
        <input class="ef" id="pc-code" placeholder="優惠碼（例：WELCOME20）" style="margin-top:8px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <select class="ef" id="pc-type">${typeOpts.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select>
          <input class="ef" id="pc-value" type="number" placeholder="值（$ 或 %）">
          <input class="ef" id="pc-max" type="number" placeholder="總用量上限（可空）">
          <input class="ef" id="pc-per" type="number" placeholder="每人限用（預設 1）">
        </div>
        <input class="ef" id="pc-desc" placeholder="描述（可空）" style="margin-top:8px">
        <button class="btn btn-primary btn-block" id="pc-add" style="margin-top:10px">新增優惠碼</button>
        <div id="pc-status" class="muted center" style="font-size:13px;margin-top:8px"></div>
      </div></div>`;
      html += codes.length ? `<div class="card">${codes.map(c => row(`${esc2(c.code)} <span class="pill ${c.active?'ok':'off'}">${c.active?'啟用':'停用'}</span><div class="kv">${esc2(c.type)} ${esc2(c.value)} · 用咗 ${c.used_count||0}${c.max_uses?'/'+c.max_uses:''}${c.class_id?' · 限指定班':''}</div>`, "")).join("")}</div>` : `<div class="card"><div class="body muted center">暫無優惠碼。</div></div>`;
      panel().innerHTML = html;
      document.getElementById("pc-add").onclick = async () => {
        const code = document.getElementById("pc-code").value.trim();
        const type = document.getElementById("pc-type").value;
        const value = document.getElementById("pc-value").value;
        const stt = document.getElementById("pc-status");
        if (!code || value === "") { stt.textContent = "請填優惠碼同數值"; return; }
        if (!confirm("確定新增優惠碼 " + code + "？")) return;
        const r2 = await api.post("/promo", { code, type, value: Number(value), max_uses: document.getElementById("pc-max").value || undefined, per_user_limit: document.getElementById("pc-per").value || 1, description: document.getElementById("pc-desc").value || undefined });
        stt.textContent = r2.ok ? ("✅ 已新增 " + ((r2.data&&r2.data.code)||code)) : ("❌ " + ((r2.data&&r2.data.error)||"失敗"));
        if (r2.ok) load();
      };
    }

    async function marketingTab() {
      panel().innerHTML = `<div class="card"><div class="body">
        <b>📢 廣播訊息</b>
        <input class="ef" id="mk-subject" placeholder="主旨" style="margin-top:8px">
        <textarea class="ef" id="mk-msg" rows="4" placeholder="內容" style="margin-top:8px"></textarea>
        <button class="btn btn-primary btn-block" id="mk-send" style="margin-top:10px">📤 發送廣播</button>
        <div class="spacer"></div>
        <button class="btn btn-secondary btn-block" id="mk-winback">🔁 觸發流失用戶 winback</button>
        <div id="mk-status" class="muted center" style="font-size:13px;margin-top:10px"></div>
      </div></div>`;
      document.getElementById("mk-send").onclick = async () => {
        const s = document.getElementById("mk-subject").value.trim(), m = document.getElementById("mk-msg").value.trim();
        const stt = document.getElementById("mk-status");
        if (!s || !m) { stt.textContent = "請填主旨同內容"; return; }
        if (!confirm("確定發送廣播俾所有用戶？")) return;
        const b = document.getElementById("mk-send"); b.disabled = true; b.textContent = "傳送中…";
        const r = await api.post("/marketing/broadcast", { subject: s, message: m });
        b.disabled = false; b.textContent = "📤 發送廣播";
        stt.textContent = r.ok ? `✅ 已發送 ${(r.data&&r.data.sent)||0}/${(r.data&&r.data.total)||0} 位用戶` : ("❌ " + ((r.data&&r.data.error)||"失敗"));
      };
      document.getElementById("mk-winback").onclick = async () => {
        if (!confirm("確定觸發 winback（通知流失用戶）？")) return;
        const b = document.getElementById("mk-winback"); b.disabled = true; b.textContent = "檢查中…";
        const r = await api.post("/marketing/winback", {});
        b.disabled = false; b.textContent = "🔁 觸發流失用戶 winback";
        document.getElementById("mk-status").textContent = r.ok ? `✅ 已通知 ${(r.data&&r.data.notified)||0} 個流失用戶` : ("❌ " + ((r.data&&r.data.error)||"失敗"));
      };
    }

    async function reports() {
      const r = await api.get("/admin/revenue-dashboard");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const d = r.data || {};
      let html = `<div class="kpis">
        <div class="kpi"><div class="big">${money(d.mrr)}</div><div class="lbl">MRR</div></div>
        <div class="kpi"><div class="big">${money(d.totalRevenue)}</div><div class="lbl">總收入</div></div>
        <div class="kpi"><div class="big">${d.activeSubscribers||0}</div><div class="lbl">活躍訂閱</div></div>
        <div class="kpi"><div class="big">${money(d.avgRevenuePerUser)}</div><div class="lbl">人均收入</div></div>
      </div>`;
      const monthly = Array.isArray(d.monthlyRevenue) ? d.monthlyRevenue : [];
      if (monthly.length) html += `<div class="card" style="margin-top:10px"><div class="body"><b>每月收入</b>${monthly.slice(-6).map(m=>`<div class="kv">${esc2(m.month||m.period||"")}：${money(m.revenue||m.total)}</div>`).join("")}</div></div>`;
      const tx = Array.isArray(d.recentTransactions) ? d.recentTransactions : [];
      if (tx.length) html += `<div class="card" style="margin-top:10px">${tx.slice(0,15).map(t=>row(`${esc2(t.description||t.type||"")}<div class="kv">${esc2(String(t.created_at||"").slice(0,16))}</div>`, money(t.amount))).join("")}</div>`;
      panel().innerHTML = html;
    }

    async function coachApps() {
      const r = await api.get("/admin/coach-applications");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const arr = (r.data && r.data.applications) || [];
      if (!arr.length) { panel().innerHTML = `<div class="card"><div class="body muted center">暫無教練申請。</div></div>`; return; }
      panel().innerHTML = arr.map(a => `<div class="card" data-ai="${esc2(a.id)}"><div class="body">
        <div style="display:flex;justify-content:space-between"><b>${esc2(a.name||"")}</b><span class="pill ${a.status==='approved'?'ok':(a.status==='rejected'?'off':'warn')}">${esc2(st(a.status))}</span></div>
        <p class="kv">${esc2(a.email||"")} · ${esc2(a.phone||"")}</p>
        ${a.specialties?`<p class="kv">專長：${esc2(a.specialties)}</p>`:""}
        ${a.status==='pending'?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary" data-ca="approve" style="flex:1">批准</button><button class="btn btn-ghost" data-ca="reject" style="flex:1">拒絕</button></div>`:""}
      </div></div>`).join("");
      panel().querySelectorAll("[data-ca]").forEach(b => b.onclick = async () => {
        const id = b.closest(".card").dataset.ai; b.disabled = true;
        const r = await api.post("/admin/coach-" + b.dataset.ca, { application_id: id });
        if (r.ok && r.data && r.data.success !== false) return load();
        b.disabled = false; alert((r.data&&r.data.error)||"失敗");
      });
    }

    async function payouts() {
      const r = await api.get("/admin/payouts");
      if (r.status === 401 || r.status === 403) return needAdmin();
      const s = (r.data && r.data.summary) || {};
      const arr = (r.data && r.data.payouts) || [];
      let html = `<div class="kpis" style="margin-bottom:10px">
        <div class="kpi"><div class="big">${money(s.pending_total)}</div><div class="lbl">待出糧</div></div>
        <div class="kpi"><div class="big">${money(s.paid_total)}</div><div class="lbl">已出糧</div></div></div>`;
      html += arr.length ? `<div class="card">${arr.map(p => row(`${esc2(p.coach_name||p.coach_id||"")}<div class="kv">${esc2(String(p.created_at||"").slice(0,10))}</div>`, `${money(p.amount)} <span class="pill ${p.status==='paid'?'ok':'warn'}">${esc2(st(p.status))}</span>`)).join("")}</div>`
        : `<div class="card"><div class="body muted center">暫無出糧紀錄。</div></div>`;
      panel().innerHTML = html;
    }

    renderTabs();
    if (api.requireLogin("admin.html")) load();
  </script>
</body>
</html>
