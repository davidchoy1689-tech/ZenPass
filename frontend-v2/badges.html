<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>成就徽章 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=17" />
  <style>
    .wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .bd { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 10px; text-align: center; }
    .bd .ico { font-size: 30px; line-height: 1.2; }
    .bd .nm { font-weight: 700; font-size: 13px; margin-top: 6px; }
    .bd .ds { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .bd.locked { opacity: .4; filter: grayscale(1); }
    .head { text-align: center; margin-bottom: 14px; }
    .head .big { font-size: 26px; font-weight: 800; color: var(--brand-600); }
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">成就徽章</div></div>
  <div class="wrap">
    <div class="head">
      <div class="big" id="count">—</div>
      <div class="muted" style="font-size:13px">已獲得徽章</div>
    </div>
    <div class="wall" id="wall"><div class="bd"><div class="ico">⏳</div><div class="nm">載入中…</div></div></div>
    <div class="spacer"></div>
  </div>
  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>
  <script src="assets/api.js"></script>
  <script>
    (async () => {
      if (!api.requireLogin("badges.html")) return;
      const r = await api.get("/badges");
      const list = (r.data && r.data.badges) || [];
      document.getElementById("count").textContent = (r.data && r.data.earned || 0) + " / " + (r.data && r.data.total || list.length);
      document.getElementById("wall").innerHTML = list.length ? list.map(b => `
        <div class="bd ${b.earned ? "" : "locked"}">
          <div class="ico">${esc(b.icon || "🏅")}</div>
          <div class="nm">${esc(b.name || "")}</div>
          <div class="ds">${esc(b.description || "")}</div>
          ${b.earned ? `<div class="ds" style="color:var(--brand-600);font-weight:700">已獲得</div>` : ""}
        </div>`).join("") : `<div class="bd"><div class="ds">暫無徽章</div></div>`;
    })();
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
