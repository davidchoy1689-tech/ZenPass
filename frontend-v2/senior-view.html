<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="light only" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>我的上課證 · ZenPass</title>
<style>
  :root{ color-scheme:light only; --ink:#0b1220; --brand:#1A5336; }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100% }
  body{
    background:#fff; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  main{ flex:1; padding:18px 16px 10px; display:flex; flex-direction:column; align-items:center; gap:14px }
  .date{ font-size:34px; font-weight:900; text-align:center; line-height:1.25 }
  .place{ font-size:26px; font-weight:800; text-align:center; color:#334155; line-height:1.35 }
  .who{ font-size:24px; font-weight:800; color:var(--brand) }
  .qrwrap{ width:min(70vw,320px); aspect-ratio:1/1; border:3px solid #0b1220; border-radius:18px; padding:10px; background:#fff; display:flex; align-items:center; justify-content:center }
  .qrwrap img{ width:100%; height:100%; object-fit:contain; image-rendering:pixelated }
  .tip{ font-size:20px; font-weight:800; color:#475569; text-align:center }
  .ref{ font-size:20px; font-weight:900; letter-spacing:.5px }
  .call{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; max-width:420px; min-height:68px; border:0; border-radius:18px;
    background:#dc2626; color:#fff; font-size:26px; font-weight:900; text-decoration:none;
    box-shadow:0 6px 18px rgba(220,38,38,.28); margin:0 0 18px;
  }
  .call:active{ transform:translateY(1px) }
  .foot{ font-size:14px; color:#64748b; text-align:center; padding:0 16px 16px; line-height:1.5 }
  .sos{ background:#fef2f2; border:2px solid #fecaca; border-radius:16px; padding:12px 14px; max-width:420px; width:100% }
  .sos .n{ font-size:15px; font-weight:900; color:#991b1b }
  .sos .p{ font-size:22px; font-weight:900; color:#7f1d1d; margin-top:2px }
  .err{ font-size:18px; font-weight:800; color:#b91c1c; text-align:center; padding:24px }
  @media (max-height:680px){ .qrwrap{ width:min(58vw,250px) } .date{ font-size:30px } }

  /* ===== 🌸 老友記同行推薦（長者自己都撳得到） ===== */
  .elder-referral{
    width:100%; max-width:420px;
    background:linear-gradient(135deg,#FFF9E6 0%,#FFF2CC 100%);
    border:2px solid #E6B800; border-radius:16px;
    padding:clamp(12px,4vw,20px);
    box-shadow:0 6px 18px rgba(180,140,0,.14);
    display:flex; flex-direction:column; gap:12px;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  .er-title{ font-size:26px; font-weight:900; line-height:1.35; color:#14532d; text-align:center }
  .er-text{ font-size:19px; font-weight:800; line-height:1.7; color:#5a3a00 }
  .er-code{
    align-self:center; max-width:100%; font-size:22px; font-weight:900; color:#7f1d1d;
    background:#fff; border:2px dashed #E6B800; border-radius:12px;
    padding:8px clamp(12px,4vw,20px); letter-spacing:.5px; text-align:center;
  }
  .btn-elder-wa{
    width:100%; min-height:56px; border:0; border-radius:14px;
    background:#25D366; color:#fff; font-size:21px; font-weight:900; line-height:1.35;
    padding:10px clamp(12px,4vw,20px); cursor:pointer;
    box-shadow:0 6px 16px rgba(37,211,102,.32);
    font-family:inherit;
  }
  .btn-elder-wa:active{ transform:translateY(1px) }
  .er-hint{ font-size:15px; font-weight:700; color:#57534e; text-align:center; line-height:1.6 }

  /* ===== Cross-Document View Transitions（原生跨頁淡入淡出） ===== */
  @view-transition { navigation: auto; }
  ::view-transition-old(root){ animation: 180ms cubic-bezier(0.4,0,0.2,1) both zpVtOut }
  ::view-transition-new(root){ animation: 180ms cubic-bezier(0.4,0,0.2,1) both zpVtIn }
  @keyframes zpVtOut { from{opacity:1} to{opacity:0} }
  @keyframes zpVtIn  { from{opacity:0} to{opacity:1} }
  @media (prefers-reduced-motion: reduce){
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*){ animation: none !important; }
  }
</style>
</head>
<body>
  <main id="main"><div class="tip">載入中…</div></main>
  <a class="call" id="callBtn" href="tel:" style="display:none">📞 <span id="callLabel">打電話</span></a>
  <div class="foot" id="foot">上堂前向導師出示上面嘅 QR Code 就可以簽到</div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const ID = qs.get("id") || qs.get("booking_id") || "";
  const GUEST = qs.get("token") || "";
  const SHARE = qs.get("share") || "";
  const DEMO = qs.get("demo") === "1";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const tel = (p) => String(p || "").replace(/[^\d+]/g, "");

  const DEMO_CARD = {
    student_name: "陳大文", salute: "伯伯",
    class_title: "樂齡深層伸展（示範）",
    date: "2026-12-12", weekday: "星期六", time: "10:30",
    venue_name: "青衣楓樹窩體育館 1 樓活動室", venue_address: "青衣楓樹窩路 1 號",
    booking_reference: "ZP-1212-003",
    emergency_name: "陳小明（兒子）", emergency_phone: "98765432",
    qr: { data_url: "/api/qr?raw=1&size=600&text=" + encodeURIComponent("zenpass:checkin:demo-1:abcdefghij") },
  };

  async function load(){
    if (DEMO) return DEMO_CARD;
    let url, headers = {};
    if (SHARE) {
      url = "/api/public/bookings/" + encodeURIComponent(ID) + "?share=" + encodeURIComponent(SHARE);
    } else if (GUEST) {
      const tok = encodeURIComponent(GUEST);
      url = `/api/guest/booking-card?token=${tok}&booking_id=${encodeURIComponent(ID)}`;
    } else {
      if (!ID) throw new Error("缺少預約編號");
      url = "/api/bookings/" + encodeURIComponent(ID) + "/card";
      const t = localStorage.getItem("zenpass_token") || "";
      if (t) headers.Authorization = ("Bear" + "er ") + t;
    }
    const r = await fetch(url, { headers, credentials: "include" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.card) throw new Error((d && d.error) || "讀取失敗");
    return d.card;
  }

  function render(c){
    const src = c.qr && (c.qr.data_url || c.qr.payload)
      ? (String(c.qr.data_url || c.qr.payload).startsWith("zenpass:")
          ? "/api/qr?raw=1&size=600&text=" + encodeURIComponent(c.qr.payload)
          : c.qr.data_url)
      : "";
    const when = `${c.date || ""} ${c.weekday || ""}`.trim() + (c.time ? " " + c.time : "");
    const ec = c.emergency_contact || {};
    const ephone = c.emergency_phone || "";
    const emName = c.emergency_name || ec.name || "家人";
    const emShow = ephone || ec.phone_masked || "";
    document.title = "我的上課證 · " + (c.date || "");
    document.getElementById("main").innerHTML = `
      <div class="who">${esc(c.student_name || "")}${c.salute ? " " + esc(c.salute) : ""}</div>
      <div class="date">${esc(when)}</div>
      <div class="place">${esc(c.venue_name || "")}</div>
      <div class="qrwrap">${src ? `<img src="${esc(src)}" alt="入場 QR Code" />` : ""}</div>
      <div class="tip">向導師出示上面個 QR Code 就可以簽到</div>
      ${c.booking_reference ? `<div class="ref">預約編號：${esc(c.booking_reference)}</div>` : ""}
      <div class="elder-referral">
        <div class="er-title">🌸【祝老友記健康常伴・一齊做拉筋】🌸</div>
        <div class="er-text">平時膝頭緊、行樓梯唔夠力？我報咗青衣楓樹窩嘅樂齡拉筋班，靜儀教練教得好好！介紹你一齊去，試堂各平 $30！</div>
        <div class="er-code">【老友記推薦碼：SILVER2】</div>
        <button class="btn-elder-wa" id="elderWaBtn" type="button">💬 撳呢度傳畀老友記（WhatsApp）</button>
        <div class="er-hint">💡 提示：您亦可以直接截圖呢個畫面，傳相片畀街坊老友睇！</div>
      </div>
      ${emShow ? `<div class="sos"><div class="n">🆘 有需要打畀：${esc(emName)}</div><div class="p">${esc(emShow)}</div></div>` : ""}
    `;
    const call = document.getElementById("callBtn");
    if (ephone) {
      call.href = "tel:" + tel(ephone);
      document.getElementById("callLabel").textContent = "打畀 " + emName;
      call.style.display = "";
    }

    // 💬 一鍵 WhatsApp（長輩語氣，預填 SILVER2 推薦碼）
    var waBtn = document.getElementById("elderWaBtn");
    if (waBtn) {
      waBtn.onclick = function () {
        var msg =
          "🌸 祝各位老友記身體健康、平安喜樂！ 🌸\n\n" +
          "我啱啱報咗青衣楓樹窩嘅樂齡筋膜防跌班，靜儀教練教得好細心，專針對膝頭痛同筋緊！\n" +
          "平時想活動下關節嘅話，不如一齊去？\n" +
          "憑我哋個專屬優惠碼【SILVER2】，報名每人平 $30 呀！\n\n" +
          "👉 按呢度睇班次同報名：\n" +
          "https://zenpass.hk/booking.html?ref=elder_share&code=SILVER2\n\n" +
          "祝大家出入平安、長命百歲！🌿";
        var url = "https://wa.me/?text=" + encodeURIComponent(msg);
        var w = window.open(url, "_blank");
        if (!w) location.href = url;
      };
    }

    try {
      if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {});
    } catch (e) {}
  }

  load().then(render).catch((e) => {
    document.getElementById("main").innerHTML = `<div class="err">⚠️ ${esc(e.message)}<br><br>請叫仔女再傳一次連結，或打 9033 5538。</div>`;
  });
})();
</script>
</body>
</html>
