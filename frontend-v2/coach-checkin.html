<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#047857" />
<title>教練點名 · ZenPass</title>
<link rel="manifest" href="manifest-coach.json" />
<style>
  :root{--brand:#047857;--brand2:#10b981;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"PingFang HK",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px calc(10px + env(safe-area-inset-top))}
  .row{display:flex;align-items:center;gap:10px}
  .t1{font-weight:900;font-size:16px}
  .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
  .call{margin-left:auto;flex:0 0 auto;background:#ecfdf5;color:var(--brand);border:1px solid #a7f3d0;border-radius:999px;padding:10px 14px;font-weight:800;text-decoration:none;font-size:13px}
  .prog{margin-top:10px;height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));width:0;transition:width .3s}
  .stat{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
  .wrap{padding:12px 12px 96px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .card.done{background:#ecfdf5;border-color:#a7f3d0}
  .name{font-size:22px;font-weight:900;line-height:1.25}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .badge{font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;background:#f1f5f9;color:#334155}
  .badge.blue{background:#e0f2fe;color:#0369a1}
  .badge.green{background:#dcfce7;color:#047857}
  .warn{margin-top:8px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:800}
  .meta{margin-top:8px;font-size:13px;color:var(--muted)}
  .meta a{color:var(--brand);font-weight:800;text-decoration:none}
  .acts{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:900;font-size:15px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:disabled{opacity:.55}
  .btn.ghost{color:#b91c1c;border-color:#fecaca;background:#fff5f5;flex:0 0 96px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:rgba(15,23,42,.94);color:#fff;padding:12px 18px;border-radius:99px;font-size:13.5px;z-index:99;max-width:86%}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .offline{position:fixed;left:0;right:0;bottom:0;background:#b45309;color:#fff;text-align:center;font-size:12.5px;padding:8px;display:none}
  .offline.on{display:block}
</style>
</head>
<body>
  <header class="top">
    <div class="row">
      <div>
        <div class="t1" id="title">載入中…</div>
        <div class="t2" id="sub">—</div>
      </div>
      <button class="call" id="scanBtn" type="button" style="border:0;cursor:pointer">📷 掃碼</button>
      <a class="call" href="tel:+85290335538" style="margin-left:6px">📞 支援</a>
    </div>
    <div class="prog"><i id="bar"></i></div>
    <div class="stat"><span id="stat">已到 0 / 0</span><span id="pending"></span></div>
  </header>

  <main class="wrap" id="list"><div class="empty">載入中…</div></main>
  <div class="offline" id="offline">⚠️ 網絡不穩 — 簽到會先儲存，恢復後自動上傳</div>

<div id="scanWrap" style="position:fixed;inset:0;background:#000;z-index:50;display:none">
  <video id="scanVideo" playsinline webkit-playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video>
  <div style="position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;color:#fff">
    <b style="font-size:15px">對準長者 QR Code</b>
    <button id="scanClose" style="margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:9px 14px;font-weight:800">關閉</button>
  </div>
  <div id="scanErr" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:22px;text-align:center">
    <div style="max-width:340px;width:100%;background:#fffbeb;border:2px solid #f59e0b;border-radius:18px;padding:20px;color:#92400e">
      <div style="font-size:42px;line-height:1">⚠️</div>
      <div style="font-size:20px;font-weight:900;margin:8px 0">未能開啟相機</div>
      <div id="scanErrMsg" style="font-size:14px;line-height:1.55;color:#78350f">請檢查 Safari 設定是否已允許「相機」權限。</div>
      <button id="scanRetry" style="margin-top:14px;width:100%;min-height:48px;border:0;border-radius:12px;background:#f59e0b;color:#fff;font-size:16px;font-weight:900">🔄 點此重試開啟鏡頭</button>
      <button id="scanBack" style="margin-top:8px;width:100%;min-height:48px;border:1px solid #f59e0b;border-radius:12px;background:#fff;color:#92400e;font-size:16px;font-weight:900">📋 切換回手動點名名冊</button>
    </div>
  </div>
  <div id="scanBanner" style="position:absolute;left:12px;right:12px;bottom:24px;background:#047857;color:#fff;border-radius:14px;padding:14px;font-weight:900;display:none"></div>
</div>
<script src="vendor/jsQR.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const TOKEN = new URLSearchParams(location.search).get("t") || "";
  const QKEY = "zp_coach_queue_" + TOKEN.slice(-12);
  const DEMO = new URLSearchParams(location.search).get("demo") === "1";
  const DEMO_ROSTER = {
    schedule: { id: "demo", title: "樂齡深層伸展（示範）", venue: "青衣楓樹窩體育館", start_time: new Date(Date.now() - 20 * 60000).toISOString(), end_time: new Date(Date.now() + 70 * 60000).toISOString(), coach_name: "靜儀導師" },
    roster: [
      { booking_id: "demo-1", booking_ids: ["demo-1"], seats: 1, attended: 0, no_show: 0, attendee_name: "陳伯伯", is_parent: true, sponsor_name: "陳小姐", phone_masked: "9876 ****", phone_tel: "tel:+85298765432", health_notes: "右膝微創手術", status: "confirmed", payment_status: "paid", emergency_name: "女兒 Karen", emergency_tel: "tel:+85292345678" },
      { booking_id: "demo-2", booking_ids: ["demo-2"], seats: 1, attended: 0, no_show: 0, attendee_name: "李婆婆", is_parent: false, sponsor_name: null, phone_masked: "9123 ****", phone_tel: "tel:+85291234567", health_notes: "", status: "confirmed", payment_status: "paid", emergency_name: null, emergency_tel: null },
      { booking_id: "demo-3", booking_ids: ["demo-3", "demo-4"], seats: 2, attended: 0, no_show: 0, attendee_name: "黃先生", is_parent: false, sponsor_name: null, phone_masked: "6345 ****", phone_tel: "tel:+85263456789", health_notes: "肩周炎，避免過頭動作", status: "confirmed", payment_status: "paid", emergency_name: null, emergency_tel: null }
    ]
  };
  let ROSTER = null;
  let queue = [];
  try { queue = JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch (e) { queue = []; }

  const fmtTime = (v) => {
    const str = String(v || "");
    const d = /[zZ]$|[+-]\d\d:?\d\d$/.test(str) ? new Date(str) : new Date(str.replace(" ", "T") + "Z");
    return d.toLocaleTimeString("zh-HK", { timeZone: "Asia/Hong_Kong", hour: "2-digit", minute: "2-digit", hour12: false });
  };
  const toast = (m) => {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = m;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  };
  const saveQueue = () => localStorage.setItem(QKEY, JSON.stringify(queue));
  const isOffline = () => !navigator.onLine;

  async function api(path, opts) {
    const res = await fetch(path, opts);
    let data = {};
    try { data = await res.json(); } catch (e) {}
    return { ok: res.ok, status: res.status, data };
  }

  async function load() {
    if (DEMO) { ROSTER = DEMO_ROSTER; render(); return; }
    const r = await api("/api/coach/checkin/roster?token=" + encodeURIComponent(TOKEN));
    if (!r.ok) {
      $("list").innerHTML = `<div class="card"><div class="empty">❌ ${r.data.error || "連結無效"}<br><br>請向營運同事索取新連結</div></div>`;
      return;
    }
    ROSTER = r.data;
    try { localStorage.setItem("zp_roster_" + TOKEN.slice(-12), JSON.stringify(r.data)); } catch (e) {}
    render();
  }

  function render() {
    if (!ROSTER) return;
    const s = ROSTER.schedule;
    $("title").textContent = `${s.venue || ""}${s.title ? " · " + s.title : ""}`;
    $("sub").textContent = `${fmtTime(s.start_time)}–${fmtTime(s.end_time)}${s.coach_name ? " · " + s.coach_name : ""}`;
    const total = ROSTER.roster.reduce((n, g) => n + g.seats, 0);
    const attended = ROSTER.roster.reduce((n, g) => n + g.attended, 0);
    $("bar").style.width = total ? Math.round((attended / total) * 100) + "%" : "0%";
    $("stat").textContent = `已到 ${attended} / ${total} 人`;
    $("pending").textContent = queue.length ? `⏳ 待上傳 ${queue.length}` : "";

    if (!ROSTER.roster.length) { $("list").innerHTML = `<div class="card"><div class="empty">（暫無學員）</div></div>`; return; }
    $("list").innerHTML = ROSTER.roster.map((g, i) => {
      const done = g.seats > 0 && g.attended === g.seats;
      const absent = g.no_show === g.seats && g.seats > 0;
      const badges = [
        g.is_parent ? `<span class="badge blue">👵 子女代報${g.sponsor_name ? " (" + esc(g.sponsor_name) + ")" : ""}</span>` : "",
        g.seats > 1 ? `<span class="badge">👥 ${g.seats} 人同行</span>` : "",
        done ? `<span class="badge green">✅ 已簽到</span>` : "",
        absent ? `<span class="badge" style="background:#fee2e2;color:#b91c1c">❌ 缺席</span>` : "",
        g.payment_status !== "paid" ? `<span class="badge" style="background:#fff7ed;color:#c2410c">⏳ 待付款</span>` : "",
      ].filter(Boolean).join("");
      return `<div class="card ${done ? "done" : ""}" data-i="${i}">
        <div class="name">${esc(g.attendee_name || "未填姓名")}</div>
        <div class="badges">${badges}</div>
        ${g.health_notes ? `<div class="warn">⚠️ ${esc(g.health_notes)}</div>` : ""}
        <div class="meta">📱 ${g.phone_tel ? `<a href="${g.phone_tel}">${esc(g.phone_masked)}</a>` : esc(g.phone_masked || "—")}
          ${g.emergency_tel ? ` · 緊急：<a href="${g.emergency_tel}">${esc(g.emergency_name || "聯絡人")}</a>` : ""}</div>
        <div class="acts">
          <button class="btn primary" data-act="in" data-bid="${g.booking_id}" ${done || absent ? "disabled" : ""}>${done ? "✅ 已簽到" : "✅ 點名簽到"}</button>
          <button class="btn ghost" data-act="no" data-bid="${g.booking_id}" ${done || absent ? "disabled" : ""}>❌ 缺席</button>
        </div>
      </div>`;
    }).join("");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  $("list").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn || btn.disabled) return;
    const bid = btn.dataset.bid;
    const action = btn.dataset.act === "in" ? "checkin" : "no_show";
    if (action === "no_show" && !confirm("確定標記缺席？")) return;

    // 樂觀更新
    const g = ROSTER.roster.find((x) => x.booking_id === bid);
    if (g) {
      if (action === "checkin") g.attended = g.seats;
      else g.no_show = g.seats;
      render();
    }
    if (navigator.vibrate) navigator.vibrate(action === "checkin" ? 35 : [20, 40, 20]);

    if (isOffline()) { enqueue(bid, action); return; }
    if (DEMO) { toast(action === "checkin" ? "✅ 已簽到（示範）" : "已標記缺席（示範）"); return; }
    const r = await api("/api/coach/checkin", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: TOKEN, booking_id: bid, action }),
    });
    if (!r.ok) {
      if (r.status === 0 || r.status >= 500) { enqueue(bid, action); return; }
      toast("❌ " + (r.data.error || "操作失敗"));
      load();
      return;
    }
    if (r.data.sponsor && r.data.sponsor.wa_url) {
      window.open(r.data.sponsor.wa_url, "_blank");
    }
    toast(action === "checkin" ? "✅ 已簽到" : "已標記缺席");
    load();
  });

  function enqueue(bid, action, qr) {
    queue.push({ booking_id: bid, qr: qr || null, action, ts: Date.now() });
    saveQueue(); render();
    toast("📥 已暫存，網絡恢復自動上傳");
  }

  async function flush() {
    if (!queue.length || isOffline()) return;
    const items = queue.slice();
    for (const it of items) {
      const r = await api("/api/coach/checkin", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: TOKEN, booking_id: it.booking_id, qr: it.qr || undefined, action: it.action }),
      });
      if (r.ok) queue = queue.filter((x) => x.ts !== it.ts);
      else if (r.status >= 400 && r.status < 500) queue = queue.filter((x) => x.ts !== it.ts); // 永久失敗唔好卡住
    }
    saveQueue(); load();
  }

  window.addEventListener("online", () => { $("offline").classList.remove("on"); flush(); });
  window.addEventListener("offline", () => $("offline").classList.add("on"));
  if (isOffline()) $("offline").classList.add("on");

  // 先用快取即時顯示，再拉最新
  try {
    const cached = localStorage.getItem("zp_roster_" + TOKEN.slice(-12));
    if (cached) { ROSTER = JSON.parse(cached); render(); }
  } catch (e) {}
  if (DEMO) { load(); } else { load(); flush(); }

  /* ===== 📷 掃碼簽到 ===== */
  let scanStream = null, scanRAF = null, scanning = false, scanStarting = false, lastRestartAt = 0, loopActive = false;
  const scanWrap = $("scanWrap"), scanVideo = $("scanVideo"), scanBanner = $("scanBanner");
  const scanErr = $("scanErr"), scanErrMsg = $("scanErrMsg");
  async function checkinByQr(qr) {
    if (DEMO) {
      const id = qr.split(":")[2];
      const g = DEMO_ROSTER.roster.find((x) => x.booking_ids.includes(id)) || DEMO_ROSTER.roster[0];
      g.attended = g.seats; render();
      return { ok: true, data: { sponsor: null } };
    }
    const r = await api("/api/coach/checkin", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: TOKEN, qr, action: "checkin" }),
    });
    if (!r.ok && (r.status === 0 || r.status >= 500)) { enqueue(null, "checkin", qr); return { queued: true }; }
    return r;
  }
  function banner(text, ms) {
    scanBanner.textContent = text;
    scanBanner.style.display = "block";
    setTimeout(() => { scanBanner.style.display = "none"; }, ms || 1500);
  }
  // ===== 黑屏兜底：明確錯誤卡片（唔會再留一個空黑框）=====
  function cameraHint(e) {
    const name = (e && (e.name || e.code)) || "";
    if (name === "NotAllowedError" || name === "SecurityError" || name === "PermissionDeniedError") {
      return "Safari 已封鎖相機權限。請到「設定 → Safari → 相機」改為「允許」，或撳網址列左邊「aA」→「網站設定」開啟相機，然後重試。";
    }
    if (name === "NotFoundError" || name === "OverconstrainedError" || name === "DevicesNotFoundError") {
      return "搵唔到可用鏡頭。請確認相機冇被其他 App 佔用，然後重試。";
    }
    if (name === "NotReadableError" || name === "TrackStartError") {
      return "相機被其他 App 或系統鎖住。請關閉其他相機 App（或重開 Safari）再重試。";
    }
    const msg = (e && e.message) ? String(e.message) : "";
    return "請檢查 Safari 設定是否已允許「相機」權限。" + (msg ? `（${msg}）` : "");
  }
  function showScanError(text) {
    scanErrMsg.textContent = text || "請檢查 Safari 設定是否已允許「相機」權限。";
    scanErr.style.display = "flex";
  }
  function hideScanError() { scanErr.style.display = "none"; }
  function stopTracks() {
    if (scanStream) { try { scanStream.getTracks().forEach((t) => t.stop()); } catch (e) {} scanStream = null; }
    scanVideo.srcObject = null;
  }
  async function startScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      scanWrap.style.display = "block";
      showScanError("此瀏覽器唔支援鏡頭。請改用 Safari／Chrome，或撳下面切換回手動點名。");
      return;
    }
    if (scanStarting) return;
    scanStarting = true;
    scanWrap.style.display = "block";
    try {
      stopTracks();
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      scanVideo.srcObject = scanStream;
      scanVideo.muted = true;
      scanVideo.setAttribute("playsinline", "");
      scanVideo.setAttribute("webkit-playsinline", "");
      await scanVideo.play();
      hideScanError();
      scanning = true;
      resumeLoop();
    } catch (e) {
      scanning = false;
      stopTracks();
      showScanError(cameraHint(e));
    } finally {
      scanStarting = false;
    }
  }
  function stopScan() {
    scanning = false;
    if (scanRAF) cancelAnimationFrame(scanRAF);
    scanRAF = null;
    stopTracks();
    hideScanError();
    scanWrap.style.display = "none";
  }
  function resumeLoop() {
    if (loopActive) return;
    if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
    tick();
  }
  // ===== 自癒：切 App／解鎖／背景返回後，鏡頭凍結即平滑重連 =====
  async function restartCamera() {
    if (scanWrap.style.display === "none") return;
    if (scanStarting) return;
    if (Date.now() - lastRestartAt < 1500) return; // 防連環重啟
    lastRestartAt = Date.now();
    await startScan();
    if (scanning && scanErr.style.display === "none") banner("🔄 鏡頭已重新連接", 1500);
  }
  function cameraLooksDead() {
    if (!scanStream) return true;
    const track = scanStream.getVideoTracks ? scanStream.getVideoTracks()[0] : null;
    if (!track || track.readyState === "ended") return true;
    if (!scanVideo.srcObject) return true;
    if (scanVideo.paused || scanVideo.ended) return true;
    return scanVideo.videoWidth === 0;
  }
  function recheckCamera() {
    if (scanWrap.style.display === "none") return;
    if (document.visibilityState !== "visible") return;
    // 返回前景先等 400ms，避免系統未恢復串流就誤判
    setTimeout(() => {
      if (scanWrap.style.display === "none") return;
      if (cameraLooksDead()) restartCamera();
      else if (!scanning) { scanning = true; resumeLoop(); }
    }, 400);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") recheckCamera();
  });
  window.addEventListener("focus", recheckCamera);
  window.addEventListener("pageshow", recheckCamera);
  // 每 3 秒看門狗：真黑屏（有 stream 但 0 畫面）都救得返
  setInterval(() => {
    if (document.visibilityState !== "visible") return;
    if (scanWrap.style.display === "none") return;
    if (scanErr.style.display !== "none") return; // 已顯示錯誤卡：等用戶撳「重試」，避免不停彈權限
    if (cameraLooksDead()) restartCamera();
  }, 3000);
  $("scanRetry").onclick = () => { hideScanError(); startScan(); };
  $("scanBack").onclick = () => stopScan();
  function tick() {
    if (!scanning) { loopActive = false; return; }
    loopActive = true;
    if (scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA) {
      const w = scanVideo.videoWidth, h = scanVideo.videoHeight;
      if (w && h) {
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const cx = cv.getContext("2d");
        cx.drawImage(scanVideo, 0, 0, w, h);
        const img = cx.getImageData(0, 0, w, h);
        const code = window.jsQR ? window.jsQR(img.data, w, h, { inversionAttempts: "dontInvert" }) : null;
        if (code && code.data && code.data.startsWith("zenpass:checkin:")) {
          const qr = code.data;
          scanning = false;
          if (navigator.vibrate) navigator.vibrate(100);
          checkinByQr(qr).then((r) => {
            if (!r) return;
            if (r.queued) { banner("📥 已暫存，網絡恢復自動補簽", 2600); }
            else if (r.ok) {
              const g = (ROSTER ? ROSTER.roster : []).find((x) => x.booking_ids && x.booking_ids.includes(qr.split(":")[2]));
              banner(`✅ ${g ? g.attendee_name : "學員"} 簽到成功${g && g.health_notes ? "（⚠️ " + g.health_notes + "）" : ""}`);
              if (r.data.sponsor && r.data.sponsor.wa_url) window.open(r.data.sponsor.wa_url, "_blank");
              load();
            } else {
              banner("❌ " + (r.data.error || "簽到失敗"), 2600);
            }
            setTimeout(() => { scanning = true; resumeLoop(); }, 1500);
          });
          return;
        }
      }
    }
    scanRAF = requestAnimationFrame(tick);
  }
  $("scanBtn").onclick = startScan;
  $("scanClose").onclick = stopScan;

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("coach-checkin-sw.js").catch(() => {});
</script>
</body>
</html>
