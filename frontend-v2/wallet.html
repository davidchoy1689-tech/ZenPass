<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>錢包 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=14" />
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">錢包</div></div>
  <div class="wrap">
    <div class="card" style="background:linear-gradient(135deg,var(--brand-500),var(--brand-700));color:#fff;border:0">
      <div class="body">
        <div style="opacity:.9;font-size:13px">Credits 餘額</div>
        <div style="font-size:36px;font-weight:800;margin:4px 0"><span id="bal">—</span> <span style="font-size:16px;opacity:.9">credits</span></div>
        <div style="opacity:.9;font-size:13px" id="balhk">1 credit = $10</div>
        <div style="display:flex;gap:10px;margin-top:14px">
          <a class="btn" style="background:#fff;color:var(--brand-700);flex:1" href="buy-credits.html">增值</a>
        </div>
      </div>
    </div>

    <div class="section-title">最近交易</div>
    <div class="card" id="txs"><div class="body muted">載入中…</div></div>
    <div class="spacer"></div>
  </div>
  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script>
    (async () => {
      if (!api.requireLogin("wallet.html")) return;
      const me = await api.get("/users/me");
      const u = (me.data && (me.data.user || me.data)) || {};
      const c = (u.credits != null ? u.credits : 0);
      document.getElementById("bal").textContent = c;
      document.getElementById("balhk").textContent = "≈ " + hkd(c * 10) + " · 1 credit = $10";

      const tr = await api.get("/wallet/transactions?limit=20");
      const list = (tr.data && (tr.data.transactions || tr.data.items || tr.data)) || [];
      const el = document.getElementById("txs");
      if (!Array.isArray(list) || !list.length) { el.innerHTML = `<div class="body muted">暫無交易記錄。</div>`; return; }
      el.innerHTML = list.map(t => {
        const amt = (t.amount != null ? t.amount : t.credits);
        const pos = typeof amt === "number" && amt > 0;
        return `<div class="row"><div><div style="font-weight:600">${esc(t.description || t.type || "交易")}</div>
          <div class="muted" style="font-size:12px">${esc((t.created_at || "").slice(0,10))}</div></div>
          <div class="v" style="color:${pos ? "var(--green-600)" : "var(--red-600)"}">${pos ? "+" : ""}${esc(amt)}</div></div>`;
      }).join("");
    })();
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
