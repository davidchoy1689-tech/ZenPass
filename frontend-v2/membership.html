<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>會員計劃 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=3" />
  <style>
    .plan { border:1px solid var(--border); }
    .plan.hot { border-color:var(--brand-500); box-shadow:var(--sh-md); }
    .plan .tag { position:absolute; top:-10px; right:16px; background:var(--brand-500); color:#fff; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; }
    .plan { position:relative; }
    .per { color:var(--text-muted); font-size:13px; }
    .feat { font-size:13px; color:var(--text-muted); margin:3px 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="my.html">‹</a>
    <div class="title">會員計劃</div>
  </div>

  <div class="wrap">
    <p class="muted">用 Credits 玩盡所有課程，月費越高、每堂越平。</p>
    <div id="current"></div>
    <div class="stack" id="plans"><div class="card"><div class="body muted">載入中…</div></div></div>
    <div class="spacer"></div>
    <div class="banner">ℹ️ 所有計劃：自由取消（適用於開課前一日）</div>
    <div class="spacer"></div>
  </div>

  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>

  <script src="assets/api.js"></script>
  <script>
    let planList = [];
    function card(p) {
      const per = p.credits_granted ? (p.price_hkd / p.credits_granted).toFixed(2) : "—";
      const feats = (p.features || []).map(f => `<div class="feat">✓ ${esc(f)}</div>`).join("");
      return `<div class="card plan ${p.popular ? "hot" : ""}">${p.popular ? '<span class="tag">最受歡迎</span>' : ""}<div class="body">
        <div style="display:flex;justify-content:space-between"><b>${esc(p.name)}</b><b>${hkd(p.price_hkd)}/月</b></div>
        <div class="per">${p.credits_granted} credits · ≈$${per}/credit</div>
        ${p.description ? `<div class="muted" style="font-size:13px;margin-top:6px">${esc(p.description)}</div>` : ""}
        ${feats}
        <button class="btn ${p.popular ? "btn-primary" : "btn-secondary"} btn-block" style="margin-top:12px" data-plan="${esc(p.key)}">選擇</button>
      </div></div>`;
    }
    async function load() {
      const r = await api.get("/memberships/plans");
      const plans = (r.data && r.data.plans) || {};
      planList = Object.keys(plans).map(k => Object.assign({ key: k }, plans[k]));
      document.getElementById("plans").innerHTML = planList.length ? planList.map(card).join("")
        : '<div class="card"><div class="body muted">暫無計劃。</div></div>';
      document.querySelectorAll("#plans [data-plan]").forEach(b => b.onclick = () => subscribe(b.dataset.plan));
      if (api.isLoggedIn()) {
        const my = await api.get("/memberships/my");
        const cur = my.data && my.data.current;
        const hist = (my.data && my.data.history) || [];
        if (cur && cur.type && cur.type !== "none") {
          let html = `<div class="banner">👑 現時會籍：<b>${esc(cur.type)}</b>${cur.expires_at ? "（到期 " + String(cur.expires_at).slice(0, 10) + "）" : ""}</div>`;
          const act = hist.find(m => m.status === "active");
          if (act) {
            const paused = act.paused_until && new Date(act.paused_until) > new Date();
            if (paused) {
              html += `<div class="banner" style="background:#fff7ed;margin-top:8px">⏸️ 已暫停至 ${esc(String(act.paused_until).slice(0, 10))}（第 ${esc(act.pause_count || 1)} 次）</div>`;
              html += `<div class="spacer"></div><button class="btn btn-secondary btn-block" id="resumeBtn" data-id="${esc(act.id)}">▶️ 恢復會籍</button>`;
            } else {
              html += `<div class="spacer"></div><button class="btn btn-secondary btn-block" id="pauseBtn" data-id="${esc(act.id)}">⏸️ 暫停會籍</button>`;
            }
          }
          document.getElementById("current").innerHTML = html + `<div class="spacer"></div>`;
          const pb = document.getElementById("pauseBtn");
          if (pb) pb.onclick = () => openPause(pb.dataset.id);
          const rb = document.getElementById("resumeBtn");
          if (rb) rb.onclick = () => resumeMember(rb.dataset.id);
        }
      }
    }

    window.closeModal = (el) => { const o = el.closest(".modal-overlay"); if (o) o.remove(); };
    function openPause(id) {
      const o = document.createElement("div");
      o.className = "modal-overlay";
      o.innerHTML = `<div class="modal">
        <h3>⏸️ 暫停會籍</h3>
        <p class="muted" style="font-size:13px;margin-top:0">暫停期間會籍到期日會順延（最多 3 次，每次最多 30 日）。</p>
        <div class="stack" id="pdays">
          <button class="btn btn-secondary" data-d="7">暫停 7 日</button>
          <button class="btn btn-secondary" data-d="14">暫停 14 日</button>
          <button class="btn btn-secondary" data-d="30">暫停 30 日</button>
        </div>
        <div class="actions"><button class="btn btn-secondary" onclick="closeModal(this)">取消</button></div>
      </div>`;
      document.body.appendChild(o);
      o.onclick = (e) => { if (e.target === o) o.remove(); };
      o.querySelectorAll("#pdays button").forEach(b => b.onclick = async () => {
        const days = Number(b.dataset.d);
        b.disabled = true;
        const r = await api.put("/memberships/" + encodeURIComponent(id) + "/pause", { pause_days: days });
        if (r.ok) { alert((r.data && r.data.message) || "已暫停"); o.remove(); await load(); }
        else { b.disabled = false; alert((r.data && r.data.error) || "暫停失敗"); }
      });
    }

    async function resumeMember(id) {
      if (!confirm("確定恢復會籍？")) return;
      const r = await api.put("/memberships/" + encodeURIComponent(id) + "/resume", {});
      if (r.ok) { alert((r.data && r.data.message) || "已恢復會籍"); await load(); }
      else alert((r.data && r.data.error) || "恢復失敗");
    }
    async function subscribe(type) {
      if (!api.requireLogin("membership.html")) return;
      const p = planList.find(x => x.key === type);
      if (!p) return;
      if (!confirm(`訂閱「${p.name}」？\n月費 ${hkd(p.price_hkd)}，即時獲得 ${p.credits_granted} credits。`)) return;
      const r = await api.post("/memberships/subscribe", { type });
      if (r.ok && r.data) { alert(r.data.message || "訂閱成功"); await load(); }
      else alert((r.data && r.data.error) || "訂閱失敗");
    }
    load();
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
