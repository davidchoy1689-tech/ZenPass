<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>我的收藏 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=5" />
  <style>
    .row { display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid var(--border); gap:10px; }
    .row:last-child { border-bottom:0; }
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="my.html">‹</a><div class="title">我的收藏</div></div>
  <div class="wrap">
    <div class="card" id="list"><div class="body muted">載入中…</div></div>
    <div class="spacer"></div>
  </div>
  <nav class="bottomnav">
    <a href="index.html"><span class="ic">🏠</span>主頁</a>
    <a href="explore.html"><span class="ic">🔍</span>探索</a>
    <a href="booking.html"><span class="ic">📅</span>預約</a>
    <a class="active" href="my.html"><span class="ic">🎫</span>我的</a>
  </nav>
  <script src="assets/api.js"></script>
  <script>
    (async () => {
      if (!api.requireLogin("wishlist.html")) return;
      await load();
    })();
    async function load() {
      const r = await api.get("/wishlist");
      const list = (r.data && r.data.wishlist) || [];
      document.getElementById("list").innerHTML = list.length ? list.map(w => `
        <div class="row">
          <div><b>${esc(w.title || "課程")}</b>
            <div class="muted" style="font-size:12px">${esc(w.category || "")} · ${w.price_hkd ? hkd(w.price_hkd) : ((w.credits_cost||0)+" cr")}${w.venue_name ? " · " + esc(w.venue_name) : ""}</div></div>
          <div style="white-space:nowrap">
            <a class="btn btn-primary mini" href="class-detail.html?id=${encodeURIComponent(w.class_id)}" style="min-height:34px;padding:0 12px;font-size:13px">預約</a>
            <button class="btn btn-secondary mini" onclick="removeW('${esc(w.class_id)}')" style="min-height:34px;padding:0 12px;font-size:13px">移除</button>
          </div>
        </div>`).join("") : `<div class="body muted center">你未有收藏課程。<br><br><a class="btn btn-secondary" href="explore.html">去探索課程</a></div>`;
    }
    window.removeW = async (id) => {
      if (!confirm("移除呢個收藏？")) return;
      const r = await api.del("/wishlist/" + encodeURIComponent(id));
      if (r.ok) await load(); else alert((r.data && r.data.error) || "移除失敗");
    };
  </script>
  <script src="assets/footer.js" defer></script>
</body>
</html>
