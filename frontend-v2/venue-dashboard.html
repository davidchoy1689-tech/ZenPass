<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <meta name="robots" content="noindex" />
  <title>場地管理後台 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=26" />
  <link rel="stylesheet" href="assets/polish.css?v=1" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    .hero{background:linear-gradient(135deg,var(--brand-500),var(--brand-700));color:#fff;border-radius:20px;padding:16px;margin:6px 0 12px}
    .hero h2{margin:0;font-size:18px}
    .hero p{margin:4px 0 0;font-size:12.5px;opacity:.95}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .kpi div{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px}
    .kpi .v{font-size:20px;font-weight:800;color:var(--brand-600)}
    .kpi .l{font-size:11.5px;color:var(--text-muted);margin-top:3px}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px}
    .row:last-child{border-bottom:0}
    .row .s{font-size:11.5px;color:var(--text-muted);margin-top:2px}
    .pill{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap}
    .p-on{background:#ecfdf5;color:#047857}
    .p-off{background:#f1f5f9;color:#64748b}
    .fld{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:11px;padding:11px;font:inherit;font-size:15px;background:var(--surface);color:var(--text);margin-bottom:8px}
    .lbl{font-size:12.5px;font-weight:700;color:var(--text-muted);display:block;margin:0 0 5px 2px}
    .cal-wd{font-size:10.5px;color:var(--text-muted);padding:2px 0;font-weight:700}
    .cal-cell{position:relative;padding:6px 0 8px;border-radius:10px;cursor:pointer;font-size:12.5px;line-height:1.1}
    .cal-cell.mute{color:#cbd5e1;pointer-events:none}
    .cal-cell.today{background:var(--brand-500);color:#fff;font-weight:800}
    .cal-cell.sel{outline:2px solid #10b981;outline-offset:-2px}
    .cal-dots{display:flex;gap:2px;justify-content:center;margin-top:3px;height:6px}
    .cal-dots i{width:5px;height:5px;border-radius:50%;display:block}
    .d-g{background:#10b981}.d-r{background:#ef4444}
    .toast5{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(15,23,42,.93);color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;z-index:9999}
  </style>
</head>
<body>
  <div class="topbar"><a class="back" href="merchant-centre.html">‹</a><div class="title">場地管理</div></div>
  <div class="wrap">
    <div id="guard"></div>
    <div id="app" hidden>
      <div class="hero" id="hero"></div>
      <div class="kpi" id="kpis"></div>

      <div class="section-title">📅 場地檔期</div>
      <div class="card" style="padding:12px 12px 6px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <button class="btn btn-secondary" id="calPrev" style="min-height:32px;padding:0 12px">◀</button>
          <b id="calTitle" style="font-size:15px">—</b>
          <button class="btn btn-secondary" id="calNext" style="min-height:32px;padding:0 12px">▶</button>
        </div>
        <div style="position:relative;margin-bottom:8px">
          <div style="display:flex;gap:8px">
            <button class="btn btn-secondary" id="vCsvTop" style="flex:1;min-height:36px;font-size:13px">📊 本月 CSV</button>
            <button class="btn btn-secondary" id="vSyncBtn" style="flex:2;min-height:36px;font-size:13px">📲 同步排期到行事曆 ▾</button>
          </div>
          <div id="vSyncMenu" style="display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.15);padding:6px;z-index:1000">
            <button class="btn btn-secondary" id="vSyncIcs" style="width:100%;text-align:left;border:0;background:none;margin-bottom:4px">🍏 Apple Calendar / Outlook (.ics)</button>
            <button class="btn btn-secondary" id="vSyncGcal" style="width:100%;text-align:left;border:0;background:none;margin-bottom:4px">🌐 Google Calendar</button>
            <button class="btn btn-secondary" id="vSyncCsv" style="width:100%;text-align:left;border:0;background:none;margin-bottom:4px">📊 本月場租 CSV（對賬用）</button>
            <button class="btn btn-secondary" id="vStmt" style="width:100%;text-align:left;border:0;background:none">🧾 月結場租對賬單（可列印 PDF）</button>
          </div>
        </div>
        <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px">
          <div class="cal-wd">日</div><div class="cal-wd">一</div><div class="cal-wd">二</div>
          <div class="cal-wd">三</div><div class="cal-wd">四</div><div class="cal-wd">五</div><div class="cal-wd">六</div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--text-muted);margin-top:8px">
          <span>🟢 已出租</span><span>🔴 封鎖</span><span>⚪ 空置</span>
        </div>
      </div>
      <div class="section-title" id="agendaTitle">當日場地使用</div>
      <div class="card"><div class="body" id="schedule"></div></div>

      <div class="section-title">🚫 不可出租時段</div>
      <div class="card"><div class="body">
        <div class="muted" style="font-size:12px;margin-bottom:8px">封鎖後，教練喺呢段時間唔可以開班（系統會自動擋）。</div>
        <div id="blackouts" style="margin-bottom:10px"></div>
        <label class="lbl">新增封鎖</label>
        <input class="fld" type="datetime-local" id="boStart" />
        <input class="fld" type="datetime-local" id="boEnd" />
        <input class="fld" id="boReason" placeholder="原因（可選）例：私人包場／維修" />
        <button class="btn btn-primary btn-block" id="boAdd">封鎖此時段</button>
      </div></div>

      <div class="section-title">💰 場租對賬</div>
      <div class="card"><div class="body">
        <div class="row"><span>未來 14 日場租估算</span><b id="estRent">—</b></div>
        <div class="row"><span>費率</span><span id="rateLine">—</span></div>
        <a class="btn btn-primary btn-block" id="waSettle" style="background:#25d366;color:#04331c;margin-top:10px" target="_blank" rel="noopener">💬 WhatsApp 索取場租對賬單</a>
      </div></div>
      <div style="height:10px"></div>
      <a class="btn btn-secondary btn-block" href="venue-reception.html" style="margin-bottom:8px">🏟️ 前台執勤模式（只睇今日場次，無財務資料）</a>
      <a class="btn btn-secondary btn-block" href="merchant-centre.html">前往完整商戶中心（收入報表／租金設定）</a>
    </div>
    <div class="spacer"></div>
  </div>

  <script src="assets/api.js?v=3"></script>
  <script src="assets/partner-agreement.js?v=1"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const hkd = (n) => "HK$" + Number(n || 0).toLocaleString("en-HK");
    const fmt = (t) => { const d = new Date(String(t).replace(" ", "T")); return isNaN(d) ? String(t) : d.toLocaleString("zh-HK", { month: "short", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }); };
    const hm = (t) => { const d = new Date(String(t).replace(" ", "T")); return isNaN(d) ? "" : d.toLocaleTimeString("zh-HK", { hour: "2-digit", minute: "2-digit", hour12: false }); };
    function toast(m) { const t = document.createElement("div"); t.className = "toast5"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }

    let VENUE = null, SUMMARY = null;
    let CAL = { y: new Date().getFullYear(), m: new Date().getMonth() };
    let CAL_SESSIONS = [], CAL_BLACKOUTS = [];
    let SEL_DAY = new Date().toISOString().slice(0, 10);

    const dayKey = (t) => { const d = new Date(String(t).replace(" ", "T")); return isNaN(d) ? "" : d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
    const hm2 = (t) => { const d = new Date(String(t).replace(" ", "T")); return isNaN(d) ? "" : d.toLocaleTimeString("zh-HK", { hour: "2-digit", minute: "2-digit", hour12: false }); };

    (async () => {
      if (!api.getUser()) {
        $("guard").innerHTML = `<div class="card"><div class="body center" style="padding:24px 16px">
          <div style="font-size:36px">🏟️</div>
          <b style="display:block;font-size:16px;margin-top:6px">場地管理後台</b>
          <div class="muted" style="font-size:13px;margin-top:8px;line-height:1.7">需要已開通嘅商戶帳號登入。</div>
          <div style="display:grid;gap:9px;margin-top:14px">
            <a class="btn btn-primary" href="login.html?next=venue-dashboard.html">🔑 商戶登入</a>
            <a class="btn btn-secondary" href="partner-apply.html">✍️ 申請場地加盟</a>
          </div></div></div>`;
        return;
      }
      $("app").hidden = false;
      if (window.zpRequirePartnerAgreement) zpRequirePartnerAgreement(() => location.reload());
      await loadSchedule();
      await loadBlackouts();
      await loadCal();
      const vb = $("vSyncBtn"), vm = $("vSyncMenu");
      if (vb) vb.onclick = (e) => { e.stopPropagation(); vm.style.display = vm.style.display === "none" ? "block" : "none"; };
      document.addEventListener("click", () => { if (vm) vm.style.display = "none"; });
      const vi = $("vSyncIcs"); if (vi) vi.onclick = (e) => { e.stopPropagation(); vm.style.display = "none"; vDownloadIcsAll(); };
      const vs = $("vStmt"); if (vs) vs.onclick = (e) => { e.stopPropagation(); vm.style.display = "none"; venueStatement(); };
      const vt = $("vCsvTop"); if (vt) vt.onclick = () => vExportCsv();
      const vc = $("vSyncCsv"); if (vc) vc.onclick = (e) => { e.stopPropagation(); vm.style.display = "none"; vExportCsv(); };
      const vg = $("vSyncGcal"); if (vg) vg.onclick = (e) => {
        e.stopPropagation(); vm.style.display = "none";
        const list2 = (CAL_SESSIONS || []).filter((x) => x.status !== "cancelled" && dayKey(x.start_time) === SEL_DAY);
        const t = list2[0] || (CAL_SESSIONS || [])[0];
        if (!t) { alert("暫無排期可加入"); return; }
        vGoogleFor(t);
      };
    })();

    function renderCal() {
      const grid = $("calGrid"); if (!grid) return;
      const first = new Date(CAL.y, CAL.m, 1);
      const startDow = first.getDay();
      const dim = new Date(CAL.y, CAL.m + 1, 0).getDate();
      const prevDim = new Date(CAL.y, CAL.m, 0).getDate();
      $("calTitle").textContent = `${CAL.y} 年 ${CAL.m + 1} 月`;

      const byDay = {}, boByDay = {};
      CAL_SESSIONS.forEach((x) => { const k = dayKey(x.start_time); if (k) (byDay[k] = byDay[k] || []).push(x); });
      CAL_BLACKOUTS.forEach((b) => {
        // 展開封鎖時段覆蓋嘅所有日子（簡單逐日掃）
        let t = new Date(String(b.start_time).replace(" ", "T"));
        const end = new Date(String(b.end_time).replace(" ", "T"));
        while (t < end) { const k = dayKey(t.toISOString()); (boByDay[k] = boByDay[k] || 1); t = new Date(t.getTime() + 864e5); }
      });

      let html = "";
      for (let i = 0; i < startDow; i++) html += `<div class="cal-cell mute">${prevDim - startDow + 1 + i}</div>`;
      const todayK = new Date().toISOString().slice(0, 10);
      for (let d = 1; d <= dim; d++) {
        const k = `${CAL.y}-${String(CAL.m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const sList = byDay[k] || [];
        const dots = [];
        if (sList.length) dots.push("d-g");
        if (boByDay[k]) dots.push("d-r");
        const cls = ["cal-cell", k === todayK ? "today" : "", k === SEL_DAY ? "sel" : ""].filter(Boolean).join(" ");
        html += `<div class="${cls}" data-day="${k}">${d}${dots.length ? `<div class="cal-dots">${dots.slice(0,3).map(c=>`<i class="${c}"></i>`).join("")}</div>` : ""}</div>`;
      }
      grid.innerHTML = html;
      grid.querySelectorAll("[data-day]").forEach((el) => (el.onclick = () => { SEL_DAY = el.dataset.day; renderCal(); renderAgenda(); }));
    }

    function renderAgenda() {
      const box = $("schedule"); if (!box) return;
      const list = CAL_SESSIONS.filter((x) => dayKey(x.start_time) === SEL_DAY);
      const d = new Date(SEL_DAY + "T00:00:00");
      const wd = ["日","一","二","三","四","五","六"][d.getDay()];
      $("agendaTitle").textContent = `${d.getMonth()+1} 月 ${d.getDate()} 日（${wd}）· ${list.length} 場`;
      const rate = Number(VENUE && VENUE.rental_price_per_hour) || 0;
      const boList = CAL_BLACKOUTS.filter((b) => dayKey(b.start_time) === SEL_DAY || (new Date(b.start_time) <= d && new Date(b.end_time) >= d));
      let html = "";
      if (list.length) {
        html += list.map((x) => {
          const rent = Math.round((Number(x.duration) || 60) / 60 * rate);
          return `<div class="row"><span><b>${esc(x.title)}</b>
            <span class="s">${esc(hm2(x.start_time))} – ${esc(hm2(x.end_time))} · ${esc(x.coach_name || "教練")} · ${x.enrolled_count}/${x.max_participants} 人</span></span>
            <span class="pill p-on">${hkd(rent)}</span></div>`;
        }).join("");
      } else {
        html += '<div class="muted center" style="padding:12px 0">呢日暫時冇教練租用。</div>';
      }
      if (boList.length) {
        html += boList.map((b) => `<div class="row"><span><b>🚫 封鎖時段</b><span class="s">${esc(hm2(b.start_time))} – ${esc(hm2(b.end_time))} · ${esc(b.reason || "不可出租")}</span></span></div>`).join("");
      }
      html += `<button class="btn btn-secondary btn-block" id="blockDay" style="margin-top:10px">🔒 封鎖呢日（內部自用／維修）</button>`;
      if (list.length) html += `<button class="btn btn-primary btn-block" id="dayGcal" style="margin-top:8px">📅 加入 Google Calendar（當日）</button>`;
      box.innerHTML = html;
      const dg = $("dayGcal");
      if (dg) dg.onclick = () => vGoogleFor(list[0]);
      const bd = $("blockDay");
      if (bd) bd.onclick = () => {
        $("boStart").value = SEL_DAY + "T09:00";
        $("boEnd").value = SEL_DAY + "T18:00";
        $("boReason").value = "內部自用／維修";
        $("boStart").scrollIntoView({ behavior: "smooth", block: "center" });
      };
    }

    /* ===== 📲 場地排期同步到行事曆 ===== */
    function vIcsDate(t) {
      const d = new Date(String(t).replace(" ", "T"));
      if (isNaN(d)) return null;
      return d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    }
    function vRentFor(x) { return Math.round((Number(x.duration) || 60) / 60 * (Number(VENUE && VENUE.rental_price_per_hour) || 0)); }
    function vSummary(x) { return `🏢 [ZenPass 借場] ${VENUE ? VENUE.name : ""} · ${x.title || ""}（教練 ${x.coach_name || "—"}）`; }
    function vDesc(x) {
      return [
        `場租收益：${hkd(vRentFor(x))}`,
        `入場人數：${x.enrolled_count || 0}/${x.max_participants || 0}`,
        `教練：${x.coach_name || "—"}`,
        `排期編號：${x.id}`,
        `後台：https://zenpass.hk/venue-dashboard.html`,
      ].join("\n");
    }
    function vDownloadIcsAll() {
      const list = (CAL_SESSIONS || []).filter((x) => x.status !== "cancelled");
      if (!list.length) { alert("暫無場地排期可匯出"); return; }
      const now = vIcsDate(new Date());
      const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ZenPass//Venue Bookings//ZH-HK", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:ZenPass 場地借用排期"];
      list.forEach((x) => {
        const st = vIcsDate(x.start_time), en = vIcsDate(x.end_time);
        if (!st || !en) return;
        lines.push(
          "BEGIN:VEVENT",
          "UID:" + (x.id || st) + "@venue.zenpass.hk",
          "DTSTAMP:" + now,
          "DTSTART:" + st,
          "DTEND:" + en,
          "SUMMARY:" + vSummary(x).replace(/[,;]/g, " "),
          "LOCATION:" + String((VENUE && VENUE.name) || "").replace(/[,;]/g, " "),
          "DESCRIPTION:" + vDesc(x).split("\n").join("\\n").replace(/[,;]/g, " "),
          "STATUS:CONFIRMED",
          "BEGIN:VALARM", "TRIGGER:-PT30M", "ACTION:DISPLAY",
          "DESCRIPTION:提醒：30 分鐘後有教練借場", "END:VALARM",
          "END:VEVENT",
        );
      });
      lines.push("END:VCALENDAR");
      const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `ZenPass_Venue_Bookings_${new Date().toISOString().slice(0, 10)}.ics`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      toast(`📲 已匯出 ${list.length} 場排期`);
    }
    function vGoogleFor(x) {
      const st = vIcsDate(x.start_time), en = vIcsDate(x.end_time);
      if (!st || !en) { alert("此排期未有確實時間"); return; }
      const u = new URL("https://calendar.google.com/calendar/render");
      u.searchParams.append("action", "TEMPLATE");
      u.searchParams.append("text", vSummary(x));
      u.searchParams.append("dates", st + "/" + en);
      u.searchParams.append("details", vDesc(x));
      u.searchParams.append("location", (VENUE && VENUE.name) || "");
      window.open(u.toString(), "_blank");
    }

    function venueStatement() {
      const y = CAL.y, m = CAL.m;
      const rows = (CAL_SESSIONS || []).filter((x) => {
        const d = new Date(String(x.start_time).replace(" ", "T"));
        return d.getFullYear() === y && d.getMonth() === m && x.status !== "cancelled";
      });
      if (!rows.length) { alert(`${y} 年 ${m + 1} 月暫無場地排期`); return; }
      let total = 0, heads = 0, allSettled = true;
      const lines = rows.map((x) => {
        const rent = vRentFor(x);
        total += rent; heads += Number(x.enrolled_count) || 0;
        if (!x.settled_at) allSettled = false;
        const st = x.settled_at ? "已結算" : (new Date(String(x.end_time).replace(" ", "T")).getTime() < Date.now() ? "已完結待平賬" : "未開始");
        return `<tr><td>${dayKey(x.start_time)}</td><td>${hm2(x.start_time)}–${hm2(x.end_time)}</td>
          <td>${esc(x.title || "")}</td><td>${esc(x.coach_name || "")}</td>
          <td style="text-align:right">${x.enrolled_count || 0}</td>
          <td style="text-align:right">${rent}</td><td>${st}</td></tr>`;
      }).join("");
      const uid = String((VENUE && VENUE.id) || "VENUE").replace(/[^A-Za-z0-9]/g, "").slice(-4).toUpperCase();
      const inv = `INV-${y}${String(m + 1).padStart(2, "0")}-V${uid}`;
      const stamp = allSettled ? '<div class="stamp paid">PAID 已結算</div>' : '<div class="stamp pending">PENDING 待平賬</div>';
      const html = `<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><title>${inv} 場租對賬單</title>
<style>
@page{size:A4;margin:14mm}body{font-family:"PingFang HK","Noto Sans TC",sans-serif;color:#0f172a;margin:0}
.head{display:flex;justify-content:space-between;border-bottom:3px solid #ff6b35;padding-bottom:10px}
.brand{font-size:12px;letter-spacing:2px;font-weight:800;color:#ff6b35}
h1{font-size:20px;margin:6px 0 4px}.meta{font-size:11px;color:#475569;line-height:1.7;text-align:right}
.stamp{position:absolute;right:24px;top:150px;border:3px solid;padding:6px 14px;border-radius:8px;font-weight:800;transform:rotate(-8deg);font-size:15px}
.stamp.paid{color:#047857;border-color:#047857}.stamp.pending{color:#b45309;border-color:#b45309}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border-bottom:1px solid #e2e8f0;padding:6px 5px;font-size:11px}
th{background:#f8fafc;text-align:left;font-size:10.5px;color:#475569}
.tot{margin-top:12px;margin-left:auto;width:55%;font-size:12px}
.tot div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #cbd5e1}
.tot .big{font-weight:800;font-size:14px;color:#047857;border:0}
.foot{margin-top:18px;border-top:1px dashed #cbd5e1;padding-top:8px;font-size:10px;color:#64748b;display:flex;justify-content:space-between}
</style></head><body>
<div class="head"><div>
  <div class="brand">ZENPASS 禪流</div><h1>場地月結對賬單</h1>

    function vExportCsv() {
      const y = CAL.y, m = CAL.m;
      const rows = (CAL_SESSIONS || []).filter((x) => {
        const d = new Date(String(x.start_time).replace(" ", "T"));
        return d.getFullYear() === y && d.getMonth() === m && x.status !== "cancelled";
      });
      if (!rows.length) { alert(`${y} 年 ${m + 1} 月暫無場地排期`); return; }
      const head = ["排期編號","日期","開始","結束","課堂","教練","已報","名額","場租(HK$)","狀態"];
      const lines = [head.join(",")];
      let total = 0;
      rows.forEach((x) => {
        const rent = vRentFor(x);
        total += rent;
        const ended = new Date(String(x.end_time).replace(" ", "T")).getTime() < Date.now();
        const st = x.settled_at ? "已結算" : ended ? "已完結待平賬" : "未開始";
        lines.push([x.id, dayKey(x.start_time), hm2(x.start_time), hm2(x.end_time),
          `"${String(x.title || "").replace(/"/g, '""')}"`,
          `"${String(x.coach_name || "").replace(/"/g, '""')}"`,
          x.enrolled_count || 0, x.max_participants || 0, rent, st].join(","));
      });
      lines.push(["【當月總計】", "", "", "", `${rows.length} 場`, "", "", "", total, ""].join(","));
      const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      const who = String((VENUE && VENUE.name) || "場地").replace(/[\\/:*?"<>|]/g, "");
      a.download = `ZenPass_場地對賬單_${who}_${y}-${String(m + 1).padStart(2, "0")}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      toast("📊 已匯出 " + rows.length + " 場");
    }

    async function loadCal() {
      const r = await api.get("/partner/venue/schedule?days=60");
      CAL_SESSIONS = (r.data && r.data.sessions) || [];
      const b = await api.get("/partner/venue/blackouts");
      CAL_BLACKOUTS = (b.data && b.data.blackouts) || [];
      renderCal(); renderAgenda();
    }

    const _cp = $("calPrev"), _cn = $("calNext");
    if (_cp) _cp.onclick = () => { CAL.m--; if (CAL.m < 0) { CAL.m = 11; CAL.y--; } renderCal(); };
    if (_cn) _cn.onclick = () => { CAL.m++; if (CAL.m > 11) { CAL.m = 0; CAL.y++; } renderCal(); };

    async function loadSchedule() {
      const r = await api.get("/partner/venue/schedule?days=14");
      if (!r.ok) {
        $("guard").innerHTML = `<div class="card"><div class="body center">${esc((r.data && r.data.error) || "你未有已開通嘅場地")}<br><br><a class="btn btn-secondary" href="partner-apply.html">申請場地加盟</a></div></div>`;
        $("app").hidden = true;
        return;
      }
      VENUE = r.data.venue; SUMMARY = r.data.summary;
      $("hero").innerHTML = `<h2>🏟️ ${esc(VENUE.name)}</h2><p>每小時租金 ${hkd(VENUE.rental_price_per_hour)} · 按實際排期計</p>`;
      $("kpis").innerHTML = `
        <div><div class="v">${SUMMARY.sessions}</div><div class="l">未來 14 日場次</div></div>
        <div><div class="v">${SUMMARY.hours}</div><div class="l">使用小時</div></div>
        <div><div class="v">${hkd(SUMMARY.estimated_rent)}</div><div class="l">估算場租</div></div>
        <div><div class="v">${hkd(VENUE.rental_price_per_hour)}</div><div class="l">每小時費率</div></div>`;
      const list = r.data.sessions || [];
      $("schedule").innerHTML = list.length
        ? list.map((s) => `<div class="row"><span><b>${esc(s.title)}</b>
            <span class="s">${esc(fmt(s.start_time))} – ${esc(hm(s.end_time))} · ${esc(s.coach_name || "教練")} · ${s.enrolled_count}/${s.max_participants} 人</span></span>
            <span class="pill p-on">${hkd((Number(s.duration) || 60) / 60 * (Number(VENUE.rental_price_per_hour) || 0))}</span></div>`).join("")
        : '<div class="muted center" style="padding:16px 0">未來 14 日暫時冇課堂租用。</div>';
      $("estRent").textContent = hkd(SUMMARY.estimated_rent);
      $("rateLine").textContent = hkd(VENUE.rental_price_per_hour) + " / 小時";
      const msg = `你好，我係「${VENUE.name}」場主，想索取最近 14 日場租對賬單（場次 ${SUMMARY.sessions} 場、${SUMMARY.hours} 小時、估算 ${hkd(SUMMARY.estimated_rent)}）。`;
      $("waSettle").href = "https://wa.me/85290335538?text=" + encodeURIComponent(msg);
    }

    async function loadBlackouts() {
      const r = await api.get("/partner/venue/blackouts");
      if (!r.ok) return;
      const rows = r.data.blackouts || [];
      $("blackouts").innerHTML = rows.length
        ? rows.map((b) => `<div class="row"><span><b>${esc(fmt(b.start_time))} – ${esc(hm(b.end_time))}</b>
            <span class="s">${esc(b.reason || "不可出租")}</span></span>
            <button class="btn btn-secondary" style="min-height:32px;padding:0 10px;font-size:12px" data-del="${esc(b.id)}">解除</button></div>`).join("")
        : '<div class="muted" style="font-size:12.5px">暫時冇封鎖時段。</div>';
      $("blackouts").querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
        if (!confirm("解除呢個封鎖？")) return;
        const rr = await api.del ? await api.del("/partner/venue/blackouts/" + encodeURIComponent(b.dataset.del)) : await fetch((window.API_BASE || "") + "/api/partner/venue/blackouts/" + encodeURIComponent(b.dataset.del), { method: "DELETE", credentials: "include" });
        toast("✅ 已解除");
        loadBlackouts();
      }));
    }

    $("boAdd").onclick = async () => {
      const st = $("boStart").value, en = $("boEnd").value;
      if (!st || !en) { alert("請揀開始同結束時間"); return; }
      const r = await api.post("/partner/venue/blackouts", {
        start_time: new Date(st).toISOString(), end_time: new Date(en).toISOString(), reason: $("boReason").value.trim(),
      });
      if (r.ok) { toast("✅ 已封鎖"); $("boStart").value = ""; $("boEnd").value = ""; $("boReason").value = ""; loadBlackouts(); }
      else alert((r.data && r.data.error) || "封鎖失敗");
    };
  </script>
