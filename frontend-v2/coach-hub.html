    function countUp(el, target, prefix, suffix) {
      const from = Number(el.dataset.v || 0), to = Number(target) || 0;
      const t0 = performance.now(), dur = 650;
      function step(t) {
        const k = Math.min(1, (t - t0) / dur);
        const v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
        el.textContent = (prefix || "") + v.toLocaleString("en-HK") + (suffix || "");
        if (k < 1) requestAnimationFrame(step); else el.dataset.v = to;
      }
      requestAnimationFrame(step);
    }

          <input class="fld4" type="time" id="qEnd" value="15:30" />
        </div>
        <label class="lbl4">3️⃣ 名額</label>
        <input class="fld4" type="number" id="qCap" min="2" max="60" value="8" />
        <button class="btn2" id="qGo" style="width:100%;margin-top:6px">發布時段</button>
        <div class="muted4" id="qMsg" style="margin-top:10px"></div>`;
      $("mk").classList.add("on"); $("sh").classList.add("on");
      $("qGo").onclick = async () => {
        const st = new Date($("qDate").value + "T" + $("qStart").value);
        const en = new Date($("qDate").value + "T" + $("qEnd").value);
        if (isNaN(st) || isNaN(en) || en <= st) { $("qMsg").textContent = "時間有誤"; return; }
        const btn = $("qGo"); btn.disabled = true; btn.textContent = "發布中…";
        const r = await api.post("/coach/schedules", {
          class_id: $("qClass").value, start_time: st.toISOString(), end_time: en.toISOString(),
          max_participants: Number($("qCap").value) || 8,
        });
        btn.disabled = false; btn.textContent = "發布時段";
        if (!r.ok) { $("qMsg").textContent = (r.data && r.data.error) || "發布失敗"; return; }
        closeSheet(); toast("✅ 已發布時段"); loadAll(true);
      };
    }
  </script>
  <script src="assets/footer.js?v=4" defer></script>
</body>
</html>
