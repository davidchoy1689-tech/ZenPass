<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#064E3B" media="(prefers-color-scheme: dark)" />

  <link rel="stylesheet" href="assets/v2.css?v=38" />
  <link rel="stylesheet" href="assets/polish.css?v=1" />
  <link rel="stylesheet" href="assets/ui-v3.css?v=5" />
  <style>
    body{background:#F8FAFC;color:#0F172A;font-size:16px}
    .h-wrap{max-width:720px;margin:0 auto;padding:16px 14px 90px}
    .h-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .h-head h1{font-size:20px;font-weight:900;margin:0;flex:1}
    .h-head a{font-size:13px;font-weight:700;color:#059669;text-decoration:none}
    .h-tl{position:relative;padding-left:18px}
    .h-tl::before{content:"";position:absolute;left:5px;top:4px;bottom:0;width:2px;background:#A7F3D0}
    .h-card{position:relative;background:#fff;border:1.5px solid #E2E8F0;border-radius:14px;padding:14px;margin-bottom:14px}
    .h-card::before{content:"";position:absolute;left:-17px;top:18px;width:10px;height:10px;border-radius:50%;background:#059669;border:2px solid #fff;box-shadow:0 0 0 2px #A7F3D0}
    .h-date{font-size:12px;font-weight:800;color:#059669;background:#ECFDF5;border:1px solid #D1FAE5;border-radius:999px;padding:2px 8px;display:inline-block}
    .h-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
    .h-tag{font-size:12px;font-weight:800;color:#065F46;background:#DCFCE7;border-radius:6px;padding:3px 8px}
    .h-comment{font-size:15.5px;line-height:1.7;margin:6px 0;white-space:pre-line}
    .h-hw{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.6;margin-top:8px}
    .h-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
    .h-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid #E2E8F0}
    .h-replies{margin-top:12px;border-top:1px dashed #E2E8F0;padding-top:10px;display:flex;flex-direction:column;gap:7px}
    .h-reply{font-size:13.5px;line-height:1.55;background:#F8FAFC;border-radius:8px;padding:7px 9px}
    .h-reply b{color:#065F46}
    .h-form{display:flex;gap:6px;margin-top:8px}
    .h-form input{flex:1;border:1.5px solid #CBD5E1;border-radius:9px;padding:10px;font:inherit;font-size:14px}
    .h-form button{border:0;background:#059669;color:#fff;border-radius:9px;padding:0 14px;font-weight:900;font-size:14px;cursor:pointer}
    .h-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
    .h-quick a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:#fff;border:1.5px solid #E2E8F0;border-radius:12px;text-decoration:none;color:#0F172A;font-size:12.5px;font-weight:800;text-align:center}
    .h-quick a span{font-size:20px;line-height:1}
    .h-quick a:active{transform:scale(.97)}
    @media (max-width:360px){.h-quick{grid-template-columns:repeat(2,1fr)}}
    .h-empty{text-align:center;color:#64748B;padding:30px;font-size:15px}
    .h-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.2s;z-index:99}
    .h-toast.on{opacity:1}
    .wallet{background:linear-gradient(135deg,#ECFDF5,#F0FDFA);border:1.5px solid #A7F3D0;border-radius:16px;padding:14px 16px;margin-bottom:14px}
    .wallet-top{display:flex;align-items:baseline;gap:8px}
    .wallet-num{font-size:34px;font-weight:900;color:#065F46;line-height:1}
    .wallet-lbl{font-size:14px;font-weight:800;color:#047857}
    .wallet-sub{font-size:13.5px;color:#475569;margin-top:6px;line-height:1.6}
    .wallet-btn{display:inline-block;margin-top:10px;background:#059669;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:900;cursor:pointer;text-decoration:none}
    .wallet-reward{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700;margin-top:8px}
    .up-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
    .up-card b{font-size:14px}
    .up-card .s{font-size:12px;color:#64748B;line-height:1.6}
    .up-card button{border:1px solid #FCA5A5;background:#fff;color:#B91C1C;border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
    .up-card button:disabled{border-color:#E2E8F0;color:#94A3B8;background:#F8FAFC;cursor:not-allowed}
    .up-title{font-size:14px;font-weight:900;margin:14px 0 8px}
    .qr-modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
    .qr-modal[hidden]{display:none}
    .qr-box{background:#fff;border-radius:20px;padding:20px;text-align:center;max-width:340px;width:100%}
    .qr-box h3{margin:0 0 4px;font-size:16px}
    .qr-box .s{font-size:12px;color:#64748b;margin-bottom:10px}
    #qrCanvas{display:flex;justify-content:center;margin:10px 0}
    .qr-count{font-size:12px;font-weight:900;color:#b45309}
    .qr-pin{font-size:22px;font-weight:900;letter-spacing:4px;margin:8px 0;color:#0f766e}
    .qr-box button{width:100%;border:0;border-radius:11px;padding:11px;font:inherit;font-weight:800;background:#f1f5f9;color:#334155;margin-top:8px}
  
    /* 桌面寬屏（zp-wide）：手機不變 */
    @media (min-width: 768px) and (max-width: 1023px) {
      body.zp-wide .wrap, body.zp-wide .topbar, body.zp-wide .bottomnav { max-width: 860px; }
    }
    @media (min-width: 1024px) {
      body.zp-wide .wrap, body.zp-wide .topbar, body.zp-wide .bottomnav { max-width: 960px; }
    }
</style>

<div class="qr-modal" id="qrModal" hidden><div class="qr-box">
  <h3 id="qrTitle">即時入場通行憑證</h3>
  <div class="s" id="qrSub"></div>
  <div id="qrCanvas"></div>
  <div class="qr-count" id="qrCount"></div>
  <div class="s" style="margin-top:10px">🔑 門店備用 PIN</div>
  <div class="qr-pin" id="qrPin">------</div>
  <button id="qrClose" type="button">關閉</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/api.js?v=16"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let SID = new URLSearchParams(location.search).get("student_id") || "";
  let toastTimer;
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2000); };

  async function loadWallet() {
    const s = await api.get("/student/referral/summary");
    if (!s.ok || !s.data) return;
    const d = s.data;
    const bal = Number(d.pass_balance) || 0;
    const my = d.my_referral;
    const recent = (d.recent || []).find((r) => r.status === "rewarded");
    const link = location.origin + "/detail.html?id=07188a59-2a63-44f1-b517-a4b0790196dd&utm_source=friend_referral" + (d.code ? "&ref=" + encodeURIComponent(d.code) : "");
    const msg = `我喺 ZenPass 做運動，教練一對一小班。你用我條連結登記，完成第一堂之後，我哋各多 1 堂：${link}`;
    $("wallet").innerHTML = `
      <div class="wallet">
        <div class="wallet-top"><span class="wallet-num">${bal}</span><span class="wallet-lbl">堂 · 我的堂數存簿</span></div>
        <div class="wallet-sub">剩餘堂數會喺預約時自動扣減；取消／請假會自動退回。</div>
        ${recent ? `<div class="wallet-reward">🎁 親友 ${esc(recent.name)} 已出席，為你帶來 +1 堂獎賞！</div>` : ""}
        ${my && my.status === "pending_attendance" ? `<div class="wallet-sub">⏳ ${esc(my.referrer_name)} 推薦咗你，完成第一堂出席後雙方各得 1 堂。</div>` : ""}
        ${my && my.status === "rewarded" ? `<div class="wallet-reward">✅ 你已完成首堂，推薦獎賞已入帳。</div>` : ""}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <a class="wallet-btn" href="my-bookings.html">預約用堂</a>
          <button class="wallet-btn" id="refShare" style="background:#fff;color:#065F46;border:1.5px solid #A7F3D0">💬 推薦朋友 · 各得 1 堂</button>
        </div>
        <div class="wallet-sub" style="margin-top:8px">已推薦 ${Number(d.stats?.invited) || 0} 人 · 已獎賞 ${Number(d.stats?.rewarded) || 0} 次（每月上限 ${Number(d.stats?.monthly_cap) || 4} 次）</div>
      </div>`;
    const btn = $("refShare");
    if (btn) btn.onclick = async () => {
      if (navigator.share) { try { await navigator.share({ text: msg }); return; } catch (e) {} }
      try { await navigator.clipboard.writeText(msg); toast("已複製推薦訊息"); } catch (e) { alert(msg); }
    };
  }

  async function load() {
    if (!SID) {
      const me = await api.me();
      if (!me.ok) { location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search); return; }
      SID = me.data.user.id;
    }
    loadWallet();
    loadUpcoming();
    const r = await api.get("/student/handbook/" + encodeURIComponent(SID));
    if (!r.ok) { $("list").innerHTML = `<div class="h-empty">${esc((r.data && r.data.error) || "讀取失敗")}</div>`; return; }
    const list = r.data.handbooks || [];
    if (!list.length) { $("list").innerHTML = '<div class="h-empty">教練未更新手冊，完成課堂後再嚟睇。</div>'; return; }
    $("title").textContent = (list[0].student_name || "學員") + " 嘅運動手冊";
    loadAnnouncements(list[0].session_id);
    $("list").innerHTML = '<div class="h-tl">' + list.map((h) => `
      <div class="h-card" data-id="${esc(h.id)}">
        <span class="h-date">${esc(h.log_date)}</span>
        <div class="h-tags">${(h.tags || []).map((t) => `<span class="h-tag">${esc(t)}</span>`).join("")}</div>
        <div class="h-comment">${esc(h.comment)}</div>
        ${h.homework ? `<div class="h-hw">🏠 <b>回家功課：</b>${esc(h.homework)}</div>` : ""}
        ${(h.photos || []).length ? `<div class="h-photos">${h.photos.map((p) => `<img src="${esc(p)}" alt="課堂相片" loading="lazy">`).join("")}</div>` : ""}
        <div class="h-replies" data-replies>
          ${(h.replies || []).map((r) => `<div class="h-reply"><b>${esc(r.author_name)}：</b>${esc(r.content)}</div>`).join("")}
        </div>
        ${h.allow_reply ? `<div class="h-form"><input placeholder="多謝教練／想問…" maxlength="500"><button>傳送</button></div>` : ""}
      </div>`).join("") + "</div>";

    $("list").querySelectorAll(".h-form").forEach((form) => {
      const btn = form.querySelector("button"), input = form.querySelector("input");
      btn.onclick = async () => {
        const content = input.value.trim();
        if (!content) return toast("請輸入留言");
        btn.disabled = true;
        const id = form.closest(".h-card").dataset.id;
        const r2 = await api.post("/student/handbook/" + encodeURIComponent(id) + "/reply", { content });
        btn.disabled = false;
        if (r2.ok) {
          input.value = "";
          const box = form.parentElement.querySelector("[data-replies]");
          box.insertAdjacentHTML("beforeend", `<div class="h-reply"><b>我：</b>${esc(content)}</div>`);
          toast("✅ 已送出");
        } else toast("❌ " + ((r2.data && r2.data.error) || "送出失敗"));
      };
    });
  }

  function upHours(t) {
    const raw = String(t || "");
    const iso = /Z|[+-]\d\d:?\d\d$/.test(raw) ? raw : raw.replace(" ", "T") + "Z";
    const ms = new Date(iso).getTime();
    return isNaN(ms) ? -1 : (ms - Date.now()) / 3600000;
  }
  async function loadUpcoming() {
    try {
      const r = await api.get("/bookings/my?status=confirmed&limit=30");
      const rows = ((r.data && r.data.bookings) || []).filter((b) => b.user_id === SID && upHours(b.start_time) > 0).slice(0, 3);
      if (!rows.length) { $("upcoming").innerHTML = ""; return; }
      $("upcoming").innerHTML = '<div class="up-title">🗓️ 即將上課</div>' + rows.map((b) => {
        const h = upHours(b.start_time);
        const btn = h >= 24
          ? `<button data-cancel="${esc(b.id)}">🗓️ 取消預約（退還 1 堂）</button>`
          : `<button disabled title="開課前 24 小時內不可取消">🔒 24 小時內不可退</button>`;
        return `<div class="up-card"><div><b>${esc(b.title || "課堂")}</b><div class="s">${esc(String(b.start_time || "").slice(0, 16))}${b.venue_name ? " · " + esc(b.venue_name) : ""}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button data-checkin="${esc(b.id)}" style="border-color:#5eead4;color:#0f766e">🎟️ 入場碼</button>${btn}</div></div>`;
      }).join("");
      $("upcoming").querySelectorAll("[data-cancel]").forEach((btn) => {
        btn.onclick = async () => {
          if (!confirm("確定取消此預約？取消後 1 堂通行 Pass 會即時退回錢包。")) return;
          btn.disabled = true;
          const rr = await api.post("/bookings/" + encodeURIComponent(btn.dataset.cancel) + "/cancel", { reason: "user_self_cancel" });
          if (rr.ok) { toast("已取消，1 堂已退回"); loadWallet(); loadUpcoming(); }
          else { btn.disabled = false; alert((rr.data && rr.data.error) || "取消失敗"); }
        };
      });
      $("upcoming").querySelectorAll("[data-checkin]").forEach((btn) => {
        btn.onclick = () => openQr(btn.dataset.checkin);
      });
    } catch (e) {}
  }

  let qrTimer = null;
  async function openQr(bookingId) {
    const modal = $("qrModal");
    modal.hidden = false;
    $("qrCanvas").innerHTML = "";
    $("qrPin").textContent = "------";
    const load = async () => {
      const r = await api.get("/student/checkin-token/" + encodeURIComponent(bookingId));
      if (!r.ok) { $("qrSub").textContent = (r.data && r.data.error) || "尚未到入場時間"; return; }
      $("qrSub").textContent = "每 30 秒自動更新 · 禁止截圖轉發";
      new QRCode($("qrCanvas"), { text: r.data.token, width: 190, height: 190, correctLevel: QRCode.CorrectLevel.M });
      let left = r.data.expires_in_seconds || 30;
      clearInterval(qrTimer);
      qrTimer = setInterval(async () => {
        left--;
        $("qrCount").textContent = `🔄 ${Math.max(left, 0)} 秒後更新`;
        if (left <= 0) { clearInterval(qrTimer); await load(); }
      }, 1000);
      $("qrCount").textContent = `🔄 ${left} 秒後更新`;
      try {
        const p = await api.get("/student/door-pin/" + encodeURIComponent(bookingId));
        if (p.ok) $("qrPin").textContent = p.data.pin;
      } catch (e) {}
    };
    $("qrClose").onclick = () => { clearInterval(qrTimer); modal.hidden = true; };
    await load();
  }
  async function loadAnnouncements(sessionId) {
    try {
      const r = await api.get("/student/announcements?session_id=" + encodeURIComponent(sessionId || ""));
      const now = Date.now();
      const show = (r.data && r.data.announcements || []).filter((a) => {
        if (a.is_pinned) return true;
        const t = new Date(String(a.created_at).replace(" ", "T")).getTime();
        return !isNaN(t) && now - t < 48 * 3600 * 1000;
      }).slice(0, 3);
      if (!show.length) return;
      $("annBar").innerHTML = show.map((a) => `
        <div style="background:#FEFCE8;border:1.5px solid #FDE68A;border-radius:12px;padding:10px 12px;margin-bottom:10px">
          <div style="font-size:13.5px;font-weight:900;color:#92400E">📢 ${esc(a.title)}</div>
          <div style="font-size:12.5px;color:#78350F;line-height:1.55;margin-top:3px;white-space:pre-line">${esc(a.content)}</div>
          <div style="font-size:10.5px;color:#A16207;margin-top:4px">${esc(a.coach_name || "教練")} · ${esc(String(a.created_at).slice(0, 10))}</div>
        </div>`).join("");
    } catch (e) {}
  }
  load();
</script>

<div id="mkSection" style="margin:22px 14px 90px;display:none">
  <div style="font-size:15px;font-weight:900;margin-bottom:4px" id="mkTitle">🧘 教練推薦 · 今日課堂復康輔助用品</div>
  <div style="font-size:12px;color:#64748b;margin-bottom:10px">順豐包郵到屋企 / 智能櫃 · 平台直送</div>
  <div id="mkCards"></div>
</div>

<div id="mkMask" hidden style="position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:flex;align-items:flex-end">
  <div style="background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 26px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b id="mkModalTitle">輔具訂購</b><button id="mkClose" style="border:0;background:#f1f5f9;border-radius:8px;padding:6px 10px">✕</button>
    </div>
    <div id="mkProduct" style="font-size:13px;color:#334155;margin-bottom:10px"></div>
    <input id="mkName" placeholder="收件人姓名" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:8px">
    <input id="mkPhone" inputmode="numeric" placeholder="香港手提電話" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:8px">
    <input id="mkDistrict" placeholder="送貨地區（例：Kwai Tsing）" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:8px">
    <textarea id="mkAddr" rows="2" placeholder="詳細送貨地址（順豐可到屋企或智能櫃）" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:10px;font:inherit"></textarea>
    <div id="mkCardBox" style="display:none;border:1px solid #cbd5e1;border-radius:10px;padding:11px;margin-bottom:10px"></div>
    <button id="mkPay" style="width:100%;padding:14px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-size:15px;font-weight:800">一鍵付款</button>
    <div id="mkMsg" style="font-size:12.5px;color:#64748b;margin-top:10px;line-height:1.6"></div>
  </div>
</div>
<script>
(function(){
  const tk = localStorage.getItem("zenpass_token");
  if (!tk) return;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let products = [], current = null, coachId = null, stripe = null, card = null, clientSecret = null;
  const auth = { authorization: "***" + tk };

  async function init(){
    try {
      const b = await fetch("/api/bookings/my", { headers: auth }).then(r=>r.json());
      const list = b.bookings || b.data || [];
      const latest = list[0] || null;
      coachId = latest && (latest.coach_id || latest.coachId) || null;
    } catch(e){}
    const r = await fetch("/api/marketplace/products").then(x=>x.json()).catch(()=>({}));
    products = (r.products || []).slice(0,3);
    if (!products.length) return;
    $("mkSection").style.display = "block";
    $("mkCards").innerHTML = products.map((p)=>`
      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px">
        <img src="${esc(p.image_url)}" alt="" style="width:78px;height:78px;object-fit:cover;border-radius:10px;background:#f1f5f9">
        <div style="flex:1">
          <div style="font-size:13.5px;font-weight:800;line-height:1.35">${esc(p.title)}</div>
          <div style="font-size:12px;color:#64748b;margin-top:3px">順豐包郵 · 教練推薦</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
            <b style="color:#0f766e">HK$ ${(p.price_cents/100).toFixed(0)}</b>
            <button data-buy="${esc(p.id)}" style="border:0;background:#0f766e;color:#fff;border-radius:9px;padding:7px 12px;font-weight:700">🛍️ 購買</button>
          </div>
        </div>
      </div>`).join("");
    document.querySelectorAll("[data-buy]").forEach((b)=>b.onclick=()=>openBuy(b.dataset.buy));
  }

  function openBuy(id){
    current = products.find((p)=>p.id===id);
    if (!current) return;
    clientSecret = null; card = null;
    $("mkProduct").textContent = current.title + " · HK$" + (current.price_cents/100).toFixed(0);
    $("mkCardBox").style.display = "none";
    $("mkPay").textContent = "一鍵付款 · HK$" + (current.price_cents/100).toFixed(0);
    $("mkMsg").textContent = "";
    $("mkMask").hidden = false;
  }
  $("mkClose").onclick = ()=>{ $("mkMask").hidden = true; };
  $("mkMask").onclick = (e)=>{ if(e.target.id==="mkMask") $("mkMask").hidden = true; };

  $("mkPay").onclick = async ()=>{
    const msg = $("mkMsg");
    const body = {
      product_id: current.id, coach_id: coachId, quantity: 1,
      shipping_name: $("mkName").value.trim(), shipping_phone: $("mkPhone").value.trim(),
      shipping_address: $("mkAddr").value.trim(), shipping_district: $("mkDistrict").value.trim(),
    };
    if (clientSecret && stripe && card) {
      msg.textContent = "付款處理中…";
      const res = await stripe.confirmCardPayment(clientSecret, { payment_method: { card } });
      if (res.error) { msg.textContent = res.error.message; return; }
      const done = await fetch("/api/marketplace/orders/" + encodeURIComponent(currentOrderId) + "/complete", { method:"POST", headers:{...auth,"content-type":"application/json"}, body:"{}" }).then(r=>r.json());
      if (done.success){ msg.textContent = "✅ 付款成功，順豐將於 1–2 個工作天出貨"; setTimeout(()=>{ $("mkMask").hidden = true; }, 1500); }
      else msg.textContent = done.error || "確認付款失敗";
      return;
    }
    $("mkPay").disabled = true;
    const r = await fetch("/api/marketplace/orders/checkout", { method:"POST", headers:{...auth,"content-type":"application/json","idempotency-key":"mk-"+Date.now()}, body: JSON.stringify(body) }).then(x=>x.json()).catch(()=>({}));
    $("mkPay").disabled = false;
    if (!r.success){ msg.textContent = r.error || "下單失敗"; return; }
    if (r.order && r.order.order_status === "paid") { msg.textContent = "✅ 已付款，順豐將於 1–2 個工作天出貨"; setTimeout(()=>{ $("mkMask").hidden = true; }, 1500); return; }
    if (r.checkout_url) { location.href = r.checkout_url; return; }
    msg.textContent = "付款暫時未開放，請聯絡客服";
  };

  // Stripe 回跳：student-handbook.html?mk_order=<id>
  (async () => {
    const oid = new URLSearchParams(location.search).get("mk_order");
    if (!oid) return;
    const r = await fetch("/api/marketplace/orders/" + encodeURIComponent(oid) + "/complete", { method: "POST", headers: { ...auth, "content-type": "application/json" }, body: "{}" }).then(x=>x.json()).catch(()=>({}));
    $("mkSection").style.display = "block";
    $("mkTitle").textContent = r.success ? "✅ 付款成功 · 順豐將於 1–2 個工作天出貨" : (r.error || "訂單確認中");
    if (r.success) history.replaceState({}, "", location.pathname);
  })();
  init();
})();
</script>
  <script src="assets/senior-mode.js?v=2" defer></script>
</body>
</html>
