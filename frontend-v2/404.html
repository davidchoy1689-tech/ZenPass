<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.png?v=3" type="image/png" />
  <title>搵唔到呢一頁 | ZenPass 禪流</title>
  <style>
    :root { --orange:#ff6b35; --ink:#1f2937; --muted:#6b7280; --bg:#faf7f2; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 22px 90px;
      text-align: center;
    }
    .emoji { font-size: 68px; margin-bottom: 10px; }
    h1 { font-size: 56px; letter-spacing: 2px; color: var(--orange); margin-bottom: 6px; }
    p { font-size: 16px; color: var(--muted); line-height: 1.7; margin-bottom: 26px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 26px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 26px; border-radius: 26px; font-size: 15px; font-weight: 600;
      text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff7f4d, #e8511c); color: #fff;
      box-shadow: 0 6px 16px rgba(232,81,28,.28);
    }
    .btn-outline { border: 2px solid var(--orange); color: var(--orange); background: #fff; }
    .btn:active { transform: translateY(1px); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .chip {
      padding: 9px 16px; background: #fff; border-radius: 20px; text-decoration: none;
      color: var(--ink); font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.07);
    }
    .bottomnav {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: space-around; align-items: center;
      background: #fff; border-top: 1px solid #eee;
      padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    }
    .bottomnav a {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; color: var(--muted); text-decoration: none; flex: 1;
    }
    .bottomnav .ic { font-size: 20px; line-height: 1; }
    .bottomnav a.active { color: var(--orange); }
  </style>
</head>
<body>
  <div class="emoji">🤸</div>
  <h1>404</h1>
  <p>呢版好似做咗個後空翻，搵唔到路 🤸<br />可能條 link 錯咗，或者已經搬咗位。</p>

  <div class="actions">
    <a class="btn btn-primary" href="/index.html">🏠 返去主頁</a>
    <a class="btn btn-outline" href="/explore.html">🧘 睇課程</a>
    <a class="btn btn-outline" href="/membership.html">🎫 睇會籍</a>
  </div>

  <div class="chips">
    <a class="chip" href="/explore.html">🔥 熱門課程</a>
    <a class="chip" href="/coaches.html">⭐ 星級教練</a>
    <a class="chip" href="/faq.html">❓ 常見問題</a>
    <a class="chip" href="/about.html">📖 關於我們</a>
  </div>

  <nav class="bottomnav">
    <a class="active" href="/index.html"><span class="ic">🏠</span>主頁</a>
    <a href="/explore.html"><span class="ic">🔍</span>探索</a>
    <a href="/booking.html"><span class="ic">📅</span>預約</a>
    <a href="/my.html"><span class="ic">🎫</span>我的</a>
  </nav>
</body>
</html>
