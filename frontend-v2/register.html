<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>註冊 · ZenPass 禪流</title>
  <link rel="stylesheet" href="assets/v2.css?v=21" />
  <style>input.field{border:1px solid var(--border);border-radius:12px;padding:13px 14px;width:100%;font:inherit;background:var(--surface);color:var(--text)}</style>
</head>
<body>
  <div class="wrap" style="padding-top:28px">
    <div class="center" style="margin:16px 0 8px">
      <div style="font-size:34px">🧭</div>
      <h1 style="margin:8px 0 2px">建立帳戶</h1>
      <p class="muted">幾步就可以開始預約課堂</p>
    </div>
    <div class="banner" style="margin-bottom:10px">🎉 新用戶首堂半價 · 結帳用碼 <b>WELCOME50</b></div>
    <div class="stack">
      <input class="field" id="name" placeholder="姓名" autocomplete="name" />
      <input class="field" id="email" placeholder="電郵" type="email" autocomplete="username" />
      <input class="field" id="phone" placeholder="電話（選填）" type="tel" autocomplete="tel" />
      <input class="field" id="pw" placeholder="密碼（至少 6 位）" type="password" autocomplete="new-password" />
      <input class="field" id="pw2" placeholder="確認密碼" type="password" autocomplete="new-password" />
      <button class="btn btn-primary btn-block" id="go">註冊</button>
      <div id="msg" class="muted center" style="font-size:13px"></div>
    </div>
    <div class="spacer"></div>
    <p class="muted center" style="font-size:13px">已有帳戶？<a style="color:var(--brand-600);font-weight:700" href="login.html">登入</a></p>
    <p class="muted center" style="font-size:12px">註冊即表示你同意本平台之<a style="color:var(--brand-600)" href="/terms.html">服務條款</a>及<a style="color:var(--brand-600)" href="/privacy.html">私隱政策</a>。</p>
  </div>

  <script src="assets/api.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "my.html";
    async function doRegister() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;
      const msg = document.getElementById("msg");
      if (!name || !email || !pw) { msg.textContent = "請填寫姓名、電郵和密碼"; return; }
      if (pw.length < 6) { msg.textContent = "密碼至少需要 6 個字元"; return; }
      if (pw !== pw2) { msg.textContent = "兩次輸入的密碼唔一致"; return; }
      const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "註冊中…";
      const r = await api.post("/auth/register", { name, email, phone, password: pw });
      btn.disabled = false; btn.textContent = "註冊";
      if (r.ok && r.data) {
        if (r.data.token) api.setToken(r.data.token);
        if (r.data.user) api.setUser(r.data.user);
        location.href = next;
      } else {
        msg.textContent = (r.data && (r.data.error || r.data.message)) || "註冊失敗，請重試";
      }
    }
    document.getElementById("go").onclick = doRegister;
    document.getElementById("pw2").addEventListener("keydown", e => { if (e.key === "Enter") doRegister(); });
  </script>
  <script src="assets/footer.js?v=3" defer></script>
</body>
</html>
