# ZenPass 禪流 — Nginx Production Config
# 用法：sudo ln -sf $(pwd)/deploy/nginx.conf /etc/nginx/sites-available/zenpass
#       sudo ln -sf /etc/nginx/sites-available/zenpass /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name zenpass.hk www.zenpass.hk;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zenpass.hk www.zenpass.hk;

    # SSL (用 certbot 或 Let's Encrypt 生成)
    ssl_certificate /etc/letsencrypt/live/zenpass.hk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zenpass.hk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers — 2026-10-28 加固（同 production /etc/nginx/conf.d/zenpass.conf 保持一致）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://ssl.gstatic.com https://apis.google.com https://accounts.google.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://images.pexels.com https://*.googleusercontent.com data: blob:; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://*.googleapis.com https://plausible.io; manifest-src 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Static files (cache aggressively)
    location /assets/ {
        root /var/www/zenpass/frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /icons/ {
        root /var/www/zenpass/frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /var/www/zenpass/frontend;
        try_files $uri $uri/ /index.html;
        # 2026-10-23: HTML 一律 no-cache，避免部署後 10 分鐘內仍顯示舊頁
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # Uploads
    location /uploads/ {
        alias /var/www/zenpass/uploads/;
        expires 7d;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|db) {
        deny all;
    }

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
}
